name: Diagnose chess-server on Oracle Cloud

on:
  workflow_dispatch:
    inputs:
      setup_tls:
        description: 'Also (idempotently) provision/renew the Lets Encrypt cert for bear.servebeer.com'
        type: boolean
        default: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run diagnostics (and optional TLS setup) over SSH
        env:
          SETUP_TLS: ${{ inputs.setup_tls }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SETUP_TLS
          script: |
            if [ "$SETUP_TLS" = "true" ]; then
              echo "== enabling EPEL (certbot lives there on Oracle Linux) =="
              cat /etc/os-release
              sudo dnf install -y oracle-epel-release-el9 || sudo dnf install -y oracle-epel-release-el8 || true
              sudo dnf config-manager --set-enabled ol9_developer_EPEL || sudo dnf config-manager --set-enabled ol8_developer_EPEL || true

              echo "== installing certbot =="
              sudo dnf install -y certbot python3-certbot-apache

              echo "== ensuring mod_ssl's default placeholder cert exists (its stock ssl.conf references it and fails configtest otherwise) =="
              CRT_PATH=$(sudo grep -E '^[[:space:]]*SSLCertificateFile[[:space:]]' /etc/httpd/conf.d/ssl.conf 2>/dev/null | awk '{print $2}' | head -1)
              KEY_PATH=$(sudo grep -E '^[[:space:]]*SSLCertificateKeyFile[[:space:]]' /etc/httpd/conf.d/ssl.conf 2>/dev/null | awk '{print $2}' | head -1)
              echo "expected placeholder cert: $CRT_PATH key: $KEY_PATH"
              if [ -n "$CRT_PATH" ] && [ ! -s "$CRT_PATH" ]; then
                sudo mkdir -p "$(dirname "$CRT_PATH")" "$(dirname "$KEY_PATH")"
                sudo openssl req -x509 -nodes -days 1 -newkey rsa:2048 -keyout "$KEY_PATH" -out "$CRT_PATH" -subj "/CN=localhost"
              fi
              sudo apachectl configtest

              echo "== requesting/renewing certificate for bear.servebeer.com =="
              sudo certbot --apache -d bear.servebeer.com --non-interactive --agree-tos \
                -m remi.tournie@gmail.com --redirect

              echo "== opening https in firewalld (idempotent) =="
              sudo firewall-cmd --permanent --add-service=https || true
              sudo firewall-cmd --reload || true

              SSL_CONF=$(sudo grep -rl "ServerName bear.servebeer.com" /etc/httpd/conf.d/ | xargs -r sudo grep -l "VirtualHost \*:443" | head -n1)
              echo "== ssl vhost file: $SSL_CONF =="
              if [ -n "$SSL_CONF" ] && ! sudo grep -q "chess-ws" "$SSL_CONF"; then
                echo "== adding chess-ws ProxyPass to ssl vhost =="
                sudo sed -i '/<\/VirtualHost>/i\    ProxyPass "/chess-ws" "ws://127.0.0.1:8095/chess-ws"' "$SSL_CONF"
                sudo sed -i '/<\/VirtualHost>/i\    ProxyPassReverse "/chess-ws" "ws://127.0.0.1:8095/chess-ws"' "$SSL_CONF"
              fi

              sudo apachectl configtest
              sudo systemctl reload httpd
            fi

            echo "== chess-server service =="
            sudo systemctl status chess-server --no-pager || true
            echo
            echo "== local health check (127.0.0.1:8095) =="
            curl -s -o /dev/null -w 'http_code=%{http_code}\n' http://127.0.0.1:8095/health || true
            echo
            echo "== ports listening (80/443) =="
            sudo ss -ltnp | grep -E ':(80|443)\b' || echo "neither 80 nor 443 listening"
            echo
            echo "== apache ssl module loaded =="
            httpd -M 2>&1 | grep -i ssl || echo "no ssl module found"
            echo
            echo "== letsencrypt certs =="
            sudo ls -la /etc/letsencrypt/live/ 2>/dev/null || echo "no letsencrypt directory"
            echo
            echo "== apache config test =="
            sudo apachectl configtest || true
            echo
            echo "== all conf.d files mentioning chess-ws =="
            sudo grep -rl "chess-ws" /etc/httpd/conf.d/ || echo "none found"

      - name: Test HTTPS + WSS from the public internet
        run: |
          echo "== chess.html over HTTPS (real domain) =="
          curl -s --connect-timeout 8 -o /dev/null -w 'http_code=%{http_code} time=%{time_total}s\n' "https://bear.servebeer.com/chess.html" || true
          echo "== HTTP -> HTTPS redirect check =="
          curl -s --connect-timeout 8 -o /dev/null -w 'http_code=%{http_code}\n' "http://bear.servebeer.com/chess.html" || true
          echo
          npm install ws --no-audit --no-fund --silent
          node -e "
          const WebSocket = require('ws');
          const url = 'wss://bear.servebeer.com/chess-ws';
          console.log('Connecting to', url);
          const a = new WebSocket(url);
          const b = new WebSocket(url);
          let code;
          const timer = setTimeout(() => { console.log('TIMEOUT waiting for full handshake'); process.exit(1); }, 15000);

          a.on('open', () => a.send(JSON.stringify({type:'create'})));
          a.on('error', (e) => console.log('A error:', e.message));
          b.on('error', (e) => console.log('B error:', e.message));

          a.on('message', (raw) => {
            const m = JSON.parse(raw);
            console.log('A <-', m.type, m.color || '');
            if (m.type === 'created') {
              code = m.code;
              b.send(JSON.stringify({type:'join', code}));
            }
          });

          b.on('message', (raw) => {
            const m = JSON.parse(raw);
            console.log('B <-', m.type, m.color || '');
            if (m.type === 'start') {
              const mover = m.turn === 'white' ? (m.color === 'white' ? b : a) : (m.color === 'black' ? b : a);
              mover.send(JSON.stringify({type:'move', from:'e2', to:'e4'}));
            }
            if (m.type === 'move') {
              console.log('SUCCESS: full create/join/move round-trip works over wss://bear.servebeer.com/chess-ws');
              clearTimeout(timer);
              a.close(); b.close();
              process.exit(0);
            }
          });
          "
