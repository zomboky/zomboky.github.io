name: Diagnose chess-server on Oracle Cloud

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run read-only diagnostics over SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "== chess-server service =="
            sudo systemctl status chess-server --no-pager || true
            echo
            echo "== chess-server recent logs (last 80 lines) =="
            sudo journalctl -u chess-server --no-pager -n 80 || true
            echo
            echo "== local health check (127.0.0.1:8095) =="
            curl -s -o /dev/null -w 'http_code=%{http_code}\n' http://127.0.0.1:8095/health || true
            curl -s http://127.0.0.1:8095/health || true
            echo
            echo "== node version =="
            node -v || echo "node not found"
            echo
            echo "== /opt/chess-server contents =="
            ls -la /opt/chess-server || true
            echo
            echo "== port 8095 listening? =="
            sudo ss -ltnp | grep 8095 || echo "NOT LISTENING on 8095"
            echo
            echo "== apache proxy modules loaded =="
            httpd -M 2>&1 | grep -i proxy || echo "no proxy modules found"
            echo
            echo "== apache config test =="
            sudo apachectl configtest || true
            echo
            echo "== chess-ws.conf deployed? =="
            ls -la /etc/httpd/conf.d/chess-ws.conf || true
            cat /etc/httpd/conf.d/chess-ws.conf || true

      - name: Test the actual WebSocket relay from the public internet
        run: |
          npm install ws --no-audit --no-fund --silent
          node -e "
          const WebSocket = require('ws');
          const url = 'ws://${{ secrets.REMOTE_HOST }}/chess-ws';
          console.log('Connecting to', url);
          const a = new WebSocket(url);
          const b = new WebSocket(url);
          let code;
          const timer = setTimeout(() => { console.log('TIMEOUT waiting for full handshake'); process.exit(1); }, 15000);

          a.on('open', () => a.send(JSON.stringify({type:'create'})));
          a.on('error', (e) => console.log('A error:', e.message));
          b.on('error', (e) => console.log('B error:', e.message));

          a.on('message', (raw) => {
            const m = JSON.parse(raw);
            console.log('A <-', m.type, m.color || '');
            if (m.type === 'created') {
              code = m.code;
              b.send(JSON.stringify({type:'join', code}));
            }
          });

          b.on('message', (raw) => {
            const m = JSON.parse(raw);
            console.log('B <-', m.type, m.color || '');
            if (m.type === 'start') {
              const mover = m.turn === 'white' ? (m.color === 'white' ? b : a) : (m.color === 'black' ? b : a);
              mover.send(JSON.stringify({type:'move', from:'e2', to:'e4'}));
            }
            if (m.type === 'move') {
              console.log('SUCCESS: full create/join/move round-trip works over the public WS relay');
              clearTimeout(timer);
              a.close(); b.close();
              process.exit(0);
            }
          });
          "
