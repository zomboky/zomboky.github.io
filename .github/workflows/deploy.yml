name: Deploy to Oracle Cloud OCI
on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@master
        env:
          # Secret au nom historique (ex-orange-server) : conservé pour ne pas
          # avoir à recréer le secret GitHub — il alimente désormais
          # ZOMBOKY_DASHBOARD_PASSWORD côté service.
          ORANGE_DASHBOARD_PASSWORD: ${{ secrets.ORANGE_DASHBOARD_PASSWORD }}
          HIBOU3D_V6_PASSWORD: ${{ secrets.HIBOU3D_V6_PASSWORD }}
          CAMPAGNE_SOLO_PWD: ${{ secrets.CAMPAGNE_SOLO_PWD }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ORANGE_DASHBOARD_PASSWORD,HIBOU3D_V6_PASSWORD,CAMPAGNE_SOLO_PWD
          script: |
            set -e
            sudo git config --global --add safe.directory /var/www/html
            cd /var/www/html
            sudo git fetch origin master
            sudo git reset --hard origin/master

            # --- Chess multiplayer WebSocket server (deploy before docs
            # copy removes the source, and before it's exposed under the
            # public docroot) ---
            id -u chessd >/dev/null 2>&1 || sudo useradd -r -s /sbin/nologin chessd
            command -v node >/dev/null 2>&1 || sudo dnf install -y nodejs

            sudo rm -rf /opt/chess-server
            sudo mkdir -p /opt/chess-server
            sudo cp -R /var/www/html/server/chess-server/. /opt/chess-server/
            cd /opt/chess-server
            sudo npm install --omit=dev
            sudo chown -R chessd:chessd /opt/chess-server
            cd /var/www/html

            # --- Hibou 3D multiplayer WebSocket server (relais léger,
            # voir server/hibou3d-server/README.md) ---
            id -u hibou3dd >/dev/null 2>&1 || sudo useradd -r -s /sbin/nologin hibou3dd

            sudo rm -rf /opt/hibou3d-server
            sudo mkdir -p /opt/hibou3d-server
            sudo cp -R /var/www/html/server/hibou3d-server/. /opt/hibou3d-server/
            cd /opt/hibou3d-server
            sudo npm install --omit=dev
            sudo chown -R hibou3dd:hibou3dd /opt/hibou3d-server
            cd /var/www/html

            # --- Hibou 3D self-play training environment (job MANUEL, pas un
            # service permanent — voir server/hibou3d-training/README.md).
            # Contrairement aux autres dossiers /opt/*, on ne fait PAS un
            # rm -rf complet : checkpoints/ et results/ doivent survivre aux
            # déploiements suivants (des heures d'entraînement en cours ne
            # doivent pas être perdues par un push sans rapport). Seuls
            # src/ et les fichiers package.json sont rafraîchis. ---
            sudo mkdir -p /opt/hibou3d-training/checkpoints /opt/hibou3d-training/results
            sudo rm -rf /opt/hibou3d-training/src
            sudo cp -R /var/www/html/server/hibou3d-training/src /opt/hibou3d-training/
            sudo cp /var/www/html/server/hibou3d-training/package.json /var/www/html/server/hibou3d-training/package-lock.json /var/www/html/server/hibou3d-training/README.md /opt/hibou3d-training/
            cd /opt/hibou3d-training
            sudo npm install --omit=dev
            sudo chown -R hibou3dd:hibou3dd /opt/hibou3d-training
            cd /var/www/html

            # --- API générale du site (zomboky-server : compteur de visiteurs,
            # verrou Hibou 3D, login admin — voir server/zomboky-server/README.md) ---
            id -u zombokyd >/dev/null 2>&1 || sudo useradd -r -s /sbin/nologin zombokyd

            sudo rm -rf /opt/zomboky-server
            sudo mkdir -p /opt/zomboky-server
            sudo cp -R /var/www/html/server/zomboky-server/. /opt/zomboky-server/
            cd /opt/zomboky-server
            sudo npm install --omit=dev
            if [ -n "$ORANGE_DASHBOARD_PASSWORD" ] || [ -n "$HIBOU3D_V6_PASSWORD" ] || [ -n "$CAMPAGNE_SOLO_PWD" ]; then
              {
                [ -n "$ORANGE_DASHBOARD_PASSWORD" ] && printf 'ZOMBOKY_DASHBOARD_PASSWORD=%s\n' "$ORANGE_DASHBOARD_PASSWORD"
                [ -n "$HIBOU3D_V6_PASSWORD" ] && printf 'HIBOU3D_V6_PASSWORD=%s\n' "$HIBOU3D_V6_PASSWORD"
                [ -n "$CAMPAGNE_SOLO_PWD" ] && printf 'CAMPAGNE_SOLO_PWD=%s\n' "$CAMPAGNE_SOLO_PWD"
              } | sudo tee zomboky-passwords.env > /dev/null
              sudo chmod 600 zomboky-passwords.env
            else
              echo "ORANGE_DASHBOARD_PASSWORD, HIBOU3D_V6_PASSWORD et CAMPAGNE_SOLO_PWD absents : les API de login refuseront toute connexion."
            fi
            sudo chown -R zombokyd:zombokyd /opt/zomboky-server
            sudo mkdir -p /var/lib/zomboky-server
            # Migration du compteur de visiteurs historique de l'ancien orange-server
            if [ -f /var/lib/orange-server/visitor-count.json ] && [ ! -f /var/lib/zomboky-server/visitor-count.json ]; then
              sudo cp /var/lib/orange-server/visitor-count.json /var/lib/zomboky-server/visitor-count.json
            fi
            sudo chown -R zombokyd:zombokyd /var/lib/zomboky-server
            cd /var/www/html

            # --- Flight-sim design storage API (sauvegarde/partage d'avions
            # par code court, voir server/flight-server/README.md) ---
            id -u flightd >/dev/null 2>&1 || sudo useradd -r -s /sbin/nologin flightd

            sudo rm -rf /opt/flight-server
            sudo mkdir -p /opt/flight-server
            sudo cp -R /var/www/html/server/flight-server/. /opt/flight-server/
            cd /opt/flight-server
            sudo npm install --omit=dev
            sudo chown -R flightd:flightd /opt/flight-server
            sudo mkdir -p /var/lib/flight-server/designs
            sudo chown -R flightd:flightd /var/lib/flight-server
            cd /var/www/html

            sudo cp -R docs/* .
            # La page oranges est supprimée du site : on retire aussi les copies
            # laissées dans le docroot par les déploiements précédents.
            sudo rm -f orange-disease.html scripts/orange-disease.js scripts/orange-disease-lock.js styles/orange-disease.css

            sudo rm -rf server
            sudo chown -R apache:apache /var/www/html
            sudo restorecon -Rv /var/www/html

            # Démantèlement de l'ancien orange-server (renommé zomboky-server) :
            # services/timers désactivés et fichiers systemd/Apache retirés.
            sudo systemctl disable --now orange-server orange-ingest.timer orange-gosif.timer 2>/dev/null || true
            sudo systemctl stop orange-ingest.service orange-gosif.service 2>/dev/null || true
            sudo rm -f /etc/systemd/system/orange-server.service /etc/systemd/system/orange-ingest.service /etc/systemd/system/orange-ingest.timer /etc/systemd/system/orange-gosif.service /etc/systemd/system/orange-gosif.timer
            sudo rm -f /etc/httpd/conf.d/orange-api.conf
            sudo rm -rf /opt/orange-server

            sudo cp /opt/chess-server/deploy/chess-server.service /etc/systemd/system/chess-server.service
            sudo cp /opt/hibou3d-server/deploy/hibou3d-server.service /etc/systemd/system/hibou3d-server.service
            sudo cp /opt/zomboky-server/deploy/zomboky-server.service /etc/systemd/system/zomboky-server.service
            sudo cp /opt/flight-server/deploy/flight-server.service /etc/systemd/system/flight-server.service
            sudo systemctl daemon-reload
            sudo systemctl enable chess-server hibou3d-server zomboky-server flight-server
            sudo systemctl restart chess-server hibou3d-server zomboky-server flight-server

            sudo cp /opt/chess-server/deploy/chess-ws.conf /etc/httpd/conf.d/chess-ws.conf
            sudo cp /opt/hibou3d-server/deploy/hibou3d-ws.conf /etc/httpd/conf.d/hibou3d-ws.conf
            sudo cp /opt/zomboky-server/deploy/zomboky-api.conf /etc/httpd/conf.d/zomboky-api.conf
            sudo cp /opt/flight-server/deploy/flight-api.conf /etc/httpd/conf.d/flight-api.conf
            # Le vhost SSL (écrit par chess-diagnose.yml) inclut les conf.d par
            # nom : on y remplace l'ancienne référence orange-api sinon le
            # configtest échoue sur un Include manquant.
            if [ -f /etc/httpd/conf.d/bear-servebeer-ssl.conf ]; then
              sudo sed -i 's/orange-api\.conf/zomboky-api.conf/' /etc/httpd/conf.d/bear-servebeer-ssl.conf
            fi
            sudo setsebool -P httpd_can_network_connect 1 || true
            sudo apachectl configtest
            sudo systemctl reload httpd
