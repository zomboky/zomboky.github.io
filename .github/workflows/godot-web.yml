name: Hibou 3D — build web (Godot)

# Recette du lot 0 (PLAN_GODOT.md §9) : à chaque poussée touchant le projet Godot,
# on rebuild l'export web et on publie l'artefact. Objectif secondaire mais important :
# suivre le POIDS TRANSFÉRÉ lot par lot (§10.1), qui est le vrai risque du portage.

on:
  push:
    paths:
      - 'godot/hibou3d/**'
      - 'tools/**'
      - 'docs/hibou-3d.html'
      - '.github/workflows/godot-web.yml'
  pull_request:
    paths:
      - 'godot/hibou3d/**'
      - 'tools/**'
      - 'docs/hibou-3d.html'
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5
  PROJECT_DIR: godot/hibou3d

jobs:
  export-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + templates d'export
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Installer Godot ${{ env.GODOT_VERSION }} et les templates web
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

          curl -fsSL -o /tmp/godot.zip \
            "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

          # On n'extrait que les templates web : le .tpz complet pèse ~1,3 Go.
          curl -fsSL -o /tmp/templates.tpz \
            "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz \
            'templates/web_nothreads_debug.zip' 'templates/web_nothreads_release.zip' \
            -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm -f /tmp/templates.tpz /tmp/godot.zip

      - name: Importer les assets
        working-directory: ${{ env.PROJECT_DIR }}
        # Premier import : Godot sort parfois en code != 0 tout en ayant importé
        # correctement. L'échec réel est capturé par l'étape d'export ci-dessous.
        run: ~/godot-bin/godot --headless --import || true

      - name: Exporter le build web
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p build/web
          ~/godot-bin/godot --headless --export-release "Web" build/web/index.html

      - name: Mesurer le poids transféré
        working-directory: ${{ env.PROJECT_DIR }}/build/web
        run: |
          echo "### Poids du build web" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fichier | Brut | gzip -9 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in index.wasm index.js index.pck; do
            [ -f "$f" ] || continue
            raw=$(stat -c%s "$f")
            gz=$(gzip -9 -c "$f" | wc -c)
            printf '| `%s` | %.1f Mo | %.1f Mo |\n' \
              "$f" "$(echo "$raw/1048576" | bc -l)" "$(echo "$gz/1048576" | bc -l)" \
              >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: hibou3d-web
          path: ${{ env.PROJECT_DIR }}/build/web
          if-no-files-found: error

  parity:
    # Recettes de parité contre le jeu Three.js d'origine.
    #
    # Lot 2 — modèle de vol : recette BLOQUANTE (§9.2). La trajectoire portée doit
    # suivre l'originale à moins de 1 % sur 30 s. C'est le coeur du feeling du jeu,
    # et l'IA du bot comme le multijoueur en dépendent.
    #
    # Lot 3 — terrain : le hash `sin() * 43758` amplifie le moindre écart d'ULP en
    # un relief entièrement différent (§5.4).
    #
    # Ancien nom du job : flight-parity (PLAN_GODOT.md §9.2) : le modèle de vol porté
    # doit suivre la trajectoire de l'original à moins de 1 % sur 30 s. C'est le
    # cœur du feeling du jeu, et l'IA du bot comme le multijoueur en dépendent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Installer Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Les transcriptions JavaScript sont-elles toujours à jour ?
        run: |
          node tools/flight-parity/check_drift.mjs
          node tools/terrain-parity/check_drift.mjs

      - name: Importer les assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: ~/godot-bin/godot --headless --import || true

      - name: Parité du modèle de vol (lot 2)
        run: |
          node tools/flight-parity/run_js.mjs
          (cd "$PROJECT_DIR" && ~/godot-bin/godot --headless --script res://tools/flight_parity.gd)
          node tools/flight-parity/compare.mjs

      - name: Parité du terrain (lot 3)
        run: |
          node tools/terrain-parity/run_js.mjs
          (cd "$PROJECT_DIR" && ~/godot-bin/godot --headless --script res://tools/terrain_parity.gd)
          node tools/terrain-parity/compare.mjs

      - name: Recette du hibou et de la caméra (lot 1)
        working-directory: ${{ env.PROJECT_DIR }}
        run: ~/godot-bin/godot --headless --script res://tests/test_owl.gd

      - name: Recette du terrain et de l'eau (lot 3)
        # Lancé comme une exécution normale du projet, pas via --script : en mode
        # --script, Godot remplace la SceneTree et n'instancie aucun autoload.
        working-directory: ${{ env.PROJECT_DIR }}
        run: ~/godot-bin/godot --headless res://tests/test_world.tscn
