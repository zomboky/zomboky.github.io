name: Rafraîchir les données orange-disease

on:
  schedule:
    - cron: '17 5,17 * * *'   # deux fois par jour (05:17 et 17:17 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        working-directory: server/orange-server
        run: npm install --omit=dev

      - name: Écrire la clé de service Earth Engine
        run: |
          cat <<'GEEKEY' > /tmp/gee-key.json
          ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          GEEKEY

      - name: Rafraîchir docs/data/orange-disease/dashboard.json
        working-directory: server/orange-server
        env:
          GEE_KEY_PATH: /tmp/gee-key.json
        run: npm run refresh:dashboard

      - name: Nettoyer la clé temporaire
        if: always()
        run: rm -f /tmp/gee-key.json

      - name: Committer si changement
        run: |
          if git diff --quiet -- docs/data/orange-disease/dashboard.json; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "orange-disease-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/orange-disease/dashboard.json
          git commit -m "chore: rafraîchit les données orange-disease"
          git push
