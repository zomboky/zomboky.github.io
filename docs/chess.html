<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Plateau d'Échecs Simple</title>
    <link rel="stylesheet" href="https://unpkg.com/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        /* CSS pour centrer le plateau */
        body {
            display: flex;
            justify-content: center; /* Centrage horizontal */
            align-items: center;     /* Centrage vertical (optionnel, si vous voulez au milieu de l'écran) */
            min-height: 100vh;       /* Assure que le corps prend toute la hauteur de la fenêtre */
            margin: 0;
            background-color: #f0f0f0;
        }

        /* Conteneur pour définir la taille du plateau */
        #myBoard {
            width: 400px; /* Taille désirée pour le plateau */
            max-width: 90vw; /* Rend le plateau réactif */
        }
    </style>
</head>
<body>

    <div id="myBoard"></div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        // Configuration de base pour le plateau
        var config = {
            draggable: true, // Permet de glisser les pièces
            position: 'start' // Position de départ standard
        };

        // Initialisation du plateau
        var board = Chessboard('myBoard', config);
    </script>

</body>
</html>
