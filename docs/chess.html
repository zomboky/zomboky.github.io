<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Plateau d'Échecs - Version 0.0.1</title>
    
    <link rel="stylesheet" href="https://unpkg.com/chessboardjs@0.0.1/www/css/chessboard.css">
    
    <style>
        /* CSS pour centrer et définir la taille du plateau (inchangé) */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        #myBoard {
            width: 400px;
            max-width: 90vw;
        }
    </style>
</head>
<body>

    <div id="myBoard"></div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    
    <script src="https://unpkg.com/chessboardjs@0.0.1/www/js/chessboard.js"></script>

    <script>
        var config = {
            draggable: true,
            position: 'start'
        };

        // L'objet 'Chessboard' sera maintenant défini
        var board = Chessboard('myBoard', config);
    </script>

</body>
</html>
