function rollLoot() {
  let r = Math.random(), cumul = 0;
  for (const loot of LOOT_TYPES) {
    cumul += loot.weight;
    if (r < cumul) return loot;

  return LOOT_TYPES[0];

  const img = new Image();
  img.src = 'data:image/png;base64,' + b64;
  return img;
}

  flap: [loadOwlSprite(OWL_SPRITE_B64.flap0), loadOwlSprite(OWL_SPRITE_B64.flap1), loadOwlSprite(OWL_SPRITE_B64.flap2)],
  idle: loadOwlSprite(OWL_SPRITE_B64.idle)
};
function drawOwlSprite(x, y, size, faceLeft, moving) {
  let img;
  if (!moving) {
    img = owlSprites.idle;
  } else {
    const phase = ((Math.sin(owl.flap) + 1) / 2); // 0..1
    const idx   = phase < 0.33 ? 0 : phase < 0.66 ? 1 : 2;
    img = owlSprites.flap[idx];
  }
  if (!img.complete || img.naturalWidth === 0) { drawEmoji('🦉', 0, 0, size); return; } // fallback tant que ça charge
  ctx.save();
  ctx.scale(faceLeft ? -1 : 1, 1);
  ctx.drawImage(img, -size / 2, -size / 2, size, size);
  ctx.restore();
}

const bearSprite  = loadSpriteURL('hibou2d-sprites/bear.png');  // 490x490, pose fixe (pas de cycle de marche)
const MONSTER_EMOJI_FALLBACK = { bear: '🐻', bat: '🦇', shark: '🦈' };

function drawMonster(m) {
  const size = m.size * 1.35;
  if (m.kind === 'bat' && batSprite.complete && batSprite.naturalWidth > 0) {
    const frame = Math.floor(m.flap || 0) % 16; // grille 4x4, cycle continu de vol
    const col = frame % 4, row = Math.floor(frame / 4);
    ctx.save();
    ctx.scale(Math.cos(m.heading) < 0 ? -1 : 1, 1);
    ctx.drawImage(batSprite, col * 32, row * 32, 32, 32, -size / 2, -size / 2, size, size);
    ctx.restore();
  } else if (m.kind === 'shark' && sharkSprite.complete && sharkSprite.naturalWidth > 0) {
    const sw = sharkSprite.naturalWidth / 4, sh = sharkSprite.naturalHeight / 4;
    const vertical = Math.abs(Math.sin(m.heading)) > Math.abs(Math.cos(m.heading));
    const row = vertical ? 0 : 1; // ligne 0 = nez en haut, ligne 1 = orientation gauche
    ctx.save();
    if (vertical) ctx.scale(1, Math.sin(m.heading) < 0 ? 1 : -1);
    else          ctx.scale(Math.cos(m.heading) < 0 ? -1 : 1, 1);
    ctx.drawImage(sharkSprite, 0, row * sh, sw, sh, -size / 2, -size / 2, size, size);
    ctx.restore();
  } else if (m.kind === 'bear' && bearSprite.complete && bearSprite.naturalWidth > 0) {
    ctx.drawImage(bearSprite, -size / 2, -size / 2, size, size);
  } else {
    drawEmoji(MONSTER_EMOJI_FALLBACK[m.kind] || '🐻', 0, 0, m.size);
  }
}

const rnd  = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function lerpAngle(a, b, t) {
  let diff = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  return a + diff * t;
}

function rrect(x, y, w, h, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill)   { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lw || 1.5; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function drawEmoji(e, x, y, size) {

// ══════════════════════════════════════════════════
//  ARBRES PIXEL ART (génération offscreen)
// ══════════════════════════════════════════════════
// Chaque arbre = petit canvas pré-rendu en grille de pixels (px carrés)
// puis redessiné à l'échelle avec imageSmoothingEnabled=false → pixel art net.
const PX = 3; // taille d'un "pixel" logique en px écran (avant scale du sprite)

function makeTreeSprite(paletteIdx, seed) {
  // Grille logique 12 x 20 "pixels"
  const gw = 12, gh = 20;
  const off = document.createElement('canvas');
  off.width = gw; off.height = gh;
  const octx = off.getContext('2d');
  octx.imageSmoothingEnabled = false;

  const palettes = [
    { trunk: '#3a2a1e', trunkD: '#241a12', leaf: ['#0e3d1e', '#155226', '#1f6b30'] }, // vert sombre
    { trunk: '#2e2118', trunk2: '#1c140e', leaf: ['#123318', '#1a4a22', '#26612c'] }, // vert-noir
    { trunk: '#332419', trunkD: '#211710', leaf: ['#173d24', '#1f5230', '#2a6b3a'] }  // vert-bleu
  ];
  const pal = palettes[paletteIdx % palettes.length];

  // PRNG simple à partir du seed pour variation déterministe
  let s = seed;
  const rand = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };

  // Tronc : colonne centrale, largeur 2, hauteur variable
  const trunkH = 6 + Math.floor(rand() * 3);
  const trunkX = Math.floor(gw / 2) - 1;
  for (let y = gh - trunkH; y < gh; y++) {
    octx.fillStyle = pal.trunk;
    octx.fillRect(trunkX, y, 2, 1);
  }
  octx.fillStyle = pal.trunkD || pal.trunk2 || '#000';
  octx.fillRect(trunkX, gh - trunkH, 1, trunkH);

  // Feuillage : masse triangulaire pixelisée, 3 tons pour profondeur
  const crownTop    = 0;
  const crownBottom = gh - trunkH + 2;
  const crownH      = crownBottom - crownTop;
  for (let y = crownTop; y < crownBottom; y++) {
    const t = (y - crownTop) / crownH; // 0 en haut, 1 en bas
    const halfW = Math.max(1, Math.round(t * (gw / 2 - 1) + 1));
    for (let x = -halfW; x <= halfW; x++) {
      // bruit pour bord irrégulier (silhouette naturelle)
      if (Math.abs(x) === halfW && rand() < 0.4) continue;
      const shade = rand();
      const c = shade < 0.5 ? pal.leaf[0] : shade < 0.82 ? pal.leaf[1] : pal.leaf[2];
      octx.fillStyle = c;
      octx.fillRect(Math.floor(gw / 2) + x, y, 1, 1);
    }
  }
  return { canvas: off, trunkH };
}

// ══════════════════════════════════════════════════
//  BLÉ PIXEL ART (champ) — même esprit que les arbres, non solide
// ══════════════════════════════════════════════════
function makeWheatSprite(seed) {
  const gw = 6, gh = 20;
  const off = document.createElement('canvas');
  off.width = gw; off.height = gh;
  const octx = off.getContext('2d');
  octx.imageSmoothingEnabled = false;
  const stalk = '#8a6a22', stalkD = '#6b4f16', head = ['#e8c94a', '#d4b436', '#c2a02a'];
  let s = seed;
  const rand = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const stalkH = 12 + Math.floor(rand() * 5);
  const cx = Math.floor(gw / 2);
  for (let y = gh - stalkH; y < gh; y++) { octx.fillStyle = (y % 3 === 0) ? stalkD : stalk; octx.fillRect(cx, y, 1, 1); }
  for (let y = 0; y < gh - stalkH + 3; y++) {
    const shade = rand();
    octx.fillStyle = shade < 0.5 ? head[0] : shade < 0.8 ? head[1] : head[2];
    octx.fillRect(cx - (rand() < 0.5 ? 1 : 0), y, 1, 1);
  }
  return { canvas: off };
}

function drawTreeLayer(trees, groundY, sway) {
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  for (const tr of trees) {
    const sx = tr.x + (sway || 0);
    // Dimensions tirées du sprite lui-même (12x20 arbre, 6x20 blé) : un facteur figé sur la
    // largeur de l'arbre étirerait le blé (grille plus étroite) au lieu de le garder fin.
    const sw = tr.sprite.width  * PX * tr.scale;
    const sh = tr.sprite.height * PX * tr.scale;
    ctx.globalAlpha = tr.alpha;
    ctx.drawImage(tr.sprite, sx - sw / 2, groundY - sh, sw, sh);
  }
  ctx.restore();
}

// ══════════════════════════════════════════════════
//  MONDE — graphe de cartes, biomes, transitions
// ══════════════════════════════════════════════════
// Chaque « room » a jusqu'à 4 voisins (N/E/S/W), créés paresseusement au premier
// franchissement puis mémorisés (liaison réciproque) — voir plan. Répartition de
// l'état : global (score/vies/lune/tempête/particules...) reste inchangé quelle
// que soit la carte active ; par-carte (monstres/collectibles/solids/décor) est
// sauvegardé en sortant, restauré en entrant, gelé tant que la carte n'est pas active.
let rooms         = new Map();
let currentRoomId = null;
let roomCooldown  = 0;
let nextRoomId    = 0;
// Debug uniquement (tests automatisés) : ?fastcooldown=1 raccourcit le délai de 10s à ~0.5s.
const ROOM_COOLDOWN = new URLSearchParams(location.search).get('fastcooldown') ? 30 : 600;

// Introspection / hooks debug (tests automatisés uniquement — aucun impact sur le jeu normal).
window.__hibouDebugState = () => {
  const room = currentRoom();
  return {
    roomId: currentRoomId,
    biome: currentBiome(),
    neighbors: room ? { ...room.neighbors } : null,
    roomCount: rooms.size,
    cooldown: roomCooldown,
    solidsCount: solids.length,
    monsterKinds: monsters.map(m => m.kind),
    collectiblesPos: collectibles.map(c => ({ x: c.x, y: c.y, size: c.size, value: c.value })),
    solidsRects: solids.map(s => ({ x: s.x, y: s.y, hw: s.hw, hh: s.hh })),
    owl: { x: owl.x, y: owl.y },
    gameState: state
  };
};
window.__hibouDebugForceTransition = (dir) => { roomCooldown = 0; attemptTransition(dir); return window.__hibouDebugState(); };
window.__hibouDebugSetOwl = (x, y) => { owl.x = x; owl.y = y; owl.px = x; owl.py = y; mouse.x = x; mouse.y = y; };

function currentRoom()  { return rooms.get(currentRoomId) || null; }
function currentBiome() { const r = currentRoom(); return r ? r.biome : 'foret'; }

function createRoom(biome, seed) {
  const id = 'r' + (nextRoomId++);
  const room = {
    id, biome, seed,
    neighbors: { N: null, E: null, S: null, W: null },
    generated: false, genW: 0, genH: 0,
    monsters: [], collectibles: [], solids: [],
    treesFar: [], treesNear: [], wheat: [], seabed: [], cave: null,
    pendingRespawns: [] // lac : délais de réapparition des pépites
  };
  rooms.set(id, room);
  return room;
}

function saveRoomState(room) {
  if (!room) return;
  room.monsters = monsters; room.collectibles = collectibles; room.solids = solids;
  room.treesFar = treesFar; room.treesNear = treesNear; room.wheat = wheat; room.seabed = seabed;
  room.cave = caveGrid; room.pendingRespawns = pendingRespawns;
}
function loadRoomState(room) {
  monsters = room.monsters; collectibles = room.collectibles; solids = room.solids;
  treesFar = room.treesFar; treesNear = room.treesNear; wheat = room.wheat; seabed = room.seabed;
  caveGrid = room.cave; pendingRespawns = room.pendingRespawns;
  currentRoomId = room.id;
}

// Décor+solides seulement (idempotent, resize-safe : même seed ⇒ même disposition relative).
function generateRoomDecor(room) {
  room.genW = canvas.width; room.genH = canvas.height;
  const rng = HibouWorld.mulberry32(room.seed);
  if      (room.biome === 'foret')  populateForestDecor(room, rng);
  else if (room.biome === 'champ')  populateFieldDecor(room, rng);
  else if (room.biome === 'grotte') populateCaveDecor(room, rng);
  else if (room.biome === 'lac')    populateLakeDecor(room, rng);
}
// Peuplement initial (monstres + collectibles) : une seule fois, à la toute première visite.
function populateRoomInitial(room) {
  const kind  = BIOME_MONSTER_KIND[room.biome];
  const count = room.biome === 'grotte' ? 3 : 2;
  room.monsters = Array.from({ length: count }, () => newMonster(kind));
  const ccount = room.biome === 'lac' ? 3 : 5; // lac : taux de drop réduit → moins de pépites en jeu
  room.collectibles = Array.from({ length: ccount }, () => newCollectible(room.biome, room.solids));
}
function ensureRoomGenerated(room) {
  if (!room.generated) {
    generateRoomDecor(room);
    populateRoomInitial(room);
    room.generated = true;
  } else if (room.genW !== canvas.width || room.genH !== canvas.height) {
    generateRoomDecor(room); // réajuste juste décor+solides à la nouvelle taille, garde monstres/collectibles
  }
}

function resetWorld() {
  rooms = new Map(); nextRoomId = 0;
  const seed = Math.floor(Math.random() * 0xffffffff) >>> 0;
  const room = createRoom('foret', seed);
  ensureRoomGenerated(room);
  loadRoomState(room);
  roomCooldown = ROOM_COOLDOWN;
}

// Franchir un bord (délai écoulé) : carte voisine réutilisée si déjà générée dans cette
// direction, sinon tirée au sort et mémorisée (liaison réciproque) — voir plan.
function attemptTransition(dir) {
  const from = currentRoom();
  saveRoomState(from);

  let neighborId = from.neighbors[dir];
  if (!neighborId) {
    const seed   = Math.floor(Math.random() * 0xffffffff) >>> 0;
    const biome  = HibouWorld.rollBiome();
    const neighbor = createRoom(biome, seed);
    const opp = HibouWorld.oppositeDir(dir);
    from.neighbors[dir]    = neighbor.id;
    neighbor.neighbors[opp] = from.id;
    neighborId = neighbor.id;
  }
  const to = rooms.get(neighborId);
  ensureRoomGenerated(to);
  loadRoomState(to);

  owl.x = canvas.width / 2; owl.y = canvas.height / 2;
  owl.px = owl.x; owl.py = owl.y;      // mvx/mvy retombent à 0 → pas de pic d'angle/battement
  mouse.x = owl.x; mouse.y = owl.y;    // resynchro anti-à-coup du curseur virtuel
  particles = [];
  roomCooldown = ROOM_COOLDOWN;
  spawnWrapFX(owl.x, owl.y);
}

// ── Génération du décor par biome (chacune pose room.solids) ─────
function populateForestDecor(room, rng) {
  const srnd = (a, b) => a + rng() * (b - a);
  const W = canvas.width, H = canvas.height, groundY = H + 40;
  const farCount  = Math.ceil(W / 70) + 4;
  const nearCount = Math.ceil(W / 110) + 4;
  const far = [], near = [], roomSolids = [];
  for (let i = 0; i < farCount; i++) {
    const made = makeTreeSprite(i % 3, Math.floor(rng() * 1e6));
    far.push({ sprite: made.canvas, x: rng() * W, scale: srnd(2.2, 3.0), alpha: 0.34 });
  }
  for (let i = 0; i < nearCount; i++) {
    const made  = makeTreeSprite((i + 1) % 3, Math.floor(rng() * 1e6));
    const scale = srnd(3.6, 4.6);
    const x     = rng() * W;
    near.push({ sprite: made.canvas, x, scale, alpha: 0.62 });
    const sw = 12 * PX * scale, sh = 20 * PX * scale;
    const trunkPxW = sw / 6, trunkPxH = made.trunkH * sh / 20;
    roomSolids.push({ x, y: groundY - trunkPxH / 2, hw: trunkPxW / 2, hh: trunkPxH / 2 });
  }
  room.treesFar = far; room.treesNear = near; room.solids = roomSolids;
}

function populateFieldDecor(room, rng) {
  const srnd = (a, b) => a + rng() * (b - a);
  const W = canvas.width;
  const count = Math.ceil(W / 40) + 6;
  const stalks = [];
  for (let i = 0; i < count; i++) {
    const made = makeWheatSprite(Math.floor(rng() * 1e6));
    stalks.push({ sprite: made.canvas, x: rng() * W, scale: srnd(3.2, 4.4), alpha: 0.7 });
  }
  room.wheat = stalks; room.solids = []; // le blé n'est pas solide
}

function populateCaveDecor(room, rng) {
  const seed = Math.floor(rng() * 0xffffffff) >>> 0;
  const cave = HibouWorld.generateCave(seed, canvas.width, canvas.height);
  room.cave = cave; room.solids = cave.solids;
}

function populateLakeDecor(room, rng) {
  const srnd = (a, b) => a + rng() * (b - a);
  const W = canvas.width, H = canvas.height;
  const bandH = H * 0.18;
  const count = Math.ceil(W / 90) + 4;
  const deco = [];
  for (let i = 0; i < count; i++) {
    const glow = rng() < 0.3;
    deco.push({
      x: rng() * W,
      h: srnd(40, 90),
      glow,
      hue: glow ? (rng() < 0.5 ? '#40e0d0' : '#e040c0') : '#1f6b4a',
      seed: rng() * Math.PI * 2
    });
  }
  room.seabed = deco; room.solids = []; // décor du lac non solide
  room.bandH = bandH;
}


// ── Resize & Étoiles ────────────────────────────
let stars = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
function initStars() {
  stars = Array.from({ length: 180 }, () => ({
    x: rnd(0, canvas.width), y: rnd(0, canvas.height * 0.8),
    r: rnd(0.3, 2), a: Math.random(),
    da: rnd(0.005, 0.02) * (Math.random() < 0.5 ? 1 : -1)
  }));
}
window.addEventListener('resize', () => {
  resize(); initStars();
  const room = currentRoom();
  if (room && (room.genW !== canvas.width || room.genH !== canvas.height)) {
    ensureRoomGenerated(room);      // réajuste décor+solides à la nouvelle taille (même seed)
    loadRoomState(room);
    HibouWorld.resolveSolids(owl, owl.size * 0.4, solids); // auto-corrige un éventuel « coincé dans un mur »
    for (const m of monsters) HibouWorld.resolveSolids(m, m.size * 0.4, solids);
  }
});
resize(); initStars();
// NB : resetWorld() n'est PAS appelé ici — il référence (via newMonster/newCollectible)
// des const déclarées plus bas dans le fichier (DIFF_RAMP_TAU, MONSTER_STATS...), qui sont
// encore en zone morte temporelle à ce stade de l'évaluation du script. Voir l'appel en
// toute fin de fichier, juste avant le démarrage de la boucle de jeu.

// ── Input ───────────────────────────────────────
const keys  = {};
const mouse = { x: -999, y: -999, on: false };

// ── Contrôle souris : pointer lock + curseur virtuel ─────────────────────────────
// Sans pointer lock, la position souris est bornée au bord de la fenêtre : le hibou fonçait
// vers le curseur coincé. On capture donc la souris (pointer lock) et on maintient un
// curseur VIRTUEL en accumulation libre (mouse.x/y ne sont plus bornés — le hibou, lui,
// est soit clampé à un mur/bord soit téléporté au centre d'une nouvelle carte, jamais
// « enroulé » sur lui-même ; resynchroniser mouse.x/y=owl.x/y à chaque pointerlockchange et
// à chaque changement de carte suffit à empêcher toute dérive). Repli automatique sur
// clientX/clientY si le pointer lock est indisponible/refusé (et pour le slider réglages +
// le tactile mobile, qui n'utilisent jamais le pointer lock).
function pointerLocked() { return document.pointerLockElement === canvas; }
function tryLockPointer() {
  if (isMobile || pointerLocked() || !canvas.requestPointerLock) return;
  try { canvas.requestPointerLock(); } catch { /* geste non éligible : repli clientX */ }
}
document.addEventListener('pointerlockchange', () => {
  // À la prise du verrou, on cale le curseur virtuel sur le hibou pour éviter tout saut.
  if (pointerLocked()) { mouse.x = owl.x; mouse.y = owl.y; mouse.on = true; }
});

// ── Slider settings (drag) ───────────────────────
let sliderDrag = false;

document.addEventListener('keydown', e => {
  keys[e.key] = true; mouse.on = false;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();

  if (state === S.NOTES) { markNotesSeen(); state = S.START; return; }

  // Touche O : ouvre/ferme le menu sensibilité (desktop uniquement)
  if (e.key === 'o' || e.key === 'O') {
    if (!isMobile) {
      settingsOpen = !settingsOpen;
      // Le slider a besoin du vrai curseur : on relâche le pointer lock quand le menu s'ouvre.
      if (settingsOpen && pointerLocked()) document.exitPointerLock();
    }
    return;
  }

  // Ferme le menu si on appuie sur Escape
  if (e.key === 'Escape') { settingsOpen = false; return; }

  if (state === S.START || state === S.OVER) beginGame();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });
document.addEventListener('mousemove', e => {
  if (pointerLocked()) {
    // Curseur virtuel : accumulation libre (resynchronisé à owl.x/y à chaque prise de
    // verrou et à chaque changement de carte — jamais de dérive à long terme).
    mouse.x += e.movementX;
    mouse.y += e.movementY;
    mouse.on = true;
  } else {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = true;
    if (sliderDrag) handleSliderDrag(e.clientX);
  }
});
document.addEventListener('mouseup', () => { sliderDrag = false; });

canvas.addEventListener('pointerdown', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = true;

  if (state === S.NOTES) { markNotesSeen(); state = S.START; return; }

  // Vérifie si on clique sur le slider du menu settings
  if (settingsOpen && !isMobile) {
    const hit = getSliderHitArea();
    if (e.clientX >= hit.x && e.clientX <= hit.x + hit.w &&
        e.clientY >= hit.y - 10 && e.clientY <= hit.y + hit.h + 10) {
      sliderDrag = true;
      handleSliderDrag(e.clientX);
      return;
    }
    // Clic hors du panel ferme le menu
    const panel = getSettingsPanelRect();
    if (e.clientX < panel.x || e.clientX > panel.x + panel.w ||
        e.clientY < panel.y || e.clientY > panel.y + panel.h) {
      settingsOpen = false;
      return;
    }
    return;
  }

  if (state === S.START || state === S.OVER) { beginGame(); return; }
  // En jeu : (re)prendre le pointer lock s'il a été relâché (ex. après Échap), pour l'enroulement.
  if (state === S.PLAY && !settingsOpen) tryLockPointer();
});
canvas.addEventListener('pointermove', e => {
  if (pointerLocked()) return; // sous pointer lock, c'est 'mousemove' (movementX) qui pilote
  if (mouse.on) { mouse.x = e.clientX; mouse.y = e.clientY; }
  if (sliderDrag) handleSliderDrag(e.clientX);
});
canvas.addEventListener('pointerup', () => { sliderDrag = false; });

// ── Calcul du lerp factor selon la sensibilité ───
// sens 0.5 → lerp 0.15 (normal) / 0.25 (speed)
// La sensibilité scale linéairement : sens * 0.30 → max lerp 0.30 à sens=1
function getMouseLerp(speedBuff) {
  const base = speedBuff ? 0.50 : 0.30;
  return base * mouseSensitivity;
}

// ── Positions du panel settings ──────────────────
function getSettingsPanelRect() {
  const W = canvas.width, H = canvas.height;
  const pw = 280, ph = 110;
  return { x: W / 2 - pw / 2, y: H / 2 - ph / 2, w: pw, h: ph };
}
function getSliderHitArea() {
  const p = getSettingsPanelRect();
  return { x: p.x + 20, y: p.y + 62, w: p.w - 40, h: 16 };
}
function handleSliderDrag(clientX) {
  const hit = getSliderHitArea();
  const t   = Math.max(0, Math.min(1, (clientX - hit.x) / hit.w));
  mouseSensitivity = Math.round(t * 19) / 19; // snap à 5% près (20 positions)
  mouseSensitivity = Math.max(0.05, Math.min(1.0, 0.05 + t * 0.95));
}

// ══════════════════════════════════════════════════
//  LOGIQUE OURS
// ══════════════════════════════════════════════════
// Courbe de difficulté temporelle : monte vite puis plafonne (asymptote vers 1), jamais de saut brutal.
const DIFF_RAMP_TAU = 5400; // ≈90s à 60fps
function difficultyFactor() {
  return 1 - Math.exp(-gameTime / DIFF_RAMP_TAU);
}

function newMonster(kind) {
  const stats = MONSTER_STATS[kind] || MONSTER_STATS.bear;
  const side = Math.floor(Math.random() * 4);
  const x    = side === 0 ? -50 : side === 1 ? canvas.width  + 50 : rnd(0, canvas.width);
  const y    = side === 2 ? -50 : side === 3 ? canvas.height + 50 : rnd(0, canvas.height);

  let life;
  if      (moon.state === 'blood') life = rnd(720,  1500);
  else if (moon.state === 'full')  life = rnd(360,  720);
  else                             life = rnd(480,  1200);

  const df = difficultyFactor(); // 0 (début) → ~1 (plateau après 4-5 min)
  let spdBase;
  if      (moon.state === 'blood') spdBase = rnd(3.8, 7.0) * (1 + df * 0.3);
  else if (moon.state === 'full')  spdBase = rnd(2.2, 3.8) * (1 + df * 0.3);
  else                             spdBase = (1.8 + Math.min(score * 0.05, 4.5)) * (1 + df * 0.3);
  spdBase = Math.min(spdBase, 9) * stats.spdMul; // cap global puis multiplicateur du kind (requin > ours > chauve-souris)

  const updateDelay = moon.state === 'blood' ? rnd(20, 45) : rnd(30, 70); // rafraîchit la dérive

  return {
    kind, x, y,
    size:    stats.size,
    turnMul: stats.turnMul,
    spdBase,
    life,
    heading:  Math.atan2(owl.y - y, owl.x - x) || 0, // cap courant (poursuite à braquage limité)
    driftAng: 0,                                     // biais d'orientation, rafraîchi périodiquement
    updateDelay,
    updateTimer: Math.floor(rnd(0, updateDelay)),
    bob: rnd(0, Math.PI * 2),
    flap: rnd(0, Math.PI * 2), // phase de battement (chauve-souris)
    spawnPulse: 1 // 1→0, anim d'apparition (scale-in + glow)
  };
}

function monsterTarget(biome) {
  if (moon.state === 'blood') return 18;
  if (moon.state === 'full')  return 12;
  if (biome === 'lac') return Math.min(1 + Math.floor(score / 25), 5); // requins : plus rares, plus dangereux
  return Math.min(2 + Math.floor(score / 15), 10);
}

// ══════════════════════════════════════════════════
//  BRANCHES & CADEAUX
// ══════════════════════════════════════════════════
function newCollectible(biome, solidsForRoom) {
  const m    = 40;
  const pool = COLLECTIBLE_POOL[biome] || COLLECTIBLE_POOL.foret;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  // Ne spawn jamais à l'intérieur d'un obstacle (arbre, paroi de grotte...).
  const pos    = HibouWorld.findSpawnPoint(Math.random, canvas.width, canvas.height, m, solidsForRoom, 30);
  const rotten = pick.rottenOk && Math.random() < ROTTEN_CHANCE;
  return {
    x: pos.x, y: pos.y,
    e: pick.e, value: pick.value,
    size: 24,
    w:  rnd(0, Math.PI * 2),
    ws: rotten ? rnd(0.06, 0.11) : rnd(0.03, 0.07),
    rotten,
    age: 0
  };
}

// ══════════════════════════════════════════════════
//  PARTICULES
// ══════════════════════════════════════════════════
function spawnFX(x, y, amount, type = 'collect', txt = '') {
  for (let i = 0; i < amount; i++) {
    const a = (i / amount) * Math.PI * 2;
    const spd = rnd(2, 8);
    particles.push({
      type: 'dot', x, y,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      life: 1,
      c: type === 'collect'
        ? ['#ffd700','#7ec850','#a8ff80','#ffffff'][Math.floor(Math.random() * 4)]
        : ['#ff4444','#ffaa00','#ffffff'][Math.floor(Math.random() * 3)]
    });
  }
  if (txt) particles.push({ type: 'txt', x, y, vx: 0, vy: -3, life: 1.5, txt, tType: type });
}

function spawnWrapFX(x, y) {
  for (let i = 0; i < 5; i++) {
    const a = rnd(0, Math.PI * 2);
    particles.push({
      type: 'dot', x, y,
      vx: Math.cos(a) * rnd(1, 3), vy: Math.sin(a) * rnd(1, 3),
      life: 0.35, c: 'rgba(160,210,255,0.75)'
    });
  }
}

// ══════════════════════════════════════════════════
//  INIT / RESET
// ══════════════════════════════════════════════════
function beginGame() {
  settingsOpen = false;
  state = S.PLAY; canvas.style.cursor = 'none';
  tryLockPointer(); // capture la souris → curseur virtuel (voir contrôle souris ci-dessus)
  score = 0; nest = 0; combo = 1; comboTimer = 0; screenShake = 0; lives = 1; gameTime = 0;
  moon  = { state: 'none', timer: 0, next: 900, fillProgress: 0 };
  storm = { active: false, timer: 0, next: rnd(1800, 3600), windAngle: 0, windForce: 0, gustPhase: 0 };
  rocks = []; windLines = [];
  hitFlash = 0;
  musicPulse = { level: 0, target: 0 };
  buffs = { speed: 0, multi: 0, slow: 0, invincible: 0 };
  lootbox = { items: [], scroll: 0, speed: 0, phase: 'scroll', result: null };
  specialItem = null;
  particles = [];
  resetWorld(); // nouvelle partie = nouveau monde : graphe de cartes entièrement recréé (carte r0 = forêt)
  owl.x = canvas.width / 2; owl.y = canvas.height / 2; owl.invul = 60;
  owl.px = owl.x; owl.py = owl.y; owl.vx = 0; owl.vy = 0; owl.angle = 0; owl.flap = 0; owl.rockInvul = 0;
  mouse.x = owl.x; mouse.y = owl.y;
}

// ══════════════════════════════════════════════════
//  UPDATE
// ══════════════════════════════════════════════════
function update() {
  if (screenShake > 0) { screenShake *= 0.9; if (screenShake < 0.5) screenShake = 0; }
  if (hitFlash    > 0) { hitFlash    *= 0.85; if (hitFlash < 0.01) hitFlash = 0; }
  musicPulse.level += (musicPulse.target - musicPulse.level) * 0.15;

  if (state === S.LOOT) { updateLootbox(); updateParticles(); return; }
  if (state !== S.PLAY) { updateParticles(); return; }

  // ── Difficulté temporelle ──
  gameTime++;

  // ── Timers globaux ──
  owl.bob += 0.1;
  if (owl.invul        > 0) owl.invul--;
  if (owl.rockInvul    > 0) owl.rockInvul--;
  if (buffs.speed      > 0) buffs.speed--;
  if (buffs.multi      > 0) buffs.multi--;
  if (buffs.slow       > 0) buffs.slow--;
  if (buffs.invincible > 0) buffs.invincible--;
  owl.speed = buffs.speed > 0 ? 11 : 6;

  updateMoon();
  updateStorm();

  // ── Bulles (lac) : le hibou est entièrement immergé ──
  if (currentBiome() === 'lac' && Math.random() < 0.08) {
    particles.push({ type: 'bubble', x: rnd(0, canvas.width), y: canvas.height - rnd(0, 40), vx: rnd(-0.2, 0.2), vy: rnd(-1.5, -0.6), life: 1 });
  }

  // ── Mouvements du hibou ──
  owl.px = owl.x; owl.py = owl.y;
  if (mouse.on) {
    const lerpF = getMouseLerp(buffs.speed > 0);
    let dx = (mouse.x - owl.x) * lerpF;
    let dy = (mouse.y - owl.y) * lerpF;
    // Plafond de vitesse LIÉ à owl.speed (6 normal → 11 avec Speed Boost) : fouetter la souris
    // ne suffit plus à atteindre la vitesse max, c'est le buff qui relève ce plafond → Speed
    // Boost devient réellement utile.
    const maxStep = owl.speed * 2.2;
    const stepMag = Math.hypot(dx, dy);
    if (stepMag > maxStep) { const k = maxStep / stepMag; dx *= k; dy *= k; }
    owl.x += dx;
    owl.y += dy;
  } else {
    if (keys['ArrowLeft']  || keys['a']) owl.x -= owl.speed;
    if (keys['ArrowRight'] || keys['d']) owl.x += owl.speed;
    if (keys['ArrowUp']    || keys['w']) owl.y -= owl.speed;
    if (keys['ArrowDown']  || keys['s']) owl.y += owl.speed;
  }
  // ── Vent de tempête : pousse le hibou dans windAngle, force pulsée par rafales ──
  if (storm.active) {
    owl.x += Math.cos(storm.windAngle) * storm.windForce;
    owl.y += Math.sin(storm.windAngle) * storm.windForce;
  }

  const r = owl.size * 0.4;
  HibouWorld.resolveSolids(owl, r, solids); // arbres/parois de grotte : plus de traversée

  // ── Changement de carte : sortir d'un bord change de carte, au lieu de s'enrouler ──
  // Un délai de 10s (roomCooldown) doit être écoulé depuis l'arrivée ; sinon le bord agit
  // comme un mur mou (clamp) — voir aussi le repère « Xs » au HUD.
  if (roomCooldown > 0) roomCooldown--;
  let justTransitioned = false;
  if (owl.x < r || owl.x > canvas.width - r) {
    if (roomCooldown <= 0) { attemptTransition(owl.x < r ? 'W' : 'E'); justTransitioned = true; }
    else owl.x = Math.max(r, Math.min(canvas.width - r, owl.x));
  }
  if (!justTransitioned && (owl.y < r || owl.y > canvas.height - r)) {
    if (roomCooldown <= 0) { attemptTransition(owl.y < r ? 'N' : 'S'); justTransitioned = true; }
    else owl.y = Math.max(r, Math.min(canvas.height - r, owl.y));
  }

  // ── Cap & battement d'ailes ──
  const mvx = owl.x - owl.px, mvy = owl.y - owl.py;
  const mvMag = Math.hypot(mvx, mvy);
  owl.vx = mvx;
  owl.vy = mvy; // vecteur vitesse complet → anticipation de l'IA des ours (Fix pourchasse)
  owl.moveMag = mvMag;
  if (mvMag > 0.2) owl.angle = lerpAngle(owl.angle, Math.atan2(mvy, mvx), 0.2);
  owl.flap += 0.22 + (buffs.speed > 0 ? 0.12 : 0) + Math.min(mvMag * 0.015, 0.15);
  if (mvMag > 1.5 && Math.random() < 0.5) {
    particles.push({ type: 'dot', x: owl.x, y: owl.y, vx: -mvx * 0.1, vy: -mvy * 0.1, life: 0.3, c: 'rgba(255,255,255,0.7)' });
  }

  for (const s of stars) { s.a += s.da; if (s.a > 1 || s.a < 0.05) s.da *= -1; }

  // ── Cadeau spécial ──
  // Cadeau spécial : plus fréquent qu'avant (0.0005 → 0.0012) ET désormais AUTORISÉ pendant les
  // tempêtes (l'utilisateur veut des objets plus souvent, tempêtes comprises). On l'évite juste
  // pendant les lunes, où le champ est déjà saturé d'ours. Les tempêtes ont lieu quand
  // moon.state === 'none', donc cette condition les couvre.
  if (!specialItem && moon.state === 'none' && Math.random() < 0.0012) {
    const m = storm.active ? 100 : 60; // en tempête, on l'éloigne un peu des bords balayés
    specialItem = { x: rnd(m, canvas.width - m), y: rnd(m, canvas.height - m), bob: 0 };
  }
  if (specialItem) {
    specialItem.bob += 0.05;
    if (dist(owl, specialItem) < r + 25) {
      const result = rollLoot();
      initLootboxScroll(result);
      state       = S.LOOT;
      specialItem = null;
      screenShake = 15;
    }
  }

  // ── Collecte des objets ──
  const biome = currentBiome();
  if (moon.state === 'none') {
    for (let i = collectibles.length - 1; i >= 0; i--) {
      const br = collectibles[i];
      br.w += br.ws;

      if (br.rotten) {
        br.age++;
        if (br.age >= ROTTEN_LIFE) { collectibles.splice(i, 1); collectibles.push(newCollectible(biome, solids)); continue; }
      }

      if (dist(owl, br) < r + br.size * 0.4) {
        if (br.rotten) {
          combo = 0; comboTimer = 0;
          screenShake = Math.max(screenShake, 9);
          hitFlash = Math.max(hitFlash, 0.35);
          spawnFX(br.x, br.y, 14, 'death', 'COMBO RESET 🤢');
          collectibles.splice(i, 1); collectibles.push(newCollectible(biome, solids));
          continue;
        }

        const multi = buffs.multi > 0 ? 5 : 1;
        const gain  = br.value * Math.max(1, combo) * multi;
        score += gain;
        nest += 1;

        if (nest >= 100) {
          nest %= 100;
          lives++;
          spawnFX(owl.x, owl.y, 30, 'collect', '+1 VIE ! ❤️');
          screenShake = 15;
        }

        screenShake = Math.min(4 + combo * 0.5, 15);
        spawnFX(br.x, br.y, 12, 'collect', `+${gain}`);
        combo = Math.max(1, combo) + 1; comboTimer = MAX_COMBO_TIME;
        collectibles.splice(i, 1);
        // Lac : taux de drop réduit → délai avant réapparition plutôt qu'instantanée.
        if (biome === 'lac') pendingRespawns.push(rnd(300, 600));
        else                 collectibles.push(newCollectible(biome, solids));
        const mk = BIOME_MONSTER_KIND[biome];
        while (monsters.length < monsterTarget(biome)) monsters.push(newMonster(mk));
      }
    }
    if (comboTimer > 0) comboTimer--; else combo = 1;

    // Réapparitions différées (lac) : chaque délai écoulé fait apparaître une nouvelle pépite.
    for (let i = pendingRespawns.length - 1; i >= 0; i--) {
      if (--pendingRespawns[i] <= 0) {
        pendingRespawns.splice(i, 1);
        collectibles.push(newCollectible('lac', solids));
      }
    }
  }

  // ── Pulse musical visuel : intensité selon contexte de danger/hype ──
  musicPulse.target = Math.min(1,
    0.15 +
    Math.min(combo * 0.045, 0.4) +
    (storm.active ? 0.25 : 0) +
    (moon.state === 'blood' ? 0.35 : moon.state === 'full' ? 0.2 : 0) +
    (buffs.invincible > 0 ? 0.3 : 0)
  );

  updateMonsters(r);
  updateRocks(r);
  updateParticles();
}

// ══════════════════════════════════════════════════
//  UPDATE LUNE
// ══════════════════════════════════════════════════
function updateMoon() {
  if (storm.active) return;
  if (moon.state === 'none') {
    moon.next--;
    if (moon.next <= 120 && moon.fillProgress < 1) {
      moon.fillProgress = Math.min(1, moon.fillProgress + 1 / 120);
    }
    if (moon.next <= 0) {
      const isBlood = Math.random() < 0.1;
      moon.state        = isBlood ? 'blood' : 'full';
      moon.fillProgress = 1;
      moon.timer        = isBlood ? 900 : 600;
      screenShake = isBlood ? 30 : 20;
      const msg = isBlood ? '🩸 LUNE DE SANG !' : '🌕 PLEINE LUNE !';
      spawnFX(canvas.width / 2, 60, 0, isBlood ? 'death' : 'collect', msg);
      { const biome = currentBiome(), mk = BIOME_MONSTER_KIND[biome];
        while (monsters.length < monsterTarget(biome)) monsters.push(newMonster(mk)); }
    }
  } else {
    moon.timer--;
    if (moon.timer <= 0) {
      moon.state        = 'none';
      moon.fillProgress = 0;
      moon.next         = rnd(1200, 1800);
      monsters          = [];
      // On repeuple TOUT DE SUITE au niveau normal : avant, le champ restait vide après une lune
      // tant qu'aucune branche n'était ramassée → « aucun monstre » pendant de longues secondes.
      { const biome = currentBiome(), mk = BIOME_MONSTER_KIND[biome];
        while (monsters.length < monsterTarget(biome)) monsters.push(newMonster(mk)); }
      screenShake       = 10;
    }
  }
}

// ══════════════════════════════════════════════════
//  UPDATE TEMPÊTE
// ══════════════════════════════════════════════════
const STORM_DURATION = 1200; // 20s à 60fps

function updateStorm() {
  if (!storm.active) {
    if (moon.state === 'none') {
      storm.next--;
      if (storm.next <= 0) {
        storm.active     = true;
        storm.timer      = STORM_DURATION;
        storm.spawnTimer = 0;
        storm.windAngle  = rnd(0, Math.PI * 2);
        storm.gustPhase  = 0;
        rocks = [];
        initWindLines();
        screenShake = 14;
        spawnFX(canvas.width / 2, 60, 0, 'death', '🌬️ TEMPÊTE !');
      }
    }
    return;
  }

  storm.timer--;
  storm.spawnTimer--;
  if (storm.spawnTimer <= 0) {
    rocks.push(newRock());
    storm.spawnTimer = Math.floor(rnd(48, 72)); // 0.8-1.2s
  }

  // ── Rafales : force pulsée (sin) + dérive lente de la direction ──
  storm.gustPhase += 0.045;
  const gust = 0.5 + 0.5 * Math.sin(storm.gustPhase);           // 0..1
  storm.windForce  = 0.6 + gust * 1.8;                           // 0.6..2.4 px/frame
  storm.windAngle += Math.sin(storm.gustPhase * 0.3) * 0.01;     // dérive douce

  for (const wl of windLines) {
    wl.x += wl.speed * (0.6 + gust * 0.8);
    if (wl.x > canvas.width + 60) { wl.x = -60; wl.y = rnd(0, canvas.height); }
  }

  // Léger balancement du décor (borné, cosmétique — le décor est en position FIXE par carte
  // pour que les rects de collision restent synchronisés ; on n'ajoute donc plus qu'un sway
  // borné au dessin, jamais injecté dans les rects solides).
  decorSwayPhase += storm.windForce * 0.05;

  if (storm.timer <= 0) {
    storm.active    = false;
    storm.next      = rnd(1800, 3600);
    storm.windForce = 0;
    rocks = [];
    screenShake = 8;
  }
}

function newRock() {
  return {
    x: rnd(30, canvas.width - 30),
    y: -50,
    vy: rnd(3, 4.2),
    vx: rnd(-1.4, 1.4),
    size: 30,           // un peu plus gros qu'avant (26) pour mieux se voir
    rot: rnd(0, Math.PI * 2),
    rotSpeed: rnd(-0.06, 0.06),
    warn: 42            // ~0.7 s d'ALERTE (télégraphe en haut) avant que le caillou ne tombe
  };
}

function updateRocks(owlRadius) {
  for (let i = rocks.length - 1; i >= 0; i--) {
    const rk = rocks[i];
    // Phase d'alerte : le caillou ne tombe pas encore et ne blesse pas — le joueur est prévenu
    // (avant, un caillou gris tombait sans prévenir sur un ciel d'orage gris → dégâts « mystère »).
    if (rk.warn > 0) { rk.warn--; continue; }
    rk.x += rk.vx; rk.y += rk.vy; rk.rot += rk.rotSpeed;

    if (rk.y > canvas.height + 50) { rocks.splice(i, 1); continue; }

    if (owl.rockInvul <= 0 && dist(owl, rk) < owlRadius * 0.8 + rk.size * 0.35) {
      score = Math.max(0, score - 20);
      owl.rockInvul = 20;
      screenShake = Math.max(screenShake, 10);
      spawnFX(rk.x, rk.y, 10, 'death', '-20');
      rocks.splice(i, 1);
    }
  }
}

function initWindLines() {
  windLines = Array.from({ length: 36 }, () => ({
    x: rnd(0, canvas.width), y: rnd(0, canvas.height),
    len: rnd(20, 55), speed: rnd(9, 18), a: rnd(0.15, 0.4)
  }));
}

// ══════════════════════════════════════════════════
//  UPDATE OURS
// ══════════════════════════════════════════════════
function updateMonsters(owlRadius) {
  const biome = currentBiome();
  const mk    = BIOME_MONSTER_KIND[biome];
  for (let i = monsters.length - 1; i >= 0; i--) {
    const b = monsters[i];
    b.life--;
    if (b.life <= 0) {
      spawnFX(b.x, b.y, 6, 'death');
      monsters.splice(i, 1);
      if (moon.state === 'none' && monsters.length < monsterTarget(biome)) monsters.push(newMonster(mk));
      continue;
    }
    b.bob += 0.12;
    b.flap = (b.flap || 0) + 0.3; // phase de battement (chauve-souris) — inoffensif pour les autres kinds
    if (b.spawnPulse > 0) b.spawnPulse = Math.max(0, b.spawnPulse - 0.05);

    // ── Poursuite ANTICIPÉE à braquage limité ─────────────────────────────────────
    // On vise là où le hibou VA être (position + vitesse × avance), pas seulement où il est, et
    // l'ours tourne PROGRESSIVEMENT vers cette cible (turnRate borné) au lieu de se réorienter
    // d'un coup. Résultat : orbiter à la souris ne suffit plus à le semer, l'ours coupe la
    // trajectoire au lieu de suivre un point périmé.
    b.updateTimer--;
    if (b.updateTimer <= 0) {
      b.updateTimer = b.updateDelay;
      b.driftAng = rnd(-0.5, 0.5); // léger biais organique (bien plus faible que l'ancienne dérive)
    }
    const lead = moon.state === 'blood' ? 14 : 10;          // frames d'anticipation
    let lvx = owl.vx * lead, lvy = owl.vy * lead;
    const lmag = Math.hypot(lvx, lvy), lcap = 200;          // borne l'avance si le hibou fonce
    if (lmag > lcap) { lvx *= lcap / lmag; lvy *= lcap / lmag; }
    const ddx = (owl.x + lvx) - b.x;
    const ddy = (owl.y + lvy) - b.y;
    const desAng = Math.atan2(ddy, ddx) + b.driftAng * 0.4;
    let da = desAng - b.heading;
    da = Math.atan2(Math.sin(da), Math.cos(da));            // écart d'angle ramené dans [-π, π]
    const turnRate = (moon.state === 'blood' ? 0.12 : 0.09) * (b.turnMul || 1); // rad/frame (braquage maximal)
    b.heading += Math.max(-turnRate, Math.min(turnRate, da));
    const spd = b.spdBase * (buffs.slow > 0 ? 0.3 : 1);
    b.x += Math.cos(b.heading) * spd;
    b.y += Math.sin(b.heading) * spd;

    HibouWorld.resolveSolids(b, b.size * 0.4, solids); // arbres/parois de grotte : plus de traversée

    if (owl.invul <= 0 && buffs.invincible <= 0 && dist(owl, b) < owlRadius * 0.8 + b.size * 0.3) {
      lives--;
      screenShake = 25;
      hitFlash    = 0.6;
      spawnFX(b.x, b.y, 16, 'death');
      if (lives <= 0) {
        best  = Math.max(best, score);
        state = S.OVER;
        spawnFX(owl.x, owl.y, 50, 'death');
        canvas.style.cursor = 'default';
        if (document.pointerLockElement) document.exitPointerLock(); // rendre le curseur
      } else {
        owl.invul = 120;
        spawnFX(owl.x, owl.y, 30, 'death', '-1 Vie !');
      }
    }
  }
  if (moon.state !== 'none' && monsters.length < monsterTarget(biome) && Math.random() < 0.15) {
    monsters.push(newMonster(mk));
  }
  // Recharge continue en jeu NORMAL aussi (avant, les ours ne réapparaissaient qu'au ramassage
  // d'une branche ou à la mort d'un ours → le champ pouvait rester vide). Le champ n'est plus vide.
  if (moon.state === 'none' && monsters.length < monsterTarget(biome) && Math.random() < 0.04) {
    monsters.push(newMonster(mk));
  }
}

// ══════════════════════════════════════════════════
//  LOOTBOX
// ══════════════════════════════════════════════════
const ITEM_COUNT  = 28;
const TARGET_IDX  = ITEM_COUNT - 4;
const CASE_W      = 90;
const CASE_GAP    = 8;
const CASE_STRIDE = CASE_W + CASE_GAP;

function initLootboxScroll(result) {
  const items = [];
  for (let i = 0; i < ITEM_COUNT; i++) {
    items.push(i === TARGET_IDX ? result : rollLoot());
  }
  const barWidth    = CASE_STRIDE * 5 - CASE_GAP;
  const finalScroll = barWidth / 2 - CASE_W / 2 - TARGET_IDX * CASE_STRIDE;
  const startScroll = barWidth + CASE_STRIDE * 4;

  lootbox = {
    items,
    result,
    scroll:      startScroll,
    finalScroll,
    phase:       'scroll',
    landTimer:   0,
    pauseTimer:  0
  };
}

function updateLootbox() {
  if (lootbox.phase === 'scroll') {
    const remaining = lootbox.finalScroll - lootbox.scroll;
    const speed = remaining * 0.06;
    const minSpeed = Math.abs(remaining) > CASE_STRIDE * 2 ? -8 : 0;
    lootbox.scroll += Math.min(speed, minSpeed);

    if (Math.abs(remaining) < 1) {
      lootbox.scroll = lootbox.finalScroll;
      lootbox.phase  = 'land';
      screenShake    = 8;
    }

  } else if (lootbox.phase === 'land') {
    lootbox.landTimer++;
    if (lootbox.landTimer === 120) applyLoot(lootbox.result.id);
    if (lootbox.landTimer >= 120) {
      lootbox.pauseTimer++;
      if (lootbox.pauseTimer >= 30) {
        state           = S.PLAY;
        owl.invul       = 90;
        canvas.style.cursor = 'none';
      }
    }
  }
}

function applyLoot(id) {
  if (id === 'life')       lives++;
  if (id === 'speed')      buffs.speed      = 420;
  if (id === 'multi')      buffs.multi      = 420;
  if (id === 'slow')       buffs.slow       = 420;
  if (id === 'invincible') buffs.invincible = 600;
}

// ══════════════════════════════════════════════════
//  UPDATE PARTICULES
// ══════════════════════════════════════════════════
function updateParticles() {
  for (const p of particles) {
    p.x  += p.vx; p.y += p.vy;
    if (p.type === 'bubble') {
      p.life -= 0.008; // remontée lente et régulière (~2s), pas d'amortissement de vitesse
      continue;
    }
    if (p.vx) p.vx *= 0.92;
    p.vy  *= (p.type === 'txt' ? 0.95 : 0.92);
    p.life -= (p.type === 'txt' ? 0.02 : 0.03);
  }
  particles = particles.filter(p => p.life > 0);
}

// ══════════════════════════════════════════════════
//  DRAW PRINCIPAL
// ══════════════════════════════════════════════════
function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.save();
  if (screenShake > 0) ctx.translate(rnd(-screenShake, screenShake), rnd(-screenShake, screenShake));

  const biome = currentBiome();

  if (biome === 'grotte') {
    drawCaveBackground(W, H);
  } else {
    drawSky(W, H);
    const t = moon.fillProgress;
    for (const s of stars) {
      ctx.save(); ctx.globalAlpha = s.a * (storm.active ? 0.15 : 1);
      if (moon.state === 'blood' && t > 0.5)      ctx.fillStyle = `rgba(255,${Math.round(200 - t*160)},${Math.round(180 - t*160)},1)`;
      else if (moon.state === 'full' && t > 0.5)  ctx.fillStyle = '#fffaee';
      else                                          ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.save(); if (storm.active) ctx.globalAlpha = 0.25;
    drawMoon(W, H);
    ctx.restore();
  }

  // ── Décor de fond, spécifique au biome (derrière le gameplay) ──
  const groundY = H + 40; // base du décor légèrement sous l'écran
  const sway = storm.active ? Math.sin(decorSwayPhase) * 4 : 0;
  if (biome === 'foret') {
    drawTreeLayer(treesFar,  groundY, sway * 0.4);
    drawTreeLayer(treesNear, groundY, sway);
  } else if (biome === 'champ') {
    drawTreeLayer(wheat, groundY, sway);
  } else if (biome === 'lac') {
    drawLakeSeabed(W, H);
  } // grotte : le fond rocheux a déjà été dessiné par drawCaveBackground ci-dessus

  if (state === S.NOTES) { drawPatchNotes(W, H); ctx.restore(); return; }
  if (state === S.START) { drawStart(W, H); ctx.restore(); return; }

  if (storm.active) drawWindLines();

  if (specialItem) {
    ctx.save();
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur  = 20 + Math.sin(specialItem.bob) * 10;
    drawEmoji('🎁', specialItem.x, specialItem.y + Math.sin(specialItem.bob) * 5, 34);
    ctx.restore();
  }

  if (moon.state === 'none') {
    for (const b of collectibles) {
      if (b.rotten) {
        const fadeStart = ROTTEN_LIFE - 60;
        const alpha = b.age > fadeStart ? Math.max(0, 1 - (b.age - fadeStart) / 60) : 1;
        ctx.save();
        ctx.globalAlpha  = alpha;
        ctx.filter       = 'grayscale(70%) brightness(0.75) sepia(25%)';
        ctx.shadowColor  = 'rgba(180,40,20,0.65)';
        ctx.shadowBlur   = 10;
        drawEmoji(b.e, b.x, b.y + Math.sin(b.w) * 4, b.size);
        ctx.filter = 'none';
        ctx.restore();
      } else {
        drawEmoji(b.e, b.x, b.y + Math.sin(b.w) * 4, b.size);
      }
    }
  }

  for (const b of monsters) {
    if (b.life < 60 && Math.floor(Date.now() / 100) % 2 === 0) continue;
    const scaleIn = 1 - b.spawnPulse * 0.6; // pop-in : 0.4 → 1.0
    const proximity = Math.max(0, 1 - dist(owl, b) / 260); // 0 loin, 1 collé
    ctx.save();
    ctx.shadowColor = b.spawnPulse > 0 ? '#ffffff' : `rgba(255,60,40,${0.5 + proximity * 0.5})`;
    ctx.shadowBlur  = b.spawnPulse > 0 ? 22 * b.spawnPulse : 6 + proximity * 18;
    ctx.translate(b.x, b.y + Math.sin(b.bob) * 3);
    ctx.scale(scaleIn, scaleIn);
    drawMonster(b);
    ctx.restore();
  }

  for (const rk of rocks) drawRock(rk);

  if (state === S.PLAY || state === S.LOOT) {
    if (owl.invul <= 0 || Math.floor(Date.now() / 80) % 2 === 0) {
      const faceLeft  = Math.cos(owl.angle) < 0;
      const tilt      = Math.max(-0.3, Math.min(0.3, owl.vx * 0.035));
      const flapScale = 1 + Math.sin(owl.flap) * 0.09;

      ctx.save();
      if (buffs.invincible > 0) {
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur  = 25 + Math.sin(Date.now() / 80) * 12;
      } else {
        ctx.shadowColor = buffs.speed > 0 ? '#00ffff' : (combo > 2 ? '#ff4400' : 'rgba(255,200,80,0.65)');
        ctx.shadowBlur  = buffs.speed > 0 || combo > 2 ? 30 : 20;
      }
      const moving = (owl.moveMag || 0) > 0.15;
      ctx.translate(owl.x, owl.y + Math.sin(owl.bob) * 4);
      ctx.rotate(tilt);
      ctx.scale(1, flapScale);
      drawOwlSprite(0, 0, owl.size * 1.5, faceLeft, moving);
      ctx.restore();
    }
  }

  for (const p of particles) {
    ctx.save(); ctx.globalAlpha = Math.max(0, p.life);
    if (p.type === 'txt') {
      ctx.fillStyle    = p.tType === 'death' ? '#ff3333' : '#ffd700';
      ctx.font         = '900 24px system-ui, sans-serif';
      ctx.textAlign    = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor  = '#000'; ctx.shadowBlur = 8;
      ctx.fillText(p.txt, p.x, p.y);
    } else if (p.type === 'bubble') {
      ctx.strokeStyle = 'rgba(200,240,255,0.55)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.5 + Math.sin(p.life * 12) * 1, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, rnd(2, 6), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // ── Hibou entièrement immergé (lac) : teinte bleue permanente par-dessus le gameplay ──
  if (biome === 'lac') {
    ctx.save(); ctx.fillStyle = 'rgba(25,90,150,0.25)'; ctx.fillRect(0, 0, W, H); ctx.restore();
  }

  drawHUD();
  if (state === S.OVER) drawOver(W, H);
  if (state === S.LOOT) drawLootbox(W, H);

  // Menu settings (par-dessus tout, desktop uniquement)
  if (settingsOpen && !isMobile) drawSettings(W, H);

  // ── Flash d'impact (dégât / collision) ──
  if (hitFlash > 0) {
    ctx.save();
    ctx.globalAlpha = hitFlash;
    ctx.fillStyle = '#ff2222';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // ── Barre de pulse musical (bas d'écran, esthétique arcade) ──
  if (state === S.PLAY || state === S.LOOT) {
    ctx.save();
    const pulseH = 3 + musicPulse.level * 9;
    const grad = ctx.createLinearGradient(0, H - pulseH, 0, H);
    grad.addColorStop(0, 'rgba(150,90,255,0)');
    grad.addColorStop(1, `rgba(${Math.round(150 + musicPulse.level*100)},${Math.round(90 - musicPulse.level*40)},255,${0.25 + musicPulse.level * 0.35})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, H - pulseH, W, pulseH);
    ctx.restore();
  }

  ctx.restore();
}

// ══════════════════════════════════════════════════
//  DRAW — CIEL
// ══════════════════════════════════════════════════
function drawSky(W, H) {
  const t   = moon.fillProgress;
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  if (storm.active) {
    sky.addColorStop(0, '#25272d');
    sky.addColorStop(1, '#3a3d45');
  } else if (moon.state === 'blood') {
    sky.addColorStop(0, `rgb(${Math.round(4 + t*22)},4,${Math.round(14 - t*9)})`);
    sky.addColorStop(1, `rgb(${Math.round(12 + t*49)},${Math.round(16 - t*8)},${Math.round(48 - t*40)})`);
  } else if (moon.state === 'full') {
    sky.addColorStop(0, `rgb(6,8,${Math.round(14 + t*18)})`);
    sky.addColorStop(1, `rgb(10,14,${Math.round(30 + t*22)})`);
  } else if (currentBiome() === 'lac') {
    sky.addColorStop(0, '#0a2a40');
    sky.addColorStop(1, '#0f3d5c');
  } else {
    sky.addColorStop(0, '#04040e');
    sky.addColorStop(1, '#0c1030');
  }
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
}

// ══════════════════════════════════════════════════
//  DRAW — GROTTE (fond rocheux + cellules teintées)
// ══════════════════════════════════════════════════
function drawCaveBackground(W, H) {
  ctx.fillStyle = '#151210';
  ctx.fillRect(0, 0, W, H);
  if (!caveGrid) return;
  const palette = ['#3a3630', '#453f37', '#33302b', '#2b2823'];
  const { cols, rows, cellW, cellH, wall, cellTone } = caveGrid;
  for (let rr = 0; rr < rows; rr++) {
    for (let cc = 0; cc < cols; cc++) {
      if (!wall[rr][cc]) continue;
      ctx.fillStyle = palette[cellTone[rr][cc]] || palette[0];
      ctx.fillRect(cc * cellW, rr * cellH, cellW + 1, cellH + 1); // +1 : évite un liseré entre cellules
    }
  }
}

// ══════════════════════════════════════════════════
//  DRAW — FOND MARIN (lac) : bande basse, centre de l'écran vide
// ══════════════════════════════════════════════════
function drawLakeSeabed(W, H) {
  const room  = currentRoom();
  const bandH = (room && room.bandH) || H * 0.18;
  const bandY = H - bandH;
  ctx.save();
  const grad = ctx.createLinearGradient(0, bandY, 0, H);
  grad.addColorStop(0, 'rgba(10,40,35,0)');
  grad.addColorStop(1, 'rgba(8,28,26,0.92)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, bandY, W, bandH);

  const t = Date.now() / 600;
  for (const d of seabed) {
    if (d.glow) {
      ctx.save();
      ctx.shadowColor  = d.hue;
      ctx.shadowBlur   = 14 + Math.sin(t + d.seed) * 6;
      ctx.fillStyle    = d.hue;
      ctx.globalAlpha  = 0.75;
      ctx.beginPath(); ctx.arc(d.x, H - 6, 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else {
      ctx.save();
      ctx.strokeStyle = d.hue; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.globalAlpha = 0.65;
      const sway = Math.sin(t + d.seed) * 8;
      ctx.beginPath();
      ctx.moveTo(d.x, H);
      ctx.quadraticCurveTo(d.x + sway, H - d.h * 0.6, d.x + sway * 1.5, H - d.h);
      ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();
}

// ══════════════════════════════════════════════════
//  DRAW — LUNE
// ══════════════════════════════════════════════════
function drawMoon(W, H) {
  const mx = W * 0.82, my = H * 0.11, mr = 44;
  const t  = moon.fillProgress;

  let haloColor;
  if (moon.state === 'blood')       haloColor = `rgba(255,${Math.round(50 - t*50)},${Math.round(50 - t*50)},${0.15 + t*0.25})`;
  else if (moon.state === 'full')   haloColor = `rgba(220,230,255,${0.1 + t*0.15})`;
  else                              haloColor = 'rgba(255,248,160,0.12)';

  const gm = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * (3 + t));
  gm.addColorStop(0, haloColor); gm.addColorStop(1, 'transparent');
  ctx.fillStyle = gm;
  ctx.beginPath(); ctx.arc(mx, my, mr * (4 + t), 0, Math.PI * 2); ctx.fill();

  let rC, gC, bC;
  if (moon.state === 'blood') {
    rC = 255; gC = Math.round(253 - t * 220); bC = Math.round(224 - t * 210);
  } else {
    rC = 255; gC = Math.round(253 - t * 3); bC = Math.round(224 + t * 16);
  }
  ctx.fillStyle = `rgb(${rC},${gC},${bC})`;
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();

  if (t < 1) {
    const shadowOffset = -14 + t * (mr + 18);
    ctx.fillStyle = moon.state === 'blood'
      ? `rgb(${Math.round(4 + t*22)},4,${Math.round(14 - t*9)})`
      : `rgb(6,8,${Math.round(14 + t*18)})`;
    ctx.beginPath(); ctx.arc(mx - shadowOffset, my, mr * 0.78, 0, Math.PI * 2); ctx.fill();
  }

  if (t > 0.8) {
    const alpha = (t - 0.8) / 0.2;
    ctx.save(); ctx.globalAlpha = alpha * 0.3;
    ctx.fillStyle = moon.state === 'blood' ? '#660000' : '#8899bb';
    [[0.3, -0.2, 0.18], [-0.25, 0.3, 0.12], [0.1, 0.35, 0.08]].forEach(([dx, dy, rs]) => {
      ctx.beginPath(); ctx.arc(mx + dx * mr, my + dy * mr, rs * mr, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
  }
}

// ══════════════════════════════════════════════════
//  DRAW — TEMPÊTE
// ══════════════════════════════════════════════════
function drawWindLines() {
  ctx.save();
  ctx.strokeStyle = '#c7cbd4';
  ctx.lineCap = 'round';
  for (const wl of windLines) {
    ctx.globalAlpha = wl.a;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(wl.x, wl.y);
    ctx.lineTo(wl.x - wl.len, wl.y + wl.len * 0.22);
    ctx.stroke();
  }
  ctx.restore();
}

function drawRock(rk) {
  // ── Phase d'alerte : télégraphe clignotant en haut de la colonne de chute ──
  if (rk.warn > 0) {
    const pulse = 0.5 + 0.5 * Math.sin(rk.warn * 0.5);
    ctx.save();
    ctx.globalAlpha = 0.5 + pulse * 0.5;
    ctx.strokeStyle = '#ff5a3c';
    ctx.lineWidth   = 3;
    ctx.setLineDash([8, 6]);
    ctx.beginPath(); ctx.moveTo(rk.x, 12); ctx.lineTo(rk.x, 48); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle    = '#ff5a3c';
    ctx.font         = 'bold 22px system-ui';
    ctx.textAlign    = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor  = '#000'; ctx.shadowBlur = 6;
    ctx.fillText('⚠', rk.x, 30);
    ctx.restore();
    return;
  }
  // ── Caillou : traînée de chute + halo vif + anneau de contour → bien lisible sur l'orage ──
  ctx.save();
  ctx.translate(rk.x, rk.y);
  ctx.globalAlpha = 0.32;
  for (let t = 1; t <= 3; t++) {
    drawEmoji('🪨', -rk.vx * t * 1.6, -rk.vy * t * 1.6, rk.size * (1 - t * 0.12)); // traînée derrière
  }
  ctx.globalAlpha = 1;
  ctx.rotate(rk.rot);
  ctx.shadowColor = '#ffd24a';   // halo jaune/orangé : fort contraste sur le ciel gris d'orage
  ctx.shadowBlur  = 18;
  drawEmoji('🪨', 0, 0, rk.size);
  ctx.shadowBlur  = 0;
  ctx.strokeStyle = 'rgba(255,210,74,0.9)';
  ctx.lineWidth   = 2.5;
  ctx.beginPath(); ctx.arc(0, 0, rk.size * 0.5, 0, Math.PI * 2); ctx.stroke(); // anneau de contour
  ctx.restore();
}

// ══════════════════════════════════════════════════
//  DRAW — HUD
// ══════════════════════════════════════════════════
function drawHUD() {
  const isEvent = moon.state !== 'none' || storm.active;
  const hudH    = isEvent ? 100 : 80;
  const border  = moon.state === 'blood' ? 'rgba(255,50,50,0.8)'
                : moon.state === 'full'  ? 'rgba(200,220,255,0.5)'
                : storm.active           ? 'rgba(170,175,185,0.6)'
                : 'rgba(100,90,220,0.4)';

  ctx.save();
  rrect(12, 12, 230, hudH, 14, 'rgba(8,8,35,0.82)', border);

  ctx.fillStyle = '#dde'; ctx.font = 'bold 16px system-ui';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('Score : ' + score, 24, 32);

  let livesStr = '';
  for (let i = 0; i < lives; i++) livesStr += '❤️';
  ctx.font = '12px system-ui'; ctx.fillText(livesStr, 140, 32);

  let yTxt = 50;
  if (buffs.multi      > 0) { ctx.fillStyle = '#00ffff'; ctx.fillText('✨ SCORE x5',     24, yTxt); yTxt += 16; }
  if (buffs.speed      > 0) { ctx.fillStyle = '#00ffff'; ctx.fillText('⚡ VITESSE',       24, yTxt); yTxt += 16; }
  if (buffs.slow       > 0) { ctx.fillStyle = '#00ffff'; ctx.fillText('❄️ GELÉS',        24, yTxt); yTxt += 16; }
  if (buffs.invincible > 0) { ctx.fillStyle = '#ffd700'; ctx.fillText('🦉 INVINCIBLE !', 24, yTxt); yTxt += 16; }

  if (moon.state === 'none' && !storm.active && combo > 1 && buffs.multi === 0) {
    ctx.fillStyle = '#ffaa00'; ctx.font = 'bold 13px system-ui';
    ctx.fillText('🔥 Combo x' + combo, 24, 50);
    const cbW = 80 * (comboTimer / MAX_COMBO_TIME);
    rrect(120, 46, 80, 6, 3, 'rgba(255,255,255,0.1)');
    rrect(120, 46, Math.max(0, cbW), 6, 3, '#ffaa00');
  }

  if (moon.state !== 'none') {
    const col = moon.state === 'blood' ? '#ff3333' : '#ccddff';
    const ico = moon.state === 'blood' ? '🩸' : '🌕';
    ctx.fillStyle = col; ctx.font = '900 14px system-ui';
    ctx.fillText(`${ico} SURVIE : ${Math.ceil(moon.timer / 60)}s`, 24, 50);
  } else if (storm.active) {
    ctx.fillStyle = '#cfd3da'; ctx.font = '900 14px system-ui';
    ctx.fillText(`🌬️ TEMPÊTE : ${Math.ceil(storm.timer / 60)}s`, 24, 50);
  }

  const barY = isEvent ? 70 : 62;
  rrect(22, barY, 190, 10, 5, 'rgba(255,255,255,0.1)');
  const bw    = Math.max(10, 190 * nest / 100);
  const bar   = ctx.createLinearGradient(22, 0, 212, 0);
  bar.addColorStop(0, '#5cc83a'); bar.addColorStop(1, '#d4a800');
  const blink = nest > 90 && Math.floor(Date.now() / 100) % 2 === 0;
  rrect(22, barY, bw, 10, 5, blink ? '#fff' : bar);
  ctx.fillStyle    = '#fff'; ctx.font = 'bold 9px system-ui';
  ctx.textAlign    = 'center';
  ctx.fillText('NID ' + nest + '% ➔ +1 ❤️', 117, barY + 5);

  // Hint touche O (desktop uniquement, hors lootbox)
  if (!isMobile && state === S.PLAY) {
    ctx.fillStyle = 'rgba(150,140,220,0.55)';
    ctx.font = '10px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText('[O] Sensibilité', canvas.width - 14, canvas.height - 14);
  }

  // ── Repère de biome + délai avant de pouvoir changer de carte (haut-droite) ──
  if (state === S.PLAY || state === S.LOOT) {
    const biomeInfo = {
      foret: ['🌲', 'Forêt'], champ: ['🌾', 'Champ'], grotte: ['🦇', 'Grotte'], lac: ['🐟', 'Lac']
    }[currentBiome()] || ['🌲', 'Forêt'];
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(220,220,255,0.85)'; ctx.font = 'bold 13px system-ui';
    ctx.fillText(biomeInfo[0] + ' ' + biomeInfo[1], canvas.width - 14, 26);
    if (roomCooldown > 0) {
      ctx.fillStyle = 'rgba(255,210,120,0.85)'; ctx.font = '11px system-ui';
      ctx.fillText('🔒 ' + Math.ceil(roomCooldown / 60) + 's', canvas.width - 14, 46);
    }
  }

  ctx.restore();
}

// ══════════════════════════════════════════════════
//  DRAW — MENU SENSIBILITÉ (desktop uniquement)
// ══════════════════════════════════════════════════
function drawSettings(W, H) {
  ctx.save();

  // Fond semi-transparent
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);

  const p   = getSettingsPanelRect();
  const hit = getSliderHitArea();

  // Panel
  rrect(p.x, p.y, p.w, p.h, 16, 'rgba(8,8,40,0.97)', 'rgba(110,90,255,0.7)', 2);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#cbc3ff'; ctx.font = 'bold 15px system-ui';
  ctx.fillText('🖱️  Sensibilité souris', p.x + p.w / 2, p.y + 22);

  // Pourcentage
  const pct = Math.round(mouseSensitivity * 100);
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 13px system-ui';
  ctx.fillText(pct + '%', p.x + p.w / 2, p.y + 44);

  // Track slider
  const sx = hit.x, sy = hit.y, sw = hit.w, sh = hit.h;
  rrect(sx, sy, sw, sh, sh / 2, 'rgba(255,255,255,0.1)', 'rgba(110,90,255,0.4)', 1);

  // Fill slider
  const fillW = sw * mouseSensitivity;
  const grad  = ctx.createLinearGradient(sx, 0, sx + sw, 0);
  grad.addColorStop(0, '#5544dd');
  grad.addColorStop(1, '#aa44ff');
  rrect(sx, sy, Math.max(sh, fillW), sh, sh / 2, grad);

  // Thumb
  const thumbX = sx + fillW;
  ctx.beginPath();
  ctx.arc(thumbX, sy + sh / 2, 10, 0, Math.PI * 2);
  ctx.fillStyle = sliderDrag ? '#ffffff' : '#cbc3ff';
  ctx.fill();
  ctx.strokeStyle = '#5544dd'; ctx.lineWidth = 2;
  ctx.stroke();

  // Labels min/max
  ctx.fillStyle = 'rgba(180,170,240,0.6)'; ctx.font = '10px system-ui';
  ctx.textAlign = 'left';  ctx.fillText('Lent',   sx,      sy + sh + 12);
  ctx.textAlign = 'right'; ctx.fillText('Rapide', sx + sw, sy + sh + 12);

  // Hint fermeture
  ctx.fillStyle = 'rgba(150,140,220,0.5)'; ctx.font = '10px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('[O] ou clic extérieur pour fermer', p.x + p.w / 2, p.y + p.h - 10);

  ctx.restore();
}

// ══════════════════════════════════════════════════
//  DRAW — LOOTBOX
// ══════════════════════════════════════════════════
function drawLootbox(W, H) {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.88)'; ctx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff'; ctx.font = '900 20px system-ui';
  ctx.fillText('CADEAU !', cx, cy - 120);

  const barW    = CASE_STRIDE * 5 - CASE_GAP;
  const barH    = CASE_W;
  const barLeft = cx - barW / 2;
  const barTop  = cy - barH / 2 - 10;

  rrect(barLeft - 4, barTop - 4, barW + 8, barH + 8, 10, '#0a0a2a', '#444466', 2);

  ctx.save();
  ctx.beginPath(); ctx.rect(barLeft, barTop, barW, barH); ctx.clip();

  for (let i = 0; i < lootbox.items.length; i++) {
    const item  = lootbox.items[i];
    const caseX = barLeft + lootbox.scroll + i * CASE_STRIDE;
    const caseY = barTop;
    if (caseX + CASE_W < barLeft || caseX > barLeft + barW) continue;
    const isWinner = (i === TARGET_IDX && lootbox.phase === 'land');
    const bgColor  = isWinner ? '#2a1f00' : '#111128';
    const border   = isWinner ? '#ffd700' : '#2a2a55';
    rrect(caseX, caseY, CASE_W, barH, 8, bgColor, border, isWinner ? 3 : 1);
    if (item.id === 'invincible') {
      ctx.save();
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur  = isWinner ? 30 : 12;
      drawEmoji('🦉', caseX + CASE_W / 2, caseY + barH / 2, 38);
      ctx.restore();
    } else {
      drawEmoji(item.e, caseX + CASE_W / 2, caseY + barH / 2, 36);
    }
  }

  ctx.restore();

  ctx.save();
  ctx.fillStyle   = '#ff4444';
  ctx.strokeStyle = '#ff4444';
  ctx.lineWidth   = 2;
  ctx.beginPath(); ctx.moveTo(cx, barTop - 12); ctx.lineTo(cx, barTop + barH + 12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 8, barTop - 14); ctx.lineTo(cx + 8, barTop - 14); ctx.lineTo(cx, barTop - 2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx - 8, barTop + barH + 14); ctx.lineTo(cx + 8, barTop + barH + 14); ctx.lineTo(cx, barTop + barH + 2); ctx.closePath(); ctx.fill();
  ctx.restore();

  if (lootbox.phase === 'land') {
    const alpha = Math.min(1, lootbox.landTimer / 20);
    ctx.save(); ctx.globalAlpha = alpha;
    const isInvincible = lootbox.result.id === 'invincible';
    ctx.fillStyle  = isInvincible ? '#ffd700' : '#00ffff';
    ctx.font       = '900 26px system-ui';
    ctx.textAlign  = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = isInvincible ? '#ffa500' : '#0088ff';
    ctx.shadowBlur  = 20;
    ctx.fillText(lootbox.result.txt, cx, cy + 80);
    ctx.font      = '14px system-ui';
    ctx.fillStyle = 'rgba(200,200,255,0.7)';
    ctx.shadowBlur = 0;
    ctx.fillText('Appuie ou clique pour continuer...', cx, cy + 110);
    ctx.restore();
  }

  ctx.restore();
}

// ══════════════════════════════════════════════════
//  DRAW — POPUP "QUOI DE NEUF" (patch notes, 1x par version)
// ══════════════════════════════════════════════════
function drawPatchNotes(W, H) {
  ctx.save();
  ctx.fillStyle = 'rgba(4,4,18,0.82)'; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  const pw    = Math.min(560, W - 40);
  const lineH = 22;
  const ph    = Math.min(H - 40, 150 + PATCH_NOTES.length * lineH);
  const px = cx - pw / 2, py = cy - ph / 2;

  rrect(px, py, pw, ph, 24, 'rgba(12,12,48,0.97)', 'rgba(110,90,255,0.55)', 2);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  drawEmoji('🦉', cx, py + 32, 38);
  ctx.fillStyle = '#cbc3ff'; ctx.font = '900 22px system-ui';
  ctx.fillText('QUOI DE NEUF — v' + GAME_VERSION, cx, py + 62);

  ctx.textAlign = 'left'; ctx.font = '13px system-ui'; ctx.fillStyle = '#e8e5ff';
  let ty = py + 90;
  for (const line of PATCH_NOTES) { ctx.fillText(line, px + 24, ty); ty += lineH; }

  const bw = 200, bh = 46;
  const bx = cx - bw / 2, by = py + ph - bh - 30;
  const g = ctx.createLinearGradient(bx, by, bx + bw, by + bh);
  g.addColorStop(0, '#5544dd'); g.addColorStop(1, '#9944ee');
  rrect(bx, by, bw, bh, 23, g);
  ctx.textAlign = 'center'; ctx.font = 'bold 18px system-ui'; ctx.fillStyle = '#fff';
  ctx.fillText('Compris →', cx, by + bh / 2);

  ctx.fillStyle = 'rgba(150,140,220,0.55)'; ctx.font = '10px system-ui';
  ctx.fillText("Sprites chauve-souris (bagzie, OGA-BY 3.0) & requin (Sevarihk, CC-BY 4.0) — OpenGameArt.org", cx, py + ph - 10);
  ctx.restore();
}

// ══════════════════════════════════════════════════
//  DRAW — ÉCRAN TITRE
// ══════════════════════════════════════════════════
function drawStart(W, H) {
  ctx.save();
  ctx.fillStyle = 'rgba(4,4,18,0.75)'; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;

  rrect(cx - 140, cy - 160, 280, 320, 28, 'rgba(12,12,48,0.96)', 'rgba(110,90,255,0.45)');
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  drawEmoji('🦉', cx, cy - 95, 72);

  ctx.fillStyle = '#cbc3ff'; ctx.font = '900 32px system-ui';
  ctx.fillText('HIBOU 2D', cx, cy - 20);

  const g = ctx.createLinearGradient(cx - 100, cy + 55, cx + 100, cy + 105);
  g.addColorStop(0, '#5544dd'); g.addColorStop(1, '#9944ee');
  rrect(cx - 100, cy + 55, 200, 50, 25, g);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px system-ui';
  ctx.fillText('JOUER', cx, cy + 80);

  ctx.restore();
}

// ══════════════════════════════════════════════════
//  DRAW — GAME OVER
// ══════════════════════════════════════════════════
function drawOver(W, H) {
  ctx.save();
  ctx.fillStyle = 'rgba(255,0,0,0.28)'; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  rrect(cx - 150, cy - 180, 300, 360, 28, 'rgba(22,8,30,0.97)', 'rgba(255,70,70,0.8)');
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffaaaa'; ctx.font = '900 32px system-ui';
  ctx.fillText('MANGÉ !', cx, cy - 100);
  ctx.fillStyle = '#e8e5ff'; ctx.font = '18px system-ui';
  ctx.fillText('Score final : ' + score, cx, cy - 30);
  if (best > 0) {
    ctx.fillStyle = (score >= best && score > 0) ? '#ffaa00' : '#c0b0ff';
    ctx.font = 'bold 16px system-ui';
    ctx.fillText('Record : ' + best, cx, cy);
  }
  const medal = score >= 100 ? '👑' : score >= 50 ? '🥇' : score >= 20 ? '🥈' : '🪺';
  drawEmoji(medal, cx, cy + 50, 45);
  const pulse = Math.sin(Date.now() / 150) * 5;
  const gr = ctx.createLinearGradient(cx - 100, cy + 110, cx + 100, cy + 160);
  gr.addColorStop(0, '#cc2222'); gr.addColorStop(1, '#cc22aa');
  rrect(cx - 100 - pulse / 2, cy + 110 - pulse / 2, 200 + pulse, 50 + pulse, 25, gr);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 18px system-ui';
  ctx.fillText('↺ Rejouer', cx, cy + 135);
  ctx.restore();
}

// ══════════════════════════════════════════════════
//  BOUCLE PRINCIPALE
// ══════════════════════════════════════════════════
resetWorld(); // ici : tout le script est évalué, plus de risque de zone morte temporelle
(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
