        : ['#ff4444', '#ffaa00', '#ffffff'][Math.floor(Math.random() * 3)]
    });
  }
  if (txt) particles.push({ type: 'txt', x: s.x, y: s.y, vx: 0, vy: -3, life: 1.5, txt, tType: type });
}
function updateParticles() {
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    if (p.vx) p.vx *= 0.92;
    p.vy *= (p.type === 'txt' ? 0.95 : 0.92);
    p.life -= (p.type === 'txt' ? 0.02 : 0.03);
  }
  particles = particles.filter(p => p.life > 0);
}

// ══════════════════════════════════════════════════
//  HUD / ÉCRANS (canvas 2D superposé, indépendant de la caméra 3D)
// ══════════════════════════════════════════════════
function rrect(x, y, w, h, r, fill, stroke, lw) {
  hctx.beginPath(); hctx.roundRect(x, y, w, h, r);
  if (fill)   { hctx.fillStyle = fill; hctx.fill(); }
  if (stroke) { hctx.lineWidth = lw || 1.5; hctx.strokeStyle = stroke; hctx.stroke(); }
}

function drawHUD() {
  hctx.save();
  rrect(12, 12, 230, 100, 14, 'rgba(8,8,35,0.82)', 'rgba(100,90,220,0.4)');
  hctx.fillStyle = '#dde'; hctx.font = 'bold 16px system-ui';
  hctx.textAlign = 'left'; hctx.textBaseline = 'middle';
  hctx.fillText('Score : ' + score, 24, 32);

  let livesStr = ''; for (let i = 0; i < lives; i++) livesStr += '❤️';
  hctx.font = '12px system-ui'; hctx.fillText(livesStr, 140, 32);

  let buffY = 50;
  if (buffs.multi      > 0) { hctx.fillStyle = '#00ffff'; hctx.font = 'bold 13px system-ui'; hctx.fillText('✨ SCORE x5',     24, buffY); buffY += 16; }
  if (buffs.speed      > 0) { hctx.fillStyle = '#00ffff'; hctx.font = 'bold 13px system-ui'; hctx.fillText('⚡ VITESSE',       24, buffY); buffY += 16; }
  if (buffs.slow       > 0) { hctx.fillStyle = '#00ffff'; hctx.font = 'bold 13px system-ui'; hctx.fillText('❄️ GELÉS',        24, buffY); buffY += 16; }
  if (buffs.invincible > 0) { hctx.fillStyle = '#ffd700'; hctx.font = 'bold 13px system-ui'; hctx.fillText('🦉 INVINCIBLE !', 24, buffY); buffY += 16; }

  if (combo > 1 && comboTimer > 0 && buffs.multi === 0) {
    hctx.fillStyle = '#ffaa00'; hctx.font = 'bold 13px system-ui';
    hctx.fillText('🔥 Combo x' + combo, 24, buffY);
    const cbW = 80 * (comboTimer / MAX_COMBO_TIME);
    rrect(120, buffY - 4, 80, 6, 3, 'rgba(255,255,255,0.1)');
    rrect(120, buffY - 4, Math.max(0, cbW), 6, 3, '#ffaa00');
    buffY += 16;
  }

  const barY = 82;
  rrect(22, barY, 190, 10, 5, 'rgba(255,255,255,0.1)');
  const bw = Math.max(10, 190 * nest / 100);
  const bar = hctx.createLinearGradient(22, 0, 212, 0);
  bar.addColorStop(0, '#5cc83a'); bar.addColorStop(1, '#d4a800');
  rrect(22, barY, bw, 10, 5, bar);
  hctx.fillStyle = '#fff'; hctx.font = 'bold 9px system-ui'; hctx.textAlign = 'center';
  hctx.fillText('NID ' + nest + '% ➔ +1 ❤️', 117, barY + 5);
  hctx.restore();

  if (!isMobile) {
    hctx.save();
    hctx.fillStyle = 'rgba(150,140,220,0.55)'; hctx.font = '11px system-ui';
    hctx.textAlign = 'left'; hctx.textBaseline = 'middle';
    hctx.fillText('[O] Sensibilité souris', 22, 130);
    hctx.restore();
  }

  // ── Instruments de vol (haut-droite) : vitesse air, altitude, poussée, vario ──
  {
    hctx.save();
    const w = hudCanvas.width;
    const pw = 146, ph = 96, px = w - pw - 12, py = 12;
    rrect(px, py, pw, ph, 12, 'rgba(8,8,35,0.82)', 'rgba(100,90,220,0.4)');
    hctx.textBaseline = 'middle';
    hctx.font = '11px system-ui'; hctx.fillStyle = '#9fb0d8'; hctx.textAlign = 'left';
    hctx.fillText('Vitesse',  px + 12, py + 18);
    hctx.fillText('Altitude', px + 12, py + 38);
    hctx.fillText('Poussée',  px + 12, py + 58);
    hctx.fillText('Vario',    px + 12, py + 78);

    hctx.textAlign = 'right'; hctx.font = 'bold 12px system-ui'; hctx.fillStyle = '#e8ecff';
    hctx.fillText(Math.round(speed) + ' u/s', px + pw - 12, py + 18);
    hctx.fillText(Math.max(0, Math.round(owlGroup.position.y - effectiveGroundY(owlGroup.position.x, owlGroup.position.z))) + ' m', px + pw - 12, py + 38);
    hctx.fillText(Math.round(flight.throttle * 100) + ' %', px + pw - 12, py + 58);
    const climb = flight.climb;
    hctx.fillStyle = climb > 0.3 ? '#8fe06a' : climb < -0.3 ? '#ff9a6a' : '#e8ecff';
    hctx.fillText((climb >= 0 ? '▲ ' : '▼ ') + Math.abs(climb).toFixed(1), px + pw - 12, py + 78);
    hctx.restore();
  }

  // ── Alerte décrochage (clignotante) ──
  if (flight.stall && state === S.PLAY) {
    const w = hudCanvas.width, h = hudCanvas.height;
    if (Math.floor(Date.now() / 220) % 2 === 0) {
      hctx.save();
      rrect(w / 2 - 110, h - 92, 220, 40, 12, 'rgba(60,10,10,0.9)', 'rgba(255,90,60,0.95)');
      hctx.fillStyle = '#ffd0c0'; hctx.font = 'bold 18px system-ui';
      hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
      hctx.fillText('⚠ DÉCROCHAGE', w / 2, h - 72);
      hctx.restore();
    }
  }

  if (moon.state === 'blood') {
    hctx.save();
    const w = hudCanvas.width;
    rrect(w / 2 - 140, 12, 280, 40, 14, 'rgba(50,10,10,0.88)', 'rgba(255,80,80,0.7)');
    hctx.fillStyle = '#ffcccc'; hctx.font = 'bold 16px system-ui';
    hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
    hctx.fillText('🩸 LUNE DE SANG ! SURVIE : ' + Math.ceil(Math.max(0, moon.timer)) + 's', w / 2, 32);
    hctx.restore();
  } else if (moon.state === 'full') {
    hctx.save();
    const w = hudCanvas.width;
    rrect(w / 2 - 140, 12, 280, 40, 14, 'rgba(20,20,50,0.85)', 'rgba(200,220,255,0.6)');
    hctx.fillStyle = '#ccddff'; hctx.font = 'bold 16px system-ui';
    hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
    hctx.fillText('🌕 PLEINE LUNE ! SURVIE : ' + Math.ceil(Math.max(0, moon.timer)) + 's', w / 2, 32);
    hctx.restore();
  } else if (storm.active) {
    hctx.save();
    const w = hudCanvas.width;
    rrect(w / 2 - 140, 12, 280, 40, 14, 'rgba(40,45,55,0.85)', 'rgba(180,190,205,0.6)');
    hctx.fillStyle = '#dfe6ee'; hctx.font = 'bold 16px system-ui';
    hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
    hctx.fillText('🌬️ TEMPÊTE : ' + Math.ceil(Math.max(0, storm.timer)) + 's', w / 2, 32);
    hctx.restore();
  }
}

  hctx.fillStyle = 'rgba(255,0,0,0.28)'; hctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  rrect(cx - 150, cy - 180, 300, 360, 28, 'rgba(22,8,30,0.97)', 'rgba(255,70,70,0.8)');
  hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
  hctx.fillStyle = '#ffaaaa'; hctx.font = '900 32px system-ui';
  hctx.fillText(overReason === 'crash' ? 'CRASHÉ !' : 'MANGÉ !', cx, cy - 100);
  hctx.fillStyle = '#e8e5ff'; hctx.font = '18px system-ui';

function drawSettings() {
  const W = hudCanvas.width, H = hudCanvas.height;
  hctx.save();
  hctx.fillStyle = 'rgba(0,0,0,0.55)'; hctx.fillRect(0, 0, W, H);

  const p   = getSettingsPanelRect();
  const hit = getSliderHitArea();

  rrect(p.x, p.y, p.w, p.h, 16, 'rgba(8,8,40,0.97)', 'rgba(110,90,255,0.7)', 2);

  hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
  hctx.fillStyle = '#cbc3ff'; hctx.font = 'bold 15px system-ui';
  hctx.fillText('🖱️  Sensibilité souris', p.x + p.w / 2, p.y + 22);

  const pct = Math.round(mouseSensitivity * 100);
  hctx.fillStyle = '#ffffff'; hctx.font = 'bold 13px system-ui';
  hctx.fillText(pct + '%', p.x + p.w / 2, p.y + 44);

  const sx = hit.x, sy = hit.y, sw = hit.w, sh = hit.h;
  rrect(sx, sy, sw, sh, sh / 2, 'rgba(255,255,255,0.1)', 'rgba(110,90,255,0.4)', 1);

  const fillW = sw * mouseSensitivity;
  const grad = hctx.createLinearGradient(sx, 0, sx + sw, 0);
  grad.addColorStop(0, '#5544dd'); grad.addColorStop(1, '#aa44ff');
  rrect(sx, sy, Math.max(sh, fillW), sh, sh / 2, grad);

  const thumbX = sx + fillW;
  hctx.beginPath(); hctx.arc(thumbX, sy + sh / 2, 10, 0, Math.PI * 2);
  hctx.fillStyle = sliderDrag ? '#ffffff' : '#cbc3ff'; hctx.fill();
  hctx.strokeStyle = '#5544dd'; hctx.lineWidth = 2; hctx.stroke();

  hctx.fillStyle = 'rgba(180,170,240,0.6)'; hctx.font = '10px system-ui';
  hctx.textAlign = 'left';  hctx.fillText('Lent',   sx,      sy + sh + 12);
  hctx.textAlign = 'right'; hctx.fillText('Rapide', sx + sw, sy + sh + 12);

  hctx.fillStyle = 'rgba(150,140,220,0.5)'; hctx.font = '10px system-ui';
  hctx.textAlign = 'center';
  hctx.fillText('[O] ou clic extérieur pour fermer', p.x + p.w / 2, p.y + p.h - 10);

  hctx.restore();
}

function drawMobileControls() {
  hctx.save();
  const base = joystick.active ? { x: joystick.baseX, y: joystick.baseY } : { x: 100, y: hudCanvas.height - 120 };
  hctx.globalAlpha = joystick.active ? 0.55 : 0.3;
  hctx.beginPath(); hctx.arc(base.x, base.y, JOYSTICK_RADIUS, 0, Math.PI * 2);
  hctx.fillStyle = 'rgba(255,255,255,0.12)'; hctx.fill();
  hctx.strokeStyle = 'rgba(200,200,255,0.5)'; hctx.lineWidth = 2; hctx.stroke();
  hctx.beginPath(); hctx.arc(base.x + joystick.dx, base.y + joystick.dy, 24, 0, Math.PI * 2);
  hctx.fillStyle = 'rgba(203,195,255,0.85)'; hctx.fill();
  hctx.globalAlpha = 1;

  const thrust = getThrustButtonCenter();
  hctx.beginPath(); hctx.arc(thrust.x, thrust.y, thrust.r, 0, Math.PI * 2);
  hctx.fillStyle = touchThrust ? 'rgba(0,255,180,0.55)' : 'rgba(0,255,180,0.28)';
  hctx.fill();
  hctx.strokeStyle = 'rgba(200,255,230,0.7)'; hctx.lineWidth = 2; hctx.stroke();
  hctx.textAlign = 'center'; hctx.textBaseline = 'middle'; hctx.font = '30px serif';
  hctx.fillText('⚡', thrust.x, thrust.y);

  const brake = getBrakeButtonCenter();
  hctx.beginPath(); hctx.arc(brake.x, brake.y, brake.r, 0, Math.PI * 2);
  hctx.fillStyle = touchBrake ? 'rgba(255,80,80,0.55)' : 'rgba(255,80,80,0.28)';
  hctx.fill();
  hctx.strokeStyle = 'rgba(255,200,200,0.7)'; hctx.lineWidth = 2; hctx.stroke();
  hctx.font = '22px serif';
  hctx.fillText('✋', brake.x, brake.y);

  hctx.restore();
}

function drawLootbox() {
  const W = hudCanvas.width, H = hudCanvas.height;
  hctx.save();
  hctx.fillStyle = 'rgba(0,0,0,0.88)'; hctx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;
  hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
  hctx.fillStyle = '#ffffff'; hctx.font = '900 20px system-ui';
  hctx.fillText('CADEAU !', cx, cy - 120);

  const barW    = CASE_STRIDE * 5 - CASE_GAP;
  const barH    = CASE_W;
  const barLeft = cx - barW / 2;
  const barTop  = cy - barH / 2 - 10;

  rrect(barLeft - 4, barTop - 4, barW + 8, barH + 8, 10, '#0a0a2a', '#444466', 2);

  hctx.save();
  hctx.beginPath(); hctx.rect(barLeft, barTop, barW, barH); hctx.clip();
  for (let i = 0; i < lootbox.items.length; i++) {
    const item  = lootbox.items[i];
    const caseX = barLeft + lootbox.scroll + i * CASE_STRIDE;
    if (caseX + CASE_W < barLeft || caseX > barLeft + barW) continue;
    const isWinner = (i === TARGET_IDX && lootbox.phase === 'land');
    rrect(caseX, barTop, CASE_W, barH, 8,
      isWinner ? '#2a1f00' : '#111128', isWinner ? '#ffd700' : '#2a2a55', isWinner ? 3 : 1);
    hctx.font = (item.id === 'invincible' ? 38 : 36) + 'px serif';
    if (item.id === 'invincible') {
      hctx.save();
      hctx.shadowColor = '#ffd700'; hctx.shadowBlur = isWinner ? 30 : 12;
      hctx.fillText('🦉', caseX + CASE_W / 2, barTop + barH / 2);
      hctx.restore();
    } else {
      hctx.fillText(item.e, caseX + CASE_W / 2, barTop + barH / 2);
    }
  }
  hctx.restore();

  hctx.save();
  hctx.fillStyle = '#ff4444'; hctx.strokeStyle = '#ff4444'; hctx.lineWidth = 2;
  hctx.beginPath(); hctx.moveTo(cx, barTop - 12); hctx.lineTo(cx, barTop + barH + 12); hctx.stroke();
  hctx.beginPath(); hctx.moveTo(cx - 8, barTop - 14); hctx.lineTo(cx + 8, barTop - 14); hctx.lineTo(cx, barTop - 2); hctx.closePath(); hctx.fill();
  hctx.beginPath(); hctx.moveTo(cx - 8, barTop + barH + 14); hctx.lineTo(cx + 8, barTop + barH + 14); hctx.lineTo(cx, barTop + barH + 2); hctx.closePath(); hctx.fill();
  hctx.restore();

  if (lootbox.phase === 'land') {
    const alpha = Math.min(1, lootbox.landTimer / 20);
    hctx.save(); hctx.globalAlpha = alpha;
    const isInvincible = lootbox.result.id === 'invincible';
    hctx.fillStyle  = isInvincible ? '#ffd700' : '#00ffff';
    hctx.font       = '900 26px system-ui';
    hctx.shadowColor = isInvincible ? '#ffa500' : '#0088ff';
    hctx.shadowBlur  = 20;
    hctx.fillText(lootbox.result.txt, cx, cy + 80);
    hctx.font      = '14px system-ui';
    hctx.fillStyle = 'rgba(200,200,255,0.7)';
    hctx.shadowBlur = 0;
    hctx.fillText('Un instant...', cx, cy + 110);
    hctx.restore();
  }
  hctx.restore();
}

function drawOverlay() {
  hctx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
  hctx.save();
  if (screenShake > 0) hctx.translate(rnd(-screenShake, screenShake), rnd(-screenShake, screenShake));

  if (state === S.START) {
    drawStart();
  } else {
    for (const p of particles) {
      hctx.save(); hctx.globalAlpha = Math.max(0, p.life);
      if (p.type === 'txt') {
        hctx.fillStyle = p.tType === 'death' ? '#ff3333' : '#ffd700';
        hctx.font = '900 24px system-ui';
        hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
        hctx.shadowColor = '#000'; hctx.shadowBlur = 8;
        hctx.fillText(p.txt, p.x, p.y);
      } else {
        hctx.fillStyle = p.c;
        hctx.beginPath(); hctx.arc(p.x, p.y, rnd(2, 6), 0, Math.PI * 2); hctx.fill();
      }
      hctx.restore();
    }
    drawHUD();
    if (state === S.OVER) drawOver();
    else if (state === S.PAUSED && !settingsOpen) drawPaused();
    else if (state === S.LOOT) drawLootbox();
    if (isMobile && state === S.PLAY) drawMobileControls();
  }

  if (settingsOpen) drawSettings();

  if (hitFlash > 0) {
    hctx.save(); hctx.globalAlpha = hitFlash; hctx.fillStyle = '#ff2222';
    hctx.fillRect(0, 0, hudCanvas.width, hudCanvas.height);
    hctx.restore();
  }
  hctx.restore();
}

// ══════════════════════════════════════════════════
//  INIT / RESET
// ══════════════════════════════════════════════════
function beginGame() {
  if (!assetsReady) return; // le monde n'est pas encore construit (modèles en cours de chargement)
  state = S.PLAY;
  document.body.style.cursor = 'none';
  score = 0; nest = 0; combo = 1; comboTimer = 0; lives = 1; overReason = 'eaten';
  screenShake = 0; hitFlash = 0; owlInvul = 60; treeCooldown = 0;
  speed = MAX_SPEED * 0.55; // décolle déjà lancé

  owlGroup.position.set(ARENA_CENTER.x, 16, ARENA_CENTER.z); // altitude basse au départ
  owlGroup.quaternion.identity();
  owlGroup.visible = true;
  // État de vol initial : lancé vers l'avant (−Z), moteur en croisière, rotations à plat.
  velocity.set(0, 0, -speed);
  angRate.set(0, 0, 0);
  throttle = CRUISE_THROTTLE;
  flight.aoa = 0; flight.stall = false; flight.climb = 0; flight.throttle = throttle;
  requestFlightPointerLock();

  for (const br of branches) { scene.remove(br.sprite); br.sprite.material.dispose(); }
  for (const b of bears)     { scene.remove(b.sprite);  if (b.sprite.isSprite) b.sprite.material.dispose(); }
  for (let i = rocks.length - 1; i >= 0; i--) removeRock(i);
  rockInvul = 0;
  branches = Array.from({ length: 8 }, newBranch);
  bears = [newBear(), newBear()];
  particles = [];
  moon  = { state: 'none', timer: 0, next: 15, fillProgress: 0 };
  storm = { active: false, timer: 0, next: rnd(20, 30), windAngle: 0, windForce: 0, gustPhase: 0, rockSpawnTimer: 0 };

  if (giftItem) removeGift();
  buffs = { speed: 0, multi: 0, slow: 0, invincible: 0 };
}

// ══════════════════════════════════════════════════
//  BOUCLE PRINCIPALE
// ══════════════════════════════════════════════════
const clock = new THREE.Clock();

function update() {
  const dt = Math.min(clock.getDelta(), 0.05);

  if (screenShake > 0) { screenShake *= 0.9; if (screenShake < 0.5) screenShake = 0; }
  if (hitFlash    > 0) { hitFlash    *= 0.85; if (hitFlash < 0.01) hitFlash = 0; }

  if (state === S.PLAY) {
    if (owlInvul > 0) owlInvul--;
    if (treeCooldown > 0) treeCooldown--;
    rockInvul = Math.max(0, rockInvul - dt);
    buffs.speed      = Math.max(0, buffs.speed      - dt);
    buffs.multi      = Math.max(0, buffs.multi      - dt);
    buffs.slow       = Math.max(0, buffs.slow       - dt);
    buffs.invincible = Math.max(0, buffs.invincible - dt);
    updateMoon(dt);
    updateStorm(dt);
    updateRocks(dt);
    const speedRatio = updateFlight(dt);
    updateFlap(dt, speedRatio);
    updateBranches();
    updateBears(dt);
    updateGift(dt);
    updateBoundaryGrid();
    updateWindParticles(dt);
    updateSpeedParticles(dt);
    updateCameraClip();
    owlGroup.visible = !(owlInvul > 0 && Math.floor(Date.now() / 80) % 2 !== 0);
  } else if (state === S.LOOT) {
    mouseDX = 0; mouseDY = 0;
    boundaryGrid.visible = false;
    windParticles.visible = false;
    speedParticles.visible = false;
    updateLootbox(dt);
  } else {
    mouseDX = 0; mouseDY = 0;
    boundaryGrid.visible = false;
    windParticles.visible = false;
    speedParticles.visible = false;
  }
  updateMoonVisual(dt);
  updateStars(dt);
  updateClouds(dt);
  updateParticles();
}

function render() {
  renderer.render(scene, camera);
  drawOverlay();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// ── Boot : écran de chargement pendant le fetch des GLB, puis construction du monde ──
function drawLoading() {
  hctx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
  hctx.save();
  hctx.fillStyle = '#04040e';
  hctx.fillRect(0, 0, hudCanvas.width, hudCanvas.height);
  hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
  hctx.font = '54px serif';
  hctx.fillText('🦉', hudCanvas.width / 2, hudCanvas.height / 2 - 40);
  hctx.fillStyle = '#cbc3ff'; hctx.font = 'bold 18px system-ui';
  hctx.fillText('Chargement des modèles 3D…', hudCanvas.width / 2, hudCanvas.height / 2 + 20);
  hctx.restore();
}

// Sonde de debug/test (lecture seule) : état du jeu inspectable depuis la console.
window.__hibouDebug = () => ({
  state, score, lives, assetsReady,
  pos: owlGroup.position.toArray().map(v => Math.round(v * 10) / 10),
  groundY: Math.round(effectiveGroundY(owlGroup.position.x, owlGroup.position.z) * 10) / 10,
  trees: treeColliders.length,
  bears: bears.length,
  clouds: cloudSets.reduce((n, s) => n + s.data.length, 0),
  usingModels: {
    owl: !!models.owl, bear: !!models.bear, moon: !!models.moon,
    trees: !!(models.pine1 || models.pine2 || models.birch || models.tree1),
    mountains: !!(models.mountains || models.mountainGroup),
    clouds: !!(models.cloud1 || models.cloud2 || models.cloud3)
  }
});

resize();
drawLoading();
loadAssets().then(() => {
  makeSky();
  makeTerrain();
  makeMountainScenery();
  makeClouds();
  makeTrees();
  setupOwlVisual();
  setupBearProto();
  makeBoundaryGrid();
  makeWindParticles();
  makeSpeedParticles();
  assetsReady = true;
  loop();
});
</script>
</body>
</html>
