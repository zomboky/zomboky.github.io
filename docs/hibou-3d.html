const ammoCrateTexture = emojiTexture('📦', 160);
const healKitTexture = emojiTexture('💚', 160);

// ── Aura colorée : halo additif enfant du groupe d'un hibou — même technique
//    que le halo de menace des ours et le halo du cadeau ──
function makeAuraSprite(colorHex) {
  const mat = new THREE.SpriteMaterial({
    map: glowTexture, color: colorHex, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.setScalar(3.4);
  return { sprite, mat };
}
let localAura = null;
function setLocalAura(colorName) {
  removeLocalAura();
  localAura = makeAuraSprite(auraColorHex(colorName));
  owlGroup.add(localAura.sprite);
}
function removeLocalAura() {
  if (!localAura) return;
  owlGroup.remove(localAura.sprite);
  localAura.mat.dispose();
  localAura = null;
}

// ── Canon : petit cylindre procédural sous le ventre, pointé vers l'avant (-Z),
//    même esprit que le hibou procédural de secours buildOwl() ──
function makeCannonMesh() {
  const g = new THREE.Group();
  const barrel = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.08, 0.55, 8),
    new THREE.MeshStandardMaterial({ color: 0x3a3f4a, roughness: 0.5, metalness: 0.7 })
  );
  barrel.rotation.x = Math.PI / 2; // l'axe du cylindre (Y) bascule le long de -Z
  g.add(barrel);
  g.position.set(0, -0.28, -0.55);
  return g;
}
let localCannon = null;
function setLocalCannon(on) {
  if (on && !localCannon) { localCannon = makeCannonMesh(); owlGroup.add(localCannon); }
  else if (!on && localCannon) { owlGroup.remove(localCannon); localCannon = null; }
}

// ── Hibou distant : clone visuel du modèle GLB local (géométries/matériaux
//    partagés ; SkeletonUtils re-clone le squelette pour que l'animation de
//    battement fonctionne indépendamment sur chaque clone) ──
function makeRemoteOwlVisual() {
  if (models.owl && owl.bob) {
    const obj = skeletonClone(owl.bob);
    let mixer = null;
    const clips = modelClips.owl;
    if (clips && clips.length) {
      mixer = new THREE.AnimationMixer(obj);
      mixer.clipAction(clips[0]).play();
    }
    obj.add(makeCannonMesh());
    return { obj, mixer };
  }
  const built = buildOwl(); // repli procédural, comme pour le hibou local
  built.group.add(makeCannonMesh());
  return { obj: built.group, mixer: null };
}

// ── Balles : projectiles réels (pas de hitscan). Les balles locales testent la
//    collision contre les hiboux distants ; les tracers adverses (relayés par
//    le serveur) sont purement cosmétiques — c'est le TIREUR qui fait foi. ──
const bulletMatLocal = new THREE.SpriteMaterial({
  map: glowTexture, color: 0xfff0a0, transparent: true, opacity: 0.95,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const bulletMatRemote = new THREE.SpriteMaterial({
  map: glowTexture, color: 0xff8040, transparent: true, opacity: 0.9,
  blending: THREE.AdditiveBlending, depthWrite: false
});
let bullets = []; // { sprite, vel, owner: 'player'|'bot'|'tracer', life }
// owner: 'player' = tirée par le joueur local (teste les remotes réseau + le bot campagne) ;
// 'bot' = tirée par le bot campagne (teste le joueur local) ; 'tracer' = relais réseau cosmétique, jamais testée.
function spawnBullet(originPos, dir, owner) {
  if (bullets.length >= MP_BULLET_MAX) removeBullet(0); // recycle la plus ancienne
  const sprite = new THREE.Sprite(owner === 'player' ? bulletMatLocal : bulletMatRemote); // matériaux PARTAGÉS : rien à disposer par balle
  sprite.scale.setScalar(0.5);
  sprite.position.copy(originPos);
  scene.add(sprite);
  bullets.push({ sprite, vel: dir.clone().multiplyScalar(MP_BULLET_SPEED), owner, life: MP_BULLET_LIFE });
}
function removeBullet(i) {
  scene.remove(bullets[i].sprite);
  bullets.splice(i, 1);
}
function clearBullets() {
  for (const b of bullets) scene.remove(b.sprite);
  bullets = [];
}

// Impact classé en tête / aile gauche / aile droite / queue / corps, par position
// dans le repère LOCAL du hibou touché (boîte englobante OWL_HITBOX, avant = -Z,
// droite du hibou = +X, queue = arrière = +Z).
const _hitLocal = new THREE.Vector3();
function classifyHitLocation(remoteObj, worldPos) {
  _hitLocal.copy(worldPos);
  remoteObj.worldToLocal(_hitLocal);
  if (Math.abs(_hitLocal.x) > OWL_HITBOX.w * 0.2) {
    return _hitLocal.x > 0 ? 'right-wing' : 'left-wing';
  }
  if (_hitLocal.z < -OWL_HITBOX.d * 0.15 && _hitLocal.y > -OWL_HITBOX.h * 0.1) return 'head';
  if (_hitLocal.z > OWL_HITBOX.d * 0.3) return 'tail';
  return 'body';
}

// Une balle à 120 u/s parcourt ~2 u par frame : on teste la distance du hibou
// au SEGMENT parcouru cette frame, pas seulement au point d'arrivée, sinon la
// balle « saute » à travers la hitbox une fois sur deux.
const _segA = new THREE.Vector3(), _segAB = new THREE.Vector3(), _segClosest = new THREE.Vector3();
function segmentDistanceTo(center, a, b) {
  _segAB.copy(b).sub(a);
  const len2 = _segAB.lengthSq();
  let t = 0;
  if (len2 > 1e-8) t = THREE.MathUtils.clamp(_segClosest.copy(center).sub(a).dot(_segAB) / len2, 0, 1);
  _segClosest.copy(a).addScaledVector(_segAB, t);
  return _segClosest.distanceTo(center);
}

function updateBullets(dt) {
  const remoteOwls = mp ? mp.remotesList() : [];
  const botHostile = (vsBotMode && bot && bot.alive) ? bot : null;
  const hitRadius = Math.max(1.3, OWL_COLLIDE_RADIUS * 2.5);
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.life -= dt;
    _segA.copy(b.sprite.position);
    b.sprite.position.addScaledVector(b.vel, dt);
    if (b.sprite.position.y < effectiveGroundY(b.sprite.position.x, b.sprite.position.z)) {
      spawnFX3D(b.sprite.position, 6, 'dust'); // impact au sol
      removeBullet(i);
      continue;
    }
    if (b.life <= 0) {
      removeBullet(i);
      continue;
    }
    if (b.owner === 'tracer') continue; // cosmétique — c'est le tireur qui fait foi côté réseau

    if (b.owner === 'bot') {
      // Balle du bot campagne : teste contre le joueur local.
      if (segmentDistanceTo(owlGroup.position, _segA, b.sprite.position) > hitRadius) continue;
      const location = classifyHitLocation(owlGroup, b.sprite.position);
      onMPHitMe(location, 'bot'); // entièrement local, aucun relais réseau nécessaire
      spawnFX(b.sprite.position, 8, 'death', location === 'head' ? '🎯 TÊTE !' : '');
      removeBullet(i);
      continue;
    }

    // b.owner === 'player' : teste contre les hiboux distants réseau + le bot campagne
    let hit = false;
    for (const r of remoteOwls) {
      if (!r.alive) continue;
      if (segmentDistanceTo(r.obj.position, _segA, b.sprite.position) > hitRadius) continue;
      const location = classifyHitLocation(r.obj, b.sprite.position);
      mp.sendHit(r.id, location); // la victime applique elle-même l'effet en recevant le relais
      spawnFX(b.sprite.position, 8, 'death', location === 'head' ? '🎯 TÊTE !' : '');
      removeBullet(i);
      hit = true;
      break;
    }
    if (hit) continue;
    if (botHostile && segmentDistanceTo(botHostile.obj.position, _segA, b.sprite.position) <= hitRadius) {
      const location = classifyHitLocation(botHostile.obj, b.sprite.position);
      botTakeHit(location); // pas de relais réseau : le bot n'existe que localement
      spawnFX(b.sprite.position, 8, 'death', location === 'head' ? '🎯 TÊTE !' : '');
      removeBullet(i);
    }
  }
}

// Tir : clic gauche (ou F) maintenu — cadence exacte via accumulateur, pour ne
// pas dépendre du framerate (100 coups/s ≈ 1,7 balle par frame à 60 fps).
const _fireDir = new THREE.Vector3(), _firePos = new THREE.Vector3();
function updateMPFire(dt) {
  const fireHeld = mouseFireHeld || keys['f'] || touchFireHeld;
  if (!fireHeld || mpAmmo <= 0) { mpFireAccum = 0; return; }
  mpFireAccum += dt * MP_FIRE_RATE;
  const n = Math.min(Math.floor(mpFireAccum), mpAmmo, 6);
  mpFireAccum -= Math.floor(mpFireAccum);
  if (n <= 0) return;
  _fireDir.set(0, 0, -1).applyQuaternion(owlGroup.quaternion);
  _firePos.set(0, -0.28, -0.9);
  owlGroup.localToWorld(_firePos); // bouche du canon
  for (let i = 0; i < n; i++) {
    spawnBullet(_firePos, _fireDir, 'player');
    if (!vsBotMode) mpAmmo--; // munitions illimitées en campagne (mode de test)
    mp.sendFire();
  }
}

// Tracer cosmétique d'un tir adverse (message 'fire' relayé par le serveur).
const _tracerPos = new THREE.Vector3();
function onMPRemoteFire(pos, dir) {
  _tracerPos.copy(pos).addScaledVector(dir, 1.2);
  spawnBullet(_tracerPos, dir, 'tracer');
}

// ── Caisses de munitions : réutilisent la mécanique des branches (placement
//    via collectibleSpawnPos, recyclage à distance, ramassage par proximité)
//    mais en pool bien plus petit — elles REMPLACENT les branches en multijoueur ──
let ammoCrates = [];
function newAmmoCrate() {
  const mat = new THREE.SpriteMaterial({ map: ammoCrateTexture, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(2.2, 2.2, 1);
  const pos = collectibleSpawnPos(60, 260);
  sprite.position.copy(pos);
  scene.add(sprite);
  const glowMat = new THREE.SpriteMaterial({
    map: glowTexture, color: 0xffa030, transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const glow = new THREE.Sprite(glowMat);
  glow.scale.setScalar(2.4);
  sprite.add(glow);
  return { sprite, glowMat, w: rnd(0, Math.PI * 2), ws: rnd(0.03, 0.07), baseY: pos.y };
}
function removeAmmoCrate(i) {
  scene.remove(ammoCrates[i].sprite);
  ammoCrates[i].sprite.material.dispose();
  ammoCrates[i].glowMat.dispose();
  ammoCrates.splice(i, 1);
}
function clearAmmoCrates() { while (ammoCrates.length) removeAmmoCrate(0); }
function resetAmmoCrates() {
  clearAmmoCrates();
  ammoCrates = Array.from({ length: MP_AMMO_CRATE_COUNT }, newAmmoCrate);
}
function updateAmmoCrates() {
  for (let i = ammoCrates.length - 1; i >= 0; i--) {
    const c = ammoCrates[i];
    c.w += c.ws;
    c.sprite.position.y = c.baseY + Math.sin(c.w) * 0.4;
    c.glowMat.opacity = 0.5 + Math.sin(c.w * 2) * 0.14;
    if (c.sprite.position.distanceTo(owlGroup.position) > BRANCH_RECYCLE_DIST) {
      const p = collectibleSpawnPos(80, 260);
      c.sprite.position.copy(p);
      c.baseY = p.y;
    }
    if (owlGroup.position.distanceTo(c.sprite.position) < COLLECT_RADIUS) {
      mpAmmo = Math.min(MP_MAG_CAP, mpAmmo + MP_AMMO_GRANT); // optimiste — le serveur confirme via 'ammo'
      mp.sendPickupAmmo();
      spawnFX(c.sprite.position, 12, 'collect', '+' + MP_AMMO_GRANT + ' 📦');
      screenShake = Math.max(screenShake, 4);
      removeAmmoCrate(i);
      ammoCrates.push(newAmmoCrate());
    }
  }
}

// ── Kits de soin : collectible plus rare que les caisses de munitions, PAS
//    indiqué par l'ESP (contrairement à ammoCrates), qui répare intégralement
//    (vie + gouvernes) un hibou endommagé qui le ramasse. ──
let healKits = [];
function newHealKit() {
  const mat = new THREE.SpriteMaterial({ map: healKitTexture, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(2.2, 2.2, 1);
  const pos = collectibleSpawnPos(80, 280);
  sprite.position.copy(pos);
  scene.add(sprite);
  const glowMat = new THREE.SpriteMaterial({
    map: glowTexture, color: 0x4caf50, transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const glow = new THREE.Sprite(glowMat);
  glow.scale.setScalar(2.6);
  sprite.add(glow);
  return { sprite, glowMat, w: rnd(0, Math.PI * 2), ws: rnd(0.03, 0.07), baseY: pos.y };
}
function removeHealKit(i) {
  scene.remove(healKits[i].sprite);
  healKits[i].sprite.material.dispose();
  healKits[i].glowMat.dispose();
  healKits.splice(i, 1);
}
function clearHealKits() { while (healKits.length) removeHealKit(0); }
function resetHealKits() {
  clearHealKits();
  healKits = Array.from({ length: MP_HEALKIT_COUNT }, newHealKit);
}
function updateHealKits() {
  for (let i = healKits.length - 1; i >= 0; i--) {
    const k = healKits[i];
    k.w += k.ws;
    k.sprite.position.y = k.baseY + Math.sin(k.w) * 0.4;
    k.glowMat.opacity = 0.5 + Math.sin(k.w * 2) * 0.14;
    if (k.sprite.position.distanceTo(owlGroup.position) > BRANCH_RECYCLE_DIST) {
      const p = collectibleSpawnPos(100, 280);
      k.sprite.position.copy(p);
      k.baseY = p.y;
    }
    if (owlGroup.position.distanceTo(k.sprite.position) < COLLECT_RADIUS) {
      const damaged = life < LIFE_MAX || governEff.leftWing > 0 || governEff.rightWing > 0 || governEff.tail > 0;
      if (damaged) repairOwl();
      screenShake = Math.max(screenShake, 4);
      removeHealKit(i);
      healKits.push(newHealKit());
    }
  }
}

// ── Mort / respawn multijoueur : touche à la tête (ou vie à 0) → écran de
//    mort MP_RESPAWN_DELAY s → réapparition automatique à un point aléatoire de l'arène ──
function mpDie(cause) {
  if (state !== S.PLAY || !multiplayerMode) return;
  if (vsBotMode) campaignDeaths++;
  mpDeathCause = cause;
  mpRespawnTimer = MP_RESPAWN_DELAY;
  state = S.MP_DEAD;
  owlGroup.visible = false;
  velocity.set(0, 0, 0);
  document.body.style.cursor = 'default';
  if (document.pointerLockElement) document.exitPointerLock();
  screenShake = Math.max(screenShake, 25);
  hitFlash = Math.max(hitFlash, 0.6);
  spawnFX(owlGroup.position, 24, 'death', cause === 'headshot' ? '💥 TÊTE TOUCHÉE !' : '💥 CRASHÉ !');
  if (mp) mp.sendDied(cause);
}

function mpSpawnLocalOwl() {
  const angle = rnd(0, Math.PI * 2);
  const dist = rnd(0, ARENA_RADIUS_XZ * 0.75);
  const x = ARENA_CENTER.x + Math.cos(angle) * dist;
  const z = ARENA_CENTER.z + Math.sin(angle) * dist;
  owlGroup.position.set(x, effectiveGroundY(x, z) + rnd(25, 60), z);
  owlGroup.quaternion.identity();
  owlGroup.rotateY(rnd(0, Math.PI * 2)); // cap aléatoire
  owlGroup.visible = true;
  speed = MAX_SPEED * 0.55;
  velocity.set(0, 0, -speed).applyQuaternion(owlGroup.quaternion);
  angRate.set(0, 0, 0);
  throttle = CRUISE_THROTTLE;
  flight.aoa = 0; flight.stall = false; flight.climb = 0; flight.throttle = throttle;
  stallMode = false; stallTimer = 0;
  life = LIFE_MAX;
  governEff.leftWing = 0; governEff.rightWing = 0; governEff.tail = 0;
  controlLostShown.leftWing = false; controlLostShown.rightWing = false; controlLostShown.tail = false;
  degradeAccum = 0;
  lastHitTime = performance.now();
  lastShooterId = null;
  mpAmmo = MP_MAG_CAP;
  owlInvul = 90;   // protection de spawn (clignotement), comme en solo
  treeCooldown = 0;
  mouseFireHeld = false; touchFireHeld = false; mpFireAccum = 0;
}

function doMPRespawn() {
  mpSpawnLocalOwl();
  state = S.PLAY;
  document.body.style.cursor = 'none';
  requestFlightPointerLock();
  if (mp) mp.sendRespawn();
}

// Balle reçue sur MON hibou (relais 'hit' du serveur) : c'est toujours la
// victime qui applique l'effet sur elle-même — jamais le client du tireur.
// Le crédit de kill (+munitions au tireur, tableau des scores) est géré par
// le serveur lui-même (voir server.js, cas 'hit'/'died') : rien à renvoyer ici.
function onMPHitMe(location, shooterId) {
  if (!multiplayerMode || state !== S.PLAY) return;
  if (owlInvul > 0) return; // protection de spawn
  lastShooterId = shooterId;
  lastHitTime = performance.now(); // relance/reset le cercle de réparation
  localKillStreak = 0; // un impact subi casse le streak "5 kills sans être touché"

  if (location === 'head') {
    spawnFX(owlGroup.position, 10, 'death', 'COUP CRITIQUE : HEADSHOT');
    mpDie('headshot');
    return;
  }

  life--;
  let crit = false;
  if (Math.random() < CRIT_CHANCE) { life--; crit = true; }

  const govPart = location === 'left-wing' ? 'leftWing' : location === 'right-wing' ? 'rightWing' : location === 'tail' ? 'tail' : null;
  if (govPart) {
    if (governEff[govPart] > 0) governEff[govPart] = Math.min(1, governEff[govPart] + GOVERN_REPEAT_HIT_ADD);
    else governEff[govPart] = rnd(GOVERN_FIRST_HIT_MIN, GOVERN_FIRST_HIT_MAX);
    if (governEff[govPart] >= 1 && !controlLostShown[govPart]) {
      controlLostShown[govPart] = true;
      spawnFX(owlGroup.position, 0, 'controlloss', 'PERTE DE CONTRÔLE');
    }
  }

  screenShake = Math.max(screenShake, location === 'body' ? 6 : 12);
  hitFlash = Math.max(hitFlash, location === 'body' ? 0.2 : 0.35);
  if (location === 'left-wing')  spawnFX(owlGroup.position, 10, 'death', 'AILE GAUCHE 🩸');
  if (location === 'right-wing') spawnFX(owlGroup.position, 10, 'death', 'AILE DROITE 🩸');
  if (location === 'tail')       spawnFX(owlGroup.position, 10, 'death', 'QUEUE 🩸');
  if (crit) spawnFX(owlGroup.position, 8, 'death', 'COUP CRITIQUE');

  if (life <= 0) mpDie('shot');
}

// Kill confirmé par le serveur (crédit déjà appliqué aux munitions côté serveur,
// voir server.js) : on suit juste le streak local "5 kills sans être touché"
// pour offrir un kit de soin d'inventaire.
function onLocalKillConfirmed() {
  localKillStreak++;
  if (localKillStreak % KILLSTREAK_HEALKIT_THRESHOLD === 0 && inventory[0] === null) {
    inventory[0] = 'healkit'; // slot 1 (touche &) est réservé aux kits de soin
    spawnFX(owlGroup.position, 10, 'collect', '🎁 KIT DE SOIN GAGNÉ !');
  }
}

// ── Dégradation périodique (gouvernes déjà touchées, +10%/5s à 50% de chance)
//    et réparation passive (30 s sans nouvel impact → tout redevient intact) ──
function updateDamageSystems(dt) {
  const damaged = life < LIFE_MAX || governEff.leftWing > 0 || governEff.rightWing > 0 || governEff.tail > 0;
  if (!damaged) { repairProgress = 0; return; }

  degradeAccum += dt;
  if (degradeAccum >= GOVERN_DEGRADE_INTERVAL) {
    degradeAccum -= GOVERN_DEGRADE_INTERVAL;
    for (const part of ['leftWing', 'rightWing', 'tail']) {
      if (governEff[part] > 0 && governEff[part] < 1 && Math.random() < GOVERN_DEGRADE_CHANCE) {
        governEff[part] = Math.min(1, governEff[part] + GOVERN_DEGRADE_STEP);
        if (governEff[part] >= 1 && !controlLostShown[part]) {
          controlLostShown[part] = true;
          spawnFX(owlGroup.position, 0, 'controlloss', 'PERTE DE CONTRÔLE');
        }
      }
    }
  }

  repairProgress = THREE.MathUtils.clamp((performance.now() - lastHitTime) / 1000 / REPAIR_TIME, 0, 1);
  if (repairProgress >= 1) repairOwl();
}

// Réparation complète : réutilisée par le timer passif 30s, le kit de soin au
// sol et le kit de soin d'inventaire (streak de 5 kills).
function repairOwl() {
  life = LIFE_MAX;
  governEff.leftWing = 0; governEff.rightWing = 0; governEff.tail = 0;
  controlLostShown.leftWing = false; controlLostShown.rightWing = false; controlLostShown.tail = false;
  degradeAccum = 0;
  repairProgress = 0;
  lastHitTime = performance.now();
  spawnFX(owlGroup.position, 10, 'repaired', 'RÉPARÉ');
}

// ══════════════════════════════════════════════════
//  CAMPAGNE — bot IA. Ne passe jamais par `mp` : le bot n'existe que
//  localement, tout est résolu dans ce client (voir plan de conception,
//  "Choix d'architecture clé : ne PAS toucher à updateFlight").
// ══════════════════════════════════════════════════

// Crée le visuel du bot une seule fois (réutilisé à chaque campagne suivante).
function spawnBotEntity() {
  if (bot) return;
  const visual = makeRemoteOwlVisual();
  const aura = makeAuraSprite(auraColorHex('purple'));
  visual.obj.add(aura.sprite);
  scene.add(visual.obj);
  bot = {
    obj: visual.obj, mixer: visual.mixer || null, auraMat: aura.mat,
    velocity: new THREE.Vector3(), angRate: new THREE.Vector3(),
    speed: 0, throttle: 0, stallMode: false, stallTimer: 0,
    life: LIFE_MAX, governEff: { leftWing: 0, rightWing: 0, tail: 0 },
    controlLostShown: { leftWing: false, rightWing: false, tail: false },
    ammo: MP_MAG_CAP, fireAccum: 0,
    alive: true, invul: 0, respawnTimer: 0,
    degradeAccum: 0, lastHitTime: 0, repairProgress: 0,
    aiState: 'approach', aiTimer: 0, targetPoint: new THREE.Vector3(),
    fireIntentTimer: 0, wantsToFire: false,
    stateTimer: 0, breakCooldown: 0, jinkTimer: 0, jinkSign: 1, hitReact: false,
  };
}

// Point de réapparition à distance modérée du joueur (pas au hasard dans toute
// l'arène) : le bot doit rester trouvable, cf. règle « rien d'introuvable ».
function botRespawn() {
  const angle = rnd(0, Math.PI * 2);
  const dist = rnd(60, 140);
  const x = owlGroup.position.x + Math.cos(angle) * dist;
  const z = owlGroup.position.z + Math.sin(angle) * dist;
  bot.obj.position.set(x, effectiveGroundY(x, z) + rnd(25, 60), z);
  bot.obj.quaternion.identity();
  bot.obj.rotateY(rnd(0, Math.PI * 2));
  bot.obj.visible = true;
  bot.speed = MAX_SPEED * 0.55;
  bot.velocity.set(0, 0, -bot.speed).applyQuaternion(bot.obj.quaternion);
  bot.angRate.set(0, 0, 0);
  bot.throttle = CRUISE_THROTTLE;
  bot.stallMode = false; bot.stallTimer = 0;
  bot.life = LIFE_MAX;
  bot.governEff.leftWing = 0; bot.governEff.rightWing = 0; bot.governEff.tail = 0;
  bot.controlLostShown.leftWing = false; bot.controlLostShown.rightWing = false; bot.controlLostShown.tail = false;
  bot.degradeAccum = 0; bot.repairProgress = 0;
  bot.lastHitTime = performance.now();
  bot.ammo = MP_MAG_CAP; bot.fireAccum = 0;
  bot.alive = true; bot.invul = 90;
  bot.aiState = 'approach'; bot.aiTimer = 0; bot.fireIntentTimer = 0; bot.wantsToFire = false;
  bot.stateTimer = 0; bot.breakCooldown = 0; bot.jinkTimer = 0; bot.jinkSign = 1; bot.hitReact = false;
}

// Miroir d'onMPHitMe, mais sur l'état du bot — tout est local, pas de relais réseau.
function botTakeHit(location) {
  if (!bot || !bot.alive || bot.invul > 0) return;
  bot.lastHitTime = performance.now();
  bot.hitReact = true; // l'IA peut réagir par un break défensif au prochain tick

  if (location === 'head') {
    spawnFX(bot.obj.position, 10, 'death', 'COUP CRITIQUE : HEADSHOT');
    botDie('headshot');
    return;
  }

  bot.life--;
  if (Math.random() < CRIT_CHANCE) bot.life--;

  const govPart = location === 'left-wing' ? 'leftWing' : location === 'right-wing' ? 'rightWing' : location === 'tail' ? 'tail' : null;
  if (govPart) {
    if (bot.governEff[govPart] > 0) bot.governEff[govPart] = Math.min(1, bot.governEff[govPart] + GOVERN_REPEAT_HIT_ADD);
    else bot.governEff[govPart] = rnd(GOVERN_FIRST_HIT_MIN, GOVERN_FIRST_HIT_MAX);
  }

  screenShake = Math.max(screenShake, location === 'body' ? 4 : 8);
  if (bot.life <= 0) botDie('shot');
}

function botDie(cause) {
  campaignKills++;
  bot.alive = false;
  bot.obj.visible = false;
  bot.velocity.set(0, 0, 0);
  bot.respawnTimer = MP_RESPAWN_DELAY;
  spawnFX(bot.obj.position, 20, 'death', cause === 'headshot' ? '💥 TÊTE TOUCHÉE !' : '💥 ABATTU !');
}

// Dégradation périodique + réparation passive du bot — mêmes constantes/règles
// que updateDamageSystems/repairOwl côté joueur (parité du système de dégâts).
function updateBotDamage(dt) {
  const damaged = bot.life < LIFE_MAX || bot.governEff.leftWing > 0 || bot.governEff.rightWing > 0 || bot.governEff.tail > 0;
  if (!damaged) { bot.repairProgress = 0; return; }

  bot.degradeAccum += dt;
  if (bot.degradeAccum >= GOVERN_DEGRADE_INTERVAL) {
    bot.degradeAccum -= GOVERN_DEGRADE_INTERVAL;
    for (const part of ['leftWing', 'rightWing', 'tail']) {
      if (bot.governEff[part] > 0 && bot.governEff[part] < 1 && Math.random() < GOVERN_DEGRADE_CHANCE) {
        bot.governEff[part] = Math.min(1, bot.governEff[part] + GOVERN_DEGRADE_STEP);
      }
    }
  }

  bot.repairProgress = THREE.MathUtils.clamp((performance.now() - bot.lastHitTime) / 1000 / REPAIR_TIME, 0, 1);
  if (bot.repairProgress >= 1) {
    bot.life = LIFE_MAX;
    bot.governEff.leftWing = 0; bot.governEff.rightWing = 0; bot.governEff.tail = 0;
    bot.degradeAccum = 0; bot.repairProgress = 0;
    bot.lastHitTime = performance.now();
  }
}

// ── Vol du bot : duplique le squelette aérodynamique d'updateFlight (mêmes
//    constantes MAX_SPEED/YAW_RATE/THRUST_ACCEL/GRAVITY/portance/traînée/
//    décrochage/governEff) mais lit un `input` calculé par l'IA au lieu du
//    clavier, et écrit dans l'objet `bot` au lieu des globales du joueur. ──
const _bFwd = new THREE.Vector3(), _bUp = new THREE.Vector3(), _bRight = new THREE.Vector3();
const _bAcc = new THREE.Vector3(), _bTmp = new THREE.Vector3(), _bTgtAng = new THREE.Vector3();
function updateBotFlight(input, dt) {
  const rollMult  = 1 - Math.max(bot.governEff.leftWing, bot.governEff.rightWing);
  const pitchMult = 1 - bot.governEff.tail;
  const yawMult   = 1 - Math.max(bot.governEff.leftWing, bot.governEff.rightWing, bot.governEff.tail);
  let authority = THREE.MathUtils.clamp(
    (bot.speed - CTRL_MIN_SPEED) / (CTRL_FULL_SPEED - CTRL_MIN_SPEED), 0.2, 1);
  if (bot.stallMode) authority *= 0.3;

  _bTgtAng.set(input.pitchIn * PITCH_RATE * pitchMult, input.yawIn * YAW_RATE * yawMult,
               input.rollIn * ROLL_RATE * rollMult).multiplyScalar(authority);
  const kAng = 1 - Math.exp(-ANG_RESPONSE * dt);
  bot.angRate.lerp(_bTgtAng, kAng);
  bot.obj.rotateX(bot.angRate.x * dt);
  bot.obj.rotateY(bot.angRate.y * dt);
  bot.obj.rotateZ(bot.angRate.z * dt);

  const q = bot.obj.quaternion;
  _bFwd.set(0, 0, -1).applyQuaternion(q);
  _bUp.set(0, 1, 0).applyQuaternion(q);
  _bRight.set(1, 0, 0).applyQuaternion(q);
  const curBank = Math.asin(THREE.MathUtils.clamp(_bRight.y, -1, 1));

  if (input.thrustHeld) bot.throttle = Math.min(1, bot.throttle + 0.8 * dt);
  else if (input.brakeHeld) bot.throttle = Math.max(0, bot.throttle - BRAKE_RATE * dt);
  const climbFade = 1 - 0.85 * THREE.MathUtils.smoothstep(_bFwd.y, 0.35, 0.9);
  const thrust = bot.throttle * THRUST_ACCEL * climbFade;

  const v = bot.velocity.length();
  const vUp = bot.velocity.dot(_bUp);
  const vFwd = bot.velocity.dot(_bFwd);
  const vRight = bot.velocity.dot(_bRight);
  const aoa = v > 0.6 ? Math.atan2(-vUp, Math.abs(vFwd) + 1e-3) : 0;

  const absAoa = Math.abs(aoa);
  const stalling = absAoa > STALL_AOA;
  let CL;
  if (!stalling) CL = CL_MAX * (aoa / STALL_AOA);
  else { const over = Math.min(1, (absAoa - STALL_AOA) / STALL_AOA); CL = Math.sign(aoa) * CL_MAX * (1 - 0.75 * over); }

  const climbStall = _bFwd.y > 0.45 && v < STALL_SPEED;
  if (!bot.stallMode && (stalling || climbStall)) { bot.stallMode = true; bot.stallTimer = 0.8; }
  if (bot.stallMode) {
    bot.stallTimer -= dt;
    bot.angRate.x = THREE.MathUtils.lerp(bot.angRate.x, -1.5, 1 - Math.exp(-3.5 * dt));
    if (bot.stallTimer <= 0 && v > STALL_RECOVER && _bFwd.y < 0.25 && absAoa < STALL_AOA * 0.8) bot.stallMode = false;
  }

  _bAcc.set(0, -OWL_MASS * GRAVITY, 0);
  _bAcc.addScaledVector(_bFwd, thrust * OWL_MASS);

  const altAGL = bot.obj.position.y - effectiveGroundY(bot.obj.position.x, bot.obj.position.z);
  const groundEffect = THREE.MathUtils.clamp(1 - altAGL / 6, 0, 1);
  const dynLift  = AIR_LIFT * v * v * CL * (1 + 0.3 * groundEffect);
  const flapLift = FLAP_LIFT * (0.35 + 0.65 * bot.throttle) * Math.max(0, 1 - v / FLAP_FADE)
                 * (1 - THREE.MathUtils.smoothstep(_bFwd.y, 0.35, 0.8));
  const wingLiftMult = 1 - (bot.governEff.leftWing + bot.governEff.rightWing) / 2;
  _bAcc.addScaledVector(_bUp, (dynLift + flapLift) * wingLiftMult * OWL_MASS);

  if (v > 1e-3) {
    const drag = AIR_DRAG * v * v + INDUCED_DRAG * CL * CL * v * (1 - 0.35 * groundEffect);
    _bAcc.addScaledVector(bot.velocity, (-drag / v) * OWL_MASS);
  }
  _bAcc.addScaledVector(_bRight, -vRight * SIDE_GRIP * OWL_MASS);
  _bAcc.divideScalar(OWL_MASS);

  bot.velocity.addScaledVector(_bAcc, dt);
  const driftSeverity = Math.max(bot.governEff.leftWing, bot.governEff.rightWing, bot.governEff.tail);
  if (driftSeverity > 0) {
    const driftSign = bot.governEff.leftWing > bot.governEff.rightWing ? -1 : 1;
    bot.velocity.addScaledVector(_bRight, driftSign * DRIFT_ACCEL * driftSeverity * dt);
  }
  const vmax = MAX_SPEED;
  if (bot.velocity.lengthSq() > vmax * vmax) bot.velocity.setLength(vmax);
  bot.obj.position.addScaledVector(bot.velocity, dt);
  bot.speed = bot.velocity.length();

  const levelness = 1 - THREE.MathUtils.clamp(Math.abs(_bFwd.y) / 0.85, 0, 1);
  if (bot.speed > 3 && levelness > 0) {
    const turnRate = GRAVITY * Math.tan(THREE.MathUtils.clamp(curBank, -1.45, 1.45)) / bot.speed;
    const a = turnRate * dt * levelness;
    const ca = Math.cos(a), sa = Math.sin(a);
    const vx = bot.velocity.x, vz = bot.velocity.z;
    bot.velocity.x = vx * ca + vz * sa;
    bot.velocity.z = -vx * sa + vz * ca;
    bot.obj.rotateOnWorldAxis(_UP_AXIS, a);
  }

  // Bordure d'arène : même garde-fou dur que le joueur (pas de résistance
  // progressive ici, le bot n'a pas besoin du confort de conduite du joueur).
  const f = ellipsoidFactor(bot.obj.position);
  if (f > 1) {
    _bTmp.copy(bot.obj.position).sub(ARENA_CENTER);
    bot.obj.position.copy(ARENA_CENTER).addScaledVector(_bTmp, 1 / f);
  }
  const groundY = effectiveGroundY(bot.obj.position.x, bot.obj.position.z) + OWL_GROUND_CLEAR;
  if (bot.obj.position.y < groundY) {
    bot.obj.position.y = groundY;
    botDie('crash');
  }
}

// ── IA de décision : machine à états façon combat aérien — poursuite avec point
//    d'interception, dégagement après une passe (« extend »), break défensif
//    quand le joueur a le nez sur lui, fuite en jink quand il est blessé — posée
//    sur un pilote bas niveau qui convertit une direction voulue en commandes
//    AUX CONVENTIONS DU JOUEUR : pitchIn>0 = cabrer, yawIn>0 = virer à gauche,
//    rollIn>0 = s'incliner à gauche (l'ancienne IA avait pitch/yaw inversés :
//    son « évitement terrain » piquait moteur à fond vers le sol, d'où les
//    crashs systématiques dans le décor).
//    Priorités du pilote : décrochage > terrain > bordure > cible. ──
const _aiFwd = new THREE.Vector3(), _aiUp = new THREE.Vector3(), _aiRight = new THREE.Vector3();
const _aiSteer = new THREE.Vector3(), _aiTmp = new THREE.Vector3(), _aiTmp2 = new THREE.Vector3();
const BOT_SAFE_FACTOR  = 0.78;            // fraction de l'ellipsoïde où l'IA choisit ses points (la muraille de montagnes monte dès ~0.86)
const BOT_TARGET_CLEAR = 14;              // marge sol minimale de tout point visé
const BOT_PROBE_TIMES  = [0.5, 1.1, 2.0]; // horizons (s) des sondes terrain sur la trajectoire prédite

// Ramène un point visé dans le volume jouable (ellipsoïde sûre + au-dessus du
// sol/de l'eau) : l'IA ne se donne jamais un objectif mortel, quel que soit l'état.
function botClampTarget(p) {
  const f = ellipsoidFactor(p);
  if (f > BOT_SAFE_FACTOR) {
    _aiTmp.copy(p).sub(ARENA_CENTER);
    p.copy(ARENA_CENTER).addScaledVector(_aiTmp, BOT_SAFE_FACTOR / f);
  }
  p.y = Math.max(p.y, effectiveGroundY(p.x, p.z) + BOT_TARGET_CLEAR);
}

function updateBotAI(dt) {
  const tuning = BOT_DIFFICULTY_TUNING[botDifficulty];
  bot.aiTimer -= dt; bot.stateTimer -= dt; bot.breakCooldown -= dt;
  const distToPlayer = bot.obj.position.distanceTo(owlGroup.position);

  // Repère local du bot (nez / haut / droite) + inclinaison réelle.
  const q = bot.obj.quaternion;
  _aiFwd.set(0, 0, -1).applyQuaternion(q);
  _aiUp.set(0, 1, 0).applyQuaternion(q);
  _aiRight.set(1, 0, 0).applyQuaternion(q);
  const bank = Math.asin(THREE.MathUtils.clamp(_aiRight.y, -1, 1)); // >0 = incliné à gauche

  // ── Décision tactique (au tick — le délai entre deux décisions fait partie
  //    de la difficulté ; le pilotage/évitement, lui, tourne à chaque frame) ──
  if (bot.aiTimer <= 0) {
    bot.aiTimer = tuning.aiTickInterval;

    // Le joueur a-t-il le nez sur le bot ? (cône ~14° à portée de tir)
    _aiTmp.copy(bot.obj.position).sub(owlGroup.position);
    _aiTmp2.set(0, 0, -1).applyQuaternion(owlGroup.quaternion);
    const underAim = distToPlayer < 200 &&
      _aiTmp.dot(_aiTmp2) / Math.max(distToPlayer, 1) > Math.cos(THREE.MathUtils.degToRad(14));

    // Un break/extend en cours se tient jusqu'au bout — sauf si on vient d'être touché.
    const locked = (bot.aiState === 'break' || bot.aiState === 'extend') && bot.stateTimer > 0 && !bot.hitReact;
    if (!locked) {
      if (bot.life <= tuning.evadeLifeThreshold) {
        bot.aiState = 'evade'; // blessé : rompt le combat le temps de la réparation passive
      } else if ((underAim || bot.hitReact) && bot.breakCooldown <= 0 && Math.random() < tuning.breakChance) {
        bot.aiState = 'break';
        bot.stateTimer = rnd(1.4, 2.2);
        bot.breakCooldown = rnd(3.5, 6);
        bot.jinkSign = Math.random() < 0.5 ? -1 : 1;
        bot.jinkTimer = 0;
      } else if (distToPlayer < 30) {
        bot.aiState = 'extend'; // passe terminée : reprend de la séparation avant de revenir
        bot.stateTimer = rnd(2, 3);
      } else {
        bot.aiState = 'approach';
      }
    }
    bot.hitReact = false;

    if (bot.aiState === 'approach') {
      // Point d'interception : où sera le joueur quand la balle arrivera
      // (leadFactor dose l'anticipation — 0 en Facile = poursuite pure, très esquivable).
      const tof = distToPlayer / MP_BULLET_SPEED;
      bot.targetPoint.copy(owlGroup.position).addScaledVector(velocity, tof * tuning.leadFactor);
    } else if (bot.aiState === 'extend') {
      // File droit devant en montée douce : le combat devient une suite de
      // passes de joute, pas un tournoiement collé au joueur.
      _aiTmp.copy(bot.velocity).setY(0);
      if (_aiTmp.lengthSq() < 1) _aiTmp.copy(_aiFwd).setY(0);
      if (_aiTmp.lengthSq() < 1e-4) _aiTmp.set(0, 0, -1);
      _aiTmp.normalize();
      bot.targetPoint.copy(bot.obj.position).addScaledVector(_aiTmp, 130);
      bot.targetPoint.y += 25;
    } else if (bot.aiState === 'break') {
      // Virage serré perpendiculaire à la ligne de visée du joueur, côté tiré au sort.
      _aiTmp.copy(bot.obj.position).sub(owlGroup.position).setY(0);
      if (_aiTmp.lengthSq() < 1e-4) _aiTmp.set(1, 0, 0); // joueur pile au-dessus : direction arbitraire
      _aiTmp.normalize();
      _aiTmp2.set(-_aiTmp.z, 0, _aiTmp.x).multiplyScalar(bot.jinkSign);
      bot.targetPoint.copy(bot.obj.position).addScaledVector(_aiTmp2, 90).addScaledVector(_aiTmp, 30);
      bot.targetPoint.y += rnd(-10, 22);
    } else { // evade — fuit à l'opposé du joueur (la vie se répare passivement, voir updateBotDamage)
      _aiTmp.copy(bot.obj.position).sub(owlGroup.position).setY(0);
      if (_aiTmp.lengthSq() < 1e-4) _aiTmp.set(1, 0, 0);
      _aiTmp.normalize();
      bot.targetPoint.copy(bot.obj.position).addScaledVector(_aiTmp, 150);
    }
    botClampTarget(bot.targetPoint);
  }

  // ── Pilote bas niveau : direction voulue → yaw/pitch/roll ──
  _aiSteer.copy(bot.targetPoint).sub(bot.obj.position);
  if (_aiSteer.lengthSq() < 1) _aiSteer.copy(_aiFwd);
  _aiSteer.normalize();

  // Jink : cap qui zigzague pendant break/fuite (période selon la difficulté) —
  // dur à garder dans le viseur, sans rendre le bot imprévisible en attaque.
  if ((bot.aiState === 'break' || bot.aiState === 'evade') && tuning.jinkPeriod > 0) {
    bot.jinkTimer -= dt;
    if (bot.jinkTimer <= 0) { bot.jinkTimer = tuning.jinkPeriod * rnd(0.7, 1.3); bot.jinkSign = -bot.jinkSign; }
    _aiSteer.addScaledVector(_aiRight, bot.jinkSign * 0.45).normalize();
  }

  // ── Garde-fou bordure : si la trajectoire prédite (~2 s) sort de l'ellipsoïde
  //    sûre, on mélange la direction voulue avec un retour vers le centre —
  //    plafonné, pour que le bot reste engagé même quand le joueur rase le bord. ──
  _aiTmp.copy(bot.obj.position).addScaledVector(bot.velocity, 2.2);
  const fPred = ellipsoidFactor(_aiTmp);
  if (fPred > 0.86) {
    const w = Math.min(0.9, (fPred - 0.86) * 9);
    _aiTmp2.copy(ARENA_CENTER).sub(bot.obj.position).normalize();
    _aiSteer.lerp(_aiTmp2, w).normalize();
  }

  const side = _aiSteer.dot(_aiRight); // >0 : cible à droite du nez
  let yawIn   = THREE.MathUtils.clamp(-side * 2.5, -1, 1);
  let pitchIn = THREE.MathUtils.clamp(_aiSteer.dot(_aiUp) * 3, -1, 1);
  const wantBank = THREE.MathUtils.clamp(-side * 1.6, -1.05, 1.05); // s'incline vers la cible : virage coordonné
  let rollIn  = THREE.MathUtils.clamp((wantBank - bank) * 2.5, -1, 1);

  // ── Évitement terrain : sonde la trajectoire PRÉDITE (composante verticale
  //    comprise) à plusieurs horizons, chaque frame. La marge exigée croît avec
  //    l'horizon (il faut du temps pour arrondir). Prioritaire sur la cible. ──
  let urgency = 0;
  for (const t of BOT_PROBE_TIMES) {
    const gy = effectiveGroundY(bot.obj.position.x + bot.velocity.x * t,
                                bot.obj.position.z + bot.velocity.z * t);
    const deficit = gy + OWL_GROUND_CLEAR + 5 + 7 * t - (bot.obj.position.y + bot.velocity.y * t);
    if (deficit / 18 > urgency) urgency = deficit / 18;
  }
  urgency = Math.min(1, urgency);
  if (urgency > 0) {
    // Côté de dégagement le plus ouvert : compare le sol à ±50° du cap.
    _aiTmp.copy(bot.velocity).setY(0);
    if (_aiTmp.lengthSq() < 1) _aiTmp.copy(_aiFwd).setY(0);
    if (_aiTmp.lengthSq() < 1e-4) _aiTmp.set(0, 0, -1);
    _aiTmp.normalize();
    const lookD = Math.max(35, bot.speed * 1.6);
    const c = Math.cos(0.87), s = Math.sin(0.87);
    const gL = effectiveGroundY(bot.obj.position.x + (_aiTmp.x * c + _aiTmp.z * s) * lookD,
                                bot.obj.position.z + (-_aiTmp.x * s + _aiTmp.z * c) * lookD);
    const gR = effectiveGroundY(bot.obj.position.x + (_aiTmp.x * c - _aiTmp.z * s) * lookD,
                                bot.obj.position.z + (_aiTmp.x * s + _aiTmp.z * c) * lookD);
    const escape = gL < gR ? 1 : -1; // 1 = dégagement à gauche (yawIn > 0)
    // Cabre ailes quasi à plat (portance verticale max) en s'orientant vers le côté ouvert.
    pitchIn = THREE.MathUtils.lerp(pitchIn, 1, urgency);
    yawIn   = THREE.MathUtils.lerp(yawIn, escape * 0.6, urgency);
    rollIn  = THREE.MathUtils.lerp(rollIn,
      THREE.MathUtils.clamp((escape * 0.3 - bank) * 2.5, -1, 1), urgency);
  }

  // Anti-décrochage : cabré plafonné quand la vitesse air est basse (sinon le
  // modèle de vol décroche et force le nez vers le bas — fatal près du sol).
  if (bot.speed < STALL_RECOVER) pitchIn = Math.min(pitchIn, 0.45);
  if (bot.stallMode) {
    // Décroché : ailes à plat, gaz à fond, on laisse le nez tomber pour raccrocher.
    yawIn = 0; pitchIn = 0;
    rollIn = THREE.MathUtils.clamp(-bank * 3, -1, 1);
  }

  updateBotFlight({ yawIn, pitchIn, rollIn, thrustHeld: true, brakeHeld: false }, dt);
  // Plein régime autorisé en urgence (terrain/décrochage), bridé au cap de difficulté sinon.
  if (!(urgency > 0 || bot.stallMode)) bot.throttle = Math.min(bot.throttle, tuning.throttleCap);

  // ── Tir : cône de précision visé sur le POINT D'ANTICIPATION (temps de vol de
  //    balle × leadFactor) + délai de réaction. Un pilote en urgence ne tire pas. ──
  const aimable = bot.aiState === 'approach' && urgency <= 0.25 && !bot.stallMode;
  _aiTmp.copy(owlGroup.position)
    .addScaledVector(velocity, (distToPlayer / MP_BULLET_SPEED) * tuning.leadFactor)
    .sub(bot.obj.position).normalize();
  const aimAngle = Math.acos(THREE.MathUtils.clamp(_aiFwd.dot(_aiTmp), -1, 1));
  if (aimable && distToPlayer < tuning.fireDist && aimAngle < tuning.aimConeRad) {
    bot.fireIntentTimer += dt;
  } else {
    bot.fireIntentTimer = 0;
  }
  bot.wantsToFire = aimable && bot.fireIntentTimer >= tuning.reactionDelay;

  // Télégraphe visuel : l'aura violette s'embrase pendant la montée en intention
  // de tir — le joueur voit venir la rafale et peut casser l'alignement.
  bot.auraMat.opacity = bot.wantsToFire ? 0.95
    : bot.fireIntentTimer > 0 ? 0.6 + 0.3 * Math.sin(performance.now() / 55)
    : 0.55;
}

// ── Tir du bot : même mécanique/cadence que updateMPFire, direction bruitée
//    par le cône de précision (pas un aimbot parfait — esquivable au pilotage). ──
const _botFireDir = new THREE.Vector3(), _botFirePos = new THREE.Vector3();
function updateBotFire(dt) {
  if (!bot.wantsToFire || bot.ammo <= 0) { bot.fireAccum = 0; return; }
  bot.fireAccum += dt * MP_FIRE_RATE;
  const n = Math.min(Math.floor(bot.fireAccum), bot.ammo, 6);
  bot.fireAccum -= Math.floor(bot.fireAccum);
  if (n <= 0) return;
  const tuning = BOT_DIFFICULTY_TUNING[botDifficulty];
  _botFireDir.set(0, 0, -1).applyQuaternion(bot.obj.quaternion);
  const jitter = tuning.aimConeRad * 0.6;
  _botFireDir.x += rnd(-jitter, jitter);
  _botFireDir.y += rnd(-jitter, jitter);
  _botFireDir.normalize();
  _botFirePos.set(0, -0.28, -0.9);
  bot.obj.localToWorld(_botFirePos);
  for (let i = 0; i < n; i++) {
    spawnBullet(_botFirePos, _botFireDir, 'bot');
    // munitions illimitées en campagne (mode de test) — pas de décompte
  }
}

// Orchestrateur appelé chaque frame en campagne : respawn si mort, sinon
// IA + vol + tir + dégâts, dans cet ordre.
function updateBot(dt) {
  if (!bot) return;
  if (!bot.alive) {
    bot.respawnTimer -= dt;
    if (bot.respawnTimer <= 0) botRespawn();
    return;
  }
  if (bot.invul > 0) bot.invul--;
  updateBotAI(dt);
  updateBotFire(dt);
  updateBotDamage(dt);
  if (bot.mixer) bot.mixer.update(dt);
  bot.obj.visible = !(bot.invul > 0 && Math.floor(Date.now() / 80) % 2 !== 0);
}

// ── Entrée / sortie du mode multijoueur ──
function enterMultiplayerLobby() {
  if (!mp || !assetsReady) return;
  multiplayerMode = true;
  state = S.MP_LOBBY;
  document.body.style.cursor = 'default';
  if (document.pointerLockElement) document.exitPointerLock();
  // Purge les ours d'une éventuelle session solo précédente
  while (bears.length) removeBear(0);
  mp.enterLobby();
}

function exitMultiplayerToStart() {
  if (mp) mp.leaveMultiplayer();
  clearMultiplayerWorld();
  multiplayerMode = false;
  state = S.START;
  owlGroup.visible = false;
  document.body.style.cursor = 'default';
}

function clearMultiplayerWorld() {
  clearBullets();
  clearAmmoCrates();
  clearHealKits();
  removeLocalAura();
  setLocalCannon(false);
  life = LIFE_MAX;
  governEff.leftWing = 0; governEff.rightWing = 0; governEff.tail = 0;
  inventory = [null, null, null];
  localKillStreak = 0;
  mouseFireHeld = false; touchFireHeld = false; mpFireAccum = 0;
  if (vsBotMode) {
    vsBotMode = false;
    campaignKills = 0; campaignDeaths = 0;
    if (bot) bot.obj.visible = false; // le mesh est conservé pour la prochaine campagne
  }
}

// Test solo hors-ligne (touche [K] dans le salon) : lance directement une manche
// multijoueur sans serveur, pour essayer le canon/les munitions sans les ours.
function enterSoloMultiplayerTest() {
  if (!assetsReady) return;
  beginMultiplayerGame('brown');
}

// Mode CAMPAGNE (vs IA) : partie multijoueur locale contre un bot, sans serveur.
// Choisi depuis l'écran S.CAMPAIGN_SELECT (voir drawCampaignSelect).
function beginCampaignGame(level) {
  if (!assetsReady) return;
  beginMultiplayerGame('brown');
  vsBotMode = true;
  botDifficulty = level;
  campaignKills = 0; campaignDeaths = 0;
  spawnBotEntity();
  botRespawn();
}

// Partie rejointe (message 'joined' du serveur) : lance la manche multijoueur.
function beginMultiplayerGame(colorName) {
  if (!assetsReady) return;
  multiplayerMode = true;
  state = S.PLAY;
  document.body.style.cursor = 'none';
  score = 0; nest = 0; combo = 1; comboTimer = 0; lives = 1;
  screenShake = 0; hitFlash = 0;

  // Le terrain DOIT être identique sur tous les clients : si une partie solo a
  // régénéré la carte entre-temps, on restaure le terrain canonique avant de jouer.
  if (worldRegenerated) {
    disposeWorldGeometry();
    restoreCanonicalTerrain();
    makeTerrain();
    makeMountainScenery();
    makeTrees();
  }

  // Purge des systèmes solo : pas d'ours, pas de branches/cadeau/lune/tempête.
  for (const br of branches) { scene.remove(br.sprite); br.sprite.material.dispose(); br.glowMat.dispose(); }
  branches = [];
  while (bears.length) removeBear(0);
  for (let i = rocks.length - 1; i >= 0; i--) removeRock(i);
  rockInvul = 0;
  if (giftItem) removeGift();
  giftCooldown = Infinity;
  moon  = { state: 'none', timer: 0, next: Infinity, fillProgress: 0 };
  storm = { active: false, timer: 0, next: Infinity, windAngle: 0, windForce: 0, gustPhase: 0, rockSpawnTimer: 0 };
  buffs = { speed: 0, multi: 0, slow: 0, invincible: 0 };
  particles = [];
  skimTimer = 0; skimActive = false; trailAccum = 0;

  setLocalAura(colorName);
  setLocalCannon(true);
  resetAmmoCrates();
  resetHealKits();
  clearBullets();
  inventory = [null, null, null];
  localKillStreak = 0;
  mpSpawnLocalOwl();
  requestFlightPointerLock();
}

// Quitter la partie en cours (Retour arrière depuis la pause) : retour au salon
// multijoueur réseau, ou au menu si c'était une campagne (pas de salon pour l'IA).
function leaveMultiplayerGame() {
  const wasCampaign = vsBotMode;
  if (mp) mp.leaveRoom();
  clearMultiplayerWorld();
  state = wasCampaign ? S.START : S.MP_LOBBY;
  document.body.style.cursor = 'default';
  owlGroup.visible = false;
  if (document.pointerLockElement) document.exitPointerLock();
}

// Sortie de partie subie (déconnexion serveur en pleine manche) : retour salon.
function onMPLeftRoom() {
  if (!multiplayerMode) return;
  clearMultiplayerWorld();
  if (state === S.PLAY || state === S.MP_DEAD || state === S.PAUSED) {
    state = S.MP_LOBBY;
    owlGroup.visible = false;
    document.body.style.cursor = 'default';
    if (document.pointerLockElement) document.exitPointerLock();
  }
}

// ══════════════════════════════════════════════════
//  PARTICULES (texte flottant / éclats) — 2D écran, projetées depuis la 3D à la création
// ══════════════════════════════════════════════════
let particles = [];
function worldToScreen(v) {
  const p = v.clone().project(camera);
  return { x: (p.x * 0.5 + 0.5) * hudCanvas.width, y: (-p.y * 0.5 + 0.5) * hudCanvas.height };
}
function spawnFX(worldPos, amount, type = 'collect', txt = '') {
  const s = worldToScreen(worldPos);
  for (let i = 0; i < amount; i++) {
    const a = (i / amount) * Math.PI * 2, spd = rnd(2, 8);
    particles.push({
      type: 'dot', x: s.x, y: s.y,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life: 1,
      c: type === 'collect'
        ? ['#ffd700', '#7ec850', '#a8ff80', '#ffffff'][Math.floor(Math.random() * 4)]
        : ['#ff4444', '#ffaa00', '#ffffff'][Math.floor(Math.random() * 3)]
    });
  }
  if (txt) particles.push({ type: 'txt', x: s.x, y: s.y, vx: 0, vy: -3, life: 1.5, txt, tType: type });
}
function updateParticles() {
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    if (p.vx) p.vx *= 0.92;
    p.vy *= (p.type === 'txt' ? 0.95 : 0.92);
    p.life -= (p.type === 'txt' ? 0.02 : 0.03);
  }
  particles = particles.filter(p => p.life > 0);
}

// ══════════════════════════════════════════════════
//  HUD / ÉCRANS (canvas 2D superposé, indépendant de la caméra 3D)
// ══════════════════════════════════════════════════
function rrect(x, y, w, h, r, fill, stroke, lw) {
  hctx.beginPath(); hctx.roundRect(x, y, w, h, r);
  if (fill)   { hctx.fillStyle = fill; hctx.fill(); }
  if (stroke) { hctx.lineWidth = lw || 1.5; hctx.strokeStyle = stroke; hctx.stroke(); }
}

// Vignette dynamique + lignes de vitesse radiales : l'écran « se resserre » et file
// à haute vitesse ou sous buff ⚡ — pur canvas 2D, zéro post-processing GPU.
function drawSpeedFX() {
  const sr = THREE.MathUtils.clamp(speed / MAX_SPEED, 0, 1.3);
  const k = Math.max(0, (sr - 0.8) * 2) + (buffs.speed > 0 ? 0.4 : 0);
  if (k <= 0.03) return;
  const W = hudCanvas.width, H = hudCanvas.height, cx = W / 2, cy = H / 2;
  hctx.save();
  const g = hctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.32, cx, cy, Math.hypot(cx, cy));
  g.addColorStop(0, 'rgba(6,8,26,0)');
  g.addColorStop(1, 'rgba(6,8,26,' + Math.min(0.55, 0.5 * k).toFixed(3) + ')');
  hctx.fillStyle = g;
  hctx.fillRect(0, 0, W, H);
  hctx.strokeStyle = 'rgba(210,230,255,' + Math.min(0.4, 0.3 * k).toFixed(3) + ')';
  hctx.lineWidth = 2;
  const n = Math.floor(8 + 14 * k);
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2);
    const r0 = Math.min(W, H) * rnd(0.38, 0.5);
    const r1 = r0 + rnd(60, 190) * k;
    hctx.beginPath();
    hctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    hctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    hctx.stroke();
  }
  hctx.restore();
}

function drawHUD() {
  hctx.save();
  if (multiplayerMode) {
    drawMPStatusBox();
    drawScoreboard();
    drawInventoryBar();
    if (vsBotMode) drawCampaignScore();
    hctx.restore();
  } else {
  rrect(12, 12, 230, 100, 14, 'rgba(8,8,35,0.82)', 'rgba(100,90,220,0.4)');
  hctx.fillStyle = '#dde'; hctx.font = 'bold 16px system-ui';
  hctx.textAlign = 'left'; hctx.textBaseline = 'middle';
  hctx.fillText('Score : ' + score, 24, 32);

  let livesStr = ''; for (let i = 0; i < lives; i++) livesStr += '❤️';
  hctx.font = '12px system-ui'; hctx.fillText(livesStr, 140, 32);

  let buffY = 50;
  if (buffs.multi      > 0) { hctx.fillStyle = '#00ffff'; hctx.font = 'bold 13px system-ui'; hctx.fillText('✨ SCORE x5',     24, buffY); buffY += 16; }
  if (buffs.speed      > 0) { hctx.fillStyle = '#00ffff'; hctx.font = 'bold 13px system-ui'; hctx.fillText('⚡ VITESSE',       24, buffY); buffY += 16; }
  if (buffs.slow       > 0) { hctx.fillStyle = '#00ffff'; hctx.font = 'bold 13px system-ui'; hctx.fillText('❄️ GELÉS',        24, buffY); buffY += 16; }
  if (buffs.invincible > 0) { hctx.fillStyle = '#ffd700'; hctx.font = 'bold 13px system-ui'; hctx.fillText('🦉 INVINCIBLE !', 24, buffY); buffY += 16; }
  if (skimActive)           { hctx.fillStyle = '#8fe06a'; hctx.font = 'bold 13px system-ui'; hctx.fillText('🪶 RASE-MOTTES +' + SKIM_SCORE + '/s', 24, buffY); buffY += 16; }

  if (combo > 1 && comboTimer > 0 && buffs.multi === 0) {
    // Le compteur de combo enfle avec la série (et pulse au-delà de x5)
    const comboSize = Math.min(13 + combo, 24) + (combo >= 5 ? Math.sin(Date.now() / 90) * 1.5 : 0);
    hctx.fillStyle = '#ffaa00'; hctx.font = 'bold ' + Math.round(comboSize) + 'px system-ui';
    hctx.fillText('🔥 Combo x' + combo, 24, buffY);
    const cbW = 80 * (comboTimer / MAX_COMBO_TIME);
    rrect(120, buffY - 4, 80, 6, 3, 'rgba(255,255,255,0.1)');
    rrect(120, buffY - 4, Math.max(0, cbW), 6, 3, '#ffaa00');
    buffY += 16;
  }

  const barY = 82;
  rrect(22, barY, 190, 10, 5, 'rgba(255,255,255,0.1)');
  const bw = Math.max(10, 190 * nest / 100);
  const bar = hctx.createLinearGradient(22, 0, 212, 0);
  bar.addColorStop(0, '#5cc83a'); bar.addColorStop(1, '#d4a800');
  rrect(22, barY, bw, 10, 5, bar);
  hctx.fillStyle = '#fff'; hctx.font = 'bold 9px system-ui'; hctx.textAlign = 'center';
  hctx.fillText('NID ' + nest + '% ➔ +1 ❤️', 117, barY + 5);
  hctx.restore();
  }

  if (!isMobile) {
    hctx.save();
    hctx.fillStyle = 'rgba(150,140,220,0.55)'; hctx.font = '11px system-ui';
    hctx.textAlign = 'left'; hctx.textBaseline = 'middle';
    hctx.fillText('[O] Sensibilité souris', 22, 130);
    hctx.restore();
  }

  // ── Instruments de vol (haut-droite) : vitesse air, altitude, poussée, vario ──
  {
    hctx.save();
    const w = hudCanvas.width;
    const pw = 146, ph = 96, px = w - pw - 12, py = 12;
    rrect(px, py, pw, ph, 12, 'rgba(8,8,35,0.82)', 'rgba(100,90,220,0.4)');
    hctx.textBaseline = 'middle';
    hctx.font = '11px system-ui'; hctx.fillStyle = '#9fb0d8'; hctx.textAlign = 'left';
    hctx.fillText('Vitesse',  px + 12, py + 18);
    hctx.fillText('Altitude', px + 12, py + 38);
    hctx.fillText('Poussée',  px + 12, py + 58);
    hctx.fillText('Vario',    px + 12, py + 78);

    hctx.textAlign = 'right'; hctx.font = 'bold 12px system-ui'; hctx.fillStyle = '#e8ecff';
    hctx.fillText(Math.round(speed) + ' u/s', px + pw - 12, py + 18);
    hctx.fillText(Math.max(0, Math.round(owlGroup.position.y - effectiveGroundY(owlGroup.position.x, owlGroup.position.z))) + ' m', px + pw - 12, py + 38);
    hctx.fillText(Math.round(flight.throttle * 100) + ' %', px + pw - 12, py + 58);
    const climb = flight.climb;
    hctx.fillStyle = climb > 0.3 ? '#8fe06a' : climb < -0.3 ? '#ff9a6a' : '#e8ecff';
    hctx.fillText((climb >= 0 ? '▲ ' : '▼ ') + Math.abs(climb).toFixed(1), px + pw - 12, py + 78);
    hctx.restore();
  }

  // ── Alerte décrochage (clignotante) ──
  if (flight.stall && state === S.PLAY) {
    const w = hudCanvas.width, h = hudCanvas.height;
    if (Math.floor(Date.now() / 220) % 2 === 0) {
      hctx.save();
      rrect(w / 2 - 110, h - 92, 220, 40, 12, 'rgba(60,10,10,0.9)', 'rgba(255,90,60,0.95)');
      hctx.fillStyle = '#ffd0c0'; hctx.font = 'bold 18px system-ui';
      hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
      hctx.fillText('⚠ DÉCROCHAGE', w / 2, h - 72);
      hctx.restore();
    }
  }

  if (moon.state === 'blood') {
    hctx.save();
    const w = hudCanvas.width;
    rrect(w / 2 - 140, 12, 280, 40, 14, 'rgba(50,10,10,0.88)', 'rgba(255,80,80,0.7)');
    hctx.fillStyle = '#ffcccc'; hctx.font = 'bold 16px system-ui';
    hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
    hctx.fillText('🩸 LUNE DE SANG ! SURVIE : ' + Math.ceil(Math.max(0, moon.timer)) + 's', w / 2, 32);
    hctx.restore();
  } else if (moon.state === 'full') {
    hctx.save();
    const w = hudCanvas.width;
    rrect(w / 2 - 140, 12, 280, 40, 14, 'rgba(20,20,50,0.85)', 'rgba(200,220,255,0.6)');
    hctx.fillStyle = '#ccddff'; hctx.font = 'bold 16px system-ui';
    hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
    hctx.fillText('🌕 PLEINE LUNE ! SURVIE : ' + Math.ceil(Math.max(0, moon.timer)) + 's', w / 2, 32);
    hctx.restore();
  } else if (storm.active) {
    hctx.save();
    const w = hudCanvas.width;
    rrect(w / 2 - 140, 12, 280, 40, 14, 'rgba(40,45,55,0.85)', 'rgba(180,190,205,0.6)');
    hctx.fillStyle = '#dfe6ee'; hctx.font = 'bold 16px system-ui';
    hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
    hctx.fillText('🌬️ TEMPÊTE : ' + Math.ceil(Math.max(0, storm.timer)) + 's', w / 2, 32);
    hctx.restore();
  } else if (weather.mode === 'rain') {
    hctx.save();
    const w = hudCanvas.width;
    rrect(w / 2 - 100, 12, 200, 34, 14, 'rgba(30,38,52,0.75)', 'rgba(140,160,190,0.45)');
    hctx.fillStyle = '#b8c8de'; hctx.font = 'bold 14px system-ui';
    hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
    hctx.fillText('🌧️ PLUIE : ' + Math.ceil(Math.max(0, weather.timer)) + 's', w / 2, 29);
    hctx.restore();
  }

  // ── Boussole d'objectifs : flèches en bord d'écran vers le cadeau et la
  //    branche saine la plus proche quand ils sont hors champ ──
  if (state === S.PLAY && moon.state === 'none' && !multiplayerMode) {
    if (giftItem) drawTargetIndicator(giftItem.sprite.position, '#ffd700', '🎁');
    let nearest = null, nd = Infinity;
    for (const br of branches) {
      if (br.rotten) continue;
      const d2 = br.sprite.position.distanceToSquared(owlGroup.position);
      if (d2 < nd) { nd = d2; nearest = br; }
    }
    if (nearest) drawTargetIndicator(nearest.sprite.position, '#7ec850', '🌿');
  }

  // ── Multijoueur : croix de visée fixe, boussole vers la caisse de munitions
  //    la plus proche, et indicateurs de triche dev (position des adversaires) ──
  if (multiplayerMode && state === S.PLAY) {
    drawCrosshair();
    let nearestCrate = null, ncd = Infinity;
    for (const c of ammoCrates) {
      const d2 = c.sprite.position.distanceToSquared(owlGroup.position);
      if (d2 < ncd) { ncd = d2; nearestCrate = c; }
    }
    if (nearestCrate) drawTargetIndicator(nearestCrate.sprite.position, '#ffa030', '📦');
    if (devEspEnabled && mp) mp.drawEsp();
  }
  drawBotDebugTag(); // aussi visible sur l'écran de mort MP_DEAD : le bot continue de voler
}

// Panneau haut-gauche du multijoueur : munitions, gouvernes, vie, joueurs de la partie.
function drawMPStatusBox() {
  const rosterList = mp ? mp.roster() : [];
  const boxH = 128 + rosterList.length * 18;
  rrect(12, 12, 230, boxH, 14, 'rgba(8,8,35,0.82)', 'rgba(100,90,220,0.4)');
  hctx.fillStyle = '#dde'; hctx.font = 'bold 15px system-ui';
  hctx.textAlign = 'left'; hctx.textBaseline = 'middle';
  hctx.fillText('Munitions : ' + mpAmmo + ' / ' + MP_MAG_CAP, 24, 32);

  hctx.font = '11px system-ui'; hctx.fillStyle = '#9fb0d8';
  const govBars = [['Aile G', governEff.leftWing], ['Aile D', governEff.rightWing], ['Queue', governEff.tail]];
  let by = 52;
  for (const [label, loss] of govBars) {
    const eff = 1 - loss;

// Utilisation d'un objet d'inventaire (touches 1-3). Le kit de soin ne se
// consomme que si le hibou est réellement endommagé — sinon on le garde.
function useInventorySlot(i) {
  const item = inventory[i];
  if (!item) return;
  if (item === 'healkit') {
    const damaged = life < LIFE_MAX || governEff.leftWing > 0 || governEff.rightWing > 0 || governEff.tail > 0;
    if (!damaged) return;
    inventory[i] = null;
    repairOwl();
  }
}

// Croix verte fixe : projection à l'écran d'un point constant loin devant le
// canon (repère LOCAL du hibou) — elle ne « vise » rien, elle matérialise

const _boresight = new THREE.Vector3();
function drawCrosshair() {
  _boresight.set(0, -0.28, -60);

  hctx.beginPath();
  hctx.moveTo(s.x - 9, s.y); hctx.lineTo(s.x - 3, s.y);

  hctx.moveTo(s.x, s.y - 9); hctx.lineTo(s.x, s.y - 3);

// Flèche-boussole plaquée au bord de l'écran, pointant vers un objectif hors champ.
const _indTmp = new THREE.Vector3();
function drawTargetIndicator(worldPos, color, label) {
  const W = hudCanvas.width, H = hudCanvas.height;
  _indTmp.copy(worldPos).project(camera);
  const behind = _indTmp.z > 1;
  let sx = (_indTmp.x * 0.5 + 0.5) * W;
  let sy = (-_indTmp.y * 0.5 + 0.5) * H;
  if (behind) { sx = W - sx; sy = H - sy; } // projeté derrière la caméra : direction inversée
  const margin = 48;
  if (!behind && sx > margin && sx < W - margin && sy > margin && sy < H - margin) return; // visible : pas de flèche

  const cx = W / 2, cy = H / 2;
  let dx = sx - cx, dy = sy - cy;
  const len = Math.hypot(dx, dy) || 1;
  dx /= len; dy /= len;
  // Point d'accroche sur le cadre intérieur de l'écran
  const kx = (W / 2 - margin) / Math.abs(dx || 1e-6);
  const ky = (H / 2 - margin) / Math.abs(dy || 1e-6);
  const k = Math.min(kx, ky);
  const ex = cx + dx * k, ey = cy + dy * k;

  hctx.save();
  hctx.globalAlpha = 0.9;
  hctx.translate(ex, ey);
  hctx.rotate(Math.atan2(dy, dx));
  hctx.fillStyle = color;
  hctx.beginPath(); hctx.moveTo(16, 0); hctx.lineTo(2, -8); hctx.lineTo(2, 8); hctx.closePath(); hctx.fill();
  hctx.rotate(-Math.atan2(dy, dx));
  hctx.font = '17px serif'; hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
  hctx.fillText(label, -dx * 16, -dy * 16);
  hctx.restore();
}

function drawMobileControls() {

  const base = joystick.active ? { x: joystick.baseX, y: joystick.baseY } : { x: 100, y: hudCanvas.height - 120 };
  hctx.globalAlpha = joystick.active ? 0.55 : 0.3;
  hctx.beginPath(); hctx.arc(base.x, base.y, JOYSTICK_RADIUS, 0, Math.PI * 2);
  hctx.fillStyle = 'rgba(255,255,255,0.12)'; hctx.fill();
  hctx.strokeStyle = 'rgba(200,200,255,0.5)'; hctx.lineWidth = 2; hctx.stroke();

  hctx.fillStyle = 'rgba(203,195,255,0.85)'; hctx.fill();
  hctx.globalAlpha = 1;

  const thrust = getThrustButtonCenter();
  hctx.beginPath(); hctx.arc(thrust.x, thrust.y, thrust.r, 0, Math.PI * 2);
  hctx.fillStyle = touchThrust ? 'rgba(0,255,180,0.55)' : 'rgba(0,255,180,0.28)';
  hctx.fill();
  hctx.strokeStyle = 'rgba(200,255,230,0.7)'; hctx.lineWidth = 2; hctx.stroke();
  hctx.textAlign = 'center'; hctx.textBaseline = 'middle'; hctx.font = '30px serif';
  hctx.fillText('⚡', thrust.x, thrust.y);

  const brake = getBrakeButtonCenter();
  hctx.beginPath(); hctx.arc(brake.x, brake.y, brake.r, 0, Math.PI * 2);
  hctx.fillStyle = touchBrake ? 'rgba(255,80,80,0.55)' : 'rgba(255,80,80,0.28)';
  hctx.fill();
  hctx.strokeStyle = 'rgba(255,200,200,0.7)'; hctx.lineWidth = 2; hctx.stroke();
  hctx.font = '22px serif';
  hctx.fillText('✋', brake.x, brake.y);

  hctx.restore();
}

function drawLootbox() {
  const W = hudCanvas.width, H = hudCanvas.height;
  hctx.save();
  hctx.fillStyle = 'rgba(0,0,0,0.88)'; hctx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;
  hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
  hctx.fillStyle = '#ffffff'; hctx.font = '900 20px system-ui';
  hctx.fillText('CADEAU !', cx, cy - 120);

  const barW    = CASE_STRIDE * 5 - CASE_GAP;
  const barH    = CASE_W;
  const barLeft = cx - barW / 2;
  const barTop  = cy - barH / 2 - 10;

  rrect(barLeft - 4, barTop - 4, barW + 8, barH + 8, 10, '#0a0a2a', '#444466', 2);

  hctx.save();
  hctx.beginPath(); hctx.rect(barLeft, barTop, barW, barH); hctx.clip();
  for (let i = 0; i < lootbox.items.length; i++) {
    const item  = lootbox.items[i];
    const caseX = barLeft + lootbox.scroll + i * CASE_STRIDE;
    if (caseX + CASE_W < barLeft || caseX > barLeft + barW) continue;
    const isWinner = (i === TARGET_IDX && lootbox.phase === 'land');
    rrect(caseX, barTop, CASE_W, barH, 8,
      isWinner ? '#2a1f00' : '#111128', isWinner ? '#ffd700' : '#2a2a55', isWinner ? 3 : 1);
    hctx.font = (item.id === 'invincible' ? 38 : 36) + 'px serif';
    if (item.id === 'invincible') {
      hctx.save();
      hctx.shadowColor = '#ffd700'; hctx.shadowBlur = isWinner ? 30 : 12;
      hctx.fillText('🦉', caseX + CASE_W / 2, barTop + barH / 2);
      hctx.restore();
    } else {
      hctx.fillText(item.e, caseX + CASE_W / 2, barTop + barH / 2);
    }
  }
  hctx.restore();

  hctx.save();
  hctx.fillStyle = '#ff4444'; hctx.strokeStyle = '#ff4444'; hctx.lineWidth = 2;
  hctx.beginPath(); hctx.moveTo(cx, barTop - 12); hctx.lineTo(cx, barTop + barH + 12); hctx.stroke();
  hctx.beginPath(); hctx.moveTo(cx - 8, barTop - 14); hctx.lineTo(cx + 8, barTop - 14); hctx.lineTo(cx, barTop - 2); hctx.closePath(); hctx.fill();
  hctx.beginPath(); hctx.moveTo(cx - 8, barTop + barH + 14); hctx.lineTo(cx + 8, barTop + barH + 14); hctx.lineTo(cx, barTop + barH + 2); hctx.closePath(); hctx.fill();
  hctx.restore();

  if (lootbox.phase === 'land') {
    const alpha = Math.min(1, lootbox.landTimer / 20);
    hctx.save(); hctx.globalAlpha = alpha;
    const isInvincible = lootbox.result.id === 'invincible';
    hctx.fillStyle  = isInvincible ? '#ffd700' : '#00ffff';
    hctx.font       = '900 26px system-ui';
    hctx.shadowColor = isInvincible ? '#ffa500' : '#0088ff';
    hctx.shadowBlur  = 20;
    hctx.fillText(lootbox.result.txt, cx, cy + 80);
    hctx.font      = '14px system-ui';
    hctx.fillStyle = 'rgba(200,200,255,0.7)';
    hctx.shadowBlur = 0;
    hctx.fillText('Un instant...', cx, cy + 110);
    hctx.restore();
  }
  hctx.restore();
}

function drawOverlay() {
  hctx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
  hctx.save();
  if (screenShake > 0) hctx.translate(rnd(-screenShake, screenShake), rnd(-screenShake, screenShake));

  if (state === S.START) {
    drawStart();
  } else if (state === S.MP_LOBBY) {
    if (mp) mp.drawLobby();
  } else if (state === S.CAMPAIGN_SELECT) {
    drawCampaignSelect();
  } else {
    if (state === S.PLAY) drawSpeedFX();
    for (const p of particles) {
      hctx.save(); hctx.globalAlpha = Math.max(0, p.life);
      if (p.type === 'txt') {
        hctx.fillStyle = p.tType === 'controlloss' ? '#ff2222' : p.tType === 'repaired' ? '#ffe066' : p.tType === 'death' ? '#ff3333' : '#ffd700';
        hctx.font = '900 24px system-ui';
        hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
        hctx.shadowColor = '#000'; hctx.shadowBlur = 8;
        // Clignotement pour les alertes de contrôle (toutes les ~6 frames)
        if ((p.tType === 'controlloss' || p.tType === 'repaired') && Math.floor(p.life * 30) % 12 >= 6) { hctx.restore(); continue; }
        hctx.fillText(p.txt, p.x, p.y);
      } else {
        hctx.fillStyle = p.c;
        hctx.beginPath(); hctx.arc(p.x, p.y, rnd(2, 6), 0, Math.PI * 2); hctx.fill();
      }
      hctx.restore();
    }
    drawHUD();
    if (state === S.OVER) drawOver();
    else if (state === S.MP_DEAD) drawMPDead();
    else if (state === S.PAUSED && !settingsOpen) drawPaused();
    else if (state === S.LOOT) drawLootbox();
    if (isMobile && state === S.PLAY) drawMobileControls();
  }

  if (settingsOpen) drawSettings();

  if (hitFlash > 0) {
    hctx.save(); hctx.globalAlpha = hitFlash; hctx.fillStyle = '#ff2222';
    hctx.fillRect(0, 0, hudCanvas.width, hudCanvas.height);
    hctx.restore();
  }
  if (lightningFlash > 0.01) { // éclair : flash blanc bref sur tout l'écran
    hctx.save(); hctx.globalAlpha = Math.min(0.75, lightningFlash * 0.75); hctx.fillStyle = '#eaf2ff';
    hctx.fillRect(0, 0, hudCanvas.width, hudCanvas.height);
    hctx.restore();
  }
  hctx.restore();
}

// ══════════════════════════════════════════════════
//  INIT / RESET
// ══════════════════════════════════════════════════
function beginGame() {
  if (!assetsReady) return; // le monde n'est pas encore construit (modèles en cours de chargement)
  if (multiplayerMode) { // retour au solo : on coupe proprement le multijoueur
    if (mp) mp.leaveMultiplayer();
    clearMultiplayerWorld();
    multiplayerMode = false;
  }

  // ── Nouvelle carte à chaque partie SOLO : le monde (terrain, lacs, muraille, forêt)
  //    est démoli puis regénéré avec un nouveau seed et de nouveaux pics. Le multijoueur
  //    restaure toujours le terrain canonique avant de démarrer (restoreCanonicalTerrain).
  disposeWorldGeometry();
  regenerateTerrainSeed();
  makeTerrain();
  makeMountainScenery();
  makeTrees();

  state = S.PLAY;
  document.body.style.cursor = 'none';
  score = 0; nest = 0; combo = 1; comboTimer = 0; lives = 1; overReason = 'eaten';
  roundTime = 0; // la rampe de difficulté des ours repart de zéro
  screenShake = 0; hitFlash = 0; owlInvul = 60; treeCooldown = 0;
  speed = MAX_SPEED * 0.55; // décolle déjà lancé

  owlGroup.position.set(ARENA_CENTER.x, 16, ARENA_CENTER.z); // altitude basse au départ
  owlGroup.quaternion.identity();
  owlGroup.visible = true;
  // État de vol initial : lancé vers l'avant (−Z), moteur en croisière, rotations à plat.
  velocity.set(0, 0, -speed);
  angRate.set(0, 0, 0);
  throttle = CRUISE_THROTTLE;
  flight.aoa = 0; flight.stall = false; flight.climb = 0; flight.throttle = throttle;
  requestFlightPointerLock();

  for (const br of branches) { scene.remove(br.sprite); br.sprite.material.dispose(); br.glowMat.dispose(); }
  for (const b of bears)     { scene.remove(b.sprite);  if (b.sprite.isSprite) b.sprite.material.dispose(); b.menaceMat.dispose(); }
  for (let i = rocks.length - 1; i >= 0; i--) removeRock(i);
  rockInvul = 0;
  branches = Array.from({ length: BRANCH_COUNT }, newBranch);
  bears = [newBear(), newBear()];
  particles = [];
  moon  = { state: 'none', timer: 0, next: 15, fillProgress: 0 };
  storm = { active: false, timer: 0, next: rnd(20, 30), windAngle: 0, windForce: 0, gustPhase: 0, rockSpawnTimer: 0 };

  if (giftItem) removeGift();
  giftCooldown = rnd(8, 14); // premier cadeau garanti au bout de quelques secondes
  buffs = { speed: 0, multi: 0, slow: 0, invincible: 0 };

  // État de vol/effets annexes remis à neuf
  stallMode = false; stallTimer = 0;
  skimTimer = 0; skimActive = false;
  trailAccum = 0; comboFxAccum = 0;
  hitStopTimer = 0;
  camera.fov = 70; camera.updateProjectionMatrix();

  // Météo remise au clair (le niveau retombe en fondu via updateWeatherFX)
  weather.mode = 'clear'; weather.timer = 0; weather.next = rnd(RAIN_NEXT[0], RAIN_NEXT[1]);
  lightningFlash = 0; lightningTimer = rnd(3, 7);
  for (const d of precipData) anchorDrop(d, false); // les gouttes suivent le hibou au point de départ

  for (const d of fireflyData) anchorFirefly(d); // la nuée rejoint la clairière de départ
}

// ══════════════════════════════════════════════════
//  BOUCLE PRINCIPALE
// ══════════════════════════════════════════════════
const clock = new THREE.Clock();

function update() {
  const rawDt = Math.min(clock.getDelta(), 0.05);
  updateAdaptiveQuality(rawDt);
  // Ralenti d'impact : le temps du jeu se dilate un court instant sur les gros chocs
  if (hitStopTimer > 0) hitStopTimer -= rawDt;
  const dt = hitStopTimer > 0 ? rawDt * hitStopScale : rawDt;

  if (screenShake > 0) { screenShake *= 0.9; if (screenShake < 0.5) screenShake = 0; }
  if (hitFlash    > 0) { hitFlash    *= 0.85; if (hitFlash < 0.01) hitFlash = 0; }

  if (state === S.PLAY) {
    roundTime += dt;
    if (owlInvul > 0) owlInvul--;
    if (treeCooldown > 0) treeCooldown--;
    rockInvul = Math.max(0, rockInvul - dt);
    buffs.speed      = Math.max(0, buffs.speed      - dt);
    buffs.multi      = Math.max(0, buffs.multi      - dt);
    buffs.slow       = Math.max(0, buffs.slow       - dt);
    buffs.invincible = Math.max(0, buffs.invincible - dt);
    if (!multiplayerMode) {
      updateMoon(dt);
      updateStorm(dt);
      updateWeatherLogic(dt);
      updateRocks(dt);
    }
    const speedRatio = updateFlight(dt);
    updateFlap(dt, speedRatio);
    updateBoostTrail(dt);
    updateComboCascade(dt);
    if (multiplayerMode) {
      // Multijoueur : canon/balles/caisses remplacent branches/ours/cadeau/rase-mottes
      updateMPFire(dt);
      if (vsBotMode) updateBot(dt);
      updateBullets(dt);
      updateAmmoCrates();
      updateHealKits();
      updateDamageSystems(dt);
      updateSmokeTrail(dt);
    } else {
      updateSkim(dt);
      updateBranches();
      updateBears(dt);
      updateGift(dt);
    }
    updateBoundaryGrid();
    updateCameraClip();
    // FOV dynamique : le champ s'élargit avec la vitesse — la sensation de vitesse est exagérée
    const targetFov = 70 + speedRatio * speedRatio * 14 + (buffs.speed > 0 ? 5 : 0);
    camera.fov += (targetFov - camera.fov) * Math.min(1, 6 * dt);
    camera.updateProjectionMatrix();
    owlGroup.visible = !(owlInvul > 0 && Math.floor(Date.now() / 80) % 2 !== 0);
  } else if (state === S.LOOT) {
    mouseDX = 0; mouseDY = 0;
    boundaryGrid.visible = false;
    updateLootbox(dt);
  } else if (state === S.MP_DEAD) {
    mouseDX = 0; mouseDY = 0;
    boundaryGrid.visible = false;
    if (vsBotMode) updateBot(dt); // le bot continue de voler/patrouiller pendant que le joueur est mort
    updateBullets(dt); // les balles en vol finissent leur course pendant l'écran de mort
    mpRespawnTimer -= dt;
    if (mpRespawnTimer <= 0) doMPRespawn();
  } else {
    mouseDX = 0; mouseDY = 0;
    boundaryGrid.visible = false;
  }
  // Réseau multijoueur : interpolation des hiboux distants + envoi de l'état
  // local — tourne aussi en salon, en pause et sur l'écran de mort.
  if (mp && multiplayerMode) mp.update(dt);
  updateMoonVisual(dt);
  updateWeatherFX(dt); // après updateMoonVisual (qui fixe moonLight.intensity chaque frame)
  // Sur mobile, on gèle étoiles/nuages/lucioles sur les écrans vraiment inactifs (titre/pause/lobby)
  // pour économiser du CPU — mais pas en LOOT/OVER/MP_DEAD où d'autres animations doivent finir.
  const mobileIdle = isMobile && (state === S.START || state === S.PAUSED || state === S.MP_LOBBY);
  if (!mobileIdle) updateStars(dt);
  if (!mobileIdle) updateClouds(dt);
  updateParticles();
  updateFX3D(dt);      // les gerbes 3D finissent de retomber même en pause/game over
  if (!mobileIdle) updateFireflies(dt); // la nuée scintille aussi sur les écrans de menu (desktop)
}

function render() {
  renderer.render(scene, camera);
  drawOverlay();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// ── Boot : écran de chargement pendant le fetch des GLB, puis construction du monde ──
function drawLoading() {
  hctx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
  hctx.save();
  hctx.fillStyle = '#04040e';
  hctx.fillRect(0, 0, hudCanvas.width, hudCanvas.height);
  hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
  hctx.font = '54px serif';
  hctx.fillText('🦉', hudCanvas.width / 2, hudCanvas.height / 2 - 40);
  hctx.fillStyle = '#cbc3ff'; hctx.font = 'bold 18px system-ui';
  hctx.fillText('Chargement des modèles 3D…', hudCanvas.width / 2, hudCanvas.height / 2 + 20);
  hctx.restore();
}

// Sonde de debug/test (lecture seule) : état du jeu inspectable depuis la console.
window.__hibouDebug = () => ({
  state, score, lives, assetsReady,
  multiplayerMode, mpAmmo, life, governEff: { ...governEff }, inventory: [...inventory],
  mpRespawnTimer: Math.round(mpRespawnTimer * 10) / 10,
  bullets: bullets.length, ammoCrates: ammoCrates.length,
  mpInRoom: mp ? mp.inRoom() : false,
  mpRemotes: mp ? mp.remotesList().length : 0,
  devEsp: devEspEnabled,
  pos: owlGroup.position.toArray().map(v => Math.round(v * 10) / 10),
  groundY: Math.round(effectiveGroundY(owlGroup.position.x, owlGroup.position.z) * 10) / 10,
  speed: Math.round(speed * 10) / 10,
  stall: stallMode,
  skim: skimActive,
  trees: treeColliders.length,
  bears: bears.length,
  bearModes: bears.map(b => b.mode),
  rocks: rocks.length,
  weather: weather.mode,
  weatherLevel: Math.round(weather.level * 100) / 100,
  pixelScale,
  branches: branches.length,
  nearestBranch: branches.length
    ? Math.round(Math.min(...branches.map(b => b.sprite.position.distanceTo(owlGroup.position))))
    : null,
  gift: giftItem ? Math.round(giftItem.sprite.position.distanceTo(owlGroup.position)) : null,
  giftCooldown: Math.round(giftCooldown * 10) / 10,
  clouds: cloudSets.reduce((n, s) => n + s.data.length, 0),
  usingModels: {
    owl: !!models.owl, bear: !!models.bear, moon: !!models.moon,
    trees: !!(models.pine1 || models.pine2 || models.birch || models.tree1),
    mountains: !!(models.mountains || models.mountainGroup),
    clouds: !!(models.cloud1 || models.cloud2 || models.cloud3)
  }
});

resize();
drawLoading();
loadAssets().then(() => {
  makeSky();
  makeTerrain();
  makeMountainScenery();
  makeClouds();
  makeTrees();
  setupOwlVisual();
  setupBearProto();
  makeBoundaryGrid();
  makeFX3D();
  makeFireflies();
  makeWeather();

  // Multijoueur : le module réseau reçoit via `hooks` les seules références du
  // jeu dont il a besoin (tout l'état vit dans la closure __hibouStart).
  mp = initMultiplayer({
    THREE, scene,
    hudCanvas, hctx, rrect, drawTargetIndicator,
    makeRemoteOwlVisual, makeAuraSprite,
    getMyState: () => ({
      pos: owlGroup.position, quat: owlGroup.quaternion, vel: velocity,
      alive: state !== S.MP_DEAD,
      dmg: [governEff.leftWing, governEff.rightWing, governEff.tail],
    }),
    onJoined: (color) => beginMultiplayerGame(color),
    onLeftRoom: onMPLeftRoom,
    onHitMe: (location, shooterId) => onMPHitMe(location, shooterId),
    onAmmo: (n) => { mpAmmo = n; },
    onKill: (killerId) => { if (mp && killerId === mp.myId()) onLocalKillConfirmed(); },
    onRemoteFire: onMPRemoteFire,
    spawnFX,
  });

  assetsReady = true;
  loop();
});
</script>
</body>
</html>
