function drawSettings() {
  const W = hudCanvas.width, H = hudCanvas.height;
  hctx.save();
  hctx.fillStyle = 'rgba(0,0,0,0.55)'; hctx.fillRect(0, 0, W, H);

  const p   = getSettingsPanelRect();
  const hit = getSliderHitArea();

  rrect(p.x, p.y, p.w, p.h, 16, 'rgba(8,8,40,0.97)', 'rgba(110,90,255,0.7)', 2);

  hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
  hctx.fillStyle = '#cbc3ff'; hctx.font = 'bold 15px VT323,monospace';
  hctx.fillText('🖱️  Sensibilité souris', p.x + p.w / 2, p.y + 22);

  const pct = Math.round(mouseSensitivity * 100);
  hctx.fillStyle = '#ffffff'; hctx.font = 'bold 13px VT323,monospace';
  hctx.fillText(pct + '%', p.x + p.w / 2, p.y + 44);

  const sx = hit.x, sy = hit.y, sw = hit.w, sh = hit.h;
  rrect(sx, sy, sw, sh, sh / 2, 'rgba(255,255,255,0.1)', 'rgba(110,90,255,0.4)', 1);

  const fillW = sw * mouseSensitivity;
  const grad = hctx.createLinearGradient(sx, 0, sx + sw, 0);
  grad.addColorStop(0, '#5544dd'); grad.addColorStop(1, '#aa44ff');
  rrect(sx, sy, Math.max(sh, fillW), sh, sh / 2, grad);

  const thumbX = sx + fillW;
  hctx.beginPath(); hctx.arc(thumbX, sy + sh / 2, 10, 0, Math.PI * 2);
  hctx.fillStyle = sliderDrag ? '#ffffff' : '#cbc3ff'; hctx.fill();
  hctx.strokeStyle = '#5544dd'; hctx.lineWidth = 2; hctx.stroke();

  hctx.fillStyle = 'rgba(180,170,240,0.6)'; hctx.font = '10px VT323,monospace';
  hctx.textAlign = 'left';  hctx.fillText('Lent',   sx,      sy + sh + 12);
  hctx.textAlign = 'right'; hctx.fillText('Rapide', sx + sw, sy + sh + 12);

  hctx.fillStyle = 'rgba(150,140,220,0.5)'; hctx.font = '10px VT323,monospace';
  hctx.textAlign = 'center';
  hctx.fillText('[O] ou clic extérieur pour fermer', p.x + p.w / 2, p.y + p.h - 10);

  hctx.restore();
}

function drawMobileControls() {
  hctx.save();
  const base = joystick.active ? { x: joystick.baseX, y: joystick.baseY } : { x: 100, y: hudCanvas.height - 120 };
  hctx.globalAlpha = joystick.active ? 0.55 : 0.3;
  hctx.beginPath(); hctx.arc(base.x, base.y, JOYSTICK_RADIUS, 0, Math.PI * 2);
  hctx.fillStyle = 'rgba(255,255,255,0.12)'; hctx.fill();
  hctx.strokeStyle = 'rgba(200,200,255,0.5)'; hctx.lineWidth = 2; hctx.stroke();
  hctx.beginPath(); hctx.arc(base.x + joystick.dx, base.y + joystick.dy, 24, 0, Math.PI * 2);
  hctx.fillStyle = 'rgba(203,195,255,0.85)'; hctx.fill();
  hctx.globalAlpha = 1;

  const thrust = getThrustButtonCenter();
  hctx.beginPath(); hctx.arc(thrust.x, thrust.y, thrust.r, 0, Math.PI * 2);
  hctx.fillStyle = touchThrust ? 'rgba(0,255,180,0.55)' : 'rgba(0,255,180,0.28)';
  hctx.fill();
  hctx.strokeStyle = 'rgba(200,255,230,0.7)'; hctx.lineWidth = 2; hctx.stroke();
  hctx.textAlign = 'center'; hctx.textBaseline = 'middle'; hctx.font = '30px serif';
  hctx.fillText('⚡', thrust.x, thrust.y);

  const brake = getBrakeButtonCenter();
  hctx.beginPath(); hctx.arc(brake.x, brake.y, brake.r, 0, Math.PI * 2);
  hctx.fillStyle = touchBrake ? 'rgba(255,80,80,0.55)' : 'rgba(255,80,80,0.28)';
  hctx.fill();
  hctx.strokeStyle = 'rgba(255,200,200,0.7)'; hctx.lineWidth = 2; hctx.stroke();
  hctx.font = '22px serif';
  hctx.fillText('✋', brake.x, brake.y);

  hctx.restore();
}

function drawLootbox() {
  const W = hudCanvas.width, H = hudCanvas.height;
  hctx.save();
  hctx.fillStyle = 'rgba(0,0,0,0.88)'; hctx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;
  hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
  hctx.save();
  hctx.fillStyle = '#ffd23f'; hctx.font = "16px 'Press Start 2P',monospace";
  hctx.shadowColor = 'rgba(0,0,0,0.9)'; hctx.shadowOffsetX = 2; hctx.shadowOffsetY = 2;
  hctx.fillText('CADEAU !', cx, cy - 120);
  hctx.restore();

  const barW    = CASE_STRIDE * 5 - CASE_GAP;
  const barH    = CASE_W;
  const barLeft = cx - barW / 2;
  const barTop  = cy - barH / 2 - 10;

  rrect(barLeft - 4, barTop - 4, barW + 8, barH + 8, 10, '#0a0a2a', '#444466', 2);

  hctx.save();
  hctx.beginPath(); hctx.rect(barLeft, barTop, barW, barH); hctx.clip();
  for (let i = 0; i < lootbox.items.length; i++) {
    const item  = lootbox.items[i];
    const caseX = barLeft + lootbox.scroll + i * CASE_STRIDE;
    if (caseX + CASE_W < barLeft || caseX > barLeft + barW) continue;
    const isWinner = (i === TARGET_IDX && lootbox.phase === 'land');
    rrect(caseX, barTop, CASE_W, barH, 8,
      isWinner ? '#2a1f00' : '#111128', isWinner ? '#ffd700' : '#2a2a55', isWinner ? 3 : 1);
    hctx.font = (item.id === 'invincible' ? 38 : 36) + 'px serif';
    if (item.id === 'invincible') {
      hctx.save();
      hctx.shadowColor = '#ffd700'; hctx.shadowBlur = isWinner ? 30 : 12;
      hctx.fillText('🦉', caseX + CASE_W / 2, barTop + barH / 2);
      hctx.restore();
    } else {
      hctx.fillText(item.e, caseX + CASE_W / 2, barTop + barH / 2);
    }
  }
  hctx.restore();

  hctx.save();
  hctx.fillStyle = '#ff4444'; hctx.strokeStyle = '#ff4444'; hctx.lineWidth = 2;
  hctx.beginPath(); hctx.moveTo(cx, barTop - 12); hctx.lineTo(cx, barTop + barH + 12); hctx.stroke();
  hctx.beginPath(); hctx.moveTo(cx - 8, barTop - 14); hctx.lineTo(cx + 8, barTop - 14); hctx.lineTo(cx, barTop - 2); hctx.closePath(); hctx.fill();
  hctx.beginPath(); hctx.moveTo(cx - 8, barTop + barH + 14); hctx.lineTo(cx + 8, barTop + barH + 14); hctx.lineTo(cx, barTop + barH + 2); hctx.closePath(); hctx.fill();
  hctx.restore();

  if (lootbox.phase === 'land') {
    const alpha = Math.min(1, lootbox.landTimer / 20);
    hctx.save(); hctx.globalAlpha = alpha;
    const isInvincible = lootbox.result.id === 'invincible';
    hctx.fillStyle  = isInvincible ? '#ffd700' : '#00ffff';
    hctx.font       = '900 26px VT323,monospace';
    hctx.shadowColor = isInvincible ? '#ffa500' : '#0088ff';
    hctx.shadowBlur  = 20;
    hctx.fillText(lootbox.result.txt, cx, cy + 80);
    hctx.font      = '14px VT323,monospace';
    hctx.fillStyle = 'rgba(200,200,255,0.7)';
    hctx.shadowBlur = 0;
    hctx.fillText('Un instant...', cx, cy + 110);
    hctx.restore();
  }
  hctx.restore();
}

function drawOverlay() {
  hctx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
  hctx.save();
  if (screenShake > 0) hctx.translate(rnd(-screenShake, screenShake), rnd(-screenShake, screenShake));

  if (state === S.START) {
    drawStart();
  } else if (state === S.CAMPAIGN_LOCK) {
    drawStart(); // formulaire de code affiché par-dessus (DOM, voir #campaign-lock)
  } else if (state === S.MP_LOBBY) {
    if (mp) mp.drawLobby();
  } else if (state === S.CAMPAIGN_SELECT) {
    drawCampaignSelect();
  } else if (state === S.QUICK_SELECT) {
    drawQuickSelect();
  } else {
    if (state === S.PLAY) drawSpeedFX();
    for (const p of particles) {
      hctx.save(); hctx.globalAlpha = Math.max(0, p.life);
      if (p.type === 'txt') {
        hctx.fillStyle = p.tType === 'controlloss' ? '#ff2222' : p.tType === 'repaired' ? '#ffe066' : p.tType === 'death' ? '#ff3333' : '#ffd700';
        hctx.font = '900 24px VT323,monospace';
        hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
        hctx.shadowColor = '#000'; hctx.shadowBlur = 8;
        // Clignotement pour les alertes de contrôle (toutes les ~6 frames)
        if ((p.tType === 'controlloss' || p.tType === 'repaired') && Math.floor(p.life * 30) % 12 >= 6) { hctx.restore(); continue; }
        hctx.fillText(p.txt, p.x, p.y);
      } else {
        hctx.fillStyle = p.c;
        hctx.beginPath(); hctx.arc(p.x, p.y, rnd(2, 6), 0, Math.PI * 2); hctx.fill();
      }
      hctx.restore();
    }
    if (state === S.CUTSCENE) drawCutscene(); // cinématique : letterbox à la place du HUD
    else drawHUD();
    if (state === S.OVER) drawOver();
    else if (state === S.LEVEL_END) drawLevelEnd();
    else if (state === S.MP_DEAD) drawMPDead();
    else if (state === S.PAUSED && !settingsOpen) drawPaused();
    else if (state === S.LOOT) drawLootbox();
    if (isMobile && state === S.PLAY) drawMobileControls();
  }

  // Voile CRT (scanlines) sur les écrans de menu plein écran — renforce le look arcade.
  const menuState = state === S.START || state === S.CAMPAIGN_LOCK || state === S.CAMPAIGN_SELECT
    || state === S.QUICK_SELECT || state === S.OVER || state === S.LEVEL_END || state === S.MP_DEAD
    || state === S.PAUSED || state === S.LOOT || state === S.MP_LOBBY;
  if (menuState) scanlines(hctx, 0, 0, hudCanvas.width, hudCanvas.height, 0.13);

  if (settingsOpen) drawSettings();

  if (screenFade > 0) { // fondu au noir des transitions carte → cinématique → jeu → fin
    hctx.save(); hctx.globalAlpha = Math.min(1, screenFade); hctx.fillStyle = '#000';
    hctx.fillRect(0, 0, hudCanvas.width, hudCanvas.height);
    hctx.restore();
  }
  if (hitFlash > 0) {
    hctx.save(); hctx.globalAlpha = hitFlash; hctx.fillStyle = '#ff2222';
    hctx.fillRect(0, 0, hudCanvas.width, hudCanvas.height);
    hctx.restore();
  }
  if (lightningFlash > 0.01) { // éclair : flash blanc bref sur tout l'écran
    hctx.save(); hctx.globalAlpha = Math.min(0.75, lightningFlash * 0.75); hctx.fillStyle = '#eaf2ff';
    hctx.fillRect(0, 0, hudCanvas.width, hudCanvas.height);
    hctx.restore();
  }
  hctx.restore();
}

// ══════════════════════════════════════════════════
//  INIT / RESET
// ══════════════════════════════════════════════════
function beginGame() {
  if (!assetsReady) return; // le monde n'est pas encore construit (modèles en cours de chargement)
  if (multiplayerMode) { // retour au solo : on coupe proprement le multijoueur
    if (mp) mp.leaveMultiplayer();
    clearMultiplayerWorld();
    multiplayerMode = false;
  }

  // ── Nouvelle carte à chaque partie SOLO : le monde (terrain, lacs, muraille, forêt)
  //    est démoli puis regénéré avec un nouveau seed et de nouveaux pics. Le multijoueur
  //    restaure toujours le terrain canonique avant de démarrer (restoreCanonicalTerrain).
  disposeWorldGeometry();
  regenerateTerrainSeed();
  makeTerrain();
  makeMountainScenery();
  makeTrees();
  makeBuildings();

  state = S.PLAY;
  document.body.style.cursor = 'none';
  score = 0; nest = 0; combo = 1; comboTimer = 0; lives = 1; overReason = 'eaten';
  roundTime = 0; // la rampe de difficulté des ours repart de zéro
  screenShake = 0; hitFlash = 0; owlInvul = 60; treeCooldown = 0;
  speed = MAX_SPEED * 0.55; // décolle déjà lancé

  owlGroup.position.set(ARENA_CENTER.x, 16, ARENA_CENTER.z); // altitude basse au départ
  owlGroup.quaternion.identity();
  owlGroup.visible = true;
  // État de vol initial : lancé vers l'avant (−Z), moteur en croisière, rotations à plat.
  velocity.set(0, 0, -speed);
  angRate.set(0, 0, 0);
  throttle = CRUISE_THROTTLE;
  flight.aoa = 0; flight.stall = false; flight.climb = 0; flight.throttle = throttle;
  requestFlightPointerLock();

  for (const br of branches) { scene.remove(br.sprite); br.sprite.material.dispose(); br.glowMat.dispose(); }
  for (const b of bears)     { scene.remove(b.sprite);  if (b.sprite.isSprite) b.sprite.material.dispose(); b.menaceMat.dispose(); }
  for (let i = rocks.length - 1; i >= 0; i--) removeRock(i);
  rockInvul = 0;
  branches = Array.from({ length: BRANCH_COUNT }, newBranch);
  bears = [newBear(), newBear()];
  particles = [];
  moon  = { state: 'none', timer: 0, next: 15, fillProgress: 0 };
  storm = { active: false, timer: 0, next: rnd(20, 30), windAngle: 0, windForce: 0, gustPhase: 0, rockSpawnTimer: 0 };

  if (giftItem) removeGift();
  giftCooldown = rnd(8, 14); // premier cadeau garanti au bout de quelques secondes
  buffs = { speed: 0, multi: 0, slow: 0, invincible: 0 };

  // État de vol/effets annexes remis à neuf
  stallMode = false; stallTimer = 0;
  skimTimer = 0; skimActive = false;
  trailAccum = 0; comboFxAccum = 0;
  hitStopTimer = 0;
  camera.fov = 70; camera.updateProjectionMatrix();

  // Météo remise au clair (le niveau retombe en fondu via updateWeatherFX)
  weather.mode = 'clear'; weather.timer = 0; weather.next = rnd(RAIN_NEXT[0], RAIN_NEXT[1]);
  lightningFlash = 0; lightningTimer = rnd(3, 7);
  for (const d of precipData) anchorDrop(d, false); // les gouttes suivent le hibou au point de départ
}

// ══════════════════════════════════════════════════
//  BOUCLE PRINCIPALE
// ══════════════════════════════════════════════════
const clock = new THREE.Clock();

function update() {
  const rawDt = Math.min(clock.getDelta(), 0.05);
  updateAdaptiveQuality(rawDt);
  // Ralenti d'impact : le temps du jeu se dilate un court instant sur les gros chocs
  if (hitStopTimer > 0) hitStopTimer -= rawDt;
  const dt = hitStopTimer > 0 ? rawDt * hitStopScale : rawDt;

  if (screenShake > 0) { screenShake *= 0.9; if (screenShake < 0.5) screenShake = 0; }
  if (hitFlash    > 0) { hitFlash    *= 0.85; if (hitFlash < 0.01) hitFlash = 0; }
  if (screenFade  > 0) screenFade = Math.max(0, screenFade - rawDt / 0.7); // fondu au noir des transitions de campagne

  if (state === S.PLAY) {
    roundTime += dt;
    if (owlInvul > 0) owlInvul--;
    if (treeCooldown > 0) treeCooldown--;
    rockInvul = Math.max(0, rockInvul - dt);
    buffs.speed      = Math.max(0, buffs.speed      - dt);
    buffs.multi      = Math.max(0, buffs.multi      - dt);
    buffs.slow       = Math.max(0, buffs.slow       - dt);
    buffs.invincible = Math.max(0, buffs.invincible - dt);
    if (!multiplayerMode) {
      updateMoon(dt);
      updateStorm(dt);
      updateWeatherLogic(dt);
      updateRocks(dt);
    }
    const speedRatio = updateFlight(dt);
    updateFlap(dt, speedRatio);
    updateBoostTrail(dt);
    updateComboCascade(dt);
    if (multiplayerMode) {
      // Multijoueur : canon/balles/caisses remplacent branches/ours/cadeau/rase-mottes
      updateMPFire(dt);
      if (vsBotMode) updateBot(dt);
      updateBullets(dt);
      updateAmmoCrates();
      updateHealKits();
      updateDamageSystems(dt);
      updateSmokeTrail(dt);
    } else {
      updateSkim(dt);
      updateBranches();
      updateBears(dt);
      updateGift(dt);
    }
    if (campaignCtx) updateCampaignLogic(dt); // objectifs/chrono du niveau de campagne (les deux types)
    updateBoundaryGrid();
    updateCameraClip();
    // FOV dynamique : le champ s'élargit avec la vitesse — la sensation de vitesse est exagérée
    const targetFov = 70 + speedRatio * speedRatio * 14 + (buffs.speed > 0 ? 5 : 0);
    camera.fov += (targetFov - camera.fov) * Math.min(1, 6 * dt);
    camera.updateProjectionMatrix();
    owlGroup.visible = !(owlInvul > 0 && Math.floor(Date.now() / 80) % 2 !== 0);
  } else if (state === S.LOOT) {
    mouseDX = 0; mouseDY = 0;
    boundaryGrid.visible = false;
    updateLootbox(dt);
  } else if (state === S.MP_DEAD) {
    mouseDX = 0; mouseDY = 0;
    boundaryGrid.visible = false;
    if (vsBotMode) updateBot(dt); // le bot continue de voler/patrouiller pendant que le joueur est mort
    updateBullets(dt); // les balles en vol finissent leur course pendant l'écran de mort
    mpRespawnTimer -= dt;
    if (mpRespawnTimer <= 0) doMPRespawn();
  } else if (state === S.CUTSCENE) {
    mouseDX = 0; mouseDY = 0;
    boundaryGrid.visible = false;
    updateCutscene(dt);
  } else {
    mouseDX = 0; mouseDY = 0;
    boundaryGrid.visible = false;
    if (state === S.CAMPAIGN_SELECT && mapAnim) { // vol du hibou vers le niveau débloqué
      mapAnim.t += dt / 1.6;
      if (mapAnim.t >= 1) mapAnim = null;
    }
  }
  // Réseau multijoueur : interpolation des hiboux distants + envoi de l'état
  // local — tourne aussi en salon, en pause et sur l'écran de mort.
  if (mp && multiplayerMode) mp.update(dt);
  updateMoonVisual(dt);
  updateDayNightCycle(dt); // après updateMoonVisual (mesh lune), avant updateWeatherFX (fixe moonLight/ambientLight/FOG_CLEAR)
  updateWeatherFX(dt);
  // Sur mobile, on gèle étoiles/nuages sur les écrans vraiment inactifs (titre/pause/lobby)
  // pour économiser du CPU — mais pas en LOOT/OVER/MP_DEAD où d'autres animations doivent finir.
  const mobileIdle = isMobile && (state === S.START || state === S.PAUSED || state === S.MP_LOBBY);
  if (!mobileIdle) updateStars(dt);
  if (!mobileIdle) updateClouds(dt);
  if (!mobileIdle) updateWater(dt);
  if (!mobileIdle) updateCampfireLights();
  updateParticles();
  updateFX3D(dt);      // les gerbes 3D finissent de retomber même en pause/game over
}

function render() {
  renderer.render(scene, camera);
  drawOverlay();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// ── Boot : écran de chargement pendant le fetch des GLB, puis construction du monde ──
function drawLoading() {
  hctx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
  hctx.save();
  hctx.fillStyle = '#04040e';
  hctx.fillRect(0, 0, hudCanvas.width, hudCanvas.height);
  hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
  hctx.font = '54px serif';
  hctx.fillText('🦉', hudCanvas.width / 2, hudCanvas.height / 2 - 50);
  hctx.fillStyle = '#cbc3ff'; hctx.font = 'bold 18px VT323,monospace';
  hctx.fillText('Chargement des modèles 3D…', hudCanvas.width / 2, hudCanvas.height / 2 - 6);
  const barW = 220, barH = 10;
  const barX = hudCanvas.width / 2 - barW / 2, barY = hudCanvas.height / 2 + 20;
  hctx.strokeStyle = 'rgba(180,170,255,0.6)'; hctx.lineWidth = 2;
  hctx.strokeRect(barX, barY, barW, barH);
  hctx.fillStyle = 'rgba(180,170,255,0.9)';
  hctx.fillRect(barX, barY, barW * Math.max(0.03, loadProgress), barH);
  hctx.fillStyle = '#9b93cc'; hctx.font = '12px VT323,monospace';
  hctx.fillText(Math.round(loadProgress * 100) + ' %', hudCanvas.width / 2, barY + 26);
  hctx.restore();
}

// Boucle légère active pendant loadAssets() : sans elle, drawLoading() n'est
// dessiné qu'une fois et l'écran semble figé pendant tout le téléchargement
// (~12 Mo de modèles) alors que rien n'est cassé — juste aucun retour visuel.
function bootLoop() {
  if (assetsReady) return;
  drawLoading();
  requestAnimationFrame(bootLoop);
}

// Sonde de debug/test (lecture seule) : état du jeu inspectable depuis la console.
window.__hibouDebug = () => ({
  state, score, lives, assetsReady,
  multiplayerMode, mpAmmo, life, governEff: { ...governEff }, inventory: [...inventory],
  mpRespawnTimer: Math.round(mpRespawnTimer * 10) / 10,
  bullets: bullets.length, ammoCrates: ammoCrates.length,
  mpInRoom: mp ? mp.inRoom() : false,
  mpRemotes: mp ? mp.remotesList().length : 0,
  devEsp: devEspEnabled,
  pos: owlGroup.position.toArray().map(v => Math.round(v * 10) / 10),
  groundY: Math.round(effectiveGroundY(owlGroup.position.x, owlGroup.position.z) * 10) / 10,
  speed: Math.round(speed * 10) / 10,
  stall: stallMode,
  skim: skimActive,
  trees: treeColliders.length,
  bears: bears.length,
  bearModes: bears.map(b => b.mode),
  rocks: rocks.length,
  weather: weather.mode,
  weatherLevel: Math.round(weather.level * 100) / 100,
  pixelScale,
  branches: branches.length,
  nearestBranch: branches.length
    ? Math.round(Math.min(...branches.map(b => b.sprite.position.distanceTo(owlGroup.position))))
    : null,
  gift: giftItem ? Math.round(giftItem.sprite.position.distanceTo(owlGroup.position)) : null,
  giftCooldown: Math.round(giftCooldown * 10) / 10,
  clouds: cloudSets.reduce((n, s) => n + s.data.length, 0),
  usingModels: {
    owl: !!models.owl, bear: !!models.bear, moon: !!models.moon,
    trees: !!(models.pine1 || models.pine2 || models.birch || models.tree1),
    mountains: !!(models.mountains || models.mountainGroup),
    clouds: !!(models.cloud1 || models.cloud2 || models.cloud3),
    watchtower: !!models.watchtower
  }
});

resize();
bootLoop();
loadAssets().then(() => {
  makeSky();
  makeTerrain();
  makeMountainScenery();
  makeClouds();
  makeTrees();
  makeBuildings();
  initCampfireLightPool();
  setupOwlVisual();
  setupBearProto();
  makeBoundaryGrid();
  makeFX3D();
  makeWeather();

  // Multijoueur : le module réseau reçoit via `hooks` les seules références du
  // jeu dont il a besoin (tout l'état vit dans la closure __hibouStart).
  mp = initMultiplayer({
    THREE, scene,
    hudCanvas, hctx, rrect, drawTargetIndicator,
    makeRemoteOwlVisual, makeAuraSprite,
    getMyState: () => ({
      pos: owlGroup.position, quat: owlGroup.quaternion, vel: velocity,
      alive: state !== S.MP_DEAD,
      dmg: [governEff.leftWing, governEff.rightWing, governEff.tail],
    }),
    onJoined: (color) => beginMultiplayerGame(color),
    onLeftRoom: onMPLeftRoom,
    onHitMe: (location, shooterId) => onMPHitMe(location, shooterId),
    onAmmo: (n) => { mpAmmo = n; },
    onKill: (killerId) => { if (mp && killerId === mp.myId()) onLocalKillConfirmed(); },
    onRemoteFire: onMPRemoteFire,
    spawnFX,
  });

  assetsReady = true;
  loop();
});
</script>
