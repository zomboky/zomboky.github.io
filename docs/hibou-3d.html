};
const models = {};
const modelClips = {}; // clips d'animation (le cas échéant) du .glb, indexés comme MODEL_URLS
let assetsReady = false;

async function loadAssets() {
  const loader = new GLTFLoader();
  const entries = Object.entries(MODEL_URLS);
  const results = await Promise.allSettled(entries.map(([, url]) => loader.loadAsync(url)));
  results.forEach((res, i) => {
    if (res.status === 'fulfilled') {
      models[entries[i][0]] = res.value.scene;
      if (res.value.animations && res.value.animations.length) modelClips[entries[i][0]] = res.value.animations;
    } else {
      console.warn('Modèle 3D indisponible (repli procédural) :', entries[i][0], res.reason);
    }
  });
}

// Enveloppe un modèle dans un Group normalisé : recentré en XZ, posé au sol (ou centré),
// mis à l'échelle pour atteindre la hauteur/longueur cible, avec lacet optionnel.
// Le Group extérieur reste « neutre » : l'appelant peut le scaler/tourner librement.
function normalizeModel(root, { height, length, width, groundAlign = true, yaw = 0 } = {}) {
  const wrapper = new THREE.Group();
  const spin = new THREE.Group();
  const inner = new THREE.Group();
  spin.rotation.y = yaw;
  inner.add(root);
  spin.add(inner);
  wrapper.add(spin);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  let s = 1;
  if (height) s = height / (size.y || 1);
  else if (length) s = length / (size.z || 1);
  else if (width) s = width / (size.x || 1);
  inner.scale.setScalar(s);
  inner.position.set(-center.x * s, groundAlign ? -box.min.y * s : -center.y * s, -center.z * s);
  return wrapper;
}

// Extrait les couples {géométrie, matériau, matrice locale} d'un modèle pour l'instancing.
function collectMeshParts(root) {
  root.updateMatrixWorld(true);
  const parts = [];
  root.traverse(o => {
    if (o.isMesh) parts.push({ geo: o.geometry, mat: o.material, matrix: o.matrixWorld.clone() });
  });
  return parts;
}

// Construit des InstancedMesh à partir d'un modèle et d'une liste de matrices d'instance.
// frustumCulled=false : les instances sont dispersées sur toute la carte, la sphère
// englobante de la géométrie seule ferait disparaître des arbres en bord d'écran.
function makeInstancedFromModel(root, matrices) {
  const parts = collectMeshParts(root);
  const group = new THREE.Group();
  const tmpM = new THREE.Matrix4();
  for (const part of parts) {
    const im = new THREE.InstancedMesh(part.geo, part.mat, matrices.length);
    for (let i = 0; i < matrices.length; i++) {
      tmpM.multiplyMatrices(matrices[i], part.matrix);
      im.setMatrixAt(i, tmpM);
    }
    im.instanceMatrix.needsUpdate = true;
    im.frustumCulled = false;
    im.userData.partMatrix = part.matrix.clone(); // conservé pour les mises à jour dynamiques (nuages)
    group.add(im);
  }
  return group;
}

// ══════════════════════════════════════════════════
//  TERRAIN PROCÉDURAL — bruit de valeur fBm + pics gaussiens (montagnes),
//  lacs sous WATER_Y, forêts par masque de bruit, neige en altitude.
//  terrainHeight(x,z) est ANALYTIQUE : la même fonction sert au maillage
//  ET aux collisions/placements — aucun échantillonnage de grille.
// ══════════════════════════════════════════════════
const TERRAIN_SIZE = 4500;  // x5 : couvre la nouvelle zone de jeu élargie (ARENA_RADIUS_XZ)
const TERRAIN_SEGS = 160;
const WATER_Y      = -3.0;  // niveau des lacs
const HILL_AMP     = 24;    // amplitude des collines fBm (±) — terrain nettement plus vallonné
const GROUND_DETAIL_AMP = 5.5; // bosses fines superposées, visibles même loin des montagnes/lacs
const SNOW_LINE    = 46;    // altitude d'enneigement
const TREE_LINE    = 38;    // au-dessus : plus d'arbres

// ── Muraille de montagnes : l'arène est cernée d'une vraie chaîne de sommets ──
// Le terrain se soulève à l'approche du bord et culmine au-delà du mur invisible :
// la limite de jeu N'EST PLUS une grille abstraite, c'est la montagne elle-même.
const RING_START = ARENA_RADIUS_XZ * 0.86; // le sol commence à se soulever ici
const RING_FULL  = ARENA_RADIUS_XZ * 1.18; // altitude de crête atteinte ici
const RING_BASE  = 240;                    // hauteur minimale de la muraille
const RING_VAR   = 260;                    // relief supplémentaire des sommets (bruit)

const terrainSeed = Math.random() * 1000;

function hashNoise(ix, iz) {
  const n = Math.sin(ix * 127.1 + iz * 311.7 + terrainSeed * 17.3) * 43758.5453;
  return n - Math.floor(n);
}
function valueNoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
  const a = hashNoise(ix, iz),     b = hashNoise(ix + 1, iz);
  const c = hashNoise(ix, iz + 1), d = hashNoise(ix + 1, iz + 1);
  return a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz;
}
function fbm(x, z, octaves = 4) {
  let sum = 0, amp = 0.5, freq = 1;
  for (let o = 0; o < octaves; o++) {
    sum += amp * valueNoise(x * freq, z * freq);
    amp *= 0.5; freq *= 2.03;
  }
  return sum; // ~[0,1]
}

// Pics montagneux : bosses gaussiennes semées à l'intérieur de l'arène (jamais au centre).
// Nombre, position, hauteur et rayon tirés au hasard à chaque run — désormais répartis
// sur TOUTE l'arène élargie (l'ancien semis 90..270 laissait 90 % de la carte plate).
const mountainPeaks = [];
{
  const peakCount = Math.floor(rnd(10, 15));
  for (let i = 0; i < peakCount; i++) {
    const angle = (i / peakCount) * Math.PI * 2 + rnd(-0.5, 0.5);
    const dist = rnd(140, ARENA_RADIUS_XZ * 0.72);
    mountainPeaks.push({
      x: Math.cos(angle) * dist,
      z: Math.sin(angle) * dist,
      h: rnd(35, 105),
      r: rnd(55, 165)
    });
  }
}

function terrainHeight(x, z) {
  // Collines fBm recentrées sur ±HILL_AMP (les creux sous WATER_Y deviennent des lacs)
  let h = (fbm(x * 0.008, z * 0.008) * 2 - 1) * HILL_AMP;
  // Relief fin superposé (fréquence plus haute) : bosses au sol même loin des montagnes/lacs
  h += (fbm(x * 0.035, z * 0.035, 3) * 2 - 1) * GROUND_DETAIL_AMP;
  // Montagnes gaussiennes
  for (const p of mountainPeaks) {
    const dx = x - p.x, dz = z - p.z;
    h += p.h * Math.exp(-(dx * dx + dz * dz) / (p.r * p.r));
  }
  const d = Math.hypot(x, z);
  // Muraille de montagnes fermant l'arène : cols et sommets variés (bruit basse
  // fréquence) + arêtes découpées (bruit haute fréquence). Comme terrainHeight est
  // aussi la fonction de collision, ces pentes sont de VRAIS obstacles.
  const ringT = THREE.MathUtils.smoothstep(d, RING_START, RING_FULL);
  if (ringT > 0) {
    const ridge = fbm(x * 0.0016 + 31.4, z * 0.0016 - 12.9, 3); // grands cols et sommets
    const crag  = fbm(x * 0.008 - 5.1,  z * 0.008 + 44.2, 3);   // arêtes déchiquetées
    h += ringT * (RING_BASE + ridge * RING_VAR + crag * 90);
  }
  // Zone de départ aplanie (rayon ~25 autour du centre, fondu jusqu'à 80)
  const flat = THREE.MathUtils.smoothstep(d, 25, 80);
  return h * flat;
}

// Sol « effectif » pour les collisions/spawns : le terrain, ou la surface de l'eau.
function effectiveGroundY(x, z) {
  return Math.max(terrainHeight(x, z), WATER_Y);
}

// Masque de forêt : bruit séparé, décalé pour être indépendant du relief.
function forestDensity(x, z) {
  return fbm(x * 0.006 + 57.3, z * 0.006 - 91.7, 3);
}

function makeTerrain() {
  const geo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEGS, TERRAIN_SEGS);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setY(i, terrainHeight(pos.getX(i), pos.getZ(i)));
  }
  // Non-indexé + couleur PAR FACE = facettes franches, look low-poly assumé.
  const flat = geo.toNonIndexed();
  flat.computeVertexNormals();
  const fpos = flat.attributes.position;
  const fnorm = flat.attributes.normal;
  const colors = new Float32Array(fpos.count * 3);
  const c = new THREE.Color();
  const grassA = new THREE.Color(0x16321f), grassB = new THREE.Color(0x1e422a);
  const sand   = new THREE.Color(0x4a4632), bed   = new THREE.Color(0x1c2822);
  const rock   = new THREE.Color(0x3a3f46), snow  = new THREE.Color(0x9aa4b8);
  for (let f = 0; f < fpos.count; f += 3) {
    const hAvg = (fpos.getY(f) + fpos.getY(f + 1) + fpos.getY(f + 2)) / 3;
    const nY   = (fnorm.getY(f) + fnorm.getY(f + 1) + fnorm.getY(f + 2)) / 3;
    if (hAvg < WATER_Y - 0.5)       c.copy(bed);
    else if (hAvg < WATER_Y + 1.2)  c.copy(sand);
    else if (hAvg > SNOW_LINE)      c.copy(snow);
    else if (nY < 0.62 || hAvg > TREE_LINE) c.copy(rock);
    else c.lerpColors(grassA, grassB, valueNoise(fpos.getX(f) * 0.05, fpos.getZ(f) * 0.05));
    c.multiplyScalar(rnd(0.92, 1.08)); // léger tramage par facette
    for (let v = 0; v < 3; v++) {
      colors[(f + v) * 3] = c.r; colors[(f + v) * 3 + 1] = c.g; colors[(f + v) * 3 + 2] = c.b;
    }
  }
  flat.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mesh = new THREE.Mesh(flat, new THREE.MeshStandardMaterial({
    vertexColors: true, flatShading: true, roughness: 1
  }));
  scene.add(mesh);

  // Lacs : un seul plan d'eau sous tout le terrain, visible dans les creux.
  const water = new THREE.Mesh(
    new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE),
    new THREE.MeshStandardMaterial({
      color: 0x16305a, roughness: 0.15, metalness: 0.25,
      transparent: true, opacity: 0.92
    })
  );
  water.rotation.x = -Math.PI / 2;
  water.position.y = WATER_Y;
  scene.add(water);
}

// Chaînes de montagnes GLB plantées SUR la muraille procédurale : elles ajoutent
// des silhouettes déchiquetées crédibles par-dessus l'anneau de terrain, tout
// autour de l'arène (purement décoratives — la collision, c'est le terrain).
function makeMountainScenery() {
  const protos = [models.mountains, models.mountainGroup].filter(Boolean);
  if (!protos.length) return; // le terrain a déjà sa muraille, pas de repli nécessaire
  const matrices = [[], []];
  const dummy = new THREE.Object3D();
  const ringCount = 22;
  for (let i = 0; i < ringCount; i++) {
    const angle = (i / ringCount) * Math.PI * 2 + rnd(-0.14, 0.14);
    const dist = rnd(ARENA_RADIUS_XZ * 0.98, ARENA_RADIUS_XZ * 1.3); // à cheval sur la crête
    const x = Math.cos(angle) * dist, z = Math.sin(angle) * dist;
    dummy.position.set(x, terrainHeight(x, z) - 18, z); // enraciné dans la pente
    dummy.rotation.set(0, rnd(0, Math.PI * 2), 0);
    dummy.scale.setScalar(rnd(1.3, 2.6));
    dummy.updateMatrix();
    matrices[i % protos.length].push(dummy.matrix.clone());
  }
  protos.forEach((proto, i) => {
    if (!matrices[i].length) return;
    const norm = normalizeModel(proto.clone(true), { height: 150, groundAlign: true });
    scene.add(makeInstancedFromModel(norm, matrices[i]));
  });
}

// ══════════════════════════════════════════════════
//  NUAGES LOW-POLY — instanciés, dérive lente, recyclés en bord de carte.
// ══════════════════════════════════════════════════
const CLOUD_COUNT  = 64;                        // couvre l'arène élargie (l'ancien semis ±380 laissait le ciel vide au loin)
const CLOUD_SPREAD = ARENA_RADIUS_XZ * 0.85;    // zone de semis
const CLOUD_WRAP   = ARENA_RADIUS_XZ * 0.92;    // bord de recyclage de la dérive
let cloudSets = []; // { group, data:[{pos, scale, rotY, speed}], parts }

function makeClouds() {
  const protos = [models.cloud1, models.cloud2, models.cloud3].filter(Boolean);
  if (!protos.length) return; // pas de repli : les nuages sont purement décoratifs
  const perType = Math.ceil(CLOUD_COUNT / protos.length);
  const dummy = new THREE.Object3D();
  for (const proto of protos) {
    const norm = normalizeModel(proto.clone(true), { height: 6, groundAlign: false });
    const data = [];
    const matrices = [];
    for (let i = 0; i < perType; i++) {
      const d = {
        pos: new THREE.Vector3(rnd(-CLOUD_SPREAD, CLOUD_SPREAD), rnd(95, 240), rnd(-CLOUD_SPREAD, CLOUD_SPREAD)),
        scale: rnd(2.4, 6.5),
        rotY: rnd(0, Math.PI * 2),
        speed: rnd(1.2, 3.2)
      };
      data.push(d);
      dummy.position.copy(d.pos);
      dummy.rotation.set(0, d.rotY, 0);
      dummy.scale.setScalar(d.scale);
      dummy.updateMatrix();
      matrices.push(dummy.matrix.clone());
    }
    const group = makeInstancedFromModel(norm, matrices);
    scene.add(group);
    cloudSets.push({ group, data });
  }
}

const _cloudDummy = new THREE.Object3D();
const _cloudTmpM = new THREE.Matrix4();
function updateClouds(dt) {
  const windX = storm.active ? Math.cos(storm.windAngle) * storm.windForce * 6 : 1;
  const windZ = storm.active ? Math.sin(storm.windAngle) * storm.windForce * 6 : 0.3;
  for (const set of cloudSets) {
    for (let i = 0; i < set.data.length; i++) {
      const d = set.data[i];
      d.pos.x += windX * d.speed * dt;
      d.pos.z += windZ * d.speed * dt;
      if (d.pos.x >  CLOUD_WRAP) d.pos.x = -CLOUD_WRAP; if (d.pos.x < -CLOUD_WRAP) d.pos.x = CLOUD_WRAP;
      if (d.pos.z >  CLOUD_WRAP) d.pos.z = -CLOUD_WRAP; if (d.pos.z < -CLOUD_WRAP) d.pos.z = CLOUD_WRAP;
      _cloudDummy.position.copy(d.pos);
      _cloudDummy.rotation.set(0, d.rotY, 0);
      _cloudDummy.scale.setScalar(d.scale);
      _cloudDummy.updateMatrix();
      for (const im of set.group.children) {
        _cloudTmpM.multiplyMatrices(_cloudDummy.matrix, im.userData.partMatrix);
        im.setMatrixAt(i, _cloudTmpM);
      }
    }
    for (const im of set.group.children) im.instanceMatrix.needsUpdate = true;
  }
}

// ══════════════════════════════════════════════════
//  PLEINE LUNE / LUNE DE SANG — événements périodiques de survie (calqués sur hibou-et-nid)
//  Debug : maintenir L force une pleine lune, K force une lune de sang.
// ══════════════════════════════════════════════════
const MOON_DURATION       = 10;  // secondes (pleine lune)
const BLOOD_MOON_DURATION = 15;  // secondes (lune de sang : plus longue, plus intense)
const BLOOD_MOON_CHANCE   = 0.1; // même probabilité que le jeu 2D
const MOON_WARN_TIME = 2;    // secondes de "remplissage" avant déclenchement
let moon = { state: 'none', timer: 0, next: 15, fillProgress: 0 };

function activateFullMoon(forceBlood) {
  const isBlood = forceBlood !== undefined ? forceBlood : Math.random() < BLOOD_MOON_CHANCE;
  moon.state = isBlood ? 'blood' : 'full';
  moon.fillProgress = 1;
  moon.timer = isBlood ? BLOOD_MOON_DURATION : MOON_DURATION;
  screenShake = Math.max(screenShake, isBlood ? 28 : 20);
  spawnFX(owlGroup.position, isBlood ? 40 : 30, isBlood ? 'death' : 'collect', isBlood ? '🩸 LUNE DE SANG !' : '🌕 PLEINE LUNE !');
  while (bears.length < bearTarget()) bears.push(newBear());
}
function deactivateFullMoon() {
  moon.state = 'none';
  moon.fillProgress = 0;
  moon.next = rnd(20, 30);
  screenShake = Math.max(screenShake, 10);
}
function updateMoon(dt) {
  if (storm.active) return; // exclusion mutuelle avec la tempête (même comportement que le jeu 2D)
  const forceFull  = keys['l'];
  const forceBlood = keys['k'];
  if (forceFull || forceBlood) {
    const wantState = forceBlood ? 'blood' : 'full';
    if (moon.state !== wantState) activateFullMoon(forceBlood);
    moon.timer = moon.state === 'blood' ? BLOOD_MOON_DURATION : MOON_DURATION;
    moon.fillProgress = 1;
    return;
  }
  if (moon.state === 'none') {
    moon.next -= dt;
    if (moon.next <= MOON_WARN_TIME && moon.fillProgress < 1) {
      moon.fillProgress = Math.min(1, moon.fillProgress + dt / MOON_WARN_TIME);
    }
    if (moon.next <= 0) activateFullMoon();
  } else {
    moon.timer -= dt;
    if (moon.timer <= 0) deactivateFullMoon();
  }
}
// Sphère 3D : les phases se traduisent par une échelle, une couleur et une intensité
// d'émission — plus de redessin de texture, la géométrie tourne lentement sur elle-même.
function updateMoonVisual(dt) {
  const t = moon.fillProgress;
  const isBlood = moon.state === 'blood';

  moonMesh.scale.setScalar(THREE.MathUtils.lerp(1, MOON_FULL_SCALE, t));
  moonMesh.rotation.y += dt * 0.015;

  for (const mat of moonMaterials) {
    mat.emissive.lerpColors(MOON_COLOR_NORMAL, MOON_COLOR_BLOOD, isBlood ? t : 0);
    mat.emissiveIntensity = THREE.MathUtils.lerp(MOON_BASE_LIGHT, MOON_FULL_LIGHT, t);
  }

  moonLight.intensity = THREE.MathUtils.lerp(MOON_BASE_LIGHT, MOON_FULL_LIGHT, t);
  moonLight.color.lerp(new THREE.Color(isBlood ? 0xff5a5a : 0xccccff), 0.05);
  ambientLight.color.lerp(new THREE.Color(isBlood ? 0xff6666 : 0x8899ff), 0.05);
}

// Chaque étoile clignote indépendamment (alpha s.a oscillant entre 0.05 et 1
// à sa propre vitesse s.da, rebond aux bornes — même logique que le jeu 2D).
function updateStars(dt) {
  if (!starGeo) return;
  const colorAttr = starGeo.attributes.color;
  for (let i = 0; i < starPhases.length; i++) {
    const ph = starPhases[i];
    ph.a += ph.da;
    if (ph.a > 1 || ph.a < 0.05) { ph.da *= -1; ph.a = THREE.MathUtils.clamp(ph.a, 0.05, 1); }
    colorAttr.array[i * 3]     = starBaseColors[i * 3]     * ph.a;
    colorAttr.array[i * 3 + 1] = starBaseColors[i * 3 + 1] * ph.a;
    colorAttr.array[i * 3 + 2] = starBaseColors[i * 3 + 2] * ph.a;
  }
  colorAttr.needsUpdate = true;
}

// ══════════════════════════════════════════════════
//  TEMPÊTE — événement périodique de vent (calqué sur hibou-et-nid, adapté en secondes)
//  Exclusion mutuelle avec la pleine lune : ne se déclenche jamais si moon.state !== 'none'.
//  Debug : maintenir T force l'activation immédiate.
// ══════════════════════════════════════════════════
const STORM_DURATION = 20;   // secondes (≈1200 frames à 60fps dans le jeu 2D)
let storm = { active: false, timer: 0, next: rnd(20, 30), windAngle: 0, windForce: 0, gustPhase: 0, rockSpawnTimer: 0 };

function activateStorm() {
  storm.active    = true;
  storm.timer     = STORM_DURATION;
  storm.windAngle = rnd(0, Math.PI * 2);
  storm.gustPhase = 0;
  storm.windForce = 0.6;
  storm.rockSpawnTimer = 0.6;
  screenShake = Math.max(screenShake, 14);
  spawnFX(owlGroup.position, 20, 'death', '🌬️ TEMPÊTE !');
}
function deactivateStorm() {
  storm.active    = false;
  storm.windForce = 0;
  storm.next      = rnd(30, 60);
  screenShake = Math.max(screenShake, 8);
  for (let i = rocks.length - 1; i >= 0; i--) removeRock(i);
}
function updateStorm(dt) {
  const forced = keys['t'];
  if (forced) {
    if (moon.state !== 'none') return; // jamais en même temps qu'une pleine lune ou une lune de sang
    if (!storm.active) activateStorm();
    storm.timer = STORM_DURATION;
  } else if (!storm.active) {
    if (moon.state === 'none') {
      storm.next -= dt;
      if (storm.next <= 0) activateStorm();
    }
    return;
  }

  // ── Rafales : force pulsée (sin) + dérive lente de la direction ──
  storm.gustPhase += 0.045 * 60 * dt;
  const gust = 0.5 + 0.5 * Math.sin(storm.gustPhase);
  storm.windForce  = 0.6 + gust * 1.8;
  storm.windAngle += Math.sin(storm.gustPhase * 0.3) * 0.01 * 60 * dt;

  // ── Rochers : danger réel de la tempête (calqué sur newRock/updateRocks du jeu 2D) ──
  storm.rockSpawnTimer -= dt;
  if (storm.rockSpawnTimer <= 0 && rocks.length < ROCK_MAX) {
    rocks.push(newRock());
    storm.rockSpawnTimer = rnd(0.35, 0.75); // pluie de cailloux dense autour du joueur
  }

  if (!forced) {
    storm.timer -= dt;
    if (storm.timer <= 0) deactivateStorm();
  }
}

// ══════════════════════════════════════════════════
//  ROCHERS DE TEMPÊTE — de VRAIS cailloux low-poly (icosaèdres taillés au bruit,
//  comme le 🪨 du jeu 2D) qui tombent AUTOUR ET DEVANT le joueur, accélèrent en
//  chute, sont emportés par le vent et soulèvent la poussière à l'impact.
//  Au contact du hibou : punition de score + plaqué vers le sol.
// ══════════════════════════════════════════════════
let rocks = [];
const ROCK_RADIUS = 1.1;
const ROCK_MAX    = 26;

// 4 variantes de géométrie « taillées » une fois pour toutes : sommets perturbés
// par un bruit fonction de leur POSITION (les sommets partagés bougent ensemble).
const rockGeos = [];
for (let vIdx = 0; vIdx < 4; vIdx++) {
  const g = new THREE.IcosahedronGeometry(1, 1);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const vx = p.getX(i), vy = p.getY(i), vz = p.getZ(i);
    const n = 0.72 + 0.5 * valueNoise(vx * 2.1 + vIdx * 37.7, vy * 2.3 + vz * 1.7);
    p.setXYZ(i, vx * n, vy * n * 0.85, vz * n); // légèrement aplati : galet plutôt que boule
  }
  g.computeVertexNormals();
  rockGeos.push(g);
}
const rockMats = [
  new THREE.MeshStandardMaterial({ color: 0x5b544c, roughness: 1, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0x4a423a, roughness: 1, flatShading: true })
];

function newRock() {
  // Colonne de chute centrée un peu EN AVANT du hibou (l'ancienne version semait
  // sur toute l'arène élargie : on ne voyait jamais tomber un seul caillou).
  const lead = rnd(0.8, 3.2);
  const x = owlGroup.position.x + velocity.x * lead + rnd(-70, 70);
  const z = owlGroup.position.z + velocity.z * lead + rnd(-70, 70);
  const scale = rnd(0.9, 2.3);
  const mesh = new THREE.Mesh(
    rockGeos[Math.floor(Math.random() * rockGeos.length)],
    rockMats[Math.floor(Math.random() * rockMats.length)]
  );
  mesh.position.set(x, Math.min(ARENA_CENTER.y + ARENA_RADIUS_Y * 0.95, owlGroup.position.y + rnd(55, 110)), z);
  mesh.scale.setScalar(scale);
  mesh.rotation.set(rnd(0, Math.PI * 2), rnd(0, Math.PI * 2), rnd(0, Math.PI * 2));
  scene.add(mesh);
  return {
    mesh, scale,
    vy: rnd(16, 24),
    rotSpeed: new THREE.Vector3(rnd(-2.5, 2.5), rnd(-2.5, 2.5), rnd(-2.5, 2.5))
  };
}
function removeRock(i) {
  scene.remove(rocks[i].mesh);
  rocks.splice(i, 1);
}
function updateRocks(dt) {
  for (let i = rocks.length - 1; i >= 0; i--) {
    const rk = rocks[i];
    rk.vy = Math.min(rk.vy + 14 * dt, 46); // la chute accélère (jusqu'à une vitesse terminale)
    rk.mesh.position.y -= rk.vy * dt;
    if (storm.active) {
      rk.mesh.position.x += Math.cos(storm.windAngle) * storm.windForce * 3.5 * dt;
      rk.mesh.position.z += Math.sin(storm.windAngle) * storm.windForce * 3.5 * dt;
    }
    rk.mesh.rotation.x += rk.rotSpeed.x * dt;
    rk.mesh.rotation.y += rk.rotSpeed.y * dt;
    rk.mesh.rotation.z += rk.rotSpeed.z * dt;

    // Impact au sol : gerbe de poussière (+ secousse si proche), puis disparition
    if (rk.mesh.position.y - rk.scale * 0.4 < effectiveGroundY(rk.mesh.position.x, rk.mesh.position.z)) {
      spawnFX3D(rk.mesh.position, 8 + Math.floor(rk.scale * 4), 'dust');
      if (rk.mesh.position.distanceTo(owlGroup.position) < 40) screenShake = Math.max(screenShake, 5);
      removeRock(i);
      continue;
    }

    if (rockInvul <= 0 && buffs.invincible <= 0 &&
        owlGroup.position.distanceTo(rk.mesh.position) < (ROCK_RADIUS * rk.scale + OWL_COLLIDE_RADIUS + 0.6)) {
      score = Math.max(0, score - 20);
      rockInvul = 0.35;
      velocity.y -= 7; // le choc rabat le hibou vers le sol
      screenShake = Math.max(screenShake, 12);
      hitFlash    = Math.max(hitFlash, 0.4);
      spawnFX(rk.mesh.position, 10, 'death', '-20');
      spawnFX3D(rk.mesh.position, 12, 'burst');
      removeRock(i);
    }
  }
}

// ══════════════════════════════════════════════════
//  FORÊTS — modèles GLB instanciés (pins, bouleau, feuillu), placés sur le terrain
//  par masque de bruit : denses dans les vallées, absents au-dessus de TREE_LINE,
//  jamais dans les lacs ni sur les pentes raides. Repli : cône+cylindre procédural.
// ══════════════════════════════════════════════════
let treeColliders = [];
const TREE_COUNT  = 3000;                        // forêt étendue à TOUTE l'arène (avant : rayon 340 seulement)
const TREE_SPREAD = ARENA_RADIUS_XZ * 0.84;      // s'arrête avant les pentes de la muraille

// Repli si un modèle d'arbre manque : silhouette cône+cylindre équivalente.
function makeFallbackTree(leafHex, trunkHex) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.22, 0.4, 3, 6),
    new THREE.MeshStandardMaterial({ color: trunkHex, roughness: 1 })
  );
  trunk.position.y = 1.5;
  const leaf = new THREE.Mesh(
    new THREE.ConeGeometry(2, 5.5, 7),
    new THREE.MeshStandardMaterial({ color: leafHex, roughness: 1 })
  );
  leaf.position.y = 5.5;
  g.add(trunk, leaf);
  return g;
}

function makeTrees() {
  treeColliders = [];
  // Types d'arbres : proto normalisé (hauteur ~9) + gabarit de collision relatif (0..1 de la hauteur).
  const types = [
    { proto: models.pine1, weight: 0.38, fallback: () => makeFallbackTree(0x1a3a17, 0x47301c) },
    { proto: models.pine2, weight: 0.30, fallback: () => makeFallbackTree(0x16331a, 0x3f2b19) },
    { proto: models.birch, weight: 0.20, fallback: () => makeFallbackTree(0x22421c, 0x8a8a80) },
    { proto: models.tree1, weight: 0.12, fallback: () => makeFallbackTree(0x21421b, 0x4d331e) }
  ].map(t => {
    const src = t.proto ? t.proto.clone(true) : t.fallback();
    const norm = normalizeModel(src, { height: 9, groundAlign: true });
    // Gabarit de collision estimé depuis la boîte englobante du modèle normalisé.
    const box = new THREE.Box3().setFromObject(norm);
    const radiusXZ = Math.max(box.max.x - box.min.x, box.max.z - box.min.z) / 2;
    return {
      norm,
      matrices: [],
      colliderProto: { trunkR: Math.max(0.28, radiusXZ * 0.14), leafR: radiusXZ * 0.72, leafBaseFrac: 0.22, height: 9 }
    };
  });

  const dummy = new THREE.Object3D();
  let placed = 0, attempts = 0;
  while (placed < TREE_COUNT && attempts < TREE_COUNT * 20) {
    attempts++;
    const angle = rnd(0, Math.PI * 2);
    const r = Math.sqrt(Math.random()) * TREE_SPREAD; // aire uniforme sur toute l'arène jouable
    const x = Math.cos(angle) * r, z = Math.sin(angle) * r;
    if (r < 14) continue;                                    // clairière de départ
    const h = terrainHeight(x, z);
    if (h < WATER_Y + 0.8) continue;                         // pas d'arbres dans les lacs
    if (h > TREE_LINE) continue;                             // au-dessus : roche/neige
    const slope = Math.abs(terrainHeight(x + 2, z) - h) + Math.abs(terrainHeight(x, z + 2) - h);
    if (slope > 2.2) continue;                               // pentes raides : pas de forêt
    const nearShore = h < WATER_Y + 5; // berge : rive d'un lac, quelques mètres au-dessus de l'eau
    if (!nearShore && forestDensity(x, z) < 0.42 && Math.random() > 0.15) continue; // masque de forêt (15% d'isolés), sauf en bordure de lac

    // Tirage pondéré du type
    let pick = Math.random(), ti = 0;
    const weights = [0.38, 0.30, 0.20, 0.12];
    for (let i = 0; i < weights.length; i++) { pick -= weights[i]; if (pick <= 0) { ti = i; break; } }
    const type = types[ti];

    const s = rnd(0.7, 1.5);
    dummy.position.set(x, h - 0.15, z); // très légèrement enterré pour épouser la pente
    dummy.rotation.set(0, rnd(0, Math.PI * 2), 0);
    dummy.scale.setScalar(s);
    dummy.updateMatrix();
    type.matrices.push(dummy.matrix.clone());

    const cp = type.colliderProto;
    treeColliders.push({
      x, z,
      trunkR: cp.trunkR * s,
      leafBase: h + cp.height * cp.leafBaseFrac * s,
      leafTop:  h + cp.height * s,
      leafR: cp.leafR * s,
      groundY: h
    });
    placed++;
  }

  for (const type of types) {
    if (type.matrices.length) scene.add(makeInstancedFromModel(type.norm, type.matrices));
  }
}

// ══════════════════════════════════════════════════
//  LE HIBOU — modèle 3D procédural + battement d'ailes
// ══════════════════════════════════════════════════
// Convention : l'avant du hibou est l'axe local -Z (comme une caméra Three.js).
function buildOwl() {
  const g = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x8a6a3d, roughness: 0.8 });
  const body = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), bodyMat);
  body.scale.set(0.8, 0.9, 1.3);
  g.add(body);

  const headMat = new THREE.MeshStandardMaterial({ color: 0xa5845a, roughness: 0.8 });
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.55, 10, 8), headMat);
  head.position.set(0, 0.5, -0.9);
  g.add(head);

  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffe066, emissive: 0xffb020, emissiveIntensity: 0.5 });
  for (const side of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), eyeMat);
    eye.position.set(side * 0.22, 0.55, -1.35);
    g.add(eye);
  }

  const beakMat = new THREE.MeshStandardMaterial({ color: 0xd68a2e, roughness: 0.6 });
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.35, 6), beakMat);
  beak.rotation.x = -Math.PI / 2;
  beak.position.set(0, 0.42, -1.5);
  g.add(beak);

  const tailMat = new THREE.MeshStandardMaterial({ color: 0x6b4f2a, roughness: 0.8 });
  const tail = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.7), tailMat);
  tail.position.set(0, 0, 1.1);
  g.add(tail);

  const wingMat = new THREE.MeshStandardMaterial({ color: 0x6b4f2a, roughness: 0.8, side: THREE.DoubleSide });
  const wings = [];
  for (const side of [-1, 1]) {
    const pivot = new THREE.Group();
    pivot.position.set(side * 0.75, 0.1, 0);
    const wing = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.05, 0.9), wingMat);
    wing.position.set(side * 0.8, 0, 0);
    pivot.add(wing);
    g.add(pivot);
    wings.push(pivot); // wings[0] = gauche (side -1), wings[1] = droite (side +1)
  }

  return { group: g, wings, body };
}

// owlGroup existe dès le boot (la caméra y est attachée) ; le visuel — modèle GLB
// ou repli procédural — y est ajouté par setupOwlVisual() une fois les assets chargés.
const owlGroup = new THREE.Group();
owlGroup.visible = false;
scene.add(owlGroup);

// Lacet appliqué au modèle GLB pour aligner sa face sur l'avant du jeu (-Z).
// barnowl.glb regarde vers +Z → demi-tour. Ajuster ici si le modèle change.
const OWL_MODEL_YAW = Math.PI;
let owl = { wings: null, body: null, bob: null }; // rempli par setupOwlVisual
let owlMixer = null, owlAction = null; // pilotage de l'animation de vol du modèle GLB (voir updateFlap)

function setupOwlVisual() {
  if (models.owl) {
    // Modèle "ailes seules" (12139_OwlWings, voir docs/modele-hibou) : pas de matériau
    // exporté dans le .glb, on lui donne une teinte plume plausible.
    models.owl.traverse(o => {
      if (o.isMesh) {
        o.material = new THREE.MeshStandardMaterial({ color: 0x8a6a3f, roughness: 0.85, side: THREE.DoubleSide });
      }
    });
    // Normalisation par l'envergure (X) plutôt que la profondeur (Z) : ce modèle a les
    // ailes largement déployées, une normalisation par longueur le rendrait démesuré.
    const norm = normalizeModel(models.owl, { width: 2.6, groundAlign: false, yaw: OWL_MODEL_YAW });
    norm.rotation.x = -0.25; // légère assiette piquée : posture de vol plutôt que perché
    owlGroup.add(norm);
    owl = { wings: null, body: null, bob: norm };

    // Anime le clip de battement d'ailes du .glb (WingsArmatureAction) — sa vitesse de
    // lecture est recalée sur la vitesse de vol dans updateFlap(), pas ici.
    const clips = modelClips.owl;
    if (clips && clips.length) {
      owlMixer = new THREE.AnimationMixer(norm);
      owlAction = owlMixer.clipAction(clips[0]);
      owlAction.play();
    }

    // Gabarit de collision dérivé de la boîte englobante réelle du modèle (et non de son
    // envergure, qui inclut les ailes déployées) : le corps qui touche vraiment le décor
    // est bien plus étroit/bas que les 2.6 de large utilisés pour la normalisation visuelle.
    const box = new THREE.Box3().setFromObject(norm);
    const size = box.getSize(new THREE.Vector3());
    OWL_GROUND_CLEAR   = size.y / 2 + 0.15;
    OWL_COLLIDE_RADIUS = Math.min(size.y, size.z) / 2;
  } else {
    const built = buildOwl();
    owlGroup.add(built.group);
    owl = { wings: built.wings, body: built.body, bob: built.group };
  }
}

// Caméra rigidement attachée au hibou : elle hérite de TOUTE son orientation (roulis inclus).
const CAMERA_LOCAL_OFFSET = new THREE.Vector3(0, 2, 6.5);
const CAMERA_MIN_DIST     = 2.5; // distance mini si un arbre bloque la vue arrière
camera.position.copy(CAMERA_LOCAL_OFFSET);
camera.rotation.set(0, 0, 0);
owlGroup.add(camera);

// ── Anti-clipping caméra : rapproche la caméra du hibou si un arbre se trouve
//    sur le segment hibou→caméra, pour éviter qu'elle ne traverse le feuillage.
const CAMERA_CLIP_SAMPLES = 10;
function pointInsideAnyTree(p) {
  for (const t of treeColliders) {
    const dx = p.x - t.x, dz = p.z - t.z;
    let r;
    if (p.y < t.leafBase) r = t.trunkR;
    else if (p.y <= t.leafTop) r = t.leafR * (1 - (p.y - t.leafBase) / (t.leafTop - t.leafBase));
    else continue;
    if (dx * dx + dz * dz < r * r) return true;
  }
  return false;
}
const camClipDir = new THREE.Vector3();
const camClipPoint = new THREE.Vector3();
function updateCameraClip() {
  const maxDist = CAMERA_LOCAL_OFFSET.length();
  camClipDir.copy(CAMERA_LOCAL_OFFSET).normalize().applyQuaternion(owlGroup.quaternion);
  let safeDist = maxDist;
  for (let i = 1; i <= CAMERA_CLIP_SAMPLES; i++) {
    const t = (i / CAMERA_CLIP_SAMPLES) * maxDist;
    camClipPoint.copy(owlGroup.position).addScaledVector(camClipDir, t);
    // La caméra ne doit traverser ni le feuillage ni le relief du terrain
    if (pointInsideAnyTree(camClipPoint) ||
        camClipPoint.y < effectiveGroundY(camClipPoint.x, camClipPoint.z) + 0.4) {
      safeDist = Math.max(CAMERA_MIN_DIST, t - 0.5);
      break;
    }
  }
  camera.position.copy(CAMERA_LOCAL_OFFSET).setLength(safeDist);
}

let flapPhase = 0;
// Bornes de cadence du clip GLB (en multiplicateur de sa vitesse de lecture d'origine) :
// quasi figé (glissé) à l'arrêt, battement rapide à pleine vitesse — jamais totalement
// nul pour garder un frémissement d'ailes même immobile.
const FLAP_CLIP_RATE_MIN = 0.25;
const FLAP_CLIP_RATE_MAX = 3.2;
function updateFlap(dt, speedRatio) {
  if (owlMixer) {
    // Modèle GLB animé : la vitesse de lecture du clip suit la vitesse de vol du hibou.
    owlMixer.timeScale = FLAP_CLIP_RATE_MIN + (FLAP_CLIP_RATE_MAX - FLAP_CLIP_RATE_MIN) * speedRatio;
    owlMixer.update(dt);
    return;
  }
  const amp  = 0.5 + 0.7 * speedRatio;
  const rate = 5 + 14 * speedRatio;
  flapPhase += rate * dt;
  const s = Math.sin(flapPhase);
  if (owl.wings) {
    // Repli procédural : vraies ailes articulées
    const angle = -0.2 + s * amp;
    owl.wings[0].rotation.z = -angle;
    owl.wings[1].rotation.z = angle;
    owl.body.position.y = Math.sin(flapPhase * 0.5) * 0.05;
  } else if (owl.bob) {
    // Modèle GLB statique (pas de clip) : ondulation de vol (bob vertical + léger roulis)
    owl.bob.position.y = Math.sin(flapPhase * 0.5) * 0.12;
    owl.bob.rotation.z = s * 0.06 * (0.4 + 0.6 * speedRatio);
  }
}

// ══════════════════════════════════════════════════
//  ENTRÉES — clavier (ZQSD/AE) + souris (joystick additionnel) + tactile (mobile)
// ══════════════════════════════════════════════════
const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

const keys = {};
const ARROW_KEYS = ['arrowup', 'arrowdown', 'arrowleft', 'arrowright'];

// ── Menu de sensibilité souris (desktop uniquement, touche O) ──
let settingsOpen = false;
let sliderDrag = false;
let mouseSensitivity = 0.5; // 0.05..1.0, 0.5 = sensibilité par défaut d'origine
const MOUSE_SENS_BASE = 0.002;

function toggleSettings() {
  if (isMobile || state === S.LOOT || state === S.OVER) return;
  settingsOpen = !settingsOpen;
  if (settingsOpen) {
    if (document.pointerLockElement) document.exitPointerLock();
    if (state === S.PLAY) { state = S.PAUSED; document.body.style.cursor = 'default'; }
  }
}
function getSettingsPanelRect() {
  const W = hudCanvas.width, H = hudCanvas.height;
  const pw = 280, ph = 110;
  return { x: W / 2 - pw / 2, y: H / 2 - ph / 2, w: pw, h: ph };
}
function getSliderHitArea() {
  const p = getSettingsPanelRect();
  return { x: p.x + 20, y: p.y + 62, w: p.w - 40, h: 16 };
}
function handleSliderDrag(clientX) {
  const hit = getSliderHitArea();
  const t = Math.max(0, Math.min(1, (clientX - hit.x) / hit.w));
  mouseSensitivity = Math.max(0.05, Math.min(1.0, 0.05 + t * 0.95));
}

// ── Joystick virtuel + boutons tactiles (mobile uniquement) ──
const JOYSTICK_RADIUS = 55;
let joystick = { active: false, id: null, baseX: 0, baseY: 0, dx: 0, dy: 0 };
let touchThrust = false, touchThrustId = null;
let touchBrake  = false, touchBrakeId  = null;

function getThrustButtonCenter() {
  const W = hudCanvas.width, H = hudCanvas.height;
  return { x: W - 74, y: H - 90, r: 48 };
}
function getBrakeButtonCenter() {
  const W = hudCanvas.width, H = hudCanvas.height;
  return { x: W - 74, y: H - 210, r: 34 };
}
// Événements tactiles natifs (touchstart/move/end) : contrairement aux Pointer Events,
// ils sont supportés par tous les navigateurs mobiles sans exception, y compris les
// vieux WebViews Android et les navigateurs in-app — donc plus fiable pour le tactile.
function handleMobileTouchBegin(id, x, y) {
  const thrust = getThrustButtonCenter();
  if (Math.hypot(x - thrust.x, y - thrust.y) < thrust.r) {
    touchThrust = true; touchThrustId = id; return;
  }
  const brake = getBrakeButtonCenter();
  if (Math.hypot(x - brake.x, y - brake.y) < brake.r) {
    touchBrake = true; touchBrakeId = id; return;
  }
  if (!joystick.active && x < hudCanvas.width * 0.55) {
    joystick.active = true;
    joystick.id = id;
    joystick.baseX = x; joystick.baseY = y;
    joystick.dx = 0; joystick.dy = 0;
  }
}
function handleMobileTouchDrag(id, x, y) {
  if (joystick.active && id === joystick.id) {
    let dx = x - joystick.baseX, dy = y - joystick.baseY;
    const d = Math.hypot(dx, dy);
    if (d > JOYSTICK_RADIUS) { dx = dx / d * JOYSTICK_RADIUS; dy = dy / d * JOYSTICK_RADIUS; }
    joystick.dx = dx; joystick.dy = dy;
  }
}
function handleMobileTouchRelease(id) {
  if (joystick.active && id === joystick.id) { joystick.active = false; joystick.dx = 0; joystick.dy = 0; }
  if (touchThrust && id === touchThrustId) touchThrust = false;
  if (touchBrake  && id === touchBrakeId)  touchBrake  = false;
}
function handleTouchStart(e) {
  if (state === S.START || state === S.OVER) { beginGame(); e.preventDefault(); return; }
  if (state === S.PLAY) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      handleMobileTouchBegin(t.identifier, t.clientX, t.clientY);
    }
  }
  e.preventDefault();
}
function handleTouchMove(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    handleMobileTouchDrag(t.identifier, t.clientX, t.clientY);
  }
  e.preventDefault();
}
function handleTouchEnd(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    handleMobileTouchRelease(e.changedTouches[i].identifier);
  }
  e.preventDefault();
}
if (isMobile) {
  window.addEventListener('touchstart',  handleTouchStart, { passive: false });
  window.addEventListener('touchmove',   handleTouchMove,  { passive: false });
  window.addEventListener('touchend',    handleTouchEnd,   { passive: false });
  window.addEventListener('touchcancel', handleTouchEnd,   { passive: false });
}

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' || ARROW_KEYS.includes(e.key.toLowerCase())) e.preventDefault();
  if (e.key === 'o' || e.key === 'O') { toggleSettings(); return; }
  if (e.key === 'Escape') { settingsOpen = false; return; }
  if (state === S.START || state === S.OVER) beginGame();
  else if (state === S.PAUSED) requestFlightPointerLock();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Souris en pointer-lock : le curseur ne sort jamais de l'écran, donc le lacet/tangage
// ne se bloque plus quand on atteint le bord (mouvements relatifs via movementX/Y).
let mouseDX = 0, mouseDY = 0;
function requestFlightPointerLock() {
  if (!isMobile && glCanvas.requestPointerLock) glCanvas.requestPointerLock();
}
window.addEventListener('pointermove', e => {
  if (isMobile) return; // tactile géré par touchstart/touchmove/touchend natifs
  if (document.pointerLockElement === glCanvas) {
    mouseDX += e.movementX;
    mouseDY += e.movementY;
  }
  if (sliderDrag) handleSliderDrag(e.clientX);
});
window.addEventListener('pointerup',     e => { if (isMobile) return; sliderDrag = false; });
window.addEventListener('pointercancel', e => { if (isMobile) return; sliderDrag = false; });
window.addEventListener('pointerdown', e => {
  if (isMobile) return; // tactile géré par touchstart/touchmove/touchend natifs
  if (settingsOpen) {
    const hit = getSliderHitArea();
    if (e.clientX >= hit.x && e.clientX <= hit.x + hit.w && e.clientY >= hit.y - 10 && e.clientY <= hit.y + hit.h + 10) {
      sliderDrag = true;
      handleSliderDrag(e.clientX);
      return;
    }
    const panel = getSettingsPanelRect();
    if (e.clientX < panel.x || e.clientX > panel.x + panel.w || e.clientY < panel.y || e.clientY > panel.y + panel.h) {
      settingsOpen = false;
    }
    return;
  }
  if (state === S.START || state === S.OVER) beginGame();
  else if (state === S.PLAY || state === S.PAUSED) requestFlightPointerLock();
});

// Perte du verrouillage souris (Échap navigateur, changement d'onglet…) : on met le jeu
// en pause plutôt que de laisser le pilotage souris cesser silencieusement de répondre.
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === glCanvas) {
    if (state === S.PAUSED) {
      state = S.PLAY;
      mouseDX = 0; mouseDY = 0;
      document.body.style.cursor = 'none';
    }
  } else if (state === S.PLAY) {
    state = S.PAUSED;
    document.body.style.cursor = 'default';
  }
});

// ══════════════════════════════════════════════════
//  MÉCANIQUE DU VOL — modèle aérodynamique
//  Le hibou n'est plus « poussé tout droit » : on intègre un vrai VECTEUR
//  VITESSE soumis à quatre forces (poussée, portance, traînée, pesanteur),
//  avec incidence/décrochage et inertie de rotation. Les virages, montées,
//  piqués et décrochages émergent de la physique, pas de règles ad hoc.
// ══════════════════════════════════════════════════

// Vitesses angulaires maximales commandées (rad/s) — la « barre », pas l'inertie.
// Les 3 axes sont des commandes en VITESSE : aucun ne revient au neutre tout seul
// quand on relâche — comme un vrai avion, il faut contre-braquer pour revenir à plat.
const YAW_RATE   = THREE.MathUtils.degToRad(70);
const PITCH_RATE = THREE.MathUtils.degToRad(55);
const ROLL_RATE  = THREE.MathUtils.degToRad(200); // roulis vif, façon chasse
const MOUSE_MAX_DELTA = 0.05;

// — Moteur —
const THRUST_ACCEL    = 28;   // poussée max (u/s²) le long du nez, rapportée à OWL_MASS
const MAX_SPEED       = 34;   // repère HUD + amplitude du battement d'ailes
const CRUISE_THROTTLE = 0.6;  // consigne fixée d'un simple appui sur ⚡ (0..1)
const BRAKE_RATE      = 0.55; // baisse de la consigne (throttle/s) tant que Shift/✋ est tenu — décélération PROGRESSIVE
const BRAKE_DRAG      = 0.9;  // traînée supplémentaire d'aérofrein pendant le freinage

// — Masse & aérodynamique —
// Toutes les forces ci-dessous sont calculées en newtons puis converties en
// accélération par a = ΣF / OWL_MASS (2ᵉ loi de Newton, voir updateFlight §7).
// Seule la pesanteur fait exception : son accélération ne dépend PAS de la masse
// (un corps lourd et un corps léger tombent à la même vitesse) — c'est le POIDS
// (P = OWL_MASS · GRAVITY) qui, lui, dépend de la masse.
const OWL_MASS     = 1.6;     // kg — masse de référence du hibou
const GRAVITY      = 9.8;     // pesanteur réelle (u/s²)
const AIR_LIFT     = 0.05;    // portance dynamique de l'aile  ∝ v²·CL
const AIR_DRAG     = 0.02;    // traînée parasite ∝ v² — cale la vitesse de croisière ~MAX_SPEED
const INDUCED_DRAG = 0.03;    // traînée induite (prix de l'incidence/des virages) ∝ CL²·v
const FLAP_LIFT    = 13;      // portance de battement d'ailes (basse vitesse, ∝ poussée)
const FLAP_FADE    = 17;      // vitesse air au-delà de laquelle le battement ne porte plus
const SIDE_GRIP    = 0.6;     // léger amortissement du dérapage latéral (ne doit pas tuer le virage)
const STALL_AOA    = THREE.MathUtils.degToRad(18); // incidence critique de décrochage
const CL_MAX       = 1.5;     // portance dynamique max juste avant le décrochage
const CTRL_MIN_SPEED  = 7;    // sous cette vitesse air : gouvernes molles (autorité réduite)
const CTRL_FULL_SPEED = 18;   // au-dessus : pleine autorité des gouvernes
const ANG_RESPONSE = 7;       // inertie de rotation (vitesse de convergence vers la consigne)
const WIND_ACCEL   = 3.1;     // conversion windForce (tempête) -> accélération : le vent SECOUE vraiment le hibou

// — Décrochage en cloche : une chandelle verticale n'est plus tenable indéfiniment —
// La poussée s'essouffle nez au zénith, la vitesse s'évanouit, l'aile lâche : abattée.
const STALL_SPEED   = 9.5;   // vitesse air sous laquelle une montée cabrée décroche
const STALL_RECOVER = 13;    // vitesse à retrouver (nez baissé) pour raccrocher l'aile
let stallMode = false, stallTimer = 0;

let speed = 0;                // module du vecteur vitesse (flap + HUD)
let throttle = 0;             // consigne moteur 0..1 (⚡ = CRUISE_THROTTLE, ✋ = 0)
let prevThrustHeld = false;
const velocity = new THREE.Vector3();  // vecteur vitesse dans le repère monde
const angRate  = new THREE.Vector3();  // vitesses angulaires courantes (x=tangage, y=lacet, z=roulis) rad/s

// État de vol exposé au HUD (instruments)
const flight = { aoa: 0, stall: false, climb: 0, throttle: 0 };

// Vecteurs temporaires — zéro allocation par frame dans updateFlight
const _fwd = new THREE.Vector3(), _up = new THREE.Vector3(), _right = new THREE.Vector3();
const _acc = new THREE.Vector3(), _tmp = new THREE.Vector3(), _tgtAng = new THREE.Vector3();
const _dir = new THREE.Vector3();
const _UP_AXIS = new THREE.Vector3(0, 1, 0); // verticale monde (virage coordonné)

function updateFlight(dt) {
  // ── 1. Lecture des commandes ──────────────────────────────────────────
  let yawIn   = (keys['q'] || keys['arrowleft']  ? 1 : 0) - (keys['d'] || keys['arrowright'] ? 1 : 0);
  let pitchIn = (keys['s'] || keys['arrowdown']  ? 1 : 0) - (keys['z'] || keys['arrowup']    ? 1 : 0);
  let rollIn  = (keys['a'] ? 1 : 0) - (keys['e'] ? 1 : 0);

  // Joystick tactile (mobile) : tangage/roulis proportionnels, pas de lacet.
  if (isMobile) {
    yawIn = 0;
    if (joystick.active) {
      pitchIn = THREE.MathUtils.clamp( joystick.dy / JOYSTICK_RADIUS, -1, 1);
      rollIn  = THREE.MathUtils.clamp(-joystick.dx / JOYSTICK_RADIUS, -1, 1);
    }
  }

  const mouseSens = MOUSE_SENS_BASE * (mouseSensitivity / 0.5);
  const mdx = THREE.MathUtils.clamp(-mouseDX * mouseSens, -MOUSE_MAX_DELTA, MOUSE_MAX_DELTA);
  const mdy = THREE.MathUtils.clamp(-mouseDY * mouseSens, -MOUSE_MAX_DELTA, MOUSE_MAX_DELTA);
  mouseDX = 0; mouseDY = 0;

  // ── 2. Dynamique de rotation : inertie + autorité selon la vitesse air ──
  // Gouvernes molles à basse vitesse (un aéronef lent ne répond plus).
  let authority = THREE.MathUtils.clamp(
    (speed - CTRL_MIN_SPEED) / (CTRL_FULL_SPEED - CTRL_MIN_SPEED), 0.2, 1);
  if (stallMode) authority *= 0.3; // aile décrochée : les gouvernes ne mordent presque plus

  // Tangage, lacet & roulis : commande en VITESSE angulaire, avec inertie (le hibou
  // n'est plus une girouette instantanée — il faut « emmancher » la rotation).
  // Aucun axe ne « recentre » automatiquement quand on relâche : l'inclinaison
  // tenue reste tenue, il faut contre-braquer pour revenir à plat, comme un vrai avion.
  _tgtAng.set(pitchIn * PITCH_RATE, yawIn * YAW_RATE, rollIn * ROLL_RATE).multiplyScalar(authority);
  const kAng = 1 - Math.exp(-ANG_RESPONSE * dt); // lissage exponentiel, stable quel que soit dt
  angRate.lerp(_tgtAng, kAng);
  owlGroup.rotateX(angRate.x * dt);
  owlGroup.rotateY(angRate.y * dt);
  owlGroup.rotateZ(angRate.z * dt);
  owlGroup.rotateY(mdx); // souris = pilotage fin, appliqué directement (crisp)
  owlGroup.rotateX(-mdy); // tangage inversé : souris vers le bas = cabrer, comme un manche

  // ── 3. Repère local du hibou (nez / haut / droite) ──
  const q = owlGroup.quaternion;
  _fwd.set(0, 0, -1).applyQuaternion(q);
  _up.set(0, 1, 0).applyQuaternion(q);
  _right.set(1, 0, 0).applyQuaternion(q);
  const curBank = Math.asin(THREE.MathUtils.clamp(_right.y, -1, 1)); // inclinaison réelle, lue depuis l'orientation

  // ── 4. Poussée moteur : ⚡ fixe la consigne, Shift/✋ la réduit PROGRESSIVEMENT ──
  // (l'ancien frein Ctrl coupait la consigne à zéro d'un coup : on décélère désormais en douceur)
  const thrustHeld = keys[' '] || touchThrust;
  const brakeHeld  = keys['shift'] || touchBrake;
  if (thrustHeld && !prevThrustHeld) throttle = Math.max(throttle, CRUISE_THROTTLE);
  if (thrustHeld) throttle = Math.min(1, throttle + 0.8 * dt);
  if (brakeHeld)  throttle = Math.max(0, throttle - BRAKE_RATE * dt);
  prevThrustHeld = thrustHeld;

  const speedBoost = buffs.speed > 0 ? 1.4 : 1;
  // La poussée s'essouffle quand le nez pointe vers le zénith : un hibou n'est pas
  // une fusée — c'est ce qui rend la chandelle intenable et amène le décrochage.
  const climbFade = 1 - 0.85 * THREE.MathUtils.smoothstep(_fwd.y, 0.35, 0.9);
  const thrust = throttle * THRUST_ACCEL * speedBoost * climbFade;

  // ── 5. Vitesse air & incidence (angle d'attaque) ──
  const v      = velocity.length();
  const vUp    = velocity.dot(_up);
  const vFwd   = velocity.dot(_fwd);
  const vRight = velocity.dot(_right);
  // Incidence : angle entre la trajectoire et l'axe du nez, dans le plan de tangage.
  // >0 = le hibou « cabre » (nez au-dessus du flux) → génère de la portance.
  const aoa = v > 0.6 ? Math.atan2(-vUp, Math.abs(vFwd) + 1e-3) : 0;

  // ── 6. Coefficient de portance : linéaire avec l'incidence, puis effondrement ──
  const absAoa = Math.abs(aoa);
  const stalling = absAoa > STALL_AOA;
  let CL;
  if (!stalling) {
    CL = CL_MAX * (aoa / STALL_AOA);                 // régime linéaire
  } else {
    const over = Math.min(1, (absAoa - STALL_AOA) / STALL_AOA);
    CL = Math.sign(aoa) * CL_MAX * (1 - 0.75 * over); // aile décrochée : la portance chute
  }

  // ── 6bis. Décrochage « en cloche » : montée trop raide + vitesse évanouie → l'aile lâche.
  // Abattée automatique (le nez tombe), buffeting, gouvernes molles (§2) le temps de
  // reprendre de la vitesse en piqué. On ne peut donc PLUS monter à la verticale en continu.
  const climbStall = _fwd.y > 0.45 && v < STALL_SPEED;
  if (!stallMode && (stalling || climbStall)) { stallMode = true; stallTimer = 0.8; }
  if (stallMode) {
    stallTimer -= dt;
    angRate.x = THREE.MathUtils.lerp(angRate.x, -1.5, 1 - Math.exp(-3.5 * dt)); // abattée : le nez plonge
    angRate.z += rnd(-1, 1) * 2.4 * dt;                                          // tremblement de buffeting
    screenShake = Math.max(screenShake, 2.5);
    if (stallTimer <= 0 && v > STALL_RECOVER && _fwd.y < 0.25 && absAoa < STALL_AOA * 0.8) stallMode = false;
  }

  // ── 7. Bilan des forces, en newtons (2ᵉ loi de Newton : a = ΣF / masse) ──
  _acc.set(0, -OWL_MASS * GRAVITY, 0);           // poids P = m·g (la pesanteur ne dépend pas de la masse)
  _acc.addScaledVector(_fwd, thrust * OWL_MASS); // poussée le long du nez

  // Portance : dynamique (aile, ∝ v²·CL) + battement (basse vitesse, ∝ poussée).
  // Le battement ne porte plus quand le nez pointe au zénith : plus d'ascenseur vertical gratuit.
  const dynLift  = AIR_LIFT * v * v * CL;
  const flapLift = FLAP_LIFT * (0.35 + 0.65 * throttle) * Math.max(0, 1 - v / FLAP_FADE)
                 * (1 - THREE.MathUtils.smoothstep(_fwd.y, 0.35, 0.8));
  _acc.addScaledVector(_up, (dynLift + flapLift) * OWL_MASS);

  // Traînée : parasite (∝ v²) + induite (∝ CL²), opposée à la vitesse.
  // Le frein (Shift/✋) déploie des aérofreins : traînée renforcée, décélération en douceur.
  if (v > 1e-3) {
    const drag = AIR_DRAG * (brakeHeld ? 1 + BRAKE_DRAG : 1) * v * v + INDUCED_DRAG * CL * CL * v;
    _acc.addScaledVector(velocity, (-drag / v) * OWL_MASS);
  }

  // Anti-dérapage : on gomme la glisse latérale → sensation « je vole », pas « je glisse »
  _acc.addScaledVector(_right, -vRight * SIDE_GRIP * OWL_MASS);

  // ── 8. Vent de tempête : bourrasques latérales + RABATTANT qui plaque vers le sol.
  // Seul le hibou y est soumis (les ours, plaqués au relief, ne sont pas emportés).
  if (storm.active) {
    const w = storm.windForce * WIND_ACCEL * OWL_MASS;
    _acc.x += Math.cos(storm.windAngle) * w;
    _acc.z += Math.sin(storm.windAngle) * w;
    _acc.y -= w * (0.55 + 0.35 * Math.sin(storm.gustPhase * 0.5)); // toujours vers le bas, pulsé par les rafales
  }

  _acc.divideScalar(OWL_MASS); // a = ΣF / m — c'est ici que la masse (1.6 kg) intervient réellement

  // ── 9. Intégration semi-implicite du vecteur vitesse puis de la position ──
  velocity.addScaledVector(_acc, dt);
  const vmax = MAX_SPEED * speedBoost * 1.2;
  if (velocity.lengthSq() > vmax * vmax) velocity.setLength(vmax);
  owlGroup.position.addScaledVector(velocity, dt);
  speed = velocity.length();

  // Virage coordonné : une aile inclinée courbe la trajectoire au taux réel
  // ω = g·tan(inclinaison)/v. On fait pivoter ENSEMBLE la trajectoire (composante
  // horizontale de la vitesse) et le nez (autour de la verticale monde) → virage
  // parfaitement coordonné, sans dérapage, franc et lisible. Le plafond sur tan()
  // est repoussé à 83° (au lieu de 71,6°) pour qu'un virage « sur la tranche »
  // reste de plus en plus serré à mesure qu'on incline plus fort (sensation chasse).
  //
  // Ce modèle de bank angle n'a de sens qu'en vol à peu près horizontal : dès que
  // le nez pointe vers la verticale (montée cabrée, décrochage), l'angle d'inclinaison
  // lu depuis l'orientation devient dégénéré (gimbal lock) et se met à osciller —
  // on atténue donc cette correction à mesure que le nez approche de la verticale,
  // pour éviter que la caméra ne « recentre » erratiquement pendant ces phases.
  const levelness = 1 - THREE.MathUtils.clamp(Math.abs(_fwd.y) / 0.85, 0, 1);
  if (speed > 3 && levelness > 0) {
    const turnRate = GRAVITY * Math.tan(THREE.MathUtils.clamp(curBank, -1.45, 1.45)) / speed;
    const a = turnRate * dt * levelness;
    const ca = Math.cos(a), sa = Math.sin(a);
    const vx = velocity.x, vz = velocity.z;
    velocity.x = vx * ca + vz * sa;
    velocity.z = -vx * sa + vz * ca;
    owlGroup.rotateOnWorldAxis(_UP_AXIS, a);
  }

  // ── 10. Bordure ellipsoïde : résistance progressive (pas de téléportation) ──
  // On freine la composante « sortante » de la vitesse de plus en plus fort à
  // mesure qu'on approche du bord (comme un vent de face croissant), au lieu de
  // clamper brutalement la position — ce qui donnait l'impression que la caméra
  // se recentrait toute seule d'un coup en approchant de la limite.
  const offset = _tmp.copy(owlGroup.position).sub(ARENA_CENTER);
  const f = ellipsoidFactor(owlGroup.position);
  const pushStart = 1 - BOUNDARY_FADE_DIST / ARENA_RADIUS_XZ;
  if (f > pushStart) {
    _dir.copy(offset).normalize();
    const vOut = velocity.dot(_dir);
    if (vOut > 0) {
      const strength = THREE.MathUtils.clamp((f - pushStart) / (1 - pushStart), 0, 1);
      velocity.addScaledVector(_dir, -vOut * strength * Math.min(1, 6 * dt));
    }
    if (f > 1) owlGroup.position.copy(ARENA_CENTER).addScaledVector(offset, 1 / f); // garde-fou dur, en dernier recours
  }
  const groundY = effectiveGroundY(owlGroup.position.x, owlGroup.position.z) + OWL_GROUND_CLEAR;
  if (owlGroup.position.y < groundY) {
    owlGroup.position.y = groundY;
    onGroundCrash();
  }

  // ── 11. État de vol pour les instruments du HUD ──
  flight.aoa = aoa;
  flight.stall = stalling || stallMode;
  flight.climb = velocity.y;
  flight.throttle = throttle;

  checkTreeCollision();

  return THREE.MathUtils.clamp(speed / MAX_SPEED, 0, 1);
}

// Collision avec un arbre : grosse perte de score/nid + vitesse ramenée à zéro.
function checkTreeCollision() {
  if (treeCooldown > 0) return;
  const p = owlGroup.position;
  for (const t of treeColliders) {
    let r;
    if (p.y < t.leafBase) {
      r = t.trunkR; // sous le feuillage : seul le tronc fin peut toucher
    } else if (p.y <= t.leafTop) {
      const frac = (p.y - t.leafBase) / (t.leafTop - t.leafBase);
      r = t.leafR * (1 - frac); // cône qui se rétrécit vers le sommet
    } else {
      continue; // au-dessus de l'arbre : pas de collision
    }
    r += OWL_COLLIDE_RADIUS;
    const dx = p.x - t.x, dz = p.z - t.z;
    const distSq = dx * dx + dz * dz;
    if (distSq < r * r) {
      const dist = Math.sqrt(distSq) || 0.001;
      p.x += (dx / dist) * (r - dist + 0.3);
      p.z += (dz / dist) * (r - dist + 0.3);
      onTreeHit();
      return;
    }
  }
}

function onTreeHit() {
  speed = 0;
  velocity.set(0, 0, 0); // le crash casse net l'élan (le vecteur vitesse, pas juste le scalaire)
  score = Math.max(0, score - 15);
  nest = Math.max(0, nest - 30);
  combo = 1; comboTimer = 0;
  screenShake = Math.max(screenShake, 22);
  hitFlash = Math.max(hitFlash, 0.5);
  treeCooldown = TREE_HIT_COOLDOWN;
  spawnFX(owlGroup.position, 18, 'death', 'CRASH ! 🌳');
}

// Contact avec le sol (le sprite/modèle du hibou, pas la caméra) : crash fatal,
// game over immédiat — contrairement aux arbres/ours, on ne relève pas de vie ici.
function onGroundCrash() {
  if (state !== S.PLAY) return;
  best = Math.max(best, score);
  state = S.OVER;
  overReason = 'crash';
  owlGroup.visible = false;
  document.body.style.cursor = 'default';
  if (document.pointerLockElement) document.exitPointerLock();
  screenShake = Math.max(screenShake, 25);
  hitFlash = Math.max(hitFlash, 0.6);
  spawnFX(owlGroup.position, 24, 'death', '💥 CRASHÉ !');
}

// ══════════════════════════════════════════════════
//  TEXTURES EMOJI (ours, branches) — même technique que le rendu pixel-art du jeu 2D
// ══════════════════════════════════════════════════
function emojiTexture(str, size = 128) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const cctx = c.getContext('2d');
  cctx.font = Math.floor(size * 0.7) + 'px serif';
  cctx.textAlign = 'center'; cctx.textBaseline = 'middle';
  cctx.fillText(str, size / 2, size / 2 + size * 0.05);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}
const BRANCH_EMOJI = ['🪵', '🌿', '🍃', '🍂'];
const branchTextures = {};
for (const e of BRANCH_EMOJI) branchTextures[e] = emojiTexture(e);
const bearTexture = emojiTexture('🐻', 160);
const giftTexture = emojiTexture('🎁', 160);

// Halo radial doux (blanc → transparent), teinté à l'usage : lueur des branches et
// du cadeau, menace des ours, points ronds des particules 3D et des lucioles.
function makeGlowTexture(size = 64) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const cctx = c.getContext('2d');
  const g = cctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.4, 'rgba(255,255,255,0.45)');
  g.addColorStop(1,   'rgba(255,255,255,0)');
  cctx.fillStyle = g;
  cctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const glowTexture = makeGlowTexture();

// ══════════════════════════════════════════════════
//  CADEAU BONUS (porté depuis hibou-et-nid.html, sans l'animation de roulette)
//  L'ancien tirage (3 %/s, n'importe où dans l'arène x5) faisait qu'on n'en
//  voyait JAMAIS : apparition désormais GARANTIE à intervalle régulier, près
//  du joueur, signalée par un pilier de lumière doré visible de très loin.
// ══════════════════════════════════════════════════
const GIFT_COLLECT_RADIUS = 3.5;
const GIFT_PILLAR_H = 90;
let giftCooldown = rnd(10, 16);

function spawnGiftIfNeeded(dt) {
  if (giftItem) return;
  if (moon.state !== 'none') return;
  if (storm.active) return;
  giftCooldown -= dt;
  if (giftCooldown > 0) return;

  const mat = new THREE.SpriteMaterial({ map: giftTexture, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(2.4, 2.4, 1);
  const pos = collectibleSpawnPos(70, 260);
  sprite.position.copy(pos);
  scene.add(sprite);

  // Halo doré pulsé derrière le paquet
  const glowMat = new THREE.SpriteMaterial({
    map: glowTexture, transparent: true, opacity: 0.55,
    color: 0xffd766, blending: THREE.AdditiveBlending, depthWrite: false
  });
  const glow = new THREE.Sprite(glowMat);
  glow.scale.set(7, 7, 1);
  glow.position.copy(pos);
  scene.add(glow);

  // Pilier de lumière planté dans le sol : le phare qui rend le cadeau trouvable
  const pillarMat = new THREE.MeshBasicMaterial({
    color: 0xffd766, transparent: true, opacity: 0.22,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: false, side: THREE.DoubleSide
  });
  const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.7, GIFT_PILLAR_H, 10, 1, true), pillarMat);
  pillar.position.set(pos.x, effectiveGroundY(pos.x, pos.z) + GIFT_PILLAR_H / 2, pos.z);
  scene.add(pillar);

  giftItem = { sprite, glow, pillar, baseY: pos.y, w: rnd(0, Math.PI * 2) };
}

function removeGift() {
  scene.remove(giftItem.sprite);
  giftItem.sprite.material.dispose();
  scene.remove(giftItem.glow);
  giftItem.glow.material.dispose();
  scene.remove(giftItem.pillar);
  giftItem.pillar.geometry.dispose();
  giftItem.pillar.material.dispose();
  giftItem = null;
  giftCooldown = rnd(18, 28); // prochain cadeau garanti
}

function updateGift(dt) {
  spawnGiftIfNeeded(dt);
  if (!giftItem) return;

  // Distancé (le joueur est parti à l'autre bout) : le cadeau le rejoint
  if (giftItem.sprite.position.distanceTo(owlGroup.position) > 650) {
    const p = collectibleSpawnPos(80, 250);
    giftItem.sprite.position.copy(p);
    giftItem.baseY = p.y;
    giftItem.pillar.position.set(p.x, effectiveGroundY(p.x, p.z) + GIFT_PILLAR_H / 2, p.z);
  }

  giftItem.w += dt * 2.2;
  giftItem.sprite.position.y = giftItem.baseY + Math.sin(giftItem.w) * 0.4;
  giftItem.glow.position.copy(giftItem.sprite.position);
  const pulse = 1 + Math.sin(giftItem.w * 1.7) * 0.12;
  giftItem.sprite.scale.set(2.4 * pulse, 2.4 * pulse, 1);
  giftItem.glow.scale.set(7 * pulse, 7 * pulse, 1);
  giftItem.pillar.material.opacity = 0.16 + 0.1 * (0.5 + 0.5 * Math.sin(giftItem.w * 1.3));
  giftItem.pillar.rotation.y += dt * 0.6;

  if (owlGroup.position.distanceTo(giftItem.sprite.position) < GIFT_COLLECT_RADIUS) {
    spawnFX3D(giftItem.sprite.position, 26, 'sparkle');
    const loot = rollLoot();
    initLootboxScroll(loot);
    state       = S.LOOT;
    screenShake = 15;
    removeGift();
  }
}

function applyGiftLoot(loot) {
  if (loot.id === 'life')       lives++;
  if (loot.id === 'speed')      buffs.speed      = 7;
  if (loot.id === 'multi')      buffs.multi      = 7;
  if (loot.id === 'slow')       buffs.slow       = 7;
  if (loot.id === 'invincible') buffs.invincible = 10;
}

// ══════════════════════════════════════════════════
//  LOOT BOX — roulette de révélation avant application du bonus
//  (porté depuis hibou-et-nid.html : scroll puis atterrissage sur l'item tiré)
// ══════════════════════════════════════════════════
const ITEM_COUNT  = 28;
const TARGET_IDX  = ITEM_COUNT - 4;
const CASE_W      = 90;
const CASE_GAP    = 8;
const CASE_STRIDE = CASE_W + CASE_GAP;

let lootbox = { items: [], scroll: 0, phase: 'scroll', result: null };

function initLootboxScroll(result) {
  const items = [];
  for (let i = 0; i < ITEM_COUNT; i++) items.push(i === TARGET_IDX ? result : rollLoot());

  const barWidth    = CASE_STRIDE * 5 - CASE_GAP;
  const finalScroll = barWidth / 2 - CASE_W / 2 - TARGET_IDX * CASE_STRIDE;
  const startScroll = barWidth + CASE_STRIDE * 4;

  lootbox = {
    items, result,
    scroll: startScroll, finalScroll,
    phase: 'scroll',
    landTimer: 0, pauseTimer: 0,
    applied: false
  };
}

// Les constantes de timing du jeu 2D sont exprimées en nombre d'images à 60fps ;
// `frames` convertit le pas de temps réel dt en équivalent-images pour les réutiliser telles quelles.
function updateLootbox(dt) {
  const frames = 60 * dt;
  if (lootbox.phase === 'scroll') {
    const remaining = lootbox.finalScroll - lootbox.scroll;
    const speed    = remaining * 0.06 * frames;
    const minSpeed = Math.abs(remaining) > CASE_STRIDE * 2 ? -8 * frames : 0;
    lootbox.scroll += Math.min(speed, minSpeed);

    if (Math.abs(remaining) < 1) {
      lootbox.scroll = lootbox.finalScroll;
      lootbox.phase  = 'land';
      screenShake    = 8;
    }
  } else if (lootbox.phase === 'land') {
    lootbox.landTimer += frames;
    if (lootbox.landTimer >= 120 && !lootbox.applied) {
      applyGiftLoot(lootbox.result);
      lootbox.applied = true;
    }
    if (lootbox.landTimer >= 120) {
      lootbox.pauseTimer += frames;
      if (lootbox.pauseTimer >= 30) {
        state = S.PLAY;
        owlInvul = 90;
        document.body.style.cursor = 'none';
      }
    }
  }
}

// ══════════════════════════════════════════════════
//  BRANCHES / NID / SCORE / COMBO
//  L'arène x5 rendait les branches introuvables (semées au hasard dans tout le
//  volume) : elles apparaissent désormais AUTOUR et DEVANT le hibou, plutôt
//  près du sol, brillent d'un halo, et sont recyclées quand on les distance.
// ══════════════════════════════════════════════════
const ROTTEN_LIFE = 600, ROTTEN_CHANCE = 0.08;
const COLLECT_RADIUS = 3;
const BRANCH_COUNT = 14;
const BRANCH_RECYCLE_DIST = 420;
let branches = [];

// Position de spawn d'un collectible : autour du hibou, avec un biais DEVANT lui
// et un biais VERS LE SOL (la récolte tire naturellement le vol vers le bas).
function collectibleSpawnPos(minDist, maxDist) {
  let angle;
  if (velocity.lengthSq() > 4 && Math.random() < 0.6) {
    angle = Math.atan2(velocity.z, velocity.x) + rnd(-0.9, 0.9); // dans le cône de route
  } else {
    angle = rnd(0, Math.PI * 2);
  }
  const dist = rnd(minDist, maxDist);
  const p = new THREE.Vector3(
    owlGroup.position.x + Math.cos(angle) * dist, 0,
    owlGroup.position.z + Math.sin(angle) * dist);
  // Rabattu vers le centre si le tirage sort de l'arène (près de la muraille)
  const f = Math.hypot(p.x - ARENA_CENTER.x, p.z - ARENA_CENTER.z) / ARENA_RADIUS_XZ;
  if (f > 0.85) {
    p.x = ARENA_CENTER.x + (p.x - ARENA_CENTER.x) * 0.85 / f;
    p.z = ARENA_CENTER.z + (p.z - ARENA_CENTER.z) * 0.85 / f;
  }
  const g = effectiveGroundY(p.x, p.z);
  p.y = Math.random() < 0.6
    ? g + rnd(2.5, 14)                               // ras du sol / cime des arbres
    : Math.min(g + rnd(15, 70), COLLECTIBLE_MAX_Y);  // plein ciel
  return p;
}

function newBranch() {
  const e = BRANCH_EMOJI[Math.floor(Math.random() * 4)];
  const rotten = Math.random() < ROTTEN_CHANCE;
  const mat = new THREE.SpriteMaterial({ map: branchTextures[e], transparent: true });
  if (rotten) mat.color.set(0x99775a);
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(2, 2, 1);
  const pos = collectibleSpawnPos(35, 210);
  sprite.position.copy(pos);
  scene.add(sprite);

  // Halo : vert tendre pour les saines, brun terne pour les pourries (lisible de loin)
  const glowMat = new THREE.SpriteMaterial({
    map: glowTexture, color: rotten ? 0x8a6a20 : 0x66ff66, transparent: true,
    opacity: rotten ? 0.28 : 0.5, blending: THREE.AdditiveBlending, depthWrite: false
  });
  const glow = new THREE.Sprite(glowMat);
  glow.scale.setScalar(2.3); // relatif au sprite parent (échelle 2) → ~4.6 unités monde
  sprite.add(glow);

  return { sprite, glowMat, rotten, w: rnd(0, Math.PI * 2), ws: rotten ? rnd(0.06, 0.11) : rnd(0.03, 0.07), age: 0, baseY: pos.y };
}
function removeBranch(i) {
  scene.remove(branches[i].sprite);
  branches[i].sprite.material.dispose();
  branches[i].glowMat.dispose();
  branches.splice(i, 1);
}

function updateBranches() {
  if (moon.state !== 'none') return; // pleine lune : survie pure, pas de collecte
  for (let i = branches.length - 1; i >= 0; i--) {
    const br = branches[i];
    br.w += br.ws;
    br.sprite.position.y = br.baseY + Math.sin(br.w) * 0.4;
    br.glowMat.opacity = (br.rotten ? 0.28 : 0.5) + Math.sin(br.w * 2) * 0.14; // halo qui respire

    // Recyclage : une branche laissée trop loin derrière revient près du hibou
    if (br.sprite.position.distanceTo(owlGroup.position) > BRANCH_RECYCLE_DIST) {
      const p = collectibleSpawnPos(60, 230);
      br.sprite.position.copy(p);
      br.baseY = p.y;
    }

    if (br.rotten) {
      br.age++;
      if (br.age >= ROTTEN_LIFE) { removeBranch(i); branches.push(newBranch()); continue; }
    }

    if (owlGroup.position.distanceTo(br.sprite.position) < COLLECT_RADIUS) {
      if (br.rotten) {
        combo = 0; comboTimer = 0;
        screenShake = Math.max(screenShake, 9);
        hitFlash = Math.max(hitFlash, 0.35);
        spawnFX(br.sprite.position, 14, 'death', 'COMBO RESET 🤢');
      } else {
        const gain = Math.max(1, combo) * (buffs.multi > 0 ? 5 : 1);
        score += gain; nest += 1;
        if (nest >= 100) {
          nest %= 100; lives++;
          spawnFX(owlGroup.position, 30, 'collect', '+1 VIE ! ❤️');
          screenShake = 15;
        }
        screenShake = Math.min(4 + combo * 0.5, 15);
        spawnFX(br.sprite.position, 12, 'collect', `+${gain}`);
        spawnFX3D(br.sprite.position, 14, 'collect'); // gerbe dorée dans la scène
        combo = Math.max(1, combo) + 1; comboTimer = MAX_COMBO_TIME;
        while (bears.length < bearTarget()) bears.push(newBear());
      }
      removeBranch(i);
      branches.push(newBranch());
    }
  }
  if (comboTimer > 0) comboTimer--; else combo = 1;
}

// ══════════════════════════════════════════════════
//  RASE-MOTTES — voler BAS et VITE rapporte en continu : la carotte qui attire
//  le joueur au sol, entre les arbres et le relief (du risque contre des points).
// ══════════════════════════════════════════════════
const SKIM_ALT = 8, SKIM_MIN_SPEED = 13;
let skimTimer = 0, skimActive = false;

function updateSkim(dt) {
  const alt = owlGroup.position.y - effectiveGroundY(owlGroup.position.x, owlGroup.position.z);
  skimActive = alt < SKIM_ALT && speed > SKIM_MIN_SPEED;
  if (!skimActive) { skimTimer = 0; return; }
  skimTimer += dt;
  if (skimTimer >= 1) { // +2 par seconde passée au ras du sol (x5 avec le buff ✨)
    skimTimer -= 1;
    const gain = 2 * (buffs.multi > 0 ? 5 : 1);
    score += gain;
    nest += 1;
    if (nest >= 100) {
      nest %= 100; lives++;
      spawnFX(owlGroup.position, 30, 'collect', '+1 VIE ! ❤️');
      screenShake = 15;
    }
    spawnFX(owlGroup.position, 5, 'collect', `+${gain} 🪶`);
    spawnFX3D(owlGroup.position, 5, 'dust'); // poussière soulevée dans le sillage
  }
}

// ══════════════════════════════════════════════════
//  OURS — modèle GLB cloné par ours (géométrie/matériaux partagés), orienté vers
//  sa direction de déplacement. Repli : sprite emoji 🐻 d'origine.
// ══════════════════════════════════════════════════
let bears = [];
// Lacet du modèle GLB pour que l'ours regarde vers +Z (convention lookAt de three.js).
const BEAR_MODEL_YAW = 0;
let bearProto = null; // gabarit normalisé, cloné pour chaque ours
function setupBearProto() {
  if (!models.bear) return;
  bearProto = normalizeModel(models.bear, { height: 1, groundAlign: false, yaw: BEAR_MODEL_YAW });
}

function bearTarget() {
  if (moon.state === 'blood') return 18;
  if (moon.state === 'full')  return 12;
  return Math.min(2 + Math.floor(score / 15), 10);
}

function newBear() {
  let sprite;
  if (bearProto) {
    sprite = bearProto.clone(true); // clone léger : géométries et matériaux partagés
    sprite.scale.setScalar(2.6);
  } else {
    const mat = new THREE.SpriteMaterial({ map: bearTexture, transparent: true });
    sprite = new THREE.Sprite(mat);
    sprite.scale.set(2.6, 2.6, 1);
  }

  // Halo de menace : lueur rouge additive allumée pendant la préparation et la
  // charge — le télégraphe qui rend la charge lisible et esquivable (au virage).
  const menaceMat = new THREE.SpriteMaterial({
    map: glowTexture, color: 0xff2211, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const menaceGlow = new THREE.Sprite(menaceMat);
  menaceGlow.scale.setScalar(1.6);
  sprite.add(menaceGlow);

  // Une fois sur deux, l'ours apparaît DEVANT le hibou, sur sa trajectoire :
  // fuir tout droit, c'est foncer dans les prochains.
  let dir;
  if (Math.random() < 0.5 && velocity.lengthSq() > 4) {
    dir = velocity.clone().normalize().applyAxisAngle(_UP_AXIS, rnd(-0.7, 0.7));
    dir.y = THREE.MathUtils.clamp(dir.y + rnd(-0.3, 0.3), -0.5, 0.5);
    dir.normalize();
  } else {
    const angle = rnd(0, Math.PI * 2);
    const elev = rnd(-0.4, 0.4);
    dir = new THREE.Vector3(Math.cos(angle) * Math.cos(elev), Math.sin(elev), Math.sin(angle) * Math.cos(elev));
  }
  const distR = rnd(42, 65);
  let pos = owlGroup.position.clone().add(dir.multiplyScalar(distR));
  const offset = pos.clone().sub(ARENA_CENTER);
  const f = ellipsoidFactor(pos);
  if (f > 1) offset.multiplyScalar(0.95 / f);
  pos = ARENA_CENTER.clone().add(offset);
  pos.y = Math.max(effectiveGroundY(pos.x, pos.z) + 2.5,
                   Math.min(pos.y, ARENA_CENTER.y + ARENA_RADIUS_Y * 0.55));
  sprite.position.copy(pos);
  scene.add(sprite);

  const isFullMoon  = moon.state === 'full';
  const isBloodMoon = moon.state === 'blood';
  return {
    sprite, menaceMat,
    life: isBloodMoon ? rnd(400, 900) : isFullMoon ? rnd(300, 600) : rnd(1000, 2000),
    spdBase: (isBloodMoon ? 22 : isFullMoon ? 16 : 11) + Math.min(score * 0.15, 10), // unités/s (mouvement mis à l'échelle par dt)
    lead: rnd(0.5, 1.5),         // anticipation : l'ours vise là où le hibou SERA, pas là où il est
    drift: new THREE.Vector3(),
    driftTimer: 0,
    mode: 'stalk', modeTimer: 0, // stalk → windup (télégraphe) → lunge (charge) → recover
    lungeCooldown: rnd(1.5, 3.5),
    lungeDir: new THREE.Vector3(),
    bob: rnd(0, Math.PI * 2),
    spawnPulse: 1,
    spawnGrace: 90 // frames d'immunité après l'apparition, pour ne pas mourir dans la seconde qui suit
  };
}
function removeBear(i) {
  scene.remove(bears[i].sprite);
  if (bears[i].sprite.isSprite) bears[i].sprite.material.dispose(); // le GLB partage ses matériaux : ne pas les détruire
  bears[i].menaceMat.dispose(); // le halo de menace, lui, est propre à chaque ours
  bears.splice(i, 1);
}

const BEAR_LUNGE_RANGE = 38; // distance de déclenchement de la charge
const BEAR_LUNGE_SPEED = 31; // vitesse de charge : plus vite que la croisière du hibou
const _bearAim = new THREE.Vector3(), _bearMove = new THREE.Vector3();

function updateBears(dt) {
  for (let i = bears.length - 1; i >= 0; i--) {
    const b = bears[i];
    b.life--;
    if (b.life <= 0) {
      spawnFX(b.sprite.position, 6, 'death');
      removeBear(i);
      if (bears.length < bearTarget()) bears.push(newBear());
      continue;
    }
    if (b.spawnGrace > 0) b.spawnGrace--;
    b.bob += 0.12;
    if (b.spawnPulse > 0) b.spawnPulse = Math.max(0, b.spawnPulse - 0.05);

    const slowMul = buffs.slow > 0 ? 0.3 : 1;
    const dist = b.sprite.position.distanceTo(owlGroup.position);

    // Poursuite avec ANTICIPATION, réévaluée à chaque frame : l'ours coupe la
    // trajectoire au lieu de suivre bêtement — la ligne droite ne le sème plus.
    b.driftTimer -= dt;
    if (b.driftTimer <= 0) {
      b.driftTimer = rnd(0.5, 2);
      b.drift.set(rnd(-1, 1), rnd(-0.6, 0.6), rnd(-1, 1)).normalize().multiplyScalar(rnd(2, 9));
    }
    _bearAim.copy(owlGroup.position).addScaledVector(velocity, b.lead).add(b.drift);

    let spd = b.spdBase * slowMul;
    _bearMove.copy(_bearAim).sub(b.sprite.position);

    // Machine à états : traque → préparation (télégraphe rouge) → CHARGE en ligne
    // figée (esquivable au virage serré) → récupération, puis cooldown.
    b.modeTimer -= dt;
    b.lungeCooldown -= dt;
    if (b.mode === 'stalk') {
      if (dist < BEAR_LUNGE_RANGE && b.lungeCooldown <= 0 && b.spawnGrace <= 0) {
        b.mode = 'windup'; b.modeTimer = 0.45;
      }
    } else if (b.mode === 'windup') {
      spd *= 0.25; // se ramasse sur lui-même avant de bondir
      if (b.modeTimer <= 0) {
        b.mode = 'lunge'; b.modeTimer = 0.85;
        b.lungeDir.copy(_bearAim).sub(b.sprite.position).normalize();
      }
    } else if (b.mode === 'lunge') {
      spd = Math.max(BEAR_LUNGE_SPEED, b.spdBase * 1.5) * slowMul;
      _bearMove.copy(b.lungeDir);
      if (b.modeTimer <= 0) { b.mode = 'recover'; b.modeTimer = 1.1; b.lungeCooldown = rnd(2.2, 4); }
    } else if (b.mode === 'recover') {
      spd *= 0.45;
      if (b.modeTimer <= 0) b.mode = 'stalk';
    }

    // Télégraphe visuel : halo rouge pulsé + ours qui « gonfle » avant la charge
    const menaceTarget = b.mode === 'windup' ? 0.85 + 0.15 * Math.sin(b.bob * 4)
                       : b.mode === 'lunge'  ? 0.55 : 0;
    b.menaceMat.opacity = THREE.MathUtils.lerp(b.menaceMat.opacity, menaceTarget, 0.25);
    const menace = b.mode === 'windup' ? 1.25 : b.mode === 'lunge' ? 1.12 : 1;
    b.sprite.scale.setScalar(2.6 * (1 - b.spawnPulse * 0.6) * menace);

    const d = _bearMove.length() || 1;
    b.sprite.position.addScaledVector(_bearMove, (spd * dt) / d);
    b.sprite.position.y += Math.sin(b.bob) * 0.02;
    // Jamais sous le terrain (les ours volants restent des ours polis)
    b.sprite.position.y = Math.max(b.sprite.position.y, effectiveGroundY(b.sprite.position.x, b.sprite.position.z) + 1.2);
    // Le modèle 3D regarde dans sa direction de déplacement (le sprite de repli, lui, fait toujours face caméra)
    if (!b.sprite.isSprite && _bearMove.lengthSq() > 1e-6) {
      _tmp.copy(b.sprite.position).add(_bearMove);
      b.sprite.lookAt(_tmp);
    }

    if (owlInvul <= 0 && buffs.invincible <= 0 && b.spawnGrace <= 0 && owlGroup.position.distanceTo(b.sprite.position) < COLLECT_RADIUS + 1) {
      lives--;
      screenShake = 25; hitFlash = 0.6;
      spawnFX(b.sprite.position, 16, 'death');
      if (lives <= 0) {
        best = Math.max(best, score);
        state = S.OVER;
        overReason = 'eaten';
        owlGroup.visible = false;
        document.body.style.cursor = 'default';
        if (document.pointerLockElement) document.exitPointerLock();
      } else {
        owlInvul = 120;
        spawnFX(owlGroup.position, 30, 'death', '-1 Vie !');
      }
    }
  }
  if (bears.length < bearTarget() && Math.random() < 0.02) bears.push(newBear());
}

// ══════════════════════════════════════════════════
//  PARTICULES (texte flottant / éclats) — 2D écran, projetées depuis la 3D à la création
// ══════════════════════════════════════════════════
let particles = [];
function worldToScreen(v) {
  const p = v.clone().project(camera);
  return { x: (p.x * 0.5 + 0.5) * hudCanvas.width, y: (-p.y * 0.5 + 0.5) * hudCanvas.height };
}
function spawnFX(worldPos, amount, type = 'collect', txt = '') {
  const s = worldToScreen(worldPos);
  for (let i = 0; i < amount; i++) {
    const a = (i / amount) * Math.PI * 2, spd = rnd(2, 8);
    particles.push({
      type: 'dot', x: s.x, y: s.y,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life: 1,
      c: type === 'collect'
        ? ['#ffd700', '#7ec850', '#a8ff80', '#ffffff'][Math.floor(Math.random() * 4)]
        : ['#ff4444', '#ffaa00', '#ffffff'][Math.floor(Math.random() * 3)]
    });
  }
  if (txt) particles.push({ type: 'txt', x: s.x, y: s.y, vx: 0, vy: -3, life: 1.5, txt, tType: type });
}
function updateParticles() {
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    if (p.vx) p.vx *= 0.92;
    p.vy *= (p.type === 'txt' ? 0.95 : 0.92);
    p.life -= (p.type === 'txt' ? 0.02 : 0.03);
  }
  particles = particles.filter(p => p.life > 0);
}

function rrect(x, y, w, h, r, fill, stroke, lw) {
  hctx.beginPath(); hctx.roundRect(x, y, w, h, r);
  if (fill)   { hctx.fillStyle = fill; hctx.fill(); }
  if (stroke) { hctx.lineWidth = lw || 1.5; hctx.strokeStyle = stroke; hctx.stroke(); }
}

  // ── Boussole d'objectifs : flèches en bord d'écran vers le cadeau et la
