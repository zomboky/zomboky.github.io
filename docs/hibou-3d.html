<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🦉 Hibou 3D</title>

<!-- importmap : mappe 'three' vers le build local (docs/three/), même convention que space.html -->
<script type="importmap">
{
  "imports": {
    "three": "./three/build/three.module.min.js"
  }
}
</script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04040e; }
  canvas { position: fixed; top: 0; left: 0; display: block; }
  #hud { pointer-events: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>

<script type="module">
import * as THREE from 'three';

// ══════════════════════════════════════════════════
//  ÉTAT DU JEU
// ══════════════════════════════════════════════════
const S = { START: 0, PLAY: 1, OVER: 2 };
let state = S.START;

const MAX_COMBO_TIME = 120;
let score = 0, nest = 0, combo = 1, comboTimer = 0, lives = 1, best = 0;
let owlInvul = 0;
let screenShake = 0, hitFlash = 0;

const rnd = (a, b) => a + Math.random() * (b - a);

// ══════════════════════════════════════════════════
//  CANVAS / RENDERER / SCÈNE
// ══════════════════════════════════════════════════
const glCanvas  = document.getElementById('gl');
const hudCanvas = document.getElementById('hud');
const hctx = hudCanvas.getContext('2d');

const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04040e);
scene.fog = new THREE.FogExp2(0x0c1030, 0.028);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 500);

scene.add(new THREE.AmbientLight(0x8899ff, 0.55));
const moonLight = new THREE.DirectionalLight(0xccccff, 0.6);
moonLight.position.set(-60, 90, 30);
scene.add(moonLight);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshStandardMaterial({ color: 0x0a1a12, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  hudCanvas.width  = w;
  hudCanvas.height = h;
}
window.addEventListener('resize', resize);

// ══════════════════════════════════════════════════
//  VOLUME DE JEU (sphère 3D)
// ══════════════════════════════════════════════════
const ARENA_CENTER = new THREE.Vector3(0, 35, 0);
const ARENA_RADIUS  = 70;
const FLOOR_Y       = 1.5;

function randomPointInArena(minY, maxY) {
  let x, y, z;
  do {
    x = rnd(-1, 1); y = rnd(-1, 1); z = rnd(-1, 1);
  } while (x * x + y * y + z * z > 1);
  const dir = new THREE.Vector3(x, y, z).normalize();
  const r = ARENA_RADIUS * Math.cbrt(Math.random());
  const p = ARENA_CENTER.clone().add(dir.multiplyScalar(r));
  p.y = THREE.MathUtils.clamp(p.y, minY, maxY);
  return p;
}

// ══════════════════════════════════════════════════
//  ARBRES PROCÉDURAUX (InstancedMesh)
// ══════════════════════════════════════════════════
function makeTrees() {
  const palettes = [
    { trunk: 0x3a2a1e, leaf: [0x0e3d1e, 0x155226, 0x1f6b30] },
    { trunk: 0x2e2118, leaf: [0x123318, 0x1a4a22, 0x26612c] },
    { trunk: 0x332419, leaf: [0x173d24, 0x1f5230, 0x2a6b3a] }
  ];
  const count = 220;
  const trunkMat = new THREE.MeshStandardMaterial({ roughness: 1 });
  const leafMat  = new THREE.MeshStandardMaterial({ roughness: 1 });
  const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.25, 0.35, 1, 6), trunkMat, count);
  const leaves = new THREE.InstancedMesh(new THREE.ConeGeometry(1, 1, 7), leafMat, count);

  const dummy = new THREE.Object3D();
  const color = new THREE.Color();

  for (let i = 0; i < count; i++) {
    const angle = rnd(0, Math.PI * 2);
    const r = rnd(15, 85);
    const x = Math.cos(angle) * r, z = Math.sin(angle) * r;
    const trunkH = rnd(4, 10);
    const pal = palettes[i % 3];

    dummy.position.set(x, trunkH / 2, z);
    dummy.rotation.set(0, rnd(0, Math.PI * 2), 0);
    dummy.scale.set(1, trunkH, 1);
    dummy.updateMatrix();
    trunks.setMatrixAt(i, dummy.matrix);
    trunks.setColorAt(i, color.setHex(pal.trunk));

    const leafH = trunkH * 1.4, leafR = rnd(1.5, 2.6);
    dummy.position.set(x, trunkH + leafH * 0.45, z);
    dummy.scale.set(leafR, leafH, leafR);
    dummy.updateMatrix();
    leaves.setMatrixAt(i, dummy.matrix);
    leaves.setColorAt(i, color.setHex(pal.leaf[Math.floor(Math.random() * 3)]));
  }
  trunks.instanceMatrix.needsUpdate = true;
  leaves.instanceMatrix.needsUpdate = true;
  if (trunks.instanceColor) trunks.instanceColor.needsUpdate = true;
  if (leaves.instanceColor) leaves.instanceColor.needsUpdate = true;
  scene.add(trunks, leaves);
}

// ══════════════════════════════════════════════════
//  LE HIBOU — modèle 3D procédural + battement d'ailes
// ══════════════════════════════════════════════════
// Convention : l'avant du hibou est l'axe local -Z (comme une caméra Three.js).
function buildOwl() {
  const g = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x8a6a3d, roughness: 0.8 });
  const body = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), bodyMat);
  body.scale.set(0.8, 0.9, 1.3);
  g.add(body);

  const headMat = new THREE.MeshStandardMaterial({ color: 0xa5845a, roughness: 0.8 });
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.55, 10, 8), headMat);
  head.position.set(0, 0.5, -0.9);
  g.add(head);

  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffe066, emissive: 0xffb020, emissiveIntensity: 0.5 });
  for (const side of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), eyeMat);
    eye.position.set(side * 0.22, 0.55, -1.35);
    g.add(eye);
  }

  const beakMat = new THREE.MeshStandardMaterial({ color: 0xd68a2e, roughness: 0.6 });
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.35, 6), beakMat);
  beak.rotation.x = -Math.PI / 2;
  beak.position.set(0, 0.42, -1.5);
  g.add(beak);

  const tailMat = new THREE.MeshStandardMaterial({ color: 0x6b4f2a, roughness: 0.8 });
  const tail = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.7), tailMat);
  tail.position.set(0, 0, 1.1);
  g.add(tail);

  const wingMat = new THREE.MeshStandardMaterial({ color: 0x6b4f2a, roughness: 0.8, side: THREE.DoubleSide });
  const wings = [];
  for (const side of [-1, 1]) {
    const pivot = new THREE.Group();
    pivot.position.set(side * 0.75, 0.1, 0);
    const wing = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.05, 0.9), wingMat);
    wing.position.set(side * 0.8, 0, 0);
    pivot.add(wing);
    g.add(pivot);
    wings.push(pivot); // wings[0] = gauche (side -1), wings[1] = droite (side +1)
  }

  return { group: g, wings, body };
}

const owl = buildOwl();
const owlGroup = owl.group;
owlGroup.visible = false;
scene.add(owlGroup);

// Caméra rigidement attachée au hibou : elle hérite de TOUTE son orientation (roulis inclus).
camera.position.set(0, 2, 6.5);
camera.rotation.set(0, 0, 0);
owlGroup.add(camera);

let flapPhase = 0;
function updateFlap(dt, speedRatio) {
  const amp  = 0.5 + 0.7 * speedRatio;
  const rate = 5 + 14 * speedRatio;
  flapPhase += rate * dt;
  const s = Math.sin(flapPhase);
  const angle = -0.2 + s * amp;
  owl.wings[0].rotation.z = -angle;
  owl.wings[1].rotation.z = angle;
  owl.body.position.y = Math.sin(flapPhase * 0.5) * 0.05;
}

// ══════════════════════════════════════════════════
//  ENTRÉES — clavier (ZQSD/AE) + souris (joystick additionnel)
// ══════════════════════════════════════════════════
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') e.preventDefault();
  if (state === S.START || state === S.OVER) beginGame();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

let lastMouseX = null, lastMouseY = null;
let mouseDX = 0, mouseDY = 0;
window.addEventListener('pointermove', e => {
  if (lastMouseX !== null) { mouseDX += e.clientX - lastMouseX; mouseDY += e.clientY - lastMouseY; }
  lastMouseX = e.clientX; lastMouseY = e.clientY;
});
window.addEventListener('pointerdown', () => {
  if (state === S.START || state === S.OVER) beginGame();
});

// Vitesses angulaires (rad/s) et sensibilité souris — ajustables en polish
const YAW_RATE   = THREE.MathUtils.degToRad(60);
const PITCH_RATE = THREE.MathUtils.degToRad(50);
const ROLL_RATE  = THREE.MathUtils.degToRad(90);
const MOUSE_YAW_SENS   = 0.002;
const MOUSE_PITCH_SENS = 0.002;
const MOUSE_MAX_DELTA  = 0.05;

const THRUST_ACCEL = 18;
const BRAKE_DECEL  = 24;
const DRAG_PER_SEC  = 0.4;
const MAX_SPEED    = 28;
let speed = 0;

function updateFlight(dt) {
  const yawIn   = (keys['q'] ? 1 : 0) - (keys['d'] ? 1 : 0);
  const pitchIn = (keys['s'] ? 1 : 0) - (keys['z'] ? 1 : 0);
  const rollIn  = (keys['a'] ? 1 : 0) - (keys['e'] ? 1 : 0);

  let yawDelta   = yawIn * YAW_RATE * dt;
  let pitchDelta = pitchIn * PITCH_RATE * dt;
  const rollDelta = rollIn * ROLL_RATE * dt;

  const mdx = THREE.MathUtils.clamp(-mouseDX * MOUSE_YAW_SENS, -MOUSE_MAX_DELTA, MOUSE_MAX_DELTA);
  const mdy = THREE.MathUtils.clamp(-mouseDY * MOUSE_PITCH_SENS, -MOUSE_MAX_DELTA, MOUSE_MAX_DELTA);
  yawDelta   += mdx;
  pitchDelta += mdy;
  mouseDX = 0; mouseDY = 0;

  owlGroup.rotateY(yawDelta);
  owlGroup.rotateX(pitchDelta);
  owlGroup.rotateZ(rollDelta);

  if (keys[' ']) speed = Math.min(MAX_SPEED, speed + THRUST_ACCEL * dt);
  else if (keys['control']) speed = Math.max(0, speed - BRAKE_DECEL * dt);
  else speed = Math.max(0, speed * (1 - DRAG_PER_SEC * dt));

  owlGroup.translateZ(-speed * dt);

  // Clamp dans le volume 3D (sphère + plancher)
  const offset = owlGroup.position.clone().sub(ARENA_CENTER);
  const len = offset.length();
  if (len > ARENA_RADIUS) owlGroup.position.copy(ARENA_CENTER.clone().add(offset.setLength(ARENA_RADIUS)));
  if (owlGroup.position.y < FLOOR_Y) owlGroup.position.y = FLOOR_Y;

  return speed / MAX_SPEED;
}

// ══════════════════════════════════════════════════
//  TEXTURES EMOJI (ours, branches) — même technique que le rendu pixel-art du jeu 2D
// ══════════════════════════════════════════════════
function emojiTexture(str, size = 128) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const cctx = c.getContext('2d');
  cctx.font = Math.floor(size * 0.7) + 'px serif';
  cctx.textAlign = 'center'; cctx.textBaseline = 'middle';
  cctx.fillText(str, size / 2, size / 2 + size * 0.05);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}
const BRANCH_EMOJI = ['🪵', '🌿', '🍃', '🍂'];
const branchTextures = {};
for (const e of BRANCH_EMOJI) branchTextures[e] = emojiTexture(e);
const bearTexture = emojiTexture('🐻', 160);

// ══════════════════════════════════════════════════
//  BRANCHES / NID / SCORE / COMBO
// ══════════════════════════════════════════════════
const ROTTEN_LIFE = 600, ROTTEN_CHANCE = 0.08;
const COLLECT_RADIUS = 3;
let branches = [];

function newBranch() {
  const e = BRANCH_EMOJI[Math.floor(Math.random() * 4)];
  const rotten = Math.random() < ROTTEN_CHANCE;
  const mat = new THREE.SpriteMaterial({ map: branchTextures[e], transparent: true });
  if (rotten) mat.color.set(0x99775a);
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(2, 2, 1);
  const pos = randomPointInArena(3, 68);
  sprite.position.copy(pos);
  scene.add(sprite);
  return { sprite, rotten, w: rnd(0, Math.PI * 2), ws: rotten ? rnd(0.06, 0.11) : rnd(0.03, 0.07), age: 0, baseY: pos.y };
}
function removeBranch(i) {
  scene.remove(branches[i].sprite);
  branches[i].sprite.material.dispose();
  branches.splice(i, 1);
}

function updateBranches() {
  for (let i = branches.length - 1; i >= 0; i--) {
    const br = branches[i];
    br.w += br.ws;
    br.sprite.position.y = br.baseY + Math.sin(br.w) * 0.4;

    if (br.rotten) {
      br.age++;
      if (br.age >= ROTTEN_LIFE) { removeBranch(i); branches.push(newBranch()); continue; }
    }

    if (owlGroup.position.distanceTo(br.sprite.position) < COLLECT_RADIUS) {
      if (br.rotten) {
        combo = 0; comboTimer = 0;
        screenShake = Math.max(screenShake, 9);
        hitFlash = Math.max(hitFlash, 0.35);
        spawnFX(br.sprite.position, 14, 'death', 'COMBO RESET 🤢');
      } else {
        const gain = Math.max(1, combo);
        score += gain; nest += 1;
        if (nest >= 100) {
          nest %= 100; lives++;
          spawnFX(owlGroup.position, 30, 'collect', '+1 VIE ! ❤️');
          screenShake = 15;
        }
        screenShake = Math.min(4 + combo * 0.5, 15);
        spawnFX(br.sprite.position, 12, 'collect', `+${gain}`);
        combo = Math.max(1, combo) + 1; comboTimer = MAX_COMBO_TIME;
        while (bears.length < bearTarget()) bears.push(newBear());
      }
      removeBranch(i);
      branches.push(newBranch());
    }
  }
  if (comboTimer > 0) comboTimer--; else combo = 1;
}

// ══════════════════════════════════════════════════
//  OURS
// ══════════════════════════════════════════════════
let bears = [];
function bearTarget() { return Math.min(2 + Math.floor(score / 15), 10); }

function newBear() {
  const mat = new THREE.SpriteMaterial({ map: bearTexture, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(2.6, 2.6, 1);

  const angle = rnd(0, Math.PI * 2);
  const elev = rnd(-0.4, 0.4);
  const distR = rnd(40, 60);
  const dir = new THREE.Vector3(Math.cos(angle) * Math.cos(elev), Math.sin(elev), Math.sin(angle) * Math.cos(elev));
  let pos = owlGroup.position.clone().add(dir.multiplyScalar(distR));
  const offset = pos.clone().sub(ARENA_CENTER);
  if (offset.length() > ARENA_RADIUS) offset.setLength(ARENA_RADIUS * 0.95);
  pos = ARENA_CENTER.clone().add(offset);
  pos.y = THREE.MathUtils.clamp(pos.y, 3, 68);
  sprite.position.copy(pos);
  scene.add(sprite);

  const updateDelay = rnd(20, 80);
  return {
    sprite,
    life: rnd(480, 1200),
    spdBase: 1.8 + Math.min(score * 0.05, 4.5),
    target: owlGroup.position.clone(),
    updateDelay, updateTimer: Math.floor(rnd(0, updateDelay)),
    drift: new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize().multiplyScalar(rnd(0.3, 1.4)),
    bob: rnd(0, Math.PI * 2),
    spawnPulse: 1
  };
}
function removeBear(i) {
  scene.remove(bears[i].sprite);
  bears[i].sprite.material.dispose();
  bears.splice(i, 1);
}

function updateBears() {
  for (let i = bears.length - 1; i >= 0; i--) {
    const b = bears[i];
    b.life--;
    if (b.life <= 0) {
      spawnFX(b.sprite.position, 6, 'death');
      removeBear(i);
      if (bears.length < bearTarget()) bears.push(newBear());
      continue;
    }
    b.bob += 0.12;
    if (b.spawnPulse > 0) b.spawnPulse = Math.max(0, b.spawnPulse - 0.05);
    b.sprite.scale.setScalar(2.6 * (1 - b.spawnPulse * 0.6));

    b.updateTimer--;
    if (b.updateTimer <= 0) {
      b.updateTimer = b.updateDelay;
      b.drift.set(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize().multiplyScalar(rnd(0.3, 1.4));
      b.target.copy(owlGroup.position);
    }
    const toTarget = b.target.clone().sub(b.sprite.position).add(b.drift.clone().multiplyScalar(30));
    const d = toTarget.length() || 1;
    b.sprite.position.add(toTarget.multiplyScalar(b.spdBase / d));
    b.sprite.position.y += Math.sin(b.bob) * 0.02;

    if (owlInvul <= 0 && owlGroup.position.distanceTo(b.sprite.position) < COLLECT_RADIUS + 1) {
      lives--;
      screenShake = 25; hitFlash = 0.6;
      spawnFX(b.sprite.position, 16, 'death');
      if (lives <= 0) {
        best = Math.max(best, score);
        state = S.OVER;
        owlGroup.visible = false;
        document.body.style.cursor = 'default';
      } else {
        owlInvul = 120;
        spawnFX(owlGroup.position, 30, 'death', '-1 Vie !');
      }
    }
  }
  if (bears.length < bearTarget() && Math.random() < 0.02) bears.push(newBear());
}

// ══════════════════════════════════════════════════
//  PARTICULES (texte flottant / éclats) — 2D écran, projetées depuis la 3D à la création
// ══════════════════════════════════════════════════
let particles = [];
function worldToScreen(v) {
  const p = v.clone().project(camera);
  return { x: (p.x * 0.5 + 0.5) * hudCanvas.width, y: (-p.y * 0.5 + 0.5) * hudCanvas.height };
}
function spawnFX(worldPos, amount, type = 'collect', txt = '') {
  const s = worldToScreen(worldPos);
  for (let i = 0; i < amount; i++) {
    const a = (i / amount) * Math.PI * 2, spd = rnd(2, 8);
    particles.push({
      type: 'dot', x: s.x, y: s.y,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life: 1,
      c: type === 'collect'
        ? ['#ffd700', '#7ec850', '#a8ff80', '#ffffff'][Math.floor(Math.random() * 4)]
        : ['#ff4444', '#ffaa00', '#ffffff'][Math.floor(Math.random() * 3)]
    });
  }
  if (txt) particles.push({ type: 'txt', x: s.x, y: s.y, vx: 0, vy: -3, life: 1.5, txt, tType: type });
}
function updateParticles() {
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    if (p.vx) p.vx *= 0.92;
    p.vy *= (p.type === 'txt' ? 0.95 : 0.92);
    p.life -= (p.type === 'txt' ? 0.02 : 0.03);
  }
  particles = particles.filter(p => p.life > 0);
}

// ══════════════════════════════════════════════════
//  HUD / ÉCRANS (canvas 2D superposé, indépendant de la caméra 3D)
// ══════════════════════════════════════════════════
function rrect(x, y, w, h, r, fill, stroke, lw) {
  hctx.beginPath(); hctx.roundRect(x, y, w, h, r);
  if (fill)   { hctx.fillStyle = fill; hctx.fill(); }
  if (stroke) { hctx.lineWidth = lw || 1.5; hctx.strokeStyle = stroke; hctx.stroke(); }
}

function drawHUD() {
  hctx.save();
  rrect(12, 12, 230, 80, 14, 'rgba(8,8,35,0.82)', 'rgba(100,90,220,0.4)');
  hctx.fillStyle = '#dde'; hctx.font = 'bold 16px system-ui';
  hctx.textAlign = 'left'; hctx.textBaseline = 'middle';
  hctx.fillText('Score : ' + score, 24, 32);

  let livesStr = ''; for (let i = 0; i < lives; i++) livesStr += '❤️';
  hctx.font = '12px system-ui'; hctx.fillText(livesStr, 140, 32);

  if (combo > 1 && comboTimer > 0) {
    hctx.fillStyle = '#ffaa00'; hctx.font = 'bold 13px system-ui';
    hctx.fillText('🔥 Combo x' + combo, 24, 50);
    const cbW = 80 * (comboTimer / MAX_COMBO_TIME);
    rrect(120, 46, 80, 6, 3, 'rgba(255,255,255,0.1)');
    rrect(120, 46, Math.max(0, cbW), 6, 3, '#ffaa00');
  }

  const barY = 62;
  rrect(22, barY, 190, 10, 5, 'rgba(255,255,255,0.1)');
  const bw = Math.max(10, 190 * nest / 100);
  const bar = hctx.createLinearGradient(22, 0, 212, 0);
  bar.addColorStop(0, '#5cc83a'); bar.addColorStop(1, '#d4a800');
  rrect(22, barY, bw, 10, 5, bar);
  hctx.fillStyle = '#fff'; hctx.font = 'bold 9px system-ui'; hctx.textAlign = 'center';
  hctx.fillText('NID ' + nest + '% ➔ +1 ❤️', 117, barY + 5);
  hctx.restore();
}

function drawStart() {
  const W = hudCanvas.width, H = hudCanvas.height;
  hctx.save();
  hctx.fillStyle = 'rgba(4,4,18,0.75)'; hctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  rrect(cx - 190, cy - 220, 380, 420, 28, 'rgba(12,12,48,0.96)', 'rgba(110,90,255,0.45)');
  hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
  hctx.font = '60px serif'; hctx.fillText('🦉', cx, cy - 160);
  hctx.fillStyle = '#cbc3ff'; hctx.font = '900 28px system-ui';
  hctx.fillText('HIBOU 3D', cx, cy - 100);
  hctx.fillStyle = '#cbc3dd'; hctx.font = '14px system-ui';
  hctx.fillText('Q / D = lacet (yaw)', cx, cy - 50);
  hctx.fillText('Z / S = tangage (pitch)', cx, cy - 28);
  hctx.fillText('A / E = roulis (roll)', cx, cy - 6);
  hctx.fillText('Espace = accélérer   Ctrl = freiner', cx, cy + 20);
  hctx.fillText('Souris = pilotage additionnel (yaw/pitch)', cx, cy + 44);
  hctx.fillStyle = '#fff'; hctx.font = 'bold 18px system-ui';
  hctx.fillText('Clique ou appuie sur une touche', cx, cy + 100);
  hctx.fillText('pour décoller', cx, cy + 124);
  hctx.restore();
}

function drawOver() {
  const W = hudCanvas.width, H = hudCanvas.height;
  hctx.save();
  hctx.fillStyle = 'rgba(255,0,0,0.28)'; hctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  rrect(cx - 150, cy - 180, 300, 360, 28, 'rgba(22,8,30,0.97)', 'rgba(255,70,70,0.8)');
  hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
  hctx.fillStyle = '#ffaaaa'; hctx.font = '900 32px system-ui';
  hctx.fillText('MANGÉ !', cx, cy - 100);
  hctx.fillStyle = '#e8e5ff'; hctx.font = '18px system-ui';
  hctx.fillText('Score final : ' + score, cx, cy - 30);
  if (best > 0) {
    hctx.fillStyle = (score >= best && score > 0) ? '#ffaa00' : '#c0b0ff';
    hctx.font = 'bold 16px system-ui';
    hctx.fillText('Record : ' + best, cx, cy);
  }
  const medal = score >= 100 ? '👑' : score >= 50 ? '🥇' : score >= 20 ? '🥈' : '🪺';
  hctx.font = '45px serif'; hctx.fillText(medal, cx, cy + 50);
  hctx.fillStyle = '#fff'; hctx.font = 'bold 18px system-ui';
  hctx.fillText('Clique ou appuie pour rejouer', cx, cy + 135);
  hctx.restore();
}

function drawOverlay() {
  hctx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
  hctx.save();
  if (screenShake > 0) hctx.translate(rnd(-screenShake, screenShake), rnd(-screenShake, screenShake));

  if (state === S.START) {
    drawStart();
  } else {
    for (const p of particles) {
      hctx.save(); hctx.globalAlpha = Math.max(0, p.life);
      if (p.type === 'txt') {
        hctx.fillStyle = p.tType === 'death' ? '#ff3333' : '#ffd700';
        hctx.font = '900 24px system-ui';
        hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
        hctx.shadowColor = '#000'; hctx.shadowBlur = 8;
        hctx.fillText(p.txt, p.x, p.y);
      } else {
        hctx.fillStyle = p.c;
        hctx.beginPath(); hctx.arc(p.x, p.y, rnd(2, 6), 0, Math.PI * 2); hctx.fill();
      }
      hctx.restore();
    }
    drawHUD();
    if (state === S.OVER) drawOver();
  }

  if (hitFlash > 0) {
    hctx.save(); hctx.globalAlpha = hitFlash; hctx.fillStyle = '#ff2222';
    hctx.fillRect(0, 0, hudCanvas.width, hudCanvas.height);
    hctx.restore();
  }
  hctx.restore();
}

// ══════════════════════════════════════════════════
//  INIT / RESET
// ══════════════════════════════════════════════════
function beginGame() {
  state = S.PLAY;
  document.body.style.cursor = 'none';
  score = 0; nest = 0; combo = 1; comboTimer = 0; lives = 1;
  screenShake = 0; hitFlash = 0; owlInvul = 60; speed = 0;

  owlGroup.position.copy(ARENA_CENTER);
  owlGroup.quaternion.identity();
  owlGroup.visible = true;

  for (const br of branches) { scene.remove(br.sprite); br.sprite.material.dispose(); }
  for (const b of bears)     { scene.remove(b.sprite);  b.sprite.material.dispose(); }
  branches = Array.from({ length: 8 }, newBranch);
  bears = [newBear(), newBear()];
  particles = [];
}

// ══════════════════════════════════════════════════
//  BOUCLE PRINCIPALE
// ══════════════════════════════════════════════════
const clock = new THREE.Clock();

function update() {
  const dt = Math.min(clock.getDelta(), 0.05);

  if (screenShake > 0) { screenShake *= 0.9; if (screenShake < 0.5) screenShake = 0; }
  if (hitFlash    > 0) { hitFlash    *= 0.85; if (hitFlash < 0.01) hitFlash = 0; }

  if (state === S.PLAY) {
    if (owlInvul > 0) owlInvul--;
    const speedRatio = updateFlight(dt);
    updateFlap(dt, speedRatio);
    updateBranches();
    updateBears();
    owlGroup.visible = !(owlInvul > 0 && Math.floor(Date.now() / 80) % 2 !== 0);
  } else {
    mouseDX = 0; mouseDY = 0;
  }
  updateParticles();
}

function render() {
  renderer.render(scene, camera);
  drawOverlay();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

resize();
makeTrees();
loop();
</script>
</body>
</html>
