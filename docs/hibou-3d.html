<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './three/examples/jsm/loaders/GLTFLoader.js';
import { OBJLoader } from './three/examples/jsm/loaders/OBJLoader.js';
import { clone as skeletonClone } from './three/examples/jsm/utils/SkeletonUtils.js';
import { initMultiplayer, auraColorHex } from './scripts/hibou3d-multiplayer.js';

// Modèles 3D externes (voir docs/models/CREDITS.md pour les licences/attributions) :
// hibou, ours, lune © Poly by Google (CC-BY 3.0) — arbres, montagnes, nuages © Quaternius (CC0).

// ══════════════════════════════════════════════════
//  ÉTAT DU JEU
// ══════════════════════════════════════════════════
const S = { START: 0, PLAY: 1, OVER: 2, PAUSED: 3, LOOT: 4, MP_LOBBY: 5, MP_DEAD: 6, CAMPAIGN_SELECT: 7, LEVEL_END: 8, CUTSCENE: 9, CAMPAIGN_LOCK: 10, QUICK_SELECT: 11 };
let state = S.START;

const MAX_COMBO_TIME = 120;
let score = 0, nest = 0, combo = 1, comboTimer = 0, lives = 1, best = 0;
let overReason = 'eaten'; // 'eaten' (ours) ou 'crash' (sol) — affiché par drawOver()
let owlInvul = 0;
let treeCooldown = 0;
let rockInvul = 0; // invulnérabilité dédiée aux rochers de tempête, indépendante de celle des ours

// ── Buffs / cadeaux (durées en SECONDES, décrémentées par dt) ──
let buffs = { speed: 0, multi: 0, slow: 0, invincible: 0 };
let giftItem = null;

const LOOT_TYPES = [
  { id: 'speed',      e: '⚡', txt: 'Vitesse Éclair !',   weight: 0.35 },
  { id: 'slow',       e: '❄️', txt: 'Ours Gelés !',       weight: 0.25 },
  { id: 'multi',      e: '✨', txt: 'Score x5 !',         weight: 0.20 },
  { id: 'life',       e: '❤️', txt: '+1 Vie !',           weight: 0.15 },
  { id: 'invincible', e: '🦉', txt: 'HIBOU INVINCIBLE !', weight: 0.05 }
];

function rollLoot() {
  let r = Math.random(), cumul = 0;
  for (const loot of LOOT_TYPES) {
    cumul += loot.weight;
    if (r < cumul) return loot;
  }
  return LOOT_TYPES[0];
}

let screenShake = 0, hitFlash = 0;
let roundTime = 0; // secondes écoulées dans la partie en cours — pilote la rampe de difficulté des ours
const BEAR_RAMP_TIME = 90; // durée (s) pour que les ours atteignent leur pleine intensité (hors lunes)

// ── Ralenti d'impact (« hit stop ») : le temps se fige un bref instant sur les gros chocs ──
let hitStopTimer = 0, hitStopScale = 0.25;
function triggerHitStop(duration = 0.22, scale = 0.25) {
  hitStopTimer = Math.max(hitStopTimer, duration);
  hitStopScale = scale;
}

const rnd = (a, b) => a + Math.random() * (b - a);

// PRNG déterministe (mulberry32) — utilisé UNIQUEMENT pour le placement des
// arbres (makeTrees) : cette disposition doit être identique sur tous les
// navigateurs pour que la carte soit la même en multijoueur. Le reste du jeu
// (rochers, effets, loot…) continue d'utiliser Math.random(), aléatoire par
// session, ce qui ne pose pas de problème car ces éléments sont dynamiques.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let treeRng = mulberry32(20260715);
const treeRnd = (a, b) => a + treeRng() * (b - a);

// Appareil tactile = supposé modeste : budgets de particules/forêt/nuages réduits d'office.
// (Même détection que isMobile plus bas, mais évaluée tôt car les constantes de budget en dépendent.)
const LOW_SPEC = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

// ══════════════════════════════════════════════════
//  CANVAS / RENDERER / SCÈNE
// ══════════════════════════════════════════════════
const glCanvas  = document.getElementById('gl');
const hudCanvas = document.getElementById('hud');
const hctx = hudCanvas.getContext('2d');

const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: !LOW_SPEC });
// Ombres : seul le soleil (cycle jour/nuit) en projette, jamais sur mobile (voir
// updateDayNightCycle qui gate moonLight.castShadow à `dayFactor > seuil && !LOW_SPEC`).
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const PIXEL_RATIO_MAX = Math.min(window.devicePixelRatio || 1, LOW_SPEC ? 1.5 : 2);

// ── Résolution adaptative : si les FPS s'effondrent, on baisse la définition de rendu
//    par paliers (jusqu'à -45 %), et on la remonte quand la fluidité revient.
//    Sur mobile, on démarre déjà pré-réduit (0.7) et on plafonne la remontée à 0.85. ──
let perfAccum = 0, perfFrames = 0, pixelScale = LOW_SPEC ? 0.7 : 1;
const PIXEL_SCALE_MAX = LOW_SPEC ? 0.85 : 1;
const PERF_FPS_LOW = LOW_SPEC ? 50 : 45;
renderer.setPixelRatio(PIXEL_RATIO_MAX * pixelScale);
function updateAdaptiveQuality(rawDt) {
  perfAccum += rawDt; perfFrames++;
  if (perfAccum < 1.5) return;              // fenêtre de mesure d'1,5 s
  const fps = perfFrames / perfAccum;
  perfAccum = 0; perfFrames = 0;
  if (fps < PERF_FPS_LOW && pixelScale > 0.55)         pixelScale = Math.max(0.55, pixelScale - 0.15);
  else if (fps > 57 && pixelScale < PIXEL_SCALE_MAX)   pixelScale = Math.min(PIXEL_SCALE_MAX, pixelScale + 0.1);
  else return;
  renderer.setPixelRatio(PIXEL_RATIO_MAX * pixelScale);
}

// Dégradé de ciel : nuit (teintes de drawSky() du jeu 2D) ↔ jour, lerpés par updateDayNightCycle.
function makeSkyGradient(topHex, bottomHex) {
  const canvas = document.createElement('canvas');
  canvas.width = 2;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, topHex);
  grad.addColorStop(1, bottomHex);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

const scene = new THREE.Scene();
scene.background = makeSkyGradient('#04040e', '#0c1030');
// Brouillard configuré plus bas, une fois ARENA_RADIUS_XZ connu (doit estomper le terrain
// juste après le mur invisible pour qu'on ne voie plus de sol "accessible" au-delà de la limite).

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 3200); // plan éloigné repoussé pour garder lune/étoiles visibles à leur nouvelle distance

const ambientLight = new THREE.AmbientLight(0x8899ff, 0.9);
scene.add(ambientLight);
const moonLight = new THREE.DirectionalLight(0xccccff, 2.2);
moonLight.position.set(-60, 90, 30);
scene.add(moonLight);
scene.add(moonLight.target); // cible suivie chaque frame (updateDayNightCycle) : centre la caméra d'ombre sur le hibou
moonLight.shadow.mapSize.set(1536, 1536);
moonLight.shadow.camera.near = 5;
moonLight.shadow.camera.far = 400;
moonLight.shadow.camera.left = -180;
moonLight.shadow.camera.right = 180;
moonLight.shadow.camera.top = 180;
moonLight.shadow.camera.bottom = -180;
moonLight.shadow.bias = -0.0018;
const fillLight = new THREE.HemisphereLight(0x9fb4ff, 0x24361f, 0.7);
scene.add(fillLight);

// ══════════════════════════════════════════════════
//  CYCLE JOUR/NUIT — boucle continue basée sur l'horloge murale (Date.now()), donc
//  naturellement synchrone entre clients multijoueur sans aucune donnée réseau.
//  moonLight fait office d'unique lumière céleste : soleil le jour, lune la nuit.
// ══════════════════════════════════════════════════
const DAY_NIGHT_CYCLE_SECONDS = 480; // 8 minutes, boucle continue
const SUN_COLOR = new THREE.Color(0xfff4d6);
const SUN_BASE_LIGHT = 1.8, SUN_PEAK_LIGHT = 3.4;
const AMBIENT_NIGHT_INTENSITY = 0.9, AMBIENT_DAY_INTENSITY = 1.3;
const AMBIENT_NIGHT_COLOR = new THREE.Color(0x8899ff), AMBIENT_BLOOD_COLOR = new THREE.Color(0xff6666);
const AMBIENT_DAY_COLOR = new THREE.Color(0xbfe0ff);
const FILL_SKY_NIGHT = new THREE.Color(0x9fb4ff), FILL_SKY_DAY = new THREE.Color(0xbfe0ff);
const FILL_GROUND_NIGHT = new THREE.Color(0x24361f), FILL_GROUND_DAY = new THREE.Color(0x3a4a28);
const SKY_NIGHT_TOP = new THREE.Color(0x04040e), SKY_NIGHT_BOTTOM = new THREE.Color(0x0c1030);
const SKY_DAY_TOP = new THREE.Color(0x3a7bd5), SKY_DAY_BOTTOM = new THREE.Color(0xbfe4ff);
const FOG_CLEAR_NIGHT = new THREE.Color(0x0c1030), FOG_CLEAR_DAY = new THREE.Color(0x9cc7e8);
let dayFactor = 0; // 0 = nuit pleine, 1 = jour plein (transition douce à l'horizon)
let sunMesh;
const _sunDir = new THREE.Vector3(), _moonDir = new THREE.Vector3();
const _dnNightColor = new THREE.Color(), _dnAmbientNightTarget = new THREE.Color();
const _dnSkyTop = new THREE.Color(), _dnSkyBottom = new THREE.Color();
let dayNightAmbientBase = AMBIENT_NIGHT_INTENSITY; // lu par updateWeatherFX (remplace l'ancien 0.9 en dur)
let skyGradientTimer = 0;

function updateSkyGradient() {
  _dnSkyTop.lerpColors(SKY_NIGHT_TOP, SKY_DAY_TOP, dayFactor);
  _dnSkyBottom.lerpColors(SKY_NIGHT_BOTTOM, SKY_DAY_BOTTOM, dayFactor);
  if (scene.background && scene.background.isTexture) scene.background.dispose();
  scene.background = makeSkyGradient('#' + _dnSkyTop.getHexString(), '#' + _dnSkyBottom.getHexString());
}

function updateDayNightCycle(dt) {
  const phase = (Date.now() / 1000 % DAY_NIGHT_CYCLE_SECONDS) / DAY_NIGHT_CYCLE_SECONDS;
  const angle = phase * Math.PI * 2;
  _sunDir.set(Math.cos(angle), Math.sin(angle), 0.35).normalize();
  _moonDir.set(-_sunDir.x, -_sunDir.y, -_sunDir.z);
  const elev = _sunDir.y;
  dayFactor = THREE.MathUtils.smoothstep(elev, -0.05, 0.05);

  // Astres : deux meshes distincts aux extrémités opposées du même arc, cachés sous l'horizon.
  if (sunMesh)  { sunMesh.position.copy(_sunDir).multiplyScalar(MOON_DISTANCE);  sunMesh.visible  = _sunDir.y  > -0.05; }
  if (moonMesh) { moonMesh.position.copy(_moonDir).multiplyScalar(MOON_DISTANCE); moonMesh.visible = _moonDir.y > -0.05; }

  // Lumière céleste unique : positionnée PRÈS DU JOUEUR (pas à la distance des astres) pour
  // que le frustum de la caméra d'ombre reste petit et net (voir shadow.camera.* ci-dessus).
  const activeDir = dayFactor > 0.5 ? _sunDir : _moonDir;
  moonLight.position.copy(owlGroup.position).addScaledVector(activeDir, 150);
  moonLight.target.position.copy(owlGroup.position);
  moonLight.castShadow = dayFactor > 0.15 && !LOW_SPEC;

  const nightIntensity = THREE.MathUtils.lerp(MOON_BASE_LIGHT, MOON_FULL_LIGHT, moon.fillProgress);
  _dnNightColor.lerpColors(MOON_COLOR_NORMAL, MOON_COLOR_BLOOD, moon.state === 'blood' ? moon.fillProgress : 0);
  const dayIntensity = THREE.MathUtils.lerp(SUN_BASE_LIGHT, SUN_PEAK_LIGHT, THREE.MathUtils.clamp(elev, 0, 1));
  moonLight.intensity = THREE.MathUtils.lerp(nightIntensity, dayIntensity, dayFactor);
  moonLight.color.lerpColors(_dnNightColor, SUN_COLOR, dayFactor);

  _dnAmbientNightTarget.copy(moon.state === 'blood' ? AMBIENT_BLOOD_COLOR : AMBIENT_NIGHT_COLOR);
  ambientLight.color.lerpColors(_dnAmbientNightTarget, AMBIENT_DAY_COLOR, dayFactor);
  dayNightAmbientBase = THREE.MathUtils.lerp(AMBIENT_NIGHT_INTENSITY, AMBIENT_DAY_INTENSITY, dayFactor);

  fillLight.color.lerpColors(FILL_SKY_NIGHT, FILL_SKY_DAY, dayFactor);
  fillLight.groundColor.lerpColors(FILL_GROUND_NIGHT, FILL_GROUND_DAY, dayFactor);

  if (starMat) starMat.opacity = 0.95 * (1 - dayFactor);

  FOG_CLEAR.lerpColors(FOG_CLEAR_NIGHT, FOG_CLEAR_DAY, dayFactor);

  skyGradientTimer -= dt;
  if (skyGradientTimer <= 0) { skyGradientTimer = 1; updateSkyGradient(); }
}

// Le sol plat d'origine est remplacé par un terrain procédural (voir section TERRAIN) :
// relief fBm, montagnes gaussiennes, lacs sous le niveau d'eau, colorisation par altitude/pente.

// ══════════════════════════════════════════════════
//  CIEL — étoiles + lune (vrai objet 3D sphérique, pas un sprite repeint à chaque frame)
// ══════════════════════════════════════════════════
let moonMesh;
let moonMaterials = []; // matériaux émissifs de la lune (1 pour la sphère de repli, n pour le GLB)
let starGeo, starBaseColors, starPhases, starMat;
const MOON_DISTANCE    = 2400;  // distance au centre de l'arène, bien au-delà d'ARENA_RADIUS_XZ/Y
const SUN_RADIUS       = 210;   // disque solaire, même ordre de grandeur que MOON_RADIUS
const MOON_RADIUS      = 225;   // rayon de base (mis à l'échelle avec MOON_DISTANCE pour garder la taille apparente)
const MOON_FULL_SCALE  = 1.7;
const MOON_BASE_LIGHT  = 2.2, MOON_FULL_LIGHT = 3.6; // la lune éclaire davantage le sol qu'auparavant
const MOON_COLOR_NORMAL = new THREE.Color(0xfff2d0);
const MOON_COLOR_BLOOD  = new THREE.Color(0xff2a2a);

// Texture de surface (cratères) générée UNE SEULE FOIS sur un canvas offscreen,
// puis appliquée à une vraie THREE.SphereGeometry — la 3D (relief, silhouette,
// parallaxe) vient de la géométrie elle-même, pas d'un dessin 2D reconstruit en boucle.
function makeMoonSurfaceTexture() {
  const size = 512;
  const cvs = document.createElement('canvas');
  cvs.width = cvs.height = size;
  const c = cvs.getContext('2d');
  c.fillStyle = '#e9e3cf';
  c.fillRect(0, 0, size, size);
  for (let i = 0; i < 55; i++) {
    const x = rnd(0, size), y = rnd(0, size), r = rnd(8, 46);
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(55,45,35,0.38)');
    g.addColorStop(1, 'rgba(55,45,35,0)');
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  }
  const tex = new THREE.CanvasTexture(cvs);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const STAR_COUNT = LOW_SPEC ? 500 : 1600;
function makeSky() {
  const starCount = STAR_COUNT;
  const positions = new Float32Array(starCount * 3);
  const colors = new Float32Array(starCount * 3);
  const palette = [new THREE.Color(0xffffff), new THREE.Color(0xaaccff), new THREE.Color(0xffe9c4)];
  const c = new THREE.Color();
  starBaseColors = new Float32Array(starCount * 3);
  starPhases = new Array(starCount);
  for (let i = 0; i < starCount; i++) {
    const r = rnd(1700, 2500); // bien au-delà d'ARENA_RADIUS_XZ/Y : jamais dans la zone de jeu
    const theta = rnd(0, Math.PI * 2), phi = Math.acos(rnd(-1, 1));
    positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = Math.abs(r * Math.cos(phi)) + 10;
    positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    c.copy(palette[Math.floor(Math.random() * palette.length)]);
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
    starBaseColors[i * 3] = c.r; starBaseColors[i * 3 + 1] = c.g; starBaseColors[i * 3 + 2] = c.b;
    starPhases[i] = { a: rnd(0, 1), da: rnd(0.005, 0.02) * (Math.random() < 0.5 ? 1 : -1) };
  }
  starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  starMat = new THREE.PointsMaterial({
    size: 8, vertexColors: true, transparent: true, opacity: 0.95,
    depthWrite: false, sizeAttenuation: true, fog: false
  });
  scene.add(new THREE.Points(starGeo, starMat));

  // Disque solaire : simple sphère non éclairée (toujours pleinement lumineuse), à l'opposé
  // de la lune sur le même arc (voir updateDayNightCycle) — pas de cratères, pas de phases.
  sunMesh = new THREE.Mesh(
    new THREE.SphereGeometry(SUN_RADIUS, 24, 16),
    new THREE.MeshBasicMaterial({ color: SUN_COLOR, fog: false })
  );
  scene.add(sunMesh);

  const moonPos = moonLight.position.clone().normalize().multiplyScalar(MOON_DISTANCE);
  moonMesh = new THREE.Group(); // groupe extérieur : updateMoonVisual pilote scale/rotation dessus
  moonMaterials = [];
  if (models.moon) {
    // Modèle GLB low-poly : matériaux clonés puis rendus émissifs (la lune éclaire, elle n'est pas éclairée)
    const norm = normalizeModel(models.moon, { height: MOON_RADIUS * 2, groundAlign: false });
    norm.traverse(o => {
      if (o.isMesh) {
        o.material = o.material.clone();
        o.material.emissive = MOON_COLOR_NORMAL.clone();
        o.material.emissiveMap = o.material.map || null;
        o.material.emissiveIntensity = MOON_BASE_LIGHT;
        o.material.fog = false;
        moonMaterials.push(o.material);
      }
    });
    moonMesh.add(norm);
  } else {
    const moonSurfaceTex = makeMoonSurfaceTexture();
    const mat = new THREE.MeshStandardMaterial({
      map: moonSurfaceTex,
      emissiveMap: moonSurfaceTex,
      emissive: MOON_COLOR_NORMAL,
      emissiveIntensity: MOON_BASE_LIGHT,
      roughness: 1, metalness: 0,
      fog: false
    });
    moonMesh.add(new THREE.Mesh(new THREE.SphereGeometry(MOON_RADIUS, 48, 32), mat));
    moonMaterials.push(mat);
  }
  moonMesh.position.copy(moonPos);
  scene.add(moonMesh);
}

// ══════════════════════════════════════════════════
//  PARTICULES 3D VOLUMÉTRIQUES — pool unique de points additifs recyclés :
//  gerbes de collecte, poussière d'impact des rochers, éclats de choc,
//  étincelles du cadeau, traînée de boost. (Les particules 2D du HUD restent
//  pour le texte flottant ; celles-ci vivent DANS la scène, avec la parallaxe.)
// ══════════════════════════════════════════════════
const FX3D_MAX = LOW_SPEC ? 90 : 320;
let fx3d, fx3dData = [], fx3dCursor = 0;
// grav = accélération vers le bas (négatif : flotte vers le haut), up = impulsion verticale initiale
const FX3D_KINDS = {
  collect: { colors: [0xffd700, 0x9fff6a, 0xfff6c0], speed: [4, 11],    life: [0.5, 0.9],  grav: 3,   up: 4 },
  dust:    { colors: [0x8a7a5c, 0x6f6a58, 0x9c8f70], speed: [2, 7],     life: [0.6, 1.1],  grav: 6,   up: 5 },
  burst:   { colors: [0xff5533, 0xffaa00, 0xffffff], speed: [5, 14],    life: [0.4, 0.8],  grav: 4,   up: 3 },
  sparkle: { colors: [0xffe066, 0xfff2b0, 0xffc030], speed: [3, 9],     life: [0.7, 1.3],  grav: -1,  up: 5 },
  trail:   { colors: [0x9fd8ff, 0xe8f6ff],           speed: [0.4, 1.6], life: [0.25, 0.5], grav: 0,   up: 0.5 },
  smoke:   { colors: [0x1a1a1a, 0x0d0d0d, 0x2a2a2a], speed: [0.3, 1.0], life: [0.6, 1.4],  grav: -0.4, up: 0.8 }
};

function makeFX3D() {
  const positions = new Float32Array(FX3D_MAX * 3);
  const colors = new Float32Array(FX3D_MAX * 3);
  for (let i = 0; i < FX3D_MAX; i++) {
    fx3dData.push({ alive: false, pos: new THREE.Vector3(), vel: new THREE.Vector3(), life: 0, maxLife: 1, color: new THREE.Color(), grav: 0 });
    positions[i * 3 + 1] = -9999; // parqué hors champ tant que mort
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    map: glowTexture, size: 1.5, vertexColors: true, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
  });
  fx3d = new THREE.Points(geo, mat);
  fx3d.frustumCulled = false;
  scene.add(fx3d);
}

function spawnFX3D(worldPos, amount, kind = 'collect', colorOverride = null) {
  if (!fx3d) return;
  const spec = FX3D_KINDS[kind];
  const palette = colorOverride || spec.colors;
  for (let n = 0; n < amount; n++) {
    const d = fx3dData[fx3dCursor];
    fx3dCursor = (fx3dCursor + 1) % FX3D_MAX;
    d.alive = true;
    d.pos.copy(worldPos);
    let x, y, z;
    do { x = rnd(-1, 1); y = rnd(-1, 1); z = rnd(-1, 1); } while (x * x + y * y + z * z > 1 || (x === 0 && y === 0 && z === 0));
    d.vel.set(x, y, z).normalize().multiplyScalar(rnd(spec.speed[0], spec.speed[1]));
    d.vel.y += spec.up;
    d.grav = spec.grav;
    d.maxLife = d.life = rnd(spec.life[0], spec.life[1]);
    d.color.setHex(palette[Math.floor(Math.random() * palette.length)]);
  }
}

function updateFX3D(dt) {
  const pos = fx3d.geometry.attributes.position, col = fx3d.geometry.attributes.color;
  for (let i = 0; i < FX3D_MAX; i++) {
    const d = fx3dData[i];
    if (!d.alive) continue;
    d.life -= dt;
    if (d.life <= 0) {
      d.alive = false;
      pos.array[i * 3 + 1] = -9999;
      col.array[i * 3] = col.array[i * 3 + 1] = col.array[i * 3 + 2] = 0;
      continue;
    }
    d.vel.y -= d.grav * dt;
    d.vel.multiplyScalar(Math.max(0, 1 - 1.6 * dt));
    d.pos.addScaledVector(d.vel, dt);
    const a = Math.min(1, d.life / (d.maxLife * 0.6)); // fondu : additive + couleur→noir = disparition douce
    pos.array[i * 3]     = d.pos.x;
    pos.array[i * 3 + 1] = d.pos.y;
    pos.array[i * 3 + 2] = d.pos.z;
    col.array[i * 3]     = d.color.r * a;
    col.array[i * 3 + 1] = d.color.g * a;
    col.array[i * 3 + 2] = d.color.b * a;
  }
  pos.needsUpdate = true;
  col.needsUpdate = true;
}

// Traînée de boost : DOUBLE sillage lumineux en bout d'aile quand le moteur est à
// fond (ou buff vitesse), dont la couleur reflète le buff actif — sillage exagéré,
// façon jeu d'arcade : dense en boost, doré en score x5, incandescent en invincible.
let trailAccum = 0;
const _trailTmp = new THREE.Vector3();
const TRAIL_PALETTES = {
  none:       [0x9fd8ff, 0xe8f6ff],
  speed:      [0x67e8ff, 0xb7f6ff, 0xffffff],
  multi:      [0xffd700, 0xfff0a0, 0xffb020],
  slow:       [0xa0e8ff, 0xe0f8ff],
  invincible: [0xffd700, 0xffffff, 0xff9a00]
};
function updateBoostTrail(dt) {
  if (throttle < 0.75 && buffs.speed <= 0) { trailAccum = 0; return; }
  const palette = buffs.invincible > 0 ? TRAIL_PALETTES.invincible
                : buffs.multi      > 0 ? TRAIL_PALETTES.multi
                : buffs.speed      > 0 ? TRAIL_PALETTES.speed
                : buffs.slow       > 0 ? TRAIL_PALETTES.slow
                : TRAIL_PALETTES.none;
  const rate = buffs.speed > 0 ? 0.016 : 0.028; // boost = sillage nettement plus dense
  trailAccum += dt;
  while (trailAccum > rate) {
    trailAccum -= rate;
    for (const side of [-1, 1]) { // un filet par bout d'aile
      _trailTmp.set(side * 1.25, 0.1, 1.4).applyQuaternion(owlGroup.quaternion).add(owlGroup.position);
      _trailTmp.x += rnd(-0.25, 0.25); _trailTmp.y += rnd(-0.25, 0.25); _trailTmp.z += rnd(-0.25, 0.25);
      spawnFX3D(_trailTmp, 1, 'trail', palette);
    }
  }
}

// Cascade de combo : à partir de x5, le hibou ruisselle d'étincelles dorées,
// de plus en plus dru à mesure que le combo grimpe.
let comboFxAccum = 0;
function updateComboCascade(dt) {
  if (combo < 5 || comboTimer <= 0) { comboFxAccum = 0; return; }
  comboFxAccum += dt;
  const rate = Math.max(0.05, 0.2 - combo * 0.006);
  while (comboFxAccum > rate) {
    comboFxAccum -= rate;
    _trailTmp.set(rnd(-0.8, 0.8), rnd(-0.3, 0.6), rnd(0.4, 1.6)).applyQuaternion(owlGroup.quaternion).add(owlGroup.position);
    spawnFX3D(_trailTmp, 1, 'sparkle');
  }
}

// Fumée noire de dégâts : plus la perte de contrôle max sur une gouverne est
// élevée, plus la fumée est dense (amount) et la traînée continue (rate
// resserré). Émise depuis l'arrière du hibou — locale ET adverses (via le
// résumé `dmg` reçu dans les paquets d'état réseau, voir hibou3d-multiplayer.js).
function emitSmokeAt(obj, severity, accumState, dt) {
  if (severity <= 0) { accumState.v = 0; return; }
  const rate = Math.max(0.02, 0.09 - severity * 0.07);
  const amount = 1 + Math.round(severity * 2);
  accumState.v += dt;
  while (accumState.v > rate) {
    accumState.v -= rate;
    _trailTmp.set(rnd(-0.3, 0.3), rnd(-0.1, 0.2), 1.1).applyQuaternion(obj.quaternion).add(obj.position);
    spawnFX3D(_trailTmp, amount, 'smoke');
  }
}
let smokeAccum = { v: 0 };
function updateSmokeTrail(dt) {
  emitSmokeAt(owlGroup, lastDriftSeverity, smokeAccum, dt);
  if (mp) {
    for (const r of mp.remotesList()) {
      if (!r.alive || !Array.isArray(r.dmg)) continue;
      if (!r._smokeAccum) r._smokeAccum = { v: 0 };
      emitSmokeAt(r.obj, Math.max(r.dmg[0] || 0, r.dmg[1] || 0, r.dmg[2] || 0), r._smokeAccum, dt);
    }
  }
}

// ══════════════════════════════════════════════════
//  VOLUME DE JEU (sphère 3D)
// ══════════════════════════════════════════════════
const ARENA_CENTER = new THREE.Vector3(0, 35, 0);
const ARENA_RADIUS_XZ = 1400; // largeur x5
const ARENA_RADIUS_Y  = 630;  // hauteur x3

// Brouillard linéaire : depuis que la limite de jeu est une vraie MURAILLE DE
// MONTAGNES (voir terrainHeight), il n'a plus à cacher un sol interdit — il donne
// de la profondeur et laisse deviner les crêtes en silhouette au loin.
scene.fog = new THREE.Fog(0x0c1030, ARENA_RADIUS_XZ * 0.55, ARENA_RADIUS_XZ * 1.6);

let OWL_GROUND_CLEAR = 1.2; // garde au sol : sous (terrain + marge) = crash — recalculé sur le vrai modèle dans setupOwlVisual()
let OWL_COLLIDE_RADIUS = 0.3; // rayon de collision décor — idem, affiné sur le vrai modèle
let OWL_HITBOX = { w: 2.6, h: 1.2, d: 1.6 }; // boîte englobante (multijoueur : classement tête/ailes/corps des impacts)
const TREE_HIT_COOLDOWN  = 45;
// Plafond d'altitude des branches/cadeaux : même proportion qu'avant (130 sur une
// arène de hauteur 210) rapportée à la nouvelle ARENA_RADIUS_Y (x3).
const COLLECTIBLE_MAX_Y = ARENA_CENTER.y + ARENA_RADIUS_Y * ((130 - ARENA_CENTER.y) / 210);

// Facteur radial normalisé (ellipsoïde) : 0 au centre, 1 sur la bordure, >1 en dehors.
function ellipsoidFactor(pos) {
  const dx = (pos.x - ARENA_CENTER.x) / ARENA_RADIUS_XZ;
  const dy = (pos.y - ARENA_CENTER.y) / ARENA_RADIUS_Y;
  const dz = (pos.z - ARENA_CENTER.z) / ARENA_RADIUS_XZ;
  return Math.sqrt(dx * dx + dy * dy + dz * dz);
}

// Quadrillage vert marquant la limite sphérique de l'arène : invisible de loin,
// de plus en plus opaque à mesure que le hibou s'approche du bord.
let boundaryGrid;
const BOUNDARY_FADE_DIST = 22;
function makeBoundaryGrid() {
  const geo = new THREE.SphereGeometry(1, 40, 28);
  const mat = new THREE.MeshBasicMaterial({
    color: 0x33ff66, wireframe: true, transparent: true, opacity: 0,
    depthWrite: false, fog: false
  });
  boundaryGrid = new THREE.Mesh(geo, mat);
  boundaryGrid.scale.set(ARENA_RADIUS_XZ, ARENA_RADIUS_Y, ARENA_RADIUS_XZ);
  boundaryGrid.position.copy(ARENA_CENTER);
  boundaryGrid.visible = false;
  scene.add(boundaryGrid);
}
function updateBoundaryGrid() {
  const f = ellipsoidFactor(owlGroup.position);
  const fadeFrac = BOUNDARY_FADE_DIST / ARENA_RADIUS_XZ;
  const opacity = THREE.MathUtils.clamp((f - (1 - fadeFrac)) / fadeFrac, 0, 0.85);
  boundaryGrid.material.opacity = opacity;
  boundaryGrid.visible = opacity > 0.01;
}

// (l'ancien randomPointInArena — tirage uniforme dans tout le volume — a été retiré :
//  les collectibles apparaissent désormais près du joueur via collectibleSpawnPos.)

// ══════════════════════════════════════════════════
//  MODÈLES 3D EXTERNES (GLB) — chargés au démarrage, avec repli procédural
//  si un fichier manque (hors-ligne, 404…). Voir docs/models/CREDITS.md.
// ══════════════════════════════════════════════════
const MODEL_URLS = {
  owl:           'modele-hibou/OwlWings_animation.glb',
  bear:          'models/bear.glb',
  moon:          'models/moon.glb',
  pine1:         'models/pine1.glb',
  pine2:         'models/pine2.glb',
  tree1:         'models/tree1.glb',
  birch:         'models/birch.glb',
  mountains:     'models/mountains.glb',
  mountainGroup: 'models/mountain_group.glb',
  cloud1:        'models/cloud1.glb',
  cloud2:        'models/cloud2.glb',
  cloud3:        'models/cloud3.glb',
  watchtower:    'models/watchtower.glb'
};
const models = {};
const modelClips = {}; // clips d'animation (le cas échéant) du .glb, indexés comme MODEL_URLS
let assetsReady = false;
// Suivi de progression (par fichier, pas par octet — suffisant pour montrer que
// le chargement avance) : évite un écran de chargement figé sur ~12 Mo d'assets.
let loadProgress = 0;
const loadManager = new THREE.LoadingManager();
loadManager.onProgress = (url, itemsLoaded, itemsTotal) => {
  loadProgress = itemsTotal ? itemsLoaded / itemsTotal : 0;
};

async function loadAssets() {
  const loader = new GLTFLoader(loadManager);
  const entries = Object.entries(MODEL_URLS);
  const results = await Promise.allSettled(entries.map(([, url]) => loader.loadAsync(url)));
  results.forEach((res, i) => {
    if (res.status === 'fulfilled') {
      models[entries[i][0]] = res.value.scene;
      if (res.value.animations && res.value.animations.length) modelClips[entries[i][0]] = res.value.animations;
    } else {
      console.warn('Modèle 3D indisponible (repli procédural) :', entries[i][0], res.reason);
    }
  });

  // cabin.obj (free3d) : pas de .mtl fourni avec le téléchargement → pas de couleur/texture
  // d'origine. On retint une teinte par pièce nommée (Roof/Cabin/Chimney/Door dans le .obj
  // source), assortie à la palette bois/toit déjà utilisée par les chalets procéduraux.
  try {
    const cabinRoot = await new OBJLoader(loadManager).loadAsync('models/cabin.obj');
    const CABIN_PART_COLORS = { Roof: ROOF_COLOR, Cabin: WOOD_LIGHT, Chimney: 0x6b6058, Door: WOOD_DARK };
    cabinRoot.traverse(o => {
      if (o.isMesh) {
        o.material = new THREE.MeshStandardMaterial({
          color: CABIN_PART_COLORS[o.name] ?? WOOD_LIGHT, roughness: 0.9
        });
      }
    });
    models.cabin = cabinRoot;
  } catch (err) {
    console.warn('Modèle 3D indisponible (repli procédural) :', 'cabin', err);
  }
}

// Enveloppe un modèle dans un Group normalisé : recentré en XZ, posé au sol (ou centré),
// mis à l'échelle pour atteindre la hauteur/longueur cible, avec lacet optionnel.
// Le Group extérieur reste « neutre » : l'appelant peut le scaler/tourner librement.
function normalizeModel(root, { height, length, width, groundAlign = true, yaw = 0 } = {}) {
  const wrapper = new THREE.Group();
  const spin = new THREE.Group();
  const inner = new THREE.Group();
  spin.rotation.y = yaw;
  inner.add(root);
  spin.add(inner);
  wrapper.add(spin);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  let s = 1;
  if (height) s = height / (size.y || 1);
  else if (length) s = length / (size.z || 1);
  else if (width) s = width / (size.x || 1);
  inner.scale.setScalar(s);
  inner.position.set(-center.x * s, groundAlign ? -box.min.y * s : -center.y * s, -center.z * s);
  return wrapper;
}

// Extrait les couples {géométrie, matériau, matrice locale} d'un modèle pour l'instancing.
function collectMeshParts(root) {
  root.updateMatrixWorld(true);
  const parts = [];
  root.traverse(o => {
    if (o.isMesh) parts.push({ geo: o.geometry, mat: o.material, matrix: o.matrixWorld.clone() });
  });
  return parts;
}

// Construit des InstancedMesh à partir d'un modèle et d'une liste de matrices d'instance.
// Culling laissé actif (défaut) : InstancedMesh calcule sa bounding sphere en englobant
// toutes les instances (pas juste la géométrie source), donc pas de pop-out en bord d'écran.
function makeInstancedFromModel(root, matrices) {
  const parts = collectMeshParts(root);
  const group = new THREE.Group();
  const tmpM = new THREE.Matrix4();
  for (const part of parts) {
    const im = new THREE.InstancedMesh(part.geo, part.mat, matrices.length);
    for (let i = 0; i < matrices.length; i++) {
      tmpM.multiplyMatrices(matrices[i], part.matrix);
      im.setMatrixAt(i, tmpM);
    }
    im.instanceMatrix.needsUpdate = true;
    im.userData.partMatrix = part.matrix.clone(); // conservé pour les mises à jour dynamiques (nuages)
    group.add(im);
  }
  return group;
}

// ══════════════════════════════════════════════════
//  TERRAIN PROCÉDURAL — bruit de valeur fBm + pics gaussiens (montagnes),
//  lacs sous WATER_Y, forêts par masque de bruit, neige en altitude.
//  terrainHeight(x,z) est ANALYTIQUE : la même fonction sert au maillage
//  ET aux collisions/placements — aucun échantillonnage de grille.
// ══════════════════════════════════════════════════
const TERRAIN_SIZE = 4500;  // x5 : couvre la nouvelle zone de jeu élargie (ARENA_RADIUS_XZ)
const TERRAIN_SEGS = LOW_SPEC ? 96 : 240;
const WATER_Y      = -3.0;  // niveau des lacs
const HILL_AMP     = 24;    // amplitude des collines fBm (±) — terrain nettement plus vallonné
const GROUND_DETAIL_AMP = 5.5; // bosses fines superposées, visibles même loin des montagnes/lacs
const SNOW_LINE    = 46;    // altitude d'enneigement
const TREE_LINE    = 38;    // au-dessus : plus d'arbres

// ── Muraille de montagnes : l'arène est cernée d'une vraie chaîne de sommets ──
// Le terrain se soulève à l'approche du bord et culmine au-delà du mur invisible :
// la limite de jeu N'EST PLUS une grille abstraite, c'est la montagne elle-même.
const RING_START = ARENA_RADIUS_XZ * 0.86; // le sol commence à se soulever ici
const RING_FULL  = ARENA_RADIUS_XZ * 1.18; // altitude de crête atteinte ici
const RING_BASE  = 240;                    // hauteur minimale de la muraille
const RING_VAR   = 260;                    // relief supplémentaire des sommets (bruit)

// Seed fixe (pas Math.random()) : le terrain doit être identique sur tous les
// navigateurs, sinon en multijoueur chaque client voit un sol différent — les
// hiboux distants (positionnés selon LEUR sol) se retrouvent enterrés sous
// le nôtre et deviennent invisibles. En solo en revanche, le terrain est
// régénéré à chaque partie (voir regenerateTerrainSeed) : le multijoueur
// restaure systématiquement ce seed canonique avant de démarrer une manche
// (voir restoreCanonicalTerrain), qu'une partie solo ait tourné avant ou non.
const CANONICAL_TERRAIN_SEED = 483.271;
let terrainSeed = CANONICAL_TERRAIN_SEED;
let worldRegenerated = false; // true dès qu'une partie solo a re-tiré le terrain

function hashNoise(ix, iz) {
  const n = Math.sin(ix * 127.1 + iz * 311.7 + terrainSeed * 17.3) * 43758.5453;
  return n - Math.floor(n);
}
function valueNoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
  const a = hashNoise(ix, iz),     b = hashNoise(ix + 1, iz);
  const c = hashNoise(ix, iz + 1), d = hashNoise(ix + 1, iz + 1);
  return a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz;
}
function fbm(x, z, octaves = 5) {
  let sum = 0, amp = 0.5, freq = 1;
  for (let o = 0; o < octaves; o++) {
    sum += amp * valueNoise(x * freq, z * freq);
    amp *= 0.5; freq *= 2.03;
  }
  return sum; // ~[0,1]
}
// Bruit "ridged" (crêtes franches, vallées larges) : mêmes octaves que fbm mais
// on replie la valeur autour de 0.5 puis on la met au carré — plus de relief/détail
// sans changer la forme macro (montagnes/muraille/lacs inchangés).
function ridged(x, z, octaves = 3) {
  let sum = 0, amp = 0.5, freq = 1;
  for (let o = 0; o < octaves; o++) {
    const n = 1 - Math.abs(valueNoise(x * freq, z * freq) * 2 - 1);
    sum += amp * n * n;
    amp *= 0.5; freq *= 2.03;
  }
  return sum; // ~[0,1]
}

// Pics montagneux : bosses gaussiennes semées à l'intérieur de l'arène (jamais au centre).
// Nombre, position, hauteur et rayon tirés au hasard à chaque run — désormais répartis
// sur TOUTE l'arène élargie (l'ancien semis 90..270 laissait 90 % de la carte plate).
// L'array garde la MÊME référence à travers les régénérations : terrainHeight ferme dessus.
const mountainPeaks = [];
function fillMountainPeaks() {
  mountainPeaks.length = 0;
  const peakCount = Math.floor(rnd(10, 15));
  for (let i = 0; i < peakCount; i++) {
    const angle = (i / peakCount) * Math.PI * 2 + rnd(-0.5, 0.5);
    const dist = rnd(140, ARENA_RADIUS_XZ * 0.72);
    mountainPeaks.push({
      x: Math.cos(angle) * dist,
      z: Math.sin(angle) * dist,
      h: rnd(35, 105),
      r: rnd(55, 165)
    });
  }
}
fillMountainPeaks(); // premier tirage au chargement (canonique, réutilisé par le multijoueur)
const CANONICAL_MOUNTAIN_PEAKS = mountainPeaks.map(p => ({ ...p }));

// Rivières : PRNG dédié, seedé fixe (même patron que treeRng) — contrairement aux pics de
// montagne (semés via Math.random() puis figés dans un snapshot), une rivière régénérée avec
// la MÊME graine reproduit toujours le même tracé, donc pas besoin de snapshot : il suffit de
// reseeder riverRng avec la constante fixe puis de rappeler fillRiverPaths().
const RIVER_SEED = 20260716;
let riverRng = mulberry32(RIVER_SEED);
let riverPaths = []; // [{ points:[{x,z}], width, depth }]
function fillRiverPaths() {
  riverPaths = [];
  const riverCount = 2 + Math.floor(riverRng() * 2); // 2 ou 3 rivières
  for (let i = 0; i < riverCount; i++) {
    const startAngle = (i / riverCount) * Math.PI * 2 + (riverRng() - 0.5);
    let x = Math.cos(startAngle) * ARENA_RADIUS_XZ * 0.9; // source près de la muraille
    let z = Math.sin(startAngle) * ARENA_RADIUS_XZ * 0.9;
    let dirAngle = startAngle + Math.PI + (riverRng() - 0.5) * 0.6; // serpente vers le centre
    const points = [{ x, z }];
    const steps = 14 + Math.floor(riverRng() * 6);
    const stepLen = (ARENA_RADIUS_XZ * 0.78) / steps;
    for (let s = 0; s < steps; s++) {
      dirAngle += (riverRng() - 0.5) * 0.7; // méandres
      x += Math.cos(dirAngle) * stepLen;
      z += Math.sin(dirAngle) * stepLen;
      points.push({ x, z });
    }
    riverPaths.push({ points, width: 10 + riverRng() * 8, depth: 6 + riverRng() * 5 });
  }
}
fillRiverPaths(); // premier tirage : déjà canonique, riverRng est seedé fixe (RIVER_SEED)

// Distance au tracé de rivière le plus proche → creuse un chenal (s'élargit en fin de
// tracé = embouchure/petit lac). Coût one-shot à la construction du maillage, négligeable.
function riverCarve(x, z) {
  let carve = 0;
  for (const river of riverPaths) {
    const pts = river.points;
    let minDistSq = Infinity, tAlong = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const ax = pts[i].x, az = pts[i].z, bx = pts[i + 1].x, bz = pts[i + 1].z;
      const abx = bx - ax, abz = bz - az;
      const abLenSq = abx * abx + abz * abz || 1;
      let t = ((x - ax) * abx + (z - az) * abz) / abLenSq;
      t = Math.max(0, Math.min(1, t));
      const px = ax + abx * t, pz = az + abz * t;
      const dx = x - px, dz = z - pz;
      const dSq = dx * dx + dz * dz;
      if (dSq < minDistSq) { minDistSq = dSq; tAlong = (i + t) / (pts.length - 1); }
    }
    const dist = Math.sqrt(minDistSq);
    const w = river.width * (1 + tAlong * 1.8);          // s'élargit vers l'embouchure
    const depthHere = river.depth * (0.6 + tAlong * 0.8); // plus profond vers l'embouchure
    carve += depthHere * (1 - THREE.MathUtils.smoothstep(dist, 0, w));
  }
  return carve;
}

// Nouvelle carte à chaque partie SOLO : nouveau seed de bruit + nouveaux pics + nouvelles
// rivières + nouvelle forêt (treeRng reseedé). Le multijoueur, lui, ne doit JAMAIS voir un
// terrain différent d'un client à l'autre : voir restoreCanonicalTerrain().
function regenerateTerrainSeed() {
  terrainSeed = Math.random() * 1000;
  fillMountainPeaks();
  riverRng = mulberry32(Math.floor(Math.random() * 1e9));
  fillRiverPaths();
  treeRng = mulberry32(Math.floor(Math.random() * 1e9));
  buildingRng = mulberry32(Math.floor(Math.random() * 1e9)); // makeBuildings() relit buildingRng au moment du placement
  worldRegenerated = true;
}

// Restaure le terrain canonique (seed fixe + pics + rivières + arbres + hameaux d'origine)
// avant une manche multijoueur, que le client ait joué une ou plusieurs parties solo entre-temps ou non.
function restoreCanonicalTerrain() {
  terrainSeed = CANONICAL_TERRAIN_SEED;
  mountainPeaks.length = 0;
  for (const p of CANONICAL_MOUNTAIN_PEAKS) mountainPeaks.push({ ...p });
  riverRng = mulberry32(RIVER_SEED);
  fillRiverPaths();
  treeRng = mulberry32(20260715);
  buildingRng = mulberry32(BUILDING_SEED);
  worldRegenerated = false;
}

// Références aux objets du monde régénérable (terrain/eau/montagnes GLB/forêt),
// pour pouvoir les retirer de la scène à chaque nouvelle partie (voir disposeWorldGeometry).
let terrainMesh = null, waterMesh = null;
let mountainSceneryGroups = [];
let treeGroups = [];

// Retire de la scène tout le monde régénérable avant reconstruction (nouvelle partie).
// Terrain/eau : géométries et matériaux UNIQUES, créés à chaque makeTerrain → on les dispose
// (sinon fuite GPU à chaque partie). Arbres/montagnes GLB : géométries/matériaux PARTAGÉS
// avec les modèles sources (models.pine1, models.mountains…) → on retire sans disposer.
function disposeWorldGeometry() {
  if (terrainMesh) {
    scene.remove(terrainMesh);
    terrainMesh.geometry.dispose();
    terrainMesh.material.dispose();
    terrainMesh = null;
  }
  if (waterMesh) {
    scene.remove(waterMesh);
    waterMesh.geometry.dispose();
    waterMesh.material.dispose();
    waterMesh = null;
  }
  for (const g of [...mountainSceneryGroups, ...treeGroups]) {
    scene.remove(g);
    // InstancedMesh.dispose() ne libère QUE les attributs d'instance (instanceMatrix),
    // pas la géométrie ni le matériau — donc sans danger pour les modèles GLB partagés.
    g.traverse(o => { if (o.isInstancedMesh) o.dispose(); });
  }
  mountainSceneryGroups = [];
  treeGroups = [];

  // Hameaux/feux de camp : géométries/matériaux UNIQUES (procéduraux, pas de modèle GLB
  // partagé) → on dispose vraiment, comme le terrain/l'eau.
  for (const g of buildingGroups) {
    scene.remove(g);
    g.traverse(o => {
      if (o.isMesh || o.isSprite) {
        o.geometry && o.geometry.dispose();
        o.material && o.material.dispose();
      }
    });
  }
  buildingGroups = [];
  campfires = [];
  for (const l of campfireLightPool) l.intensity = 0; // le pool lui-même persiste (créé une fois au boot)
}

function terrainHeight(x, z) {
  // Collines fBm recentrées sur ±HILL_AMP (les creux sous WATER_Y deviennent des lacs)
  let h = (fbm(x * 0.008, z * 0.008) * 2 - 1) * HILL_AMP;
  // Relief fin superposé (fréquence plus haute) : bosses au sol même loin des montagnes/lacs
  h += (fbm(x * 0.035, z * 0.035, 3) * 2 - 1) * GROUND_DETAIL_AMP;
  // Crêtes plus franches (bruit ridged) : casse la régularité du fBm, plus de polygones utiles
  h += (ridged(x * 0.05, z * 0.05, 3) - 0.35) * (GROUND_DETAIL_AMP * 1.6);
  // Montagnes gaussiennes
  for (const p of mountainPeaks) {
    const dx = x - p.x, dz = z - p.z;
    h += p.h * Math.exp(-(dx * dx + dz * dz) / (p.r * p.r));
  }
  const d = Math.hypot(x, z);
  // Muraille de montagnes fermant l'arène : cols et sommets variés (bruit basse
  // fréquence) + arêtes découpées (bruit haute fréquence). Comme terrainHeight est
  // aussi la fonction de collision, ces pentes sont de VRAIS obstacles.
  const ringT = THREE.MathUtils.smoothstep(d, RING_START, RING_FULL);
  if (ringT > 0) {
    const ridge = fbm(x * 0.0016 + 31.4, z * 0.0016 - 12.9, 3); // grands cols et sommets
    const crag  = fbm(x * 0.008 - 5.1,  z * 0.008 + 44.2, 3);   // arêtes déchiquetées
    h += ringT * (RING_BASE + ridge * RING_VAR + crag * 90);
  }
  h -= riverCarve(x, z); // chenaux de rivière creusés dans le relief (sous WATER_Y = eau visible)
  // Zone de départ aplanie (rayon ~25 autour du centre, fondu jusqu'à 80)
  const flat = THREE.MathUtils.smoothstep(d, 25, 80);
  return h * flat;
}

// Sol « effectif » pour les collisions/spawns : le terrain, ou la surface de l'eau.
function effectiveGroundY(x, z) {
  return Math.max(terrainHeight(x, z), WATER_Y);
}

// Masque de forêt : bruit séparé, décalé pour être indépendant du relief.
function forestDensity(x, z) {
  return fbm(x * 0.006 + 57.3, z * 0.006 - 91.7, 3);
}

function makeTerrain() {
  const geo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEGS, TERRAIN_SEGS);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setY(i, terrainHeight(pos.getX(i), pos.getZ(i)));
  }
  // Non-indexé + couleur PAR FACE = facettes franches, look low-poly assumé.
  const flat = geo.toNonIndexed();
  flat.computeVertexNormals();
  const fpos = flat.attributes.position;
  const fnorm = flat.attributes.normal;
  const colors = new Float32Array(fpos.count * 3);
  const c = new THREE.Color(), c2 = new THREE.Color();
  // Palette élargie : chaque bande hauteur/pente mélange 2 variantes via un second canal
  // de bruit ("humidité", décorrélé du relief) pour casser le banding et varier les teintes.
  const grassA = new THREE.Color(0x16321f), grassB = new THREE.Color(0x1e422a);
  const grassC = new THREE.Color(0x2a4a1e), grassD = new THREE.Color(0x3d5c28); // mousse sombre / herbe sèche claire
  const sand    = new THREE.Color(0x4a4632), mud     = new THREE.Color(0x3a3020);
  const bed     = new THREE.Color(0x1c2822);
  const rockDark = new THREE.Color(0x2e333a), rockLight = new THREE.Color(0x4a5058);
  const snow    = new THREE.Color(0x9aa4b8), snowBlue = new THREE.Color(0x7f92b8);
  for (let f = 0; f < fpos.count; f += 3) {
    const hAvg = (fpos.getY(f) + fpos.getY(f + 1) + fpos.getY(f + 2)) / 3;
    const nY   = (fnorm.getY(f) + fnorm.getY(f + 1) + fnorm.getY(f + 2)) / 3;
    const fx = fpos.getX(f), fz = fpos.getZ(f);
    const moisture = valueNoise(fx * 0.018 + 91.3, fz * 0.018 - 41.7);
    if (hAvg < WATER_Y - 0.5)       c.copy(bed);
    else if (hAvg < WATER_Y + 1.2)  c.lerpColors(mud, sand, valueNoise(fx * 0.05, fz * 0.05));
    else if (hAvg > SNOW_LINE)      c.lerpColors(snowBlue, snow, moisture);
    else if (nY < 0.62 || hAvg > TREE_LINE) c.lerpColors(rockDark, rockLight, THREE.MathUtils.clamp((nY - 0.3) / 0.5, 0, 1));
    else {
      c.lerpColors(grassA, grassB, valueNoise(fx * 0.05, fz * 0.05));
      c2.lerpColors(grassC, grassD, valueNoise(fx * 0.05 + 200, fz * 0.05 + 200));
      c.lerp(c2, moisture);
    }
    c.multiplyScalar(rnd(0.92, 1.08)); // léger tramage par facette
    for (let v = 0; v < 3; v++) {
      colors[(f + v) * 3] = c.r; colors[(f + v) * 3 + 1] = c.g; colors[(f + v) * 3 + 2] = c.b;
    }
  }
  flat.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mesh = new THREE.Mesh(flat, new THREE.MeshStandardMaterial({
    vertexColors: true, flatShading: true, roughness: 1
  }));
  mesh.receiveShadow = true;
  scene.add(mesh);
  terrainMesh = mesh;

  // Lacs/rivières : un seul plan d'eau sous tout le terrain, visible dans les creux.
  // Segmenté (au lieu d'un quad 1×1) pour supporter une ondulation lente (updateWater) et
  // pour que le polygonOffset limite le scintillement (z-fighting) au contact des berges.
  const WATER_SEGS = LOW_SPEC ? 24 : 48;
  const water = new THREE.Mesh(
    new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, WATER_SEGS, WATER_SEGS),
    new THREE.MeshStandardMaterial({
      color: 0x16305a, roughness: 0.15, metalness: 0.25,
      transparent: true, opacity: 0.92,
      polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1
    })
  );
  water.rotation.x = -Math.PI / 2;
  water.position.y = WATER_Y;
  water.receiveShadow = true;
  scene.add(water);
  waterMesh = water;
}

// Ondulation lente de la surface de l'eau : déplace la coordonnée Z locale du plan (qui
// devient la hauteur monde une fois la rotation -90° sur X appliquée), pas un shader —
// juste quelques milliers de sommets recalculés par frame, coût négligeable.
let waterTime = 0;
function updateWater(dt) {
  if (!waterMesh) return;
  waterTime += dt;
  const pos = waterMesh.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const lx = pos.getX(i), ly = pos.getY(i);
    const ripple = Math.sin(lx * 0.06 + waterTime * 0.6) * 0.18 + Math.cos(ly * 0.05 - waterTime * 0.45) * 0.18;
    pos.setZ(i, ripple);
  }
  pos.needsUpdate = true;
  waterMesh.geometry.computeVertexNormals();
}

// Chaînes de montagnes GLB plantées SUR la muraille procédurale : elles ajoutent
// des silhouettes déchiquetées crédibles par-dessus l'anneau de terrain, tout
// autour de l'arène (purement décoratives — la collision, c'est le terrain).
function makeMountainScenery() {
  const protos = [models.mountains, models.mountainGroup].filter(Boolean);
  if (!protos.length) return; // le terrain a déjà sa muraille, pas de repli nécessaire
  const matrices = [[], []];
  const dummy = new THREE.Object3D();
  const ringCount = 22;
  for (let i = 0; i < ringCount; i++) {
    const angle = (i / ringCount) * Math.PI * 2 + rnd(-0.14, 0.14);
    const dist = rnd(ARENA_RADIUS_XZ * 0.98, ARENA_RADIUS_XZ * 1.3); // à cheval sur la crête
    const x = Math.cos(angle) * dist, z = Math.sin(angle) * dist;
    dummy.position.set(x, terrainHeight(x, z) - 18, z); // enraciné dans la pente
    dummy.rotation.set(0, rnd(0, Math.PI * 2), 0);
    dummy.scale.setScalar(rnd(1.3, 2.6));
    dummy.updateMatrix();
    matrices[i % protos.length].push(dummy.matrix.clone());
  }
  protos.forEach((proto, i) => {
    if (!matrices[i].length) return;
    const norm = normalizeModel(proto.clone(true), { height: 150, groundAlign: true });
    const group = makeInstancedFromModel(norm, matrices[i]);
    group.traverse(o => { if (o.isInstancedMesh) { o.castShadow = true; o.receiveShadow = true; } });
    scene.add(group);
    mountainSceneryGroups.push(group);
  });
}

// ══════════════════════════════════════════════════
//  NUAGES LOW-POLY — instanciés, dérive lente, recyclés en bord de carte.
// ══════════════════════════════════════════════════
const CLOUD_COUNT  = LOW_SPEC ? 15 : 64;        // couvre l'arène élargie (l'ancien semis ±380 laissait le ciel vide au loin)
const CLOUD_SPREAD = ARENA_RADIUS_XZ * 0.85;    // zone de semis
const CLOUD_WRAP   = ARENA_RADIUS_XZ * 0.92;    // bord de recyclage de la dérive
const CLOUD_OPACITY_TIERS = [0.35, 0.65, 0.92]; // léger / moyen / dense
let cloudSets = []; // { group, data:[{pos, scale, rotY, speed}], parts }

// Position de semis : ~60 % des nuages concentrés près de l'anneau de montagnes
// (même rayon que makeMountainScenery), le reste dispersé sur toute l'arène.
function pickCloudPos() {
  if (Math.random() < 0.6) {
    const angle = rnd(0, Math.PI * 2);
    const dist = rnd(ARENA_RADIUS_XZ * 0.65, ARENA_RADIUS_XZ * 1.05);
    return new THREE.Vector3(Math.cos(angle) * dist, rnd(110, 260), Math.sin(angle) * dist);
  }
  return new THREE.Vector3(rnd(-CLOUD_SPREAD, CLOUD_SPREAD), rnd(95, 240), rnd(-CLOUD_SPREAD, CLOUD_SPREAD));
}

function makeClouds() {
  const protos = [models.cloud1, models.cloud2, models.cloud3].filter(Boolean);
  if (!protos.length) return; // pas de repli : les nuages sont purement décoratifs
  const perType = Math.ceil(CLOUD_COUNT / protos.length);
  const dummy = new THREE.Object3D();
  for (const proto of protos) {
    const norm = normalizeModel(proto.clone(true), { height: 6, groundAlign: false });
    // Sous-groupes par palier d'opacité : un InstancedMesh partage UN matériau pour toutes
    // ses instances, donc l'opacité ne peut varier qu'entre groupes, pas par instance.
    for (let tier = 0; tier < CLOUD_OPACITY_TIERS.length; tier++) {
      const data = [];
      const matrices = [];
      const tierCount = Math.round(perType / CLOUD_OPACITY_TIERS.length);
      for (let i = 0; i < tierCount; i++) {
        const d = { pos: pickCloudPos(), scale: rnd(2.4, 6.5), rotY: rnd(0, Math.PI * 2), speed: rnd(1.2, 3.2) };
        data.push(d);
        dummy.position.copy(d.pos);
        dummy.rotation.set(0, d.rotY, 0);
        dummy.scale.setScalar(d.scale);
        dummy.updateMatrix();
        matrices.push(dummy.matrix.clone());
      }
      if (!matrices.length) continue;
      const group = makeInstancedFromModel(norm, matrices);
      group.traverse(o => {
        if (o.isInstancedMesh) {
          o.material = o.material.clone();
          o.material.transparent = true;
          o.material.opacity = CLOUD_OPACITY_TIERS[tier];
          o.material.depthWrite = false; // limite les artefacts de tri entre nuages semi-transparents
        }
      });
      scene.add(group);
      cloudSets.push({ group, data });
    }
  }
}

const _cloudDummy = new THREE.Object3D();
const _cloudTmpM = new THREE.Matrix4();
function updateClouds(dt) {
  const windX = storm.active ? Math.cos(storm.windAngle) * storm.windForce * 6 : 1;
  const windZ = storm.active ? Math.sin(storm.windAngle) * storm.windForce * 6 : 0.3;
  for (const set of cloudSets) {
    for (let i = 0; i < set.data.length; i++) {
      const d = set.data[i];
      d.pos.x += windX * d.speed * dt;
      d.pos.z += windZ * d.speed * dt;
      if (d.pos.x >  CLOUD_WRAP) d.pos.x = -CLOUD_WRAP; if (d.pos.x < -CLOUD_WRAP) d.pos.x = CLOUD_WRAP;
      if (d.pos.z >  CLOUD_WRAP) d.pos.z = -CLOUD_WRAP; if (d.pos.z < -CLOUD_WRAP) d.pos.z = CLOUD_WRAP;
      _cloudDummy.position.copy(d.pos);
      _cloudDummy.rotation.set(0, d.rotY, 0);
      _cloudDummy.scale.setScalar(d.scale);
      _cloudDummy.updateMatrix();
      for (const im of set.group.children) {
        _cloudTmpM.multiplyMatrices(_cloudDummy.matrix, im.userData.partMatrix);
        im.setMatrixAt(i, _cloudTmpM);
      }
    }
    for (const im of set.group.children) im.instanceMatrix.needsUpdate = true;
  }
}

// ══════════════════════════════════════════════════
//  PLEINE LUNE / LUNE DE SANG — événements périodiques de survie (calqués sur hibou-et-nid)
//  Debug : maintenir L force une pleine lune, K force une lune de sang.
// ══════════════════════════════════════════════════
const MOON_DURATION       = 10;  // secondes (pleine lune)
const BLOOD_MOON_DURATION = 15;  // secondes (lune de sang : plus longue, plus intense)
const BLOOD_MOON_CHANCE   = 0.1; // même probabilité que le jeu 2D
const MOON_WARN_TIME = 2;    // secondes de "remplissage" avant déclenchement
let moon = { state: 'none', timer: 0, next: 15, fillProgress: 0 };

function activateFullMoon(forceBlood) {
  const isBlood = forceBlood !== undefined ? forceBlood : Math.random() < BLOOD_MOON_CHANCE;
  moon.state = isBlood ? 'blood' : 'full';
  moon.fillProgress = 1;
  moon.timer = isBlood ? BLOOD_MOON_DURATION : MOON_DURATION;
  screenShake = Math.max(screenShake, isBlood ? 28 : 20);
  spawnFX(owlGroup.position, isBlood ? 40 : 30, isBlood ? 'death' : 'collect', isBlood ? '🩸 LUNE DE SANG !' : '🌕 PLEINE LUNE !');
  while (bears.length < bearTarget()) bears.push(newBear());
}
function deactivateFullMoon() {
  moon.state = 'none';
  moon.fillProgress = 0;
  moon.next = rnd(20, 30);
  screenShake = Math.max(screenShake, 10);
}
function updateMoon(dt) {
  if (storm.active) return; // exclusion mutuelle avec la tempête (même comportement que le jeu 2D)
  const forceFull  = keys['l'];
  const forceBlood = keys['k'];
  if (forceFull || forceBlood) {
    const wantState = forceBlood ? 'blood' : 'full';
    if (moon.state !== wantState) activateFullMoon(forceBlood);
    moon.timer = moon.state === 'blood' ? BLOOD_MOON_DURATION : MOON_DURATION;
    moon.fillProgress = 1;
    return;
  }
  if (moon.state === 'none') {
    if (dayFactor > 0.5) return; // pas de déclenchement naturel en plein jour (les touches debug ci-dessus marchent toujours)
    moon.next -= dt;
    if (moon.next <= MOON_WARN_TIME && moon.fillProgress < 1) {
      moon.fillProgress = Math.min(1, moon.fillProgress + dt / MOON_WARN_TIME);
    }
    if (moon.next <= 0) activateFullMoon();
  } else {
    moon.timer -= dt;
    if (moon.timer <= 0) deactivateFullMoon();
  }
}
// Sphère 3D : les phases se traduisent par une échelle, une couleur et une intensité
// d'émission — plus de redessin de texture, la géométrie tourne lentement sur elle-même.
function updateMoonVisual(dt) {
  const t = moon.fillProgress;
  const isBlood = moon.state === 'blood';

  moonMesh.scale.setScalar(THREE.MathUtils.lerp(1, MOON_FULL_SCALE, t));
  moonMesh.rotation.y += dt * 0.015;

  for (const mat of moonMaterials) {
    mat.emissive.lerpColors(MOON_COLOR_NORMAL, MOON_COLOR_BLOOD, isBlood ? t : 0);
    mat.emissiveIntensity = THREE.MathUtils.lerp(MOON_BASE_LIGHT, MOON_FULL_LIGHT, t);
  }
  // moonLight/ambientLight sont désormais pilotés par updateDayNightCycle (qui incorpore
  // ce même moon.fillProgress/isBlood dans sa composante "nuit" avant de la mélanger au jour).
}

// Chaque étoile clignote indépendamment (alpha s.a oscillant entre 0.05 et 1
// à sa propre vitesse s.da, rebond aux bornes — même logique que le jeu 2D).
function updateStars(dt) {
  if (!starGeo) return;
  const colorAttr = starGeo.attributes.color;
  for (let i = 0; i < starPhases.length; i++) {
    const ph = starPhases[i];
    ph.a += ph.da;
    if (ph.a > 1 || ph.a < 0.05) { ph.da *= -1; ph.a = THREE.MathUtils.clamp(ph.a, 0.05, 1); }
    colorAttr.array[i * 3]     = starBaseColors[i * 3]     * ph.a;
    colorAttr.array[i * 3 + 1] = starBaseColors[i * 3 + 1] * ph.a;
    colorAttr.array[i * 3 + 2] = starBaseColors[i * 3 + 2] * ph.a;
  }
  colorAttr.needsUpdate = true;
}

// ══════════════════════════════════════════════════
//  TEMPÊTE — événement périodique de vent (calqué sur hibou-et-nid, adapté en secondes)
//  Exclusion mutuelle avec la pleine lune : ne se déclenche jamais si moon.state !== 'none'.
//  Debug : maintenir T force l'activation immédiate.
// ══════════════════════════════════════════════════
const STORM_DURATION = 20;   // secondes (≈1200 frames à 60fps dans le jeu 2D)
let storm = { active: false, timer: 0, next: rnd(20, 30), windAngle: 0, windForce: 0, gustPhase: 0, rockSpawnTimer: 0 };

function activateStorm() {
  storm.active    = true;
  storm.timer     = STORM_DURATION;
  storm.windAngle = rnd(0, Math.PI * 2);
  storm.gustPhase = 0;
  storm.windForce = 0.6;
  storm.rockSpawnTimer = 0.6;
  screenShake = Math.max(screenShake, 14);
  spawnFX(owlGroup.position, 20, 'death', '🌬️ TEMPÊTE !');
}
function deactivateStorm() {
  storm.active    = false;
  storm.windForce = 0;
  storm.next      = rnd(30, 60);
  screenShake = Math.max(screenShake, 8);
  for (let i = rocks.length - 1; i >= 0; i--) removeRock(i);
}
function updateStorm(dt) {
  const forced = keys['t'];
  if (forced) {
    if (moon.state !== 'none') return; // jamais en même temps qu'une pleine lune ou une lune de sang
    if (!storm.active) activateStorm();
    storm.timer = STORM_DURATION;
  } else if (!storm.active) {
    if (moon.state === 'none') {
      storm.next -= dt;
      if (storm.next <= 0) activateStorm();
    }
    return;
  }

  // ── Rafales : force pulsée (sin) + dérive lente de la direction ──
  storm.gustPhase += 0.045 * 60 * dt;
  const gust = 0.5 + 0.5 * Math.sin(storm.gustPhase);
  storm.windForce  = 0.6 + gust * 1.8;
  storm.windAngle += Math.sin(storm.gustPhase * 0.3) * 0.01 * 60 * dt;

  // ── Rochers : danger réel de la tempête (calqué sur newRock/updateRocks du jeu 2D) ──
  storm.rockSpawnTimer -= dt;
  if (storm.rockSpawnTimer <= 0 && rocks.length < ROCK_MAX) {
    rocks.push(newRock());
    storm.rockSpawnTimer = rnd(0.12, 0.3); // pluie de cailloux dense sur toute la zone autour du joueur
  }

  if (!forced) {
    storm.timer -= dt;
    if (storm.timer <= 0) deactivateStorm();
  }
}

// ══════════════════════════════════════════════════
//  ROCHERS DE TEMPÊTE — de VRAIS cailloux low-poly (icosaèdres taillés au bruit,
//  comme le 🪨 du jeu 2D) qui tombent AUTOUR ET DEVANT le joueur, accélèrent en
//  chute, sont emportés par le vent et soulèvent la poussière à l'impact.
//  Au contact du hibou : punition de score + plaqué vers le sol.
// ══════════════════════════════════════════════════
let rocks = [];
const ROCK_RADIUS = 1.7;
const ROCK_MAX    = 46;

// 4 variantes de géométrie « taillées » une fois pour toutes : sommets perturbés
// par un bruit fonction de leur POSITION (les sommets partagés bougent ensemble).
const rockGeos = [];
for (let vIdx = 0; vIdx < 4; vIdx++) {
  const g = new THREE.IcosahedronGeometry(1, 1);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const vx = p.getX(i), vy = p.getY(i), vz = p.getZ(i);
    const n = 0.72 + 0.5 * valueNoise(vx * 2.1 + vIdx * 37.7, vy * 2.3 + vz * 1.7);
    p.setXYZ(i, vx * n, vy * n * 0.85, vz * n); // légèrement aplati : galet plutôt que boule
  }
  g.computeVertexNormals();
  rockGeos.push(g);
}
const rockMats = [
  new THREE.MeshStandardMaterial({ color: 0x5b544c, roughness: 1, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0x4a423a, roughness: 1, flatShading: true })
];

function newRock() {
  // Pluie de cailloux qui couvre une large zone tout AUTOUR du hibou (pas seulement
  // devant) pour que la tempête soit une vraie menace où qu'on regarde.
  const lead = rnd(0.8, 3.2);
  const x = owlGroup.position.x + velocity.x * lead + rnd(-220, 220);
  const z = owlGroup.position.z + velocity.z * lead + rnd(-220, 220);
  const scale = rnd(1.4, 3.4);
  const mesh = new THREE.Mesh(
    rockGeos[Math.floor(Math.random() * rockGeos.length)],
    rockMats[Math.floor(Math.random() * rockMats.length)]
  );
  mesh.position.set(x, Math.min(ARENA_CENTER.y + ARENA_RADIUS_Y * 0.95, owlGroup.position.y + rnd(55, 110)), z);
  mesh.scale.setScalar(scale);
  mesh.rotation.set(rnd(0, Math.PI * 2), rnd(0, Math.PI * 2), rnd(0, Math.PI * 2));
  scene.add(mesh);
  return {
    mesh, scale,
    vy: rnd(16, 24),
    rotSpeed: new THREE.Vector3(rnd(-2.5, 2.5), rnd(-2.5, 2.5), rnd(-2.5, 2.5))
  };
}
function removeRock(i) {
  scene.remove(rocks[i].mesh);
  rocks.splice(i, 1);
}
function updateRocks(dt) {
  for (let i = rocks.length - 1; i >= 0; i--) {
    const rk = rocks[i];
    rk.vy = Math.min(rk.vy + 14 * dt, 46); // la chute accélère (jusqu'à une vitesse terminale)
    rk.mesh.position.y -= rk.vy * dt;
    if (storm.active) {
      rk.mesh.position.x += Math.cos(storm.windAngle) * storm.windForce * 3.5 * dt;
      rk.mesh.position.z += Math.sin(storm.windAngle) * storm.windForce * 3.5 * dt;
    }
    rk.mesh.rotation.x += rk.rotSpeed.x * dt;
    rk.mesh.rotation.y += rk.rotSpeed.y * dt;
    rk.mesh.rotation.z += rk.rotSpeed.z * dt;

    // Impact au sol : gerbe de poussière (+ secousse si proche), puis disparition
    if (rk.mesh.position.y - rk.scale * 0.4 < effectiveGroundY(rk.mesh.position.x, rk.mesh.position.z)) {
      spawnFX3D(rk.mesh.position, 8 + Math.floor(rk.scale * 4), 'dust');
      if (rk.mesh.position.distanceTo(owlGroup.position) < 40) screenShake = Math.max(screenShake, 5);
      removeRock(i);
      continue;
    }

    if (rockInvul <= 0 && buffs.invincible <= 0 &&
        owlGroup.position.distanceTo(rk.mesh.position) < (ROCK_RADIUS * rk.scale + OWL_COLLIDE_RADIUS + 0.6)) {
      screenShake = Math.max(screenShake, 25);
      hitFlash    = Math.max(hitFlash, 0.6);
      triggerHitStop(0.3, 0.15);
      spawnFX(rk.mesh.position, 16, 'death', 'ÉCRASÉ 🪨');
      spawnFX3D(rk.mesh.position, 16, 'burst');
      removeRock(i);
      // updateRocks() ne tourne jamais en multijoueur (gate dans la boucle update()) : pas de garde à faire ici.
      if (state === S.PLAY) {
        best = Math.max(best, score);
        state = S.OVER;
        overReason = 'rock';
        owlGroup.visible = false;
        document.body.style.cursor = 'default';
        if (document.pointerLockElement) document.exitPointerLock();
      }
      continue;
    }
  }
}

// ══════════════════════════════════════════════════
//  MÉTÉO DYNAMIQUE — épisodes de pluie entre les tempêtes, neige en altitude,
//  brouillard qui se densifie et lumière qui se plombe par mauvais temps,
//  éclairs pendant les tempêtes. Le ciel n'est plus figé.
// ══════════════════════════════════════════════════
const WEATHER_DROPS   = LOW_SPEC ? 150 : 900;
const RAIN_DURATION   = [18, 32];  // secondes d'un épisode de pluie
const RAIN_NEXT       = [25, 50];  // délai avant le prochain épisode
let weather = { mode: 'clear', level: 0, timer: 0, next: rnd(RAIN_NEXT[0], RAIN_NEXT[1]) };
let precip = null, precipData = [];
let lightningTimer = rnd(3, 7), lightningFlash = 0;

// Teintes de brouillard : bleu nuit par temps clair → gris plombé sous la pluie/tempête.
const FOG_CLEAR = new THREE.Color(0x0c1030), FOG_HEAVY = new THREE.Color(0x1d2530);
const PRECIP_RAIN_COLOR = new THREE.Color(0x9fc0e8), PRECIP_SNOW_COLOR = new THREE.Color(0xf4f8ff);

// (Ré)ancre une goutte/un flocon dans le volume qui suit le hibou. La hauteur du sol
// est mémorisée à l'ancrage (comme les lucioles) : zéro appel terrain par frame.
function anchorDrop(d, fromTop) {
  d.x = owlGroup.position.x + rnd(-95, 95);
  d.z = owlGroup.position.z + rnd(-95, 95);
  d.y = owlGroup.position.y + (fromTop ? rnd(25, 60) : rnd(-25, 60));
  d.spd = rnd(55, 85);
  d.sway = rnd(0, Math.PI * 2);
  d.gy = effectiveGroundY(d.x, d.z);
}

function makeWeather() {
  const positions = new Float32Array(WEATHER_DROPS * 3);
  for (let i = 0; i < WEATHER_DROPS; i++) {
    const d = {};
    anchorDrop(d, false);
    precipData.push(d);
    positions[i * 3 + 1] = -9999; // parqué hors champ tant que la pluie n'est pas levée
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    map: glowTexture, color: PRECIP_RAIN_COLOR.clone(), size: 0.55, transparent: true,
    opacity: 0, depthWrite: false, sizeAttenuation: true
  });
  precip = new THREE.Points(geo, mat);
  precip.frustumCulled = false;
  precip.visible = false;
  scene.add(precip);
}

// Cycle météo (uniquement pendant le jeu) : clair → pluie → clair, la tempête
// existante restant l'événement « paroxysme » qui force une pluie battante.
function updateWeatherLogic(dt) {
  if (!storm.active) {
    if (weather.mode === 'clear') {
      if (moon.state === 'none') { // les lunes gardent leur ciel dégagé dramatique
        weather.next -= dt;
        if (weather.next <= 0) {
          weather.mode = 'rain';
          weather.timer = rnd(RAIN_DURATION[0], RAIN_DURATION[1]);
          spawnFX(owlGroup.position, 8, 'collect', '🌧️ PLUIE');
        }
      }
    } else {
      weather.timer -= dt;
      if (weather.timer <= 0) {
        weather.mode = 'clear';
        weather.next = rnd(RAIN_NEXT[0], RAIN_NEXT[1]);
      }
    }
  }
  // Éclairs : uniquement pendant la tempête — flash lumineux + secousse.
  if (storm.active) {
    lightningTimer -= dt;
    if (lightningTimer <= 0) {
      lightningTimer = rnd(2.5, 7);
      lightningFlash = 1;
      screenShake = Math.max(screenShake, 9);
    }
  }
}

// Rendu météo (tourne aussi sur les écrans de menu : la pluie ne se fige pas).
// Appelé APRÈS updateMoonVisual/updateDayNightCycle, qui fixent moonLight/ambientLight/FOG_CLEAR.
function updateWeatherFX(dt) {
  const target = storm.active ? 1 : weather.mode === 'rain' ? 0.7 : 0;
  weather.level += (target - weather.level) * Math.min(1, 1.2 * dt);
  const lv = weather.level;

  // Brouillard densifié et lumière plombée par mauvais temps
  scene.fog.color.lerpColors(FOG_CLEAR, FOG_HEAVY, lv);
  scene.fog.near = ARENA_RADIUS_XZ * THREE.MathUtils.lerp(0.55, 0.28, lv);
  scene.fog.far  = ARENA_RADIUS_XZ * THREE.MathUtils.lerp(1.6, 0.95, lv);
  ambientLight.intensity = dayNightAmbientBase * (1 - 0.3 * lv) + lightningFlash * 1.6;
  moonLight.intensity = moonLight.intensity * (1 - 0.4 * lv) + lightningFlash * 2.5;
  lightningFlash = Math.max(0, lightningFlash - 3.2 * dt);

  if (!precip) return;
  precip.visible = lv > 0.02;
  if (!precip.visible) return;

  // Pluie en plaine, flocons dès que le hibou vole au-dessus de la ligne de neige
  const snowing = owlGroup.position.y > SNOW_LINE + 12;
  precip.material.color.lerp(snowing ? PRECIP_SNOW_COLOR : PRECIP_RAIN_COLOR, 0.08);
  precip.material.size = THREE.MathUtils.lerp(precip.material.size, snowing ? 0.95 : 0.55, 0.08);
  precip.material.opacity = 0.8 * lv;

  const pos = precip.geometry.attributes.position;
  const wx = storm.active ? Math.cos(storm.windAngle) * storm.windForce * 8 : 0;
  const wz = storm.active ? Math.sin(storm.windAngle) * storm.windForce * 8 : 0;
  const ox = owlGroup.position.x, oy = owlGroup.position.y, oz = owlGroup.position.z;
  for (let i = 0; i < WEATHER_DROPS; i++) {
    const d = precipData[i];
    if (snowing) {
      d.sway += dt * 1.6;
      d.y -= d.spd * 0.12 * dt;                       // les flocons tombent lentement…
      d.x += (wx + Math.cos(d.sway) * 2.5) * dt;      // …et voltigent
      d.z += (wz + Math.sin(d.sway * 0.8) * 2.5) * dt;
    } else {
      d.y -= d.spd * dt;                              // la pluie tombe dru
      d.x += wx * dt;
      d.z += wz * dt;
    }
    const ddx = d.x - ox, ddz = d.z - oz;
    if (d.y < Math.max(d.gy, oy - 30) || ddx * ddx + ddz * ddz > 120 * 120) anchorDrop(d, true);
    pos.array[i * 3]     = d.x;
    pos.array[i * 3 + 1] = d.y;
    pos.array[i * 3 + 2] = d.z;
  }
  pos.needsUpdate = true;
}

// ══════════════════════════════════════════════════
//  FORÊTS — modèles GLB instanciés (pins, bouleau, feuillu), placés sur le terrain
//  par masque de bruit : denses dans les vallées, absents au-dessus de TREE_LINE,
//  jamais dans les lacs ni sur les pentes raides. Repli : cône+cylindre procédural.
// ══════════════════════════════════════════════════
let treeColliders = [];
const TREE_COUNT  = LOW_SPEC ? 550 : 3000;      // forêt étendue à TOUTE l'arène (réduite sur appareil modeste)
const TREE_SPREAD = ARENA_RADIUS_XZ * 0.84;      // s'arrête avant les pentes de la muraille

// Repli si un modèle d'arbre manque : silhouette cône+cylindre équivalente.
function makeFallbackTree(leafHex, trunkHex) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.22, 0.4, 3, 6),
    new THREE.MeshStandardMaterial({ color: trunkHex, roughness: 1 })
  );
  trunk.position.y = 1.5;
  const leaf = new THREE.Mesh(
    new THREE.ConeGeometry(2, 5.5, 7),
    new THREE.MeshStandardMaterial({ color: leafHex, roughness: 1 })
  );
  leaf.position.y = 5.5;
  g.add(trunk, leaf);
  return g;
}

function makeTrees() {
  treeColliders = [];
  // Types d'arbres : proto normalisé (hauteur ~9) + gabarit de collision relatif (0..1 de la hauteur).
  const types = [
    { proto: models.pine1, weight: 0.38, fallback: () => makeFallbackTree(0x1a3a17, 0x47301c) },
    { proto: models.pine2, weight: 0.30, fallback: () => makeFallbackTree(0x16331a, 0x3f2b19) },
    { proto: models.birch, weight: 0.20, fallback: () => makeFallbackTree(0x22421c, 0x8a8a80) },
    { proto: models.tree1, weight: 0.12, fallback: () => makeFallbackTree(0x21421b, 0x4d331e) }
  ].map(t => {
    const src = t.proto ? t.proto.clone(true) : t.fallback();
    const norm = normalizeModel(src, { height: 9, groundAlign: true });
    // Gabarit de collision estimé depuis la boîte englobante du modèle normalisé.
    const box = new THREE.Box3().setFromObject(norm);
    const radiusXZ = Math.max(box.max.x - box.min.x, box.max.z - box.min.z) / 2;
    return {
      norm,
      matrices: [],
      colliderProto: { trunkR: Math.max(0.28, radiusXZ * 0.14), leafR: radiusXZ * 0.72, leafBaseFrac: 0.22, height: 9 }
    };
  });

  const dummy = new THREE.Object3D();
  let placed = 0, attempts = 0;
  while (placed < TREE_COUNT && attempts < TREE_COUNT * 20) {
    attempts++;
    const angle = treeRnd(0, Math.PI * 2);
    const r = Math.sqrt(treeRng()) * TREE_SPREAD; // aire uniforme sur toute l'arène jouable
    const x = Math.cos(angle) * r, z = Math.sin(angle) * r;
    if (r < 14) continue;                                    // clairière de départ
    const h = terrainHeight(x, z);
    if (h < WATER_Y + 0.8) continue;                         // pas d'arbres dans les lacs
    if (h > TREE_LINE) continue;                             // au-dessus : roche/neige
    const slope = Math.abs(terrainHeight(x + 2, z) - h) + Math.abs(terrainHeight(x, z + 2) - h);
    if (slope > 2.2) continue;                               // pentes raides : pas de forêt
    const nearShore = h < WATER_Y + 5; // berge : rive d'un lac, quelques mètres au-dessus de l'eau
    if (!nearShore && forestDensity(x, z) < 0.42 && treeRng() > 0.15) continue; // masque de forêt (15% d'isolés), sauf en bordure de lac

    // Tirage pondéré du type
    let pick = treeRng(), ti = 0;
    const weights = [0.38, 0.30, 0.20, 0.12];
    for (let i = 0; i < weights.length; i++) { pick -= weights[i]; if (pick <= 0) { ti = i; break; } }
    const type = types[ti];

    const s = treeRnd(0.7, 1.5);
    dummy.position.set(x, h - 0.15, z); // très légèrement enterré pour épouser la pente
    dummy.rotation.set(0, treeRnd(0, Math.PI * 2), 0);
    dummy.scale.setScalar(s);
    dummy.updateMatrix();
    type.matrices.push(dummy.matrix.clone());

    const cp = type.colliderProto;
    treeColliders.push({
      x, z,
      trunkR: cp.trunkR * s,
      leafBase: h + cp.height * cp.leafBaseFrac * s,
      leafTop:  h + cp.height * s,
      leafR: cp.leafR * s,
      groundY: h
    });
    placed++;
  }

  for (const type of types) {
    if (!type.matrices.length) continue;
    const group = makeInstancedFromModel(type.norm, type.matrices);
    group.traverse(o => { if (o.isInstancedMesh) { o.castShadow = true; o.receiveShadow = true; } });
    scene.add(group);
    treeGroups.push(group);
  }
}

// ══════════════════════════════════════════════════
//  HAMEAUX — chalets bois low-poly (simple / à étage / tour de guet) procéduraux,
//  regroupés en hameaux ou éparpillés, + feux de camp. Purement décoratifs (comme
//  la muraille de montagnes GLB) : pas de collision dédiée, juste du décor animé.
//  Placement déterministe (buildingRng, même patron que treeRng) : doit être
//  identique sur tous les clients multijoueur.
// ══════════════════════════════════════════════════
const BUILDING_SEED = 20260717;
let buildingRng = mulberry32(BUILDING_SEED);
const buildingRnd = (a, b) => a + buildingRng() * (b - a);

let buildingGroups = [];
let campfires = []; // { pos, group, flame }

const WOOD_LIGHT = 0x8a6a3f, WOOD_DARK = 0x5a3d22, ROOF_COLOR = 0x2e2620, TOWER_ROOF_COLOR = 0x4a1e1e;
// Tour de guet GLB (models.watchtower) : gabarit calé sur l'ancienne tour procédurale
// (pilotis + cabine + toit ≈ 13.8 de haut) pour garder le même feel dans les hameaux.
const TOWER_MODEL_HEIGHT = 13.8, TOWER_MODEL_FOOTPRINT = 2.4 * 1.6;
// Chalet GLB (models.cabin, cabin.obj/free3d) : gabarit calé sur l'ancien chalet 1 étage
// procédural (≈ 3.8 de haut) ; le variant 'floor' (à étage) reprend le même modèle agrandi
// faute d'un second maillage dédié.
const CABIN_MODEL_HEIGHT = 3.8, CABIN_MODEL_FOOTPRINT = 4.2 * 1.05;

// Toit pyramidal simplifié (cône à 4 côtés tourné de 45°) pour tous les bâtiments —
// même langage visuel low-poly que la tour, robuste sans avoir besoin d'un vrai
// prisme de toit à deux pans.
function buildChalet(kind) {
  const group = new THREE.Group();
  const wallMat = new THREE.MeshStandardMaterial({ color: WOOD_LIGHT, roughness: 0.9, flatShading: true });
  const trimMat = new THREE.MeshStandardMaterial({ color: WOOD_DARK, roughness: 0.9, flatShading: true });
  const roofMat = new THREE.MeshStandardMaterial({ color: ROOF_COLOR, roughness: 0.85, flatShading: true });

  if (kind === 'tower') {
    if (models.watchtower) {
      const group = new THREE.Group();
      const model = normalizeModel(models.watchtower.clone(), { height: TOWER_MODEL_HEIGHT, groundAlign: true });
      group.add(model);
      group.userData.footprint = TOWER_MODEL_FOOTPRINT;
      return group;
    }
    const legR = 0.32, legH = 9, spread = 2.4;
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(legR * 0.7, legR, legH, 5), trimMat);
      leg.position.set(sx * spread, legH / 2, sz * spread);
      leg.rotation.x = sz * 0.06; leg.rotation.z = -sx * 0.06; // légèrement inclinés : look pilotis
      group.add(leg);
    }
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(3.4, 2.6, 3.4), wallMat);
    cabin.position.y = legH + 1.3;
    group.add(cabin);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(2.7, 2.2, 4), new THREE.MeshStandardMaterial({ color: TOWER_ROOF_COLOR, roughness: 0.85, flatShading: true }));
    roof.position.y = legH + 2.6 + 1.1;
    roof.rotation.y = Math.PI / 4;
    group.add(roof);
    group.userData.footprint = spread * 1.6;
    return group;
  }

  if (models.cabin) {
    const group = new THREE.Group();
    const height = kind === 'floor' ? CABIN_MODEL_HEIGHT * 1.35 : CABIN_MODEL_HEIGHT;
    const model = normalizeModel(models.cabin.clone(), { height, groundAlign: true });
    group.add(model);
    group.userData.footprint = CABIN_MODEL_FOOTPRINT;
    return group;
  }

  const floors = kind === 'floor' ? 2 : 1;
  const baseW = 4.2, baseD = 3.6, floorH = 2.6;
  let y = 0;
  for (let f = 0; f < floors; f++) {
    const inset = f === 0 ? 1 : 0.88; // étage supérieur légèrement en retrait
    const wall = new THREE.Mesh(new THREE.BoxGeometry(baseW * inset, floorH, baseD * inset), f === 0 ? wallMat : trimMat);
    wall.position.y = y + floorH / 2;
    group.add(wall);
    y += floorH;
  }
  const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(baseW, baseD) * 0.78, 2.4, 4), roofMat);
  roof.position.y = y + 1.2;
  roof.rotation.y = Math.PI / 4;
  group.add(roof);
  group.userData.footprint = Math.max(baseW, baseD) * 1.05;
  return group;
}

// Feu de camp : quelques bûches procédurales + un sprite flamme (emoji, même patron
// que les autres éléments du HUD/monde en emojiTexture()) — pas de particule dédiée.
const CAMPFIRE_LIGHT_COLOR = new THREE.Color(0xffa33e);
function makeCampfire(x, groundY, z) {
  const group = new THREE.Group();
  const logMat = new THREE.MeshStandardMaterial({ color: 0x3f2c1c, roughness: 1, flatShading: true });
  for (let i = 0; i < 4; i++) {
    const log = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 1.4, 5), logMat);
    log.rotation.z = Math.PI / 2;
    log.rotation.y = (i / 4) * Math.PI * 2;
    log.position.y = 0.15;
    group.add(log);
  }
  group.traverse(o => { if (o.isMesh) o.castShadow = true; });

  const flame = new THREE.Sprite(new THREE.SpriteMaterial({
    map: fireTexture, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  flame.scale.setScalar(1.6);
  flame.position.y = 0.9;
  group.add(flame);

  group.position.set(x, groundY, z);
  scene.add(group);
  buildingGroups.push(group); // suit le même cycle de vie (dispose) que les bâtiments
  campfires.push({ pos: new THREE.Vector3(x, groundY + 0.9, z), group, flame });
}

function makeBuildings() {
  buildingGroups = [];
  campfires = [];
  const hamletCount = 3 + Math.floor(buildingRng() * 3); // 3 à 5
  const hamletCenters = [];
  let tries = 0;
  while (hamletCenters.length < hamletCount && tries < 200) {
    tries++;
    const angle = buildingRnd(0, Math.PI * 2);
    const r = 90 + buildingRng() * (TREE_SPREAD - 90);
    const x = Math.cos(angle) * r, z = Math.sin(angle) * r;
    const h = terrainHeight(x, z);
    if (h < WATER_Y + 1.5 || h > TREE_LINE) continue;
    const slope = Math.abs(terrainHeight(x + 3, z) - h) + Math.abs(terrainHeight(x, z + 3) - h);
    if (slope > 1.4) continue; // terrain plat requis pour un hameau
    let tooClose = false;
    for (const c of hamletCenters) {
      const dx = c.x - x, dz = c.z - z;
      if (dx * dx + dz * dz < 130 * 130) { tooClose = true; break; }
    }
    if (tooClose) continue;
    hamletCenters.push({ x, z, h });
  }

  function placeOne(x, z, kind) {
    const h = terrainHeight(x, z);
    if (h < WATER_Y + 1.2) return; // sécurité si le jitter retombe dans l'eau/la rivière
    const group = buildChalet(kind);
    group.position.set(x, h, z);
    group.rotation.y = buildingRnd(0, Math.PI * 2);
    group.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    scene.add(group);
    buildingGroups.push(group);
  }
  function pickKind() {
    const pick = buildingRng();
    return pick < 0.55 ? 'simple' : pick < 0.9 ? 'floor' : 'tower';
  }

  for (const c of hamletCenters) {
    const count = 4 + Math.floor(buildingRng() * 7); // 4 à 10 par hameau
    for (let i = 0; i < count; i++) {
      const a = buildingRnd(0, Math.PI * 2), r = buildingRnd(4, 22);
      placeOne(c.x + Math.cos(a) * r, c.z + Math.sin(a) * r, pickKind());
    }
    makeCampfire(c.x, c.h, c.z); // un feu au centre de chaque hameau
  }

  const isolatedCount = 5 + Math.floor(buildingRng() * 6); // 5 à 10 isolés
  let placed = 0, attempts = 0;
  while (placed < isolatedCount && attempts < isolatedCount * 15) {
    attempts++;
    const angle = buildingRnd(0, Math.PI * 2);
    const r = Math.sqrt(buildingRng()) * TREE_SPREAD;
    const x = Math.cos(angle) * r, z = Math.sin(angle) * r;
    if (r < 30) continue;
    const h = terrainHeight(x, z);
    if (h < WATER_Y + 1.5 || h > TREE_LINE) continue;
