<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Roue de la Chance</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at center, #1a1a1a, #000);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      justify-content: center;
    }

    .wheel-container {
      position: relative;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      overflow: hidden;
      border: 5px solid #fff;
      box-shadow: 0 0 30px gold;
      margin-bottom: 30px;
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      transform: rotate(0deg);
      transition: transform 4s cubic-bezier(0.17, 0.67, 0.83, 0.67);
    }

    .segment {
      position: absolute;
      width: 50%;
      height: 50%;
      top: 50%;
      left: 50%;
      transform-origin: 0% 0%;
      clip-path: polygon(0 0, 100% 0, 100% 100%);
      text-align: right;
      padding-right: 10px;
      font-weight: bold;
      color: white;
    }

    .gold {
      color: gold;
      text-shadow: 0 0 10px gold;
    }

    .arrow {
      width: 0; 
      height: 0; 
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 30px solid red;
      position: absolute;
      top: -40px;
      left: calc(50% - 15px);
    }

    .inputs {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      margin-bottom: 15px;
    }

    .inputs input {
      width: 200px;
      padding: 5px;
      border-radius: 5px;
      border: none;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      background: gold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      color: black;
    }

    button:hover {
      background: #ffdd55;
    }
  </style>
</head>
<body>
  <h1>🎯 Roue de la Chance Truquée</h1>

  <div class="inputs">
    <input type="text" id="input1" placeholder="Entrée 1 (ex: Bronze 60%)">
    <input type="text" id="input2" placeholder="Entrée 2 (ex: Or 10%)">
    <input type="text" id="input3" placeholder="Entrée 3 (ex: Argent 30%)">
  </div>

  <button onclick="drawWheel()">Mettre à jour la roue</button>
  <button onclick="spin()">Tourner 🎡</button>

  <div class="wheel-container">
    <div class="arrow"></div>
    <div class="wheel" id="wheel"></div>
  </div>

  <script>
    let wheel = document.getElementById("wheel");
    let segments = [];

    function drawWheel() {
      const inputs = [input1.value, input2.value, input3.value].filter(v => v.trim() !== "");
      const rareIndex = findRarestIndex(inputs);
      const slice = 360 / inputs.length;
      wheel.innerHTML = "";

      inputs.forEach((text, i) => {
        const seg = document.createElement("div");
        seg.className = "segment";
        if (i === rareIndex) seg.classList.add("gold");

        const hue = (i * 360 / inputs.length);
        seg.style.background = `hsl(${hue}, 70%, 45%)`;
        seg.style.transform = `rotate(${i * slice}deg) skewY(${90 - slice}deg)`;
        seg.innerHTML = `<span style="display:inline-block; transform: skewY(-${90 - slice}deg) rotate(${slice/2}deg);">${text}</span>`;
        wheel.appendChild(seg);
      });
      segments = inputs;
    }

    function findRarestIndex(inputs) {
      // Recherche du pourcentage minimal (si indiqué)
      let minVal = Infinity, index = 0;
      inputs.forEach((txt, i) => {
        const match = txt.match(/(\d+)%/);
        if (match && Number(match[1]) < minVal) {
          minVal = Number(match[1]);
          index = i;
        }
      });
      return index;
    }

    function spin() {
      if (segments.length < 2) return alert("Ajoute au moins 2 entrées !");
      const deg = 360 * 5 + (360 / segments.length) * (1.5 - 2); // truqué -> tombe sur 2ème
      wheel.style.transition = "transform 4s cubic-bezier(0.17, 0.67, 0.83, 0.67)";
      wheel.style.transform = `rotate(${deg}deg)`;

      setTimeout(() => {
        alert("Résultat : " + segments[1]);
      }, 4200);
    }
  </script>
</body>
</html>
