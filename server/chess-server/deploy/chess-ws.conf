# Reverse-proxy for the chess multiplayer WebSocket server.
# Requires mod_proxy and mod_proxy_wstunnel to be loaded (they ship with
# httpd on Oracle Linux, usually already enabled in
# /etc/httpd/conf.modules.d/00-proxy.conf).
#
# This file is installed to /etc/httpd/conf.d/chess-ws.conf by the deploy
# workflow. It applies to the main server config, so it is inherited by any
# VirtualHost that doesn't explicitly reset proxy directives. If your site
# uses a dedicated SSL VirtualHost block that does not inherit the main
# config, copy the two ProxyPass lines below into that block instead.

ProxyRequests Off
ProxyTimeout 3600

ProxyPass "/chess-ws" "ws://127.0.0.1:8095/chess-ws"
ProxyPassReverse "/chess-ws" "ws://127.0.0.1:8095/chess-ws"
