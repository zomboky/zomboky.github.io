# Reverse-proxy for the Hibou 3D multiplayer WebSocket server.
# Requires mod_proxy and mod_proxy_wstunnel (see chess-ws.conf for details —
# same setup, different backend port).
#
# This file is installed to /etc/httpd/conf.d/hibou3d-ws.conf by the deploy
# workflow.

ProxyRequests Off
ProxyTimeout 3600

ProxyPass "/hibou3d-ws" "ws://127.0.0.1:8098/hibou3d-ws"
ProxyPassReverse "/hibou3d-ws" "ws://127.0.0.1:8098/hibou3d-ws"
